[package]
name = "rsk-sdk"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

# Core smartcard machinery: APDU, status words, BER-TLV, AID applet registry.
# Pure logic, no HAL — `no_std` on target, but unit-tested on the host.

[lints]
workspace = true

[features]
# `scripts/kani.sh` only, and empty here — this crate pulls no hashing
# backend. It exists because `cargo kani` re-invokes cargo once per selected
# package, so the feature must name something on every crate a tier selects.
kani-soft = []

[dependencies]
# The dispatcher's long-lived buffers (a held chain, a GET RESPONSE tail) are
# wiped by hand, each under an `#[expect]`.
zeroize = { workspace = true }
# A dispatched chain, which can hold private-key IMPORT data, under a WipeGuard.
rsk-secret = { workspace = true }
