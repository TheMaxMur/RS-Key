[package]
name = "rsk-otp"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

# `cfg(kani)` guards the proof harnesses (set by `cargo kani`, unknown to rustc).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# Yubico OTP applet: the CCID side (slot configure/update/swap/delete, status,
# HMAC-SHA1 / Yubico-mode challenge-response) plus the keyboard HID interface —
# the `hid` frame codec and the `ticket` typed-OTP generator (modhex / HOTP /
# static password).
[features]
# `scripts/kani.sh` only: forwards to the dependency that carries the switch.
# What it buys, and why the firmware must never turn it on, is in
# `crates/rsk-crypto/Cargo.toml`.
kani-soft = ["rsk-crypto/kani-soft"]
# See firmware's `strict-config`. OFF by default: the default build serves the
# OTP-HID admin writes (SET_DEVICE_INFO/DEVICE_CONFIG/SCAN_MAP/NDEF) as a real
# YubiKey does; `--features strict-config` restores today's silent-OK no-op.
strict-config = []

[dependencies]
rsk-sdk = { workspace = true }
rsk-fs = { workspace = true }
rsk-crypto = { workspace = true }
rsk-devconf = { workspace = true }
# At-rest sealing of slot secrets: zeroize scrubs the plaintext scratch buffers.
zeroize = { workspace = true }

[dev-dependencies]
# RamStorage for the host tests (the same backend the other applets use).
rsk-fs = { workspace = true, features = ["test-util"] }
# An independent AES-128 for the typed Yubico-OTP round-trip test (decrypt the
# emitted modhex token and check its embedded fields).
aes = { workspace = true }
