[package]
name = "rsk-store"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

# The `rsk_fs::Storage` backend the device actually runs: two `sequential-storage`
# map partitions over one flash, counter FIDs routed away from the credential
# pages, and the scrub lap that physically destroys superseded secrets. It was
# `firmware/src/flash_storage.rs`, which meant the `power_cut` fuzz target could
# only torture a hand-written mirror of it and the emulator had no log-structured
# store at all.
[dependencies]
rsk-fs = { workspace = true }
rsk-sdk = { workspace = true }
sequential-storage = "8"
# The async NorFlash traits the backend is generic over (the same 0.4
# `sequential-storage` uses).
embedded-storage-async = "0.4"
# `sequential-storage` is async-only; every backing flash this crate is used with
# resolves on the first poll, so each op is driven synchronously.
embassy-futures = { workspace = true }

# No dev-dependencies, and the reason is measured rather than assumed. The obvious
# one is `sequential-storage`'s own `mock_flash`, the way `fuzz/` and `tools/emu`
# get it — but those are DETACHED workspaces with their own lockfiles, and this
# crate is a root member. Here the `_test` feature unifies onto the very same
# `sequential-storage` build the firmware links, so its tree is not a dev-only one:
# `cargo vet --locked` (a gate step) then wants **safe-to-deploy** for 16 crates it
# drags in — futures×7, approx, slab, and heapless's defmt→syn/thiserror/bitflags.
# None of them is what the mock needs: `mock_flash.rs` imports only `core`,
# `embedded_storage_async` and `Vec`, and `futures` appears in that crate solely in
# doctests. Narrowing the feature would mean a second local change to the vendored
# fork, whose patch notes deliberately record that only `src/map.rs` differs from
# published 8.0.0. So the fake NOR chip lives in `src/tests.rs` — the store under
# test is still the fork, which is the part that has to be the device's.
