[package]
name = "rsk-rsa"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

# RSA key generation, CRT, PKCS#1 v1.5 and public-key encoding shared by PIV
# and OpenPGP. The fixed-width Montgomery backend is shared with host tests.
[lints]
workspace = true

[features]
# `scripts/kani.sh` only, and empty here — this crate pulls no hashing
# backend. It exists because `cargo kani` re-invokes cargo once per selected
# package, so the feature must name something on every crate a tier selects.
kani-soft = []
# The KAT vectors and the PKCS#1 v1.5 verifier the two card applets' tests check
# a card-produced signature with; the `rsa` crate used to be that oracle. Turned
# on from their `[dev-dependencies]`, so it never reaches the firmware image.
test-util = []

[dependencies]
# The modexp working buffers and the CRT fields hold prime-candidate / key state;
# `alloc` for the bignum `Vec`s the key paths marshal through.
zeroize = { workspace = true, features = ["alloc"] }
# Those buffers and bignums held in a type that wipes itself on every exit.
rsk-secret = { workspace = true }
# The bignum the whole crate is arithmetic over: key assembly, the blinding and
# fault-check arithmetic and the strong-Lucas half of the prime test.
num-bigint-dig = { workspace = true }
# λ(n) = lcm(p−1, q−1), which the private exponent is derived from, plus the
# parity tests on `n` and `e`. num-bigint-dig's own arithmetic base, already in
# the tree underneath it; it re-exports the `BigUint` impls but not the trait.
num-integer = { workspace = true }
