[package]
name = "rsk-openpgp"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# The OpenPGP card applet, reached over the CCID transport. Pure and
# host-testable: device seed / serial / RNG and flash come from the caller,
# as in rsk-fido.
[features]
# `scripts/kani.sh` only: forwards to the dependency that carries the switch.
# What it buys, and why the firmware must never turn it on, is in
# `crates/rsk-crypto/Cargo.toml`.
kani-soft = ["rsk-crypto/kani-soft"]

[dependencies]
rsk-sdk = { workspace = true }
rsk-fs = { workspace = true }
rsk-crypto = { workspace = true }
# `serial4` — the one canonical chip-id -> 8-digit-serial masking, already shared
# by PIV/OTP/mgmt, so the OpenPGP AID serial matches the rest of the identity.
rsk-mgmt = { workspace = true }
# `alloc` for the Vec impls (RSA prime bytes + decipher plaintext).
zeroize = { workspace = true, features = ["alloc"] }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
k256 = { workspace = true }
# Brainpool P-256 / P-384 for the OpenPGP applet — see the workspace note.
bp256 = { workspace = true }
bp384 = { workspace = true }
ecdsa = { workspace = true }
elliptic-curve = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
# The RSA family: the key type rebuilt from `P‖Q` on load, the sealed CRT layout
# and its blinded, fault-checked private op, PKCS#1 v1.5, the public-key DO.
rsk-rsa = { workspace = true }
# Shared fixed-base comb ECDSA signers + d·G (k·G for sign, public-key derivation).
rsk-ec = { workspace = true }

[dev-dependencies]
rsk-fs = { workspace = true, features = ["test-util"] }
# The KAT vectors and the PKCS#1 v1.5 verifier the RSA tests check a
# card-produced signature against — the oracle the `rsa` crate used to be.
rsk-rsa = { workspace = true, features = ["test-util"] }
