[package]
name = "rsk-piv"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

# The PIV applet (NIST SP 800-73-4 subset + the Yubico extensions ykman
# speaks), reached over CCID. Pure and host-testable like the other applet
# crates; RSA comes from rsk-rsa and the EC key type still from rsk-openpgp,
# with its own kbase-rooted sealing.
# `cfg(kani)` guards the proof harnesses (set by `cargo kani`, unknown to rustc).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dependencies]
rsk-sdk = { workspace = true }
rsk-fs = { workspace = true }
rsk-crypto = { workspace = true }
rsk-openpgp = { workspace = true }
rsk-mgmt = { workspace = true }
# The RSA family: keygen, the sealed CRT layout and its blinded, fault-checked
# private op (UMAAL asm on device), PKCS#1 v1.5, the public-key DO.
rsk-rsa = { workspace = true }
# `RsaPrivateKey` and the bignum the seal path multiplies `N = p·q` with.
rsa = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rsk-fs = { workspace = true, features = ["test-util"] }
p256 = { workspace = true }
p384 = { workspace = true }
sha2 = { workspace = true }
# Independent Ed25519 / X25519 to cross-check signatures and key agreement.
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
# Independent X.509 parser to cross-check the hand-built DER certs (host only).
x509-parser = "0.16"

[features]
# `scripts/kani.sh` only: forwards to the dependency that carries the switch.
# What it buys, and why the firmware must never turn it on, is in
# `crates/rsk-crypto/Cargo.toml`.
kani-soft = ["sha2/force-soft", "rsk-crypto/kani-soft"]
# FIPS-style policy profile, OFF by default — the default build is unchanged.
# When enabled: no new 3DES management keys and no RSA-1024 generation/import
# (SP 800-131A); an existing 3DES key still authenticates so it can be
# migrated to AES. See docs/guides/fips.md.
fips-profile = []
