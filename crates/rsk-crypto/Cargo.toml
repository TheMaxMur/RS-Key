[package]
name = "rsk-crypto"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lints]
workspace = true

# Crypto surface over RustCrypto: hashes, HMAC/HKDF, CRC-32, base64url, AES
# CBC/CFB + AES-256-GCM, ChaCha20-Poly1305, PIN KDF, CTAP2 PIN protocol, PQC.
# Pure and host-testable — serial-hash / OTP / RNG are passed in by the caller.
[dependencies]
sha1 = { workspace = true }
sha2 = { workspace = true }
# SHA-256 and SHA-512/384 use the Cortex-M33 cores behind the same digest API;
# SHA-1 retains RustCrypto's implementation.
rsk-sha512 = { workspace = true }
# Byte-identical SHA-256; local core keeps keyed states and schedules in Secret.
rsk-sha256 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
aes = { workspace = true }
des = { workspace = true }
cbc = { workspace = true }
cfb-mode = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
p256 = { workspace = true }
rsk-secret = { workspace = true }
ml-kem = { workspace = true }
# Stack-optimized ML-DSA (FIPS 204) — the ML-DSA-44 and -65 credential signing,
# re-exported below.
rsk-mldsa = { workspace = true }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
# Remaining sha2 consumers keep the rolled backend: its unrolled compressor
# evicts the storage verifier from the XIP cache.
sha2 = { workspace = true, features = ["force-soft-compact"] }

[features]
# Kani cannot model `cpufeatures` CPU-detection asm. scripts/kani.sh enables
# software hashing for host proofs; firmware uses the compact backend above.
kani-soft = ["sha2/force-soft", "sha1/force-soft"]
