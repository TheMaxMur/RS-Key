[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
# Build/flash the partitioned Secure+Non-secure image through the documented
# TrustZone workflow. A single Cargo ELF is an intermediate, never a flash target.
# Stack below the statics, so an overflow hits the unmapped page under
# 0x20000000 and faults instead of silently eating .bss — the failure mode that
# wedged ML-DSA-65 keygen at 0x082A. Needs `nix develop` (it finds rust-lld).
linker = "flip-link"
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "target-cpu=cortex-m33",
  "--cfg", "bp256_backend=\"bigint\"",
  "--cfg", "bp384_backend=\"bigint\"",
  # Looped SHA-2 rounds fit Cortex-M33 XIP; unrolled SHA-512 thrashes it.
  "--cfg", "sha2_backend_soft=\"compact\"",
]
