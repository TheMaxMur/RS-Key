<svg viewBox="0 0 840 482" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
  <title id="title">RS-Key security boundaries</title>
  <desc id="desc">A hostile host sends traffic to the Secure USB controller. Non-secure code frames commands, checked gateways copy them, and Secure applets authorize operations. Separately, a migrated OTP root protects sealed records from a flash dump, the partition table fences off the store in BOOTSEL, and enforced Secure Boot authenticates firmware. Invasive lab attacks are out of scope.</desc>
  <defs>
    <style>
      .title { fill: #29241f; font-size: 25px; font-weight: 700; }
      .label { fill: #52473e; font-size: 15px; font-weight: 700; }
      .note { fill: #52473e; font-size: 15px; }
      .white { fill: #fff; }
      .arrow { stroke: #61554c; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#61554c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="838" height="480" rx="16" fill="#fbfaf8" stroke="#d8cfc6" stroke-width="2"/>
  <text class="title" x="32" y="46">RS-Key security boundaries</text>

  <rect x="24" y="68" width="792" height="150" rx="12" fill="#f1ece6"/>
  <text class="label" x="40" y="93">USB command path</text>
  <g text-anchor="middle">
    <rect x="40" y="109" width="114" height="65" rx="9" fill="#963c22"/>
    <text class="label white" x="97" y="134">Hostile host</text>
    <text class="note white" x="97" y="156">USB traffic</text>

    <rect x="176" y="109" width="136" height="65" rx="9" fill="#216b61"/>
    <text class="label white" x="244" y="134">Secure USB</text>
    <text class="note white" x="244" y="156">Controller &amp; setup</text>

    <rect x="334" y="109" width="140" height="65" rx="9" fill="#435972"/>
    <text class="label white" x="404" y="134">Non-secure</text>
    <text class="note white" x="404" y="156">Classes &amp; framing</text>

    <rect x="496" y="109" width="135" height="65" rx="9" fill="#216b61"/>
    <text class="label white" x="563.5" y="134">Secure gateways</text>
    <text class="note white" x="563.5" y="156">Check &amp; copy</text>

    <rect x="653" y="109" width="147" height="65" rx="9" fill="#216b61"/>
    <text class="label white" x="726.5" y="134">Secure applets</text>
    <text class="note white" x="726.5" y="156">Authorize key use</text>
  </g>
  <path class="arrow" d="M154 142 H173"/>
  <path class="arrow" d="M312 142 H331"/>
  <path class="arrow" d="M474 142 H493"/>
  <path class="arrow" d="M631 142 H650"/>
  <text class="note" x="40" y="199">A hostile host can request operations that applet policy allows.</text>

  <text class="label" x="32" y="254">Physical access to the board</text>
  <g>
    <rect x="32" y="271" width="244" height="114" rx="10" fill="#f1ece6"/>
    <text class="label" x="48" y="301">Flash dump</text>
    <text class="note" x="48" y="327">OTP root protects records</text>
    <text class="note" x="48" y="349">migrated under it.</text>

    <rect x="298" y="271" width="244" height="114" rx="10" fill="#f1ece6"/>
    <text class="label" x="314" y="301">BOOTSEL access</text>
    <text class="note" x="314" y="327">The partition table fences</text>
    <text class="note" x="314" y="349">off the credential store.</text>
    <text class="note" x="314" y="371">Raw writes can replay data.</text>

    <rect x="564" y="271" width="244" height="114" rx="10" fill="#f1ece6"/>
    <text class="label" x="580" y="301">Replacement firmware</text>
    <text class="note" x="580" y="327">Enforced Secure Boot</text>
    <text class="note" x="580" y="349">authenticates both worlds</text>
    <text class="note" x="580" y="371">and the embedded table.</text>
  </g>

  <rect x="32" y="411" width="776" height="47" rx="9" fill="none" stroke="#b1a599" stroke-dasharray="6 4"/>
  <text class="label" x="48" y="440">Out of scope</text>
  <text class="note" x="161" y="440">Invasive debug, fault injection and physical side-channel attacks</text>
</svg>
