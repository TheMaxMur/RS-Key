<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 614"
     role="img" aria-labelledby="title desc">
  <title id="title">RP2350 OTP rows used by RS-Key</title>
  <desc id="desc">Page 1 holds boot flags and the rollback floor. Page 2 holds
    four ECC-encoded boot-key fingerprints. Page 58 holds DEVK and MKEK, with
    paired chaff 32 rows above each key. The lock words are stored separately.
    The host programs keys in BOOTSEL. Secure startup seals page 58. The
    boot ROM advances the rollback floor, and it or Secure firmware can set
    ROLLBACK_REQUIRED.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #21332F; font-size: 17px; }
    .title { font-size: 25px; font-weight: 700; }
    .section { font-size: 19px; font-weight: 700; }
    .addr, .addr text { font-family: ui-monospace, monospace; font-size: 16px; }
    .writer, .writer text { fill: #315A51; font-size: 16px; }
    .card { fill: #F0F5F3; stroke: #D5E0DC; }
    .rule { stroke: #D5E0DC; }
  </style>

  <rect x="1" y="1" width="598" height="612" rx="16" fill="#FCFDFB" stroke="#B7C8C2"/>
  <text class="title" x="24" y="40">RP2350 OTP fuse map</text>
  <text x="24" y="65">Addresses are OTP row numbers.</text>

  <rect class="card" x="24" y="84" width="552" height="160" rx="10"/>
  <text class="section" x="40" y="111">Page 1 · Boot policy</text>
  <path class="rule" d="M40 121H560 M40 151H560 M40 179H560 M40 207H560"/>
  <g class="addr">
    <text x="40" y="143">0x040</text>
    <text x="40" y="171">0x048</text>
    <text x="40" y="199">0x04B</text>
    <text x="40" y="227">0x04E / 0x051</text>
  </g>
  <g>
    <text x="182" y="143">CRIT1</text>
    <text x="182" y="171">ROLLBACK_REQUIRED</text>
    <text x="182" y="199">KEY_VALID / KEY_INVALID</text>
    <text x="182" y="227">Rollback floor · 48 logical bits</text>
  </g>
  <g class="writer" text-anchor="end">
    <text x="560" y="143">BOOTSEL</text>
    <text x="560" y="171">ROM / Secure firmware</text>
    <text x="560" y="199">BOOTSEL</text>
    <text x="560" y="227">ROM</text>
  </g>

  <rect class="card" x="24" y="256" width="552" height="80" rx="10"/>
  <text class="section" x="40" y="283">Page 2 · Boot-key fingerprints</text>
  <text class="writer" x="560" y="283" text-anchor="end">BOOTSEL</text>
  <text class="addr" x="40" y="315">0x080 · 0x090 · 0x0A0 · 0x0B0</text>
  <text x="560" y="315" text-anchor="end">Four ECC slots</text>

  <rect class="card" x="24" y="348" width="552" height="128" rx="10"/>
  <text class="section" x="40" y="375">Page 58 · Device keys</text>
  <text class="writer" x="560" y="375" text-anchor="end">BOOTSEL</text>
  <text x="40" y="403">Low half · ECC</text>
  <text x="310" y="403">High half · raw complement</text>
  <path class="rule" d="M40 411H560 M290 386V461"/>
  <text class="addr" x="40" y="433">0xE80</text>
  <text class="addr" x="40" y="459">0xE90</text>
  <text x="120" y="433">DEVK</text>
  <text x="120" y="459">MKEK</text>
  <text class="addr" x="310" y="433">0xEA0</text>
  <text class="addr" x="310" y="459">0xEB0</text>
  <text x="390" y="433">DEVK chaff</text>
  <text x="390" y="459">MKEK chaff</text>

  <rect class="card" x="24" y="488" width="552" height="104" rx="10"/>
  <text class="section" x="40" y="515">Lock words</text>
  <path class="rule" d="M40 525H560 M40 555H560"/>
  <text class="addr" x="40" y="547">0xF83 / 0xF85</text>
  <text x="182" y="547">Pages 1 and 2</text>
  <text class="writer" x="560" y="547" text-anchor="end">BOOTSEL</text>
  <text class="addr" x="40" y="575">0xFF5</text>
  <text x="182" y="575">Page 58</text>
  <text class="writer" x="560" y="575" text-anchor="end">Secure startup</text>
</svg>
