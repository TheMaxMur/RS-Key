<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 298"
     role="img" aria-labelledby="title desc">
  <title id="title">Rollback versions at OTP floor 3</title>
  <desc id="desc">The OTP thermometer has 48 logical bits. Three are programmed.
    Version 2 is rejected. Version 3 passes without advancing the floor.
    A successful normal flash boot of version 5 programs two more bits.</desc>
  <defs>
    <pattern id="bits" x="32" y="59" width="10" height="20" patternUnits="userSpaceOnUse">
      <rect width="8" height="20" rx="2" fill="#D7E0DE"/>
    </pattern>
    <style>
      text { font-family: system-ui, sans-serif; fill: #21332F; }
      .heading { font-size: 26px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 650; }
      .detail { font-size: 18px; }
      .reject { fill: #963D26; }
    </style>
  </defs>

  <rect x="1" y="1" width="542" height="296" rx="16" fill="#F8FAF8" stroke="#BBCBC6"/>
  <text class="heading" x="32" y="43">OTP floor 3</text>
  <rect x="32" y="59" width="480" height="20" fill="url(#bits)"/>
  <g fill="#286A60">
    <rect x="32" y="59" width="8" height="20" rx="2"/>
    <rect x="42" y="59" width="8" height="20" rx="2"/>
    <rect x="52" y="59" width="8" height="20" rx="2"/>
  </g>
  <text class="detail" x="32" y="105">3 programmed bits</text>
  <text class="detail" x="512" y="105" text-anchor="end">48 logical bits</text>

  <g stroke="#CAD6D2">
    <path d="M32 122H512 M32 165H512 M32 208H512 M32 251H512"/>
  </g>
  <text class="label" x="32" y="149">Version 2</text>
  <text class="detail reject" x="164" y="149">Rejected below the floor</text>
  <text class="label" x="32" y="192">Version 3</text>
  <text class="detail" x="164" y="192">Passes, floor stays at 3</text>
  <text class="label" x="32" y="235">Version 5</text>
  <text class="detail" x="164" y="235">On boot, floor rises to 5 (+2 bits)</text>

  <text class="detail" x="32" y="278">The image must also pass Secure Boot.</text>
</svg>
