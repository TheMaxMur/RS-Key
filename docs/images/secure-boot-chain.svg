<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1018"
     role="img" aria-labelledby="title desc">
  <title id="title">RS-Key production provisioning</title>
  <desc id="desc">Sign the TrustZone ELF and prepare a signed wipe image.
    Load and test the signed firmware, then provision the boot-key fingerprint
    with load-key. Harden debug and check a cold boot. Enable Secure Boot and
    read the policy after the first enforced boot. A rejected image can be
    replaced through BOOTSEL. After verification, lock the boot-key policy
    for a fixed key or leave it open for rotation. Then provision page 58.
    Later rollback increases require both signed images at the new version.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#536B78"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; font-size: 18px; fill: #192C36; }
      .title { font-size: 27px; font-weight: 700; }
      .lane { font-size: 17px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .code { font-family: ui-monospace, monospace; font-size: 17px; }
      .muted { fill: #435C67; font-size: 17px; }
      .host { fill: #FFF7EB; stroke: #D5B58B; }
      .board { fill: #EFF6FA; stroke: #AAC3D0; }
      .edge { fill: none; stroke: #536B78; stroke-width: 2; marker-end: url(#arrow); }
      .gate-text { fill: #FFFFFF; }
      .accept { fill: #20563D; }
      .reject { fill: #873720; }
    </style>
  </defs>

  <rect x="1" y="1" width="638" height="1016" rx="16" fill="#FCFDFD" stroke="#B9C8CF"/>
  <text class="title" x="28" y="41">RS-Key production provisioning</text>

  <rect x="16" y="60" width="608" height="266" rx="12" fill="#FAF3E8"/>
  <text class="lane" x="36" y="87">HOST</text>
  <text class="muted" x="604" y="87" text-anchor="end">Prepare signed firmware and rsk-wipe</text>
  <rect class="host" x="36" y="100" width="268" height="55" rx="9"/>
  <rect class="host" x="336" y="100" width="268" height="55" rx="9"/>
  <rect x="190" y="183" width="260" height="48" rx="9" fill="#F4D8AB" stroke="#C7985F"/>
  <rect class="host" x="36" y="263" width="268" height="48" rx="9"/>
  <rect class="host" x="336" y="263" width="268" height="48" rx="9"/>

  <path class="edge" d="M170 156V168H240V179"/>
  <path class="edge" d="M470 156V168H400V179"/>
  <path class="edge" d="M320 232V246H170V259"/>
  <path class="edge" d="M320 232V246H470V259"/>

  <g text-anchor="middle">
    <text class="label" x="170" y="124">Combined TrustZone ELF</text>
    <text class="muted" x="170" y="145">Secure + NS + partition table</text>
    <text class="label" x="470" y="124">Private signing key</text>
    <text class="muted" x="470" y="145">Stays on the host</text>
    <text class="code" x="320" y="213">picotool seal --sign</text>
    <text class="label" x="170" y="283">Signed ELF → signed UF2</text>
    <text class="code" x="170" y="303">picotool uf2 convert</text>
    <text class="label" x="470" y="283">Boot-key fingerprint</text>
    <text class="code" x="470" y="303">otp_secureboot.json</text>
  </g>

  <rect x="16" y="346" width="608" height="656" rx="12" fill="#E7F1F6"/>
  <text class="lane" x="36" y="371">RP2350</text>
  <text class="muted" x="320" y="371" text-anchor="middle">rsk secure-boot · BOOTSEL</text>

  <rect class="board" x="36" y="384" width="268" height="62" rx="9"/>
  <rect class="board" x="336" y="384" width="268" height="62" rx="9"/>
  <rect class="board" x="36" y="474" width="568" height="55" rx="9"/>
  <rect class="board" x="36" y="551" width="568" height="56" rx="9"/>
  <rect x="36" y="629" width="568" height="67" rx="10" fill="#243F50"/>
  <rect x="36" y="720" width="268" height="60" rx="9" fill="#E3F2E9" stroke="#8DBC9F"/>
  <rect x="336" y="720" width="268" height="60" rx="9" fill="#FCECE5" stroke="#D6A28C"/>
  <rect class="board" x="36" y="804" width="568" height="60" rx="9"/>
  <rect class="board" x="36" y="888" width="568" height="56" rx="9"/>

  <path class="edge" d="M170 312V380"/>
  <path class="edge" d="M470 312V380"/>
  <path class="edge" d="M305 415H332"/>
  <path class="edge" d="M470 447V458H320V470"/>
  <path class="edge" d="M320 530V547"/>
  <path class="edge" d="M320 608V625"/>
  <path class="edge" d="M320 697V706H170V716"/>
  <path class="edge" d="M320 697V706H470V716"/>
  <path class="edge" d="M170 781V800"/>
  <path class="edge" d="M320 865V884"/>

  <g text-anchor="middle">
    <text class="label" x="170" y="409">Load signed UF2</text>
    <text class="muted" x="170" y="432">BOOTSEL → prove it boots</text>
    <text class="label" x="470" y="409">A · load-key</text>
    <text class="muted" x="470" y="432">Write fingerprint to OTP page 2</text>
    <text class="label gate-text" x="320" y="654">Boot ROM checks key, signature and rollback</text>
    <text class="gate-text" x="320" y="679">First versioned flash boot can set ROLLBACK_REQUIRED</text>
    <text class="label accept" x="170" y="744">Verify signed boot</text>
    <text class="accept" x="170" y="768">Check flags and rollback floor</text>
    <text class="label reject" x="470" y="744">Image rejected</text>
    <text class="reject" x="470" y="768">Restore through BOOTSEL</text>
  </g>

  <text class="label" x="56" y="498">B · harden</text>
  <text x="192" y="498">Disable debug and enable glitch detection</text>
  <text class="muted" x="56" y="518">Cold-boot and verify debug denial</text>

  <text class="label" x="56" y="575">C · enable</text>
  <text class="code" x="192" y="575">Set SECURE_BOOT_ENABLE</text>
  <text class="muted" x="56" y="597">Reboot into the signed firmware</text>

  <text class="label" x="56" y="830">D · lock (optional)</text>
  <text x="266" y="830">Fix the trusted key and lock pages 1–2</text>
  <text class="muted" x="56" y="852">Skip to retain rotation. After a lock, verify another signed boot.</text>

  <text class="label" x="56" y="912">Provision page 58</text>
  <text class="code" x="266" y="912">rsk otp burn</text>
  <text class="muted" x="584" y="912" text-anchor="end">BOOTSEL</text>
  <text class="muted" x="56" y="933">Secure startup migrates storage, scrubs flash and seals the page</text>

  <text class="label" x="36" y="974">Later rollback changes</text>
  <text class="muted" x="604" y="974" text-anchor="end">Sign both images before raising the floor</text>
</svg>
