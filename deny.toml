# cargo-deny policy. Run: cargo deny check  (part of ./scripts/check.sh)

[advisories]
# Unmaintained transitive crates pulled in by embassy/cortex-m; no fix upstream.
# **No vulnerability is ignored here.** The one that used to be —
# RUSTSEC-2023-0071, the `rsa` crate's Marvin timing side channel, which has no
# fixed release at all — went away with the crate in 0.4.12: `rsk-rsa` owns the
# key type and both private paths now, so there is nothing left to carve out.
# Adding a vulnerability to this list needs a written justification and an entry
# in docs/limitations.md; everything below is merely "unmaintained".
ignore = [
    "RUSTSEC-2024-0436", # paste — unmaintained, via pio-core
    "RUSTSEC-2026-0110", # bare-metal — deprecated, via cortex-m
    "RUSTSEC-2026-0173", # proc-macro-error2 — unmaintained, build-time only (pio-proc -> embassy-rp)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "BlueOak-1.0.0", # minicbor — permissive, with a patent grant
]
confidence-threshold = 0.9
# Our own firmware crates are `publish = false`; don't license-scan them.
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/embassy-rs/embassy",
    "https://github.com/embassy-rs/rp-pac",
]
