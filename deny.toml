# cargo-deny policy. Run: cargo deny check  (part of ./scripts/check.sh)

[advisories]
# Unmaintained transitive crates pulled in by embassy/cortex-m; no fix upstream.
# **No vulnerability is ignored here.** The one that used to be —
# RUSTSEC-2023-0071, the `rsa` crate's Marvin timing side channel, which has no
# fixed release at all — went away with the crate in 0.4.12: `rsk-rsa` owns the
# key type and both private paths now, so there is nothing left to carve out.
# Adding a vulnerability to this list needs a written justification and an entry
# in docs/limitations.md; everything below is merely "unmaintained".
ignore = [
    "RUSTSEC-2024-0436", # paste — unmaintained, via pio-core
    "RUSTSEC-2026-0110", # bare-metal — deprecated, via cortex-m
    "RUSTSEC-2026-0173", # proc-macro-error2 — unmaintained, build-time only (pio-proc -> embassy-rp)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "BlueOak-1.0.0", # minicbor — permissive, with a patent grant
]
confidence-threshold = 0.9
# Our own firmware crates are `publish = false`; don't license-scan them.
private = { ignore = true }

# The local P-384 kernel uses this repository's AGPL; upstream files retain
# Apache-2.0 OR MIT. Keep this version of the mixed fork license-checked.
[[licenses.exceptions]]
crate = "p384@0.14.0"
allow = ["AGPL-3.0-only", "Apache-2.0", "MIT"]

# Local P-256 borrow propagation is AGPL; upstream remains Apache-2.0 OR MIT.
[[licenses.exceptions]]
crate = "p256@0.14.0"
allow = ["AGPL-3.0-only", "Apache-2.0", "MIT"]

# Local UInt borrow propagation is AGPL; upstream remains Apache-2.0 OR MIT.
[[licenses.exceptions]]
crate = "crypto-bigint@0.7.10"
allow = ["AGPL-3.0-only", "Apache-2.0", "MIT"]

[bans]
multiple-versions = "warn"

# The crate-tier rules of docs/architecture.md, as a graph assertion.
#
# Nothing below is "a bad crate" — most entries are ours. `wrappers` is an
# allowlist of the crates permitted to depend on the entry, so a tier violation
# is a build error rather than a thing a reviewer has to notice. Every name is a
# measured edge, not a reservation: `check.sh` passes `-D unused-wrapper`, so a
# wrapper that stops being real fails the gate too and the list cannot rot into
# decoration. Widening a list is the reviewable diff that admits a new edge.
#
# The root workspace is the whole surface for this. Every crate named below is a
# member of it, so an edge *between* two of them is declared in a member's own
# manifest and shows up here whoever adds it. `tools/emu`, `tools/tui` and
# `fuzz/` are detached workspaces this row cannot see, and the only parent each
# of them adds is its own binary — a composition root by construction, and
# allowed to reach anything.
deny = [
    # R2 — an applet never reaches sideways. The eight applets are composed by
    # the two device wirings and the firmware binary, and by nothing else. Six
    # such edges stood before the tier refactor (fido→mgmt, fido→rescue,
    # openpgp→mgmt, piv→mgmt, piv→openpgp, otp→mgmt); the machinery under each
    # moved down into rsk-phy, rsk-devconf, rsk-ec and rsk-rsa instead.
    { crate = "rsk-fido", wrappers = ["firmware", "rsk-device", "rsk-display"], reason = "R2: an applet is composed by a device wiring, never named by another applet" },
    { crate = "rsk-openpgp", wrappers = ["firmware", "rsk-device", "rsk-display"], reason = "R2: an applet is composed by a device wiring, never named by another applet" },
    { crate = "rsk-piv", wrappers = ["firmware", "rsk-device", "rsk-display"], reason = "R2: an applet is composed by a device wiring, never named by another applet" },
    { crate = "rsk-oath", wrappers = ["firmware", "rsk-device", "rsk-display"], reason = "R2: an applet is composed by a device wiring, never named by another applet" },
    { crate = "rsk-otp", wrappers = ["firmware", "firmware-ns", "rsk-device", "rsk-display"], reason = "R2: NS uses only the HID frame codec; the applet is instantiated by Secure/device roots" },
    { crate = "rsk-mgmt", wrappers = ["firmware", "rsk-device", "rsk-display"], reason = "R2: an applet is composed by a device wiring, never named by another applet" },
    # Rescue owns the BOOTSEL/OTP paths a display build deliberately leaves out,
    # so its wrapper list is two, not three.
    { crate = "rsk-rescue", wrappers = ["firmware", "rsk-device"], reason = "R2: an applet is composed by a device wiring, never named by another applet" },
    { crate = "rsk-vendor", wrappers = ["firmware", "rsk-device", "rsk-display"], reason = "R2: an applet is composed by a device wiring, never named by another applet" },

    # R3 — hash and signature backends stay behind the crypto facade.
    # Algorithm crates may name digest traits and host test oracles; applets
    # reach the RustCrypto curve vocabulary through the separate allowlists.
    { crate = "sha2", wrappers = [
        "rsk-crypto",
        "rsk-piv",       # dev-only: the RSA/ECDSA KAT oracle
        "rsk-sha512",    # dev-only: byte-for-byte oracle for the crate it replaces
        "rsk-sha256",    # digest traits and the independent SHA-256 test oracle
        "bp256",
        "bp384",
        "ed25519-dalek",
        "k256",
        "p256",
        "p384",
        "p521",
    ], reason = "R3: a hash backend is named by the crypto facade, not by an applet" },
    { crate = "sha1", wrappers = ["rsk-crypto"], reason = "R3: a hash backend is named by the crypto facade, not by an applet" },
    { crate = "rsk-sha512", wrappers = ["rsk-crypto"], reason = "R3: a hash backend is named by the crypto facade, not by an applet" },
    { crate = "rsk-sha256", wrappers = ["rsk-crypto"], reason = "R3: a hash backend is named by the crypto facade, not by an applet" },
    { crate = "rsk-mldsa", wrappers = ["rsk-crypto"], reason = "R3: a signature backend is named by the crypto facade, not by an applet" },

    # The asymmetric halves stay a named allowlist rather than a re-export
    # behind rsk-crypto. Routing them through the facade would put 11 (EC) and
    # 12 (RSA) third-party crates into the closure of the five that do neither —
    # rsk-bip39, rsk-oath, rsk-otp, rsk-rescue, rsk-slip39. Feature-gating the
    # re-export is worse: no `check.sh` row builds any of those five alone, so a
    # single-crate `cargo clippy -p rsk-oath` could break under a green gate.
    #
    # rsk-x509 signs the certificates the card applets write with an EC key, so it
    # is on the EC list — and on one of its own, or any crate could reach the EC
    # layer through it.
    { crate = "rsk-ec", wrappers = ["rsk-fido", "rsk-openpgp", "rsk-piv", "rsk-x509"], reason = "R3: the EC layer is reached only by the applets that sign or seal an EC key, and the certificate builder they sign through" },
    { crate = "rsk-rsa", wrappers = ["firmware", "rsk-device", "rsk-openpgp", "rsk-piv"], reason = "R3: the RSA layer is reached by an allowlisted applet or a composition root" },
    { crate = "rsk-x509", wrappers = ["rsk-openpgp", "rsk-piv"], reason = "R3: the certificate builder is reached only by the card applets that write certificates" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/embassy-rs/embassy",
    "https://github.com/embassy-rs/rp-pac",
]
