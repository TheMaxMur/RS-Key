# cargo-deny policy. Run: cargo deny check  (part of ./scripts/check.sh)

[advisories]
# Unmaintained transitive crates pulled in by embassy/cortex-m; no fix upstream.
# The sole *vulnerability* ignored below (rsa) is a deliberate, documented
# exception. No fixed release exists — OSV gives `introduced: 0.0.0-0` with no
# `fixed` event, so every version is affected. Every hot private-RSA path now
# runs on `rsk_rsa_asm::sign_crt` instead: PIV GENERAL AUTHENTICATE, PSO:CDS,
# INTERNAL AUTHENTICATE and — since 0.4.11 — PSO:DECIPHER, which unpads with the
# applet's own constant-time `pkcs1v15`. Two private uses are left. `rsk-piv/src/
# x509.rs` signs a certificate at key generation over a digest the device built
# itself, so there is no chosen-ciphertext oracle to drive; and
# `rsa_decipher_legacy` in `rsk-openpgp/src/keys.rs` serves only a legacy `P‖Q`
# key of non-32-multiple width, which no current firmware can store and which
# would otherwise lose the ability to decrypt its own archived messages.
# Rationale and residual risk: docs/limitations.md → "RSA (RUSTSEC-2023-0071)".
# Everything else here is merely "unmaintained".
ignore = [
    "RUSTSEC-2024-0436", # paste — unmaintained, via pio-core
    "RUSTSEC-2026-0110", # bare-metal — deprecated, via cortex-m
    "RUSTSEC-2026-0173", # proc-macro-error2 — unmaintained, build-time only (pio-proc -> embassy-rp)
    "RUSTSEC-2023-0071", # rsa — Marvin timing side-channel; no fix upstream, mitigated by blinding (see above)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "BlueOak-1.0.0", # minicbor — permissive, with a patent grant
]
confidence-threshold = 0.9
# Our own firmware crates are `publish = false`; don't license-scan them.
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/embassy-rs/embassy",
    "https://github.com/embassy-rs/rp-pac",
]
