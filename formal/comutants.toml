# ---- RSKeyRetryLattice: the retry/recovery ladder ---------------------------
# The module docstring's warning was right and this is its answer: dropping the
# `left == 0` floor alone lets `left - 1` underflow a u8, and the slice then dies
# on the arithmetic rather than on a blocked reference authenticating — a kill for
# the wrong reason, which measures nothing. Rebinding `left` to `max(1)` removes
# the floor AND keeps every `left - 1` below it in range, so what fails is the
# property. Same both-layers shape as the store's revoke-before-write.

