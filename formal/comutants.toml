[comutant.BugPinFreshOutlivesPin]
status = "unreachable"
evidence = "the clamp is unobservable in today's Rust. `pin_fresh` has exactly one reader — crates/rsk-piv/src/auth.rs:63, `PINPOLICY_ALWAYS => sess.has_pin && sess.pin_fresh` — and it is CONJOINED with the status it refines, so a freshness that outlives `has_pin` authorises nothing: the guard is already false on the other half. `Session::set_pin` (crates/rsk-piv/src/lib.rs:183-186) is the only writer that sets it TRUE, and `GenAuth::spend_pin` (crates/rsk-piv/src/auth.rs:115-119) only ever sets it false. The first patch here scored a false kill by taking `self.pin_fresh = verified` out of `set_pin`, which is the INVERSE defect — it makes freshness unreachable rather than immortal, fail-closed rather than fail-open, and all 11 failures were 9000-expected-got-6982. The faithful mutant (`if verified { self.pin_fresh = true; }` — grant kept, clamp dropped) measures GREEN over 130 tests. The model keeps `pfresh` as a second requirement-side copy precisely to expose a split the Rust does not have."

[comutant.BugSigPinNotSpent]
status = "patch"
file = "crates/rsk-openpgp/src/keys.rs"
find = """
    if fs.read(EF_PW_PRIV, &mut pw).is_some() && pw[0] == 0 {
        sess.has_pw1 = false;
    }
"""
replace = """
    if fs.read(EF_PW_PRIV, &mut pw).is_some() && pw[0] == 0 {
        let _ = &sess;
    }
"""
slice = ["cargo", "test", "-p", "rsk-openpgp"]
expect = "killed"
note = "inc_sig_count stops clearing PW1 under the one-shot PW status, so one VERIFY signs for ever — the one-signature rule with nothing enforcing it."

[comutant.BugUserStatusOpensAdmin]
status = "patch"
file = "crates/rsk-openpgp/src/putdata.rs"
find = """
    if fid == EF_PRIV_DO_1 || fid == EF_PRIV_DO_3 {
        sess.has_pw2
    } else {
        sess.has_pw3
    }
"""
replace = """
    if fid == EF_PRIV_DO_1 || fid == EF_PRIV_DO_3 {
        sess.has_pw2
    } else {
        sess.has_pw3 || sess.has_pw1 || sess.has_pw2
    }
"""
slice = ["cargo", "test", "-p", "rsk-openpgp"]
expect = "killed"
note = "the converse of BugAdminOpensKeyOps: a USER status opens PUT DATA's administrative surface. PIV states the same rule at seven separate 9B management-key gates (crates/rsk-piv/src/lib.rs:288, 594, 665, 793, 1030, 1090 and crates/rsk-piv/src/keygen.rs:585), none of them patched here."

[comutant.BugRefusedValidateGrants]
status = "patch"
file = "crates/rsk-oath/src/lib.rs"
find = """
        if !ct_eq(resp, &mac[..size]) {
            return Sw::WRONG_DATA;
        }
"""
replace = """
        if !ct_eq(resp, &mac[..size]) {
            self.validated = true;
            return Sw::WRONG_DATA;
        }
"""
slice = ["cargo", "test", "-p", "rsk-oath"]
expect = "killed"
note = "a refused VALIDATE grants the unlock while still answering 6A80 — the status word says no and the applet opens. The refusal rule exempts VALIDATE entirely, so nothing but a direct test can tell the two apart."

