note = "audit run-35, shipped at four of five re-key sites: a lazy re-key — or a lazy DELETE, which appends a tombstone rather than erasing — leaves EF_HARDENED standing over the weak copy it just superseded, so no future boot ever scrubs it. The DEFINITION is patched, not the call sites, because it dominates all of them — patching sites would leave the oath and openpgp halves unmeasured and over-anchor the entry to an enumeration that grows. The anchor is the WHOLE body because the re-arm outgrew its `delete`: the read-back has to go with it, since the defect is a re-arm that keeps the marker AND still answers `Ok` — leave `try_has_data` standing and the patch models the REFUSAL instead, which kills through `expect(\"a healthy medium re-arms and says so\")` and says the wrong half. The `Fs::rescrub_refused` latch goes with it for the same reason: it is set from this body's `Err` arm, so a patch that kept it would leave a stuck medium still reported and only half the defect modelled. Direction read at both levels: TLC's counterexample is `LazyRekey` at `marker = TRUE` reaching `weak = 1`, a marker standing over a leftover, and the host failure is `requesting_a_rescrub_clears_the_hardened_marker` (crates/rsk-fs/src/fs_tests.rs:385) reporting `a rescrub request must clear the marker, or the lap never runs again` — the marker SURVIVED, not a spurious clear."

