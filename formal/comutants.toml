#
# Co-refutation: every model mutant, re-made as the code defect it models.
# The model's 28 Bug* switches each rebuild a real RS-Key defect and MUST go
# RED in TLC — that is measured weekly. This file asks the other half of the
# question: does the SAME defect, injected into the production Rust, go red
# at the code level too? A mutant the model catches and the code level does
# not is a measured abstraction gap — the exact place where "TLA+ green AND
# tests green" stops meaning "the same system was checked twice".
#
# scripts/comutate.py owns the mechanics: `--lint` (a check.sh row) holds this
# file against the Mut_*.cfg roster in both directions, resolves every patch
# anchor against the current tree, and floors the pending count; `run` applies
# a patch in a throwaway worktree, runs the slice, and compares the verdict to
# `expect`. Anchors are exact source snippets, not diff line numbers — code
# drift makes the lint fail loudly instead of the patch applying somewhere else.
#
# Statuses:
#   patch        find/replace below; `expect` records the measured verdict
#                (killed | gap). A killed that becomes gap is a regression.
#   unreachable  the defect became unreachable by construction after a shipped
#                fix; the model measured it (evidence names where). No patch.
#   pending      batch not yet derived. The count is FLOORED by --lint: it can
#                only go down, so "later" stays a plan rather than a hole.
#
# The invariant each mutant targets is NOT recorded here — the lint derives it
# from the mutant's own Solo_*.cfg, so this file cannot disagree with the
# matrix about who catches what.

pending_floor = 0
# 28 until the token-less makeCredential bridge, and 31 now. The count is an
# EQUALITY and not a floor, so it moves only with the `Mut_*` roster itself — the
# three additions are BugUvNotRqdIgnoresRk and BugTokenlessIgnoresAlwaysUv
# (batch 6) and BugForceChangeIgnored (batch 7). The arithmetic is stated because
# an earlier version of this comment named two additions beside a count of 31.
