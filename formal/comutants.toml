[comutant.BugPivChangeResetsStatus]
status = "patch"
file = "crates/rsk-piv/src/lib.rs"
find = """
        change_reference(dev, fs, which, old, new)
    }
"""
replace = """
        let sw = change_reference(dev, fs, which, old, new);
        self.sess.set_pin(false);
        sw
    }
"""
slice = ["cargo", "test", "-p", "rsk-piv"]
expect = "killed"
note = "an EXEMPT refusal taken back out: CHANGE REFERENCE DATA clears the standing status. SP 800-73-4 pt2 3.2.2/3.2.3 say it does not and a YubiKey 5.7.4 was measured keeping it, so this is a deliberate divergence the tree defends — the mutant asks whether anything would notice it going."

[comutant.BugRefusedValidateDropsUnlock]
status = "patch"
file = "crates/rsk-oath/src/lib.rs"
find = """
        if !ct_eq(resp, &mac[..size]) {
            return Sw::WRONG_DATA;
        }
"""
replace = """
        if !ct_eq(resp, &mac[..size]) {
            self.validated = false;
            return Sw::WRONG_DATA;
        }
"""
slice = ["cargo", "test", "-p", "rsk-oath"]
expect = "killed"
note = "the second exempt refusal: a refused VALIDATE drops the standing unlock. A MAC challenge-response has no retry counter for a refusal to protect, so dropping it costs availability and buys nothing."

[comutant.BugRemoveCodeUnvalidated]
status = "patch"
file = "crates/rsk-oath/src/lib.rs"
find = """
    fn cmd_set_code<S: Storage>(&mut self, apdu: &Apdu, fs: &mut Fs<S>) -> Sw {
        if !self.validated {
            return Sw::SECURITY_STATUS_NOT_SATISFIED;
        }
        let data = &apdu.data[..apdu.nc];
"""
replace = """
    fn cmd_set_code<S: Storage>(&mut self, apdu: &Apdu, fs: &mut Fs<S>) -> Sw {
        let data = &apdu.data[..apdu.nc];
        let removing = matches!(parse_exact(data, [TAG_KEY]), Some([key]) if key.is_empty());
        if !self.validated && !removing {
            return Sw::SECURITY_STATUS_NOT_SATISFIED;
        }
"""
slice = ["cargo", "test", "-p", "rsk-oath"]
expect = "killed"
note = "SEC-SEAM-006's own defect: the `73 00` removal reaches past the validated gate, so anyone who can select the applet unlocks it for good. The model could not see this for two revisions — the exemption fired exactly on the state the removal creates — and closing it needed a recorder at the STEP."
