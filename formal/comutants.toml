[comutant.BugCredBeforeRp]
status = "patch"
file = "crates/rsk-fido/src/credential.rs"
find = """
    if new_record {
        bump_rp(fs, seed, rp_id_hash, rp_id)?;
    }
"""
replace = """
    let _defer_bump = new_record;
"""
find2 = """
    if let Err(e) = fs.put(EF_CRED + slot, &rec[..total]) {
        if new_record {
            let _ = crate::credmgmt::decrement_rp(fs, rp_id_hash);
        }
        return Err(e);
    }
"""
replace2 = """
    fs.put(EF_CRED + slot, &rec[..total])?;
    if _defer_bump {
        bump_rp(fs, seed, rp_id_hash, rp_id)?;
    }
"""
slice = ["cargo", "test", "-p", "rsk-fido"]
expect = "killed"
note = "registration writes EF_CRED before EF_RP: a torn write strands a live credential no enumeration surface can reach."

[comutant.BugDeleteRpBeforeCred]
status = "patch"
file = "crates/rsk-fido/src/credmgmt.rs"
find = """
    ctx.fs
        .delete(EF_CRED + slot)
        .map_err(|_| CtapError::NotAllowed)?;
"""
replace = """
    decrement_rp(ctx.fs, rp_id_hash)?;
    ctx.fs
        .delete(EF_CRED + slot)
        .map_err(|_| CtapError::NotAllowed)?;
"""
find2 = """
    largeblobext::discard(ctx.fs, slot);
    decrement_rp(ctx.fs, rp_id_hash)?;
    Ok(0)
"""
replace2 = """
    largeblobext::discard(ctx.fs, slot);
    Ok(0)
"""
slice = ["cargo", "test", "-p", "rsk-fido"]
expect = "killed"
note = """deleteCredential drops the RP entry first: a torn delete strands the
credential. Was batch 1's one measured GAP — the registration twin's harness
tears writes, and no harness tore a delete — closed by
a_torn_delete_never_leaves_a_credential_without_its_rp (a mutating-op-budget
tear over a sole-credential RP), re-measured killed."""

