#
# The build and verification toolchain, as a TCB a generator can enumerate.
# HAND-WRITTEN FIELDS ONLY: a tool's name, role, provenance, pin and statement, a
# not-TCB input's name and reason, and a boundary's id, provider and statement.
# Everything else — which pin file each provenance names, what that file says
# today, which of the criterion's TCB categories the roster reaches, how many
# tools carry each role, WHICH FFI BOUNDARIES THE TREE HAS and what guards each
# one — is DERIVED by scripts/toolchain_gate.py and printed into
# docs/supply-chain.md, never stored.
#
# `pin` is a VALUE and it is never the authority. Every row also carries a
# `provenance` naming a file the gate opens on every run, and the row is refused
# unless that file still says the same thing. A hash whose only source is the
# moment somebody typed it is exactly what assurance/properties.toml's header
# records this tree having already paid for; a hash held against the file that
# produced it is a second copy that cannot rot silently.
#
# `unpinned` is the one provenance with no file behind it, and it is therefore
# the one that could turn this registry into a place to park a gap quietly. It is
# legal only where `pin` names a PLAT-TOOL* row of assurance/platform.toml whose
# `status` is still `pending` — so an unpinned tool is an open obligation with an
# owner, and closing that obligation while the tool stays unpinned reddens here.
#
# The flake's root inputs are held BOTH WAYS: each is named by some tool's
# provenance or carries a `[[not_tcb]]` row saying why nothing it provides
# reaches an image or a proof. A registry that lists only what somebody
# remembered is the failure this class of file exists to prevent, and it is not
# detectable from the inside — every row can be correct while the set is short.
#
# ---- What this roster does NOT enumerate -------------------------------------
#
# Stage 11A work 1's fourth exit criterion names six TCB categories: compiler,
# linker, LLVM passes, assembler, bootrom and FFI. Four are here. Three of those
# are TOOLS with a pin held against its source file (compiler, linker,
# assembler); the fourth, FFI, is the `[[boundary]]` rows below, and it is a
# different kind of answer. A boundary is a place in the source, so what the gate
# holds is that the SET is complete against the tree — both ways, on every run —
# and that each crossing's foreign half comes off a pinned producer above. It
# pins no boundary, because there is nothing there to pin.
#
# The `unsafe` sites of assurance/platform.toml's PLAT-TOOLCHAIN-002 are a
# different set again, and were never this one: `unsafe` is where Rust's rules
# are suspended, which most FFI is and most `unsafe` is not.
#
# The boundaries are the ones OF THIS TREE. A dependency declares its own in its
# own source, which no reader of this checkout can enumerate — measured over
# Cargo.lock, 25 of the 276 checksummed crates carry `extern "C"` or
# `#[no_mangle]`, cortex-m and cortex-m-rt among them. What is recorded for those
# is the [[tool]] pin that fixes the crate, not the symbols it crosses on.
#
# Two categories are absent and cannot be added by this generator:
#
#   * LLVM passes. rustc's LLVM version is not written in any file of this tree,
#     and its pass pipeline is written nowhere at all. `rustc -vV` on a machine
#     would answer for that machine, which is the question this file refuses to
#     ask (see the gate's docstring).
#   * The bootrom. It is burned into the RP2350 and no file here records a
#     version or a hash for it. assurance/platform.toml's PLAT-ROM-001 is the
#     assumption that stands in its place.
#
# So the criterion is NOT closed by this file, and saying it were would be the
# "criteria satisfied by writing sentences" failure the criteria were rewritten
# to prevent. The generated region of docs/supply-chain.md prints the split.

# ---- The image's own producers ------------------------------------------------
# Everything a byte of the shipped firmware passes through. `rust-lld` and
# `arm-none-eabi-as` have no package of their own: they ship inside the toolchain
# and inside gcc-arm-embedded respectively, so their pin is that package's, and
# they are rows rather than a footnote because the criterion counts CATEGORIES
# and the linker and the assembler are two of them.

[[tool]]
name = "rustc"
role = "compiler"
provenance = "flake.lock:fenix"
pin = "3a556b6fbd42412b6f3f0ea8d35959b1826f86ff"
statement = "Compiles every first-party crate in the image. flake.nix:47-50 combines fenix's stable toolchain with the thumbv8m rust-std, so the fenix lock node is what fixes the compiler."

[[tool]]
name = "cargo"
role = "packager"
provenance = "flake.lock:fenix"
pin = "3a556b6fbd42412b6f3f0ea8d35959b1826f86ff"
statement = "Chooses which crates and which features are compiled into the image (nix/firmware.nix:143-146). Ships in the same fenix toolchain as rustc."

[[tool]]
name = "rust-lld"
role = "linker"
provenance = "flake.lock:fenix"
pin = "3a556b6fbd42412b6f3f0ea8d35959b1826f86ff"
statement = "The linker flip-link shells out to; it sits in the rustc sysroot rather than on PATH (nix/firmware.nix:131-133), so the toolchain that pins rustc pins it."

[[tool]]
name = "flip-link"
role = "linker"
provenance = "flake.lock:nixpkgs"
pin = "331800de5053fcebacf6813adb5db9c9dca22a0c"
statement = "The linker .cargo/config.toml names (nix/firmware.nix:127). It relocates the stack so an overflow faults instead of eating .bss, which is a property of the emitted image and not of the source."

[[tool]]
name = "arm-none-eabi-gcc"
role = "compiler"
provenance = "flake.lock:nixpkgs"
pin = "331800de5053fcebacf6813adb5db9c9dca22a0c"
statement = "Compiles rsk-rsa's C modexp core; ships in pkgs.gcc-arm-embedded (nix/firmware.nix:125). A second compiler in the image, which is why elf_gate.py holds a SET of DWARF producers rather than one."

[[tool]]
name = "arm-none-eabi-as"
role = "assembler"
provenance = "flake.lock:nixpkgs"
pin = "331800de5053fcebacf6813adb5db9c9dca22a0c"
statement = "Assembles rsk-rsa's hand-written ARM asm. Same gcc-arm-embedded package as the C compiler; a row of its own because the assembler is one of the criterion's six categories."

[[tool]]
name = "cortex-m"
role = "assembler"
provenance = "Cargo.lock:cortex-m"
pin = "8ec610d8f49840a5b376c69663b6369e71f4b34484b9b2eb29fb918d92516cb9"
statement = "A PREBUILT asm blob, assembled by a 2021 nightly on someone else's machine and shipped as bytes in the crate. It is the second DWARF producer scripts/elf_gate.py counts, and the one producer in the image that no nix input pins."

[[tool]]
name = "picotool"
role = "packager"
provenance = "flake.lock:nixpkgs"
pin = "331800de5053fcebacf6813adb5db9c9dca22a0c"
statement = "Writes the partition table into the ELF (scripts/pt.sh:107) and converts it to the published UF2 (nix/firmware.nix:159). Both are shipped bytes, so it is a producer and not a viewer."

[[tool]]
name = "arm-none-eabi-nm"
role = "packager"
provenance = "flake.lock:nixpkgs"
pin = "331800de5053fcebacf6813adb5db9c9dca22a0c"
statement = "Reads the symbols the KV fence's start and end addresses are computed from (scripts/pt.sh:27-31). It is FIRST of three candidates there; llvm-nm and a host nm are fallbacks the flake does not pin, which is why this row names the one the dev shell guarantees."

# ---- The verification TCB -----------------------------------------------------
# Outside the criterion's six categories and in the TCB of every result this
# programme publishes: a checker that is not the one recorded makes a verdict a
# statement about a different program.

[[tool]]
name = "cargo-kani"
role = "prover"
provenance = "workflow:.github/workflows/ci.yml:KANI_VERSION"
pin = "0.67.0"
statement = "Runs every #[kani::proof] harness. No nix file mentions it at all, so its only pin is an env: assignment written three times across two workflow files; the gate holds all three together."

[[tool]]
name = "cbmc"
role = "checker"
provenance = "unpinned"
pin = "PLAT-TOOL-003"
statement = "The model checker cargo-kani downloads with its own bundle. Its version is a function of the Kani release and of nothing in this tree, so it has no pin at all — the gap PLAT-TOOL-003 already names."

[[tool]]
name = "tlaplus"
role = "checker"
provenance = "flake.lock:nixpkgs"
pin = "331800de5053fcebacf6813adb5db9c9dca22a0c"
statement = "TLC, and the tla2tools.jar formal/run-tlc.sh runs (nix/devshells.nix:62). Every model verdict in assurance/configurations.toml is this tool's answer."

[[tool]]
name = "jre8"
role = "runtime"
provenance = "flake.lock:nixpkgs"
pin = "331800de5053fcebacf6813adb5db9c9dca22a0c"
statement = "The JVM TLC runs on (nix/devshells.nix:63). It was taken from the contributor's PATH before it was pinned, which made a prover's runtime differ per machine."

# ---- Root inputs that are not in the TCB --------------------------------------
# The other half of the both-ways rule. An input listed here provides nothing to
# any image or any proof, and the reason has to say why — a bare exclusion is a
# gap parked under a different heading.

[[not_tcb]]
input = "nixpkgs-sdl2"
reason = "SDL2 alone, for the tools/emu --display window (flake.nix:9-15). Nothing from this pin enters a firmware build, a Kani run or a TLC run; it exists because unstable's sdl2-compat emits SDL3 window events the Rust crate aborts on."

[[not_tcb]]
input = "flake-utils"
reason = "eachDefaultSystem plumbing (flake.nix:36). It emits no binary into any build; it decides which systems the outputs are instantiated for."

# ---- The FFI boundaries -------------------------------------------------------
# The criterion's sixth category. A boundary is every place a Rust name in this
# tree binds to a symbol that Rust does not define: an item an `extern` block
# declares (`import:`), an item this tree defines for a foreign caller
# (`export:`), and a foreign translation unit a `build.rs` hands to `cc`
# (`unit:`). The `id` is not written here so much as CLAIMED: the gate derives
# the set from the tree on every run and holds it both ways — a boundary in the
# tree with no row is the registry falling short, a row whose id no derivation
# produces is a row that outlived what it described.
#
# `provider` is the pinned tool that produces the FOREIGN half, and it has to be
# a `[[tool]]` above whose role answers for one of the criterion's categories.
# That is the join to the toolchain closure: an FFI boundary enumerated with no
# pinned producer behind it would be a list of names, which is the shape the
# criterion asks this file not to be.

[[boundary]]
id = "import:crates/rsk-rsa/src/lib.rs:bignum_modexp_private_exponent"
provider = "arm-none-eabi-gcc"
statement = "csrc/bignum_high_level.c:280. The private-exponent modexp, the one RSA signing runs; its arguments are secret key material and its contract (widths, endianness, temp size) is stated in csrc/bignum_high_level.h and nowhere the Rust compiler can see."

[[boundary]]
id = "import:crates/rsk-rsa/src/lib.rs:rsa_private_exp_crt"
provider = "arm-none-eabi-gcc"
statement = "csrc/bignum_high_level.c:296. CRT signing. Same header contract, and the one with the most operands: eleven, of which eight are pointers whose lengths Rust cannot check and three are the size_t lengths describing two of them. Counted off the signature itself, which crates/rsk-rsa/src/lib.rs:326-338 and the C definition spell operand for operand alike; it read `nine pointers` until 2026-09-02."

[[boundary]]
id = "import:crates/rsk-rsa/src/lib.rs:bignum_modexp_public_exponent"
provider = "arm-none-eabi-gcc"
statement = "csrc/bignum_high_level.c:69. Public-exponent modexp, the verify path. The only one of the three that returns a status; the negative returns are preconditions the C checks and the Rust signature does not."

[[boundary]]
id = "import:firmware/src/main.rs:_stack_end"
provider = "flip-link"
statement = "Not a function: a symbol whose ADDRESS is the datum. cortex-m-rt's link.x emits it and flip-link rewrites it when it inverts RAM, so the value MSPLIM is armed with is the linker's output and not the source's."

[[boundary]]
id = "import:firmware/src/main.rs:__kvmain_start"
provider = "rust-lld"
statement = "firmware/memory.x:30, an assignment the linker evaluates. The KV store's flash offset; scripts/pt.sh:43 reads the same symbol back out of the ELF, which is the other half of this boundary being checked."

[[boundary]]
id = "import:firmware/src/main.rs:__kvmain_end"
provider = "rust-lld"
statement = "firmware/memory.x:31. The end of the same range."

[[boundary]]
id = "import:firmware/src/main.rs:__kvcnt_start"
provider = "rust-lld"
statement = "firmware/memory.x:32. The counter partition's flash offset, fenced apart from the main store."

[[boundary]]
id = "import:firmware/src/main.rs:__kvcnt_end"
provider = "rust-lld"
statement = "firmware/memory.x:33. The end of the counter partition; scripts/check.sh:275 holds the partition table against __kvmain_start..__kvcnt_end."

[[boundary]]
id = "unit:crates/rsk-rsa/csrc/bignum_high_level.c"
provider = "arm-none-eabi-gcc"
statement = "The C half of rsa-armv7, compiled straight into the image by crates/rsk-rsa/build.rs and only when CARGO_CFG_TARGET_OS is `none`. It defines all three imported symbols above and calls the assembly below; csrc/bignum_high_level.h and csrc/bignum_config.h are its headers, inputs to this unit rather than units of their own."

[[boundary]]
id = "unit:crates/rsk-rsa/csrc/bignum_asm.S"
provider = "arm-none-eabi-as"
statement = "The hand-written Armv7-M assembly, preprocessed by gcc and assembled by as. Seven START_GLOBAL_FUNC symbols, none of them declared by any Rust extern block — the C above is their only caller. It is linked into .data so it executes from SRAM."
