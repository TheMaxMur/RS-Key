#
# Standing assumptions: facts a model uses that the model itself cannot
# establish. HAND-WRITTEN FIELDS ONLY: constant, statement, discharged_by, risk.
# Which configurations pin an assumption, which arm each takes, and whether the
# module branches on it at all are DERIVED by scripts/assumption_gate.py and
# printed, never stored — the same rule properties.toml states, for the same
# reason.
#
# The gate holds this file against the tree in both directions, and its third
# rule is the one that earned the file. `PowerOnClearsScratch2` was an
# `ASSUME` in RSKeyBootHardening and `TRUE` in all seven Boot configurations
# THERE WERE AT `358755f^`, and nothing branched on it: deleting the line left
# every run bit-identical (77 states, 24 distinct, depth 5, before and after).
# All four numbers are that experiment's rather than the tree's, which is why
# they carry the commit: undated, the seven reads as a live count, and the tree
# grew Boot configurations after it. It named the open
# question without letting anyone ask it. So an assumption must be ASSIGNED
# BOTH WAYS by some configuration and READ BY AN ACTION, or it is a comment
# with a type.

[[assumption]]
constant = "PowerOnClearsScratch2"
statement = "A real RP2350 power-on reset clears WATCHDOG.scratch2, so the PIN soft-lock the previous cycle recorded does not ride through it."
discharged_by = "A board measurement: write a known value to WATCHDOG.scratch2, cut power at the supply (not a warm reset — firmware/src/pin_lock.rs:54 writes the word on every FIDO dispatch (CTAPHID or CCID), so the read must come from the first boot after), and read it back on the next boot. tests/54_sram_residue.py is the shape; the register is not SRAM, so it needs its own probe."
# Which way an unconfirmed assumption fails matters more than that it is
# unconfirmed, and this one fails towards MORE locking, not less: a word that
# rides a power cycle carries the mismatch batch with it. The undefined-register
# case is a third possibility and is already handled — the tag makes garbage read
# as clear (firmware/src/pin_lock.rs:36-37) — so it is not this assumption's.
risk = "usability"

[[assumption]]
constant = "RekeyOrderModelled"
statement = "The re-arm and the record write beneath it can be modelled as ONE step: which of the two lands first reaches no state the configurations the tiers are about would otherwise see."
discharged_by = "Both arms run, and the TRUE arm REFUTES the collapse in one direction rather than confirming it — which is why the constant exists instead of a sentence. FALSE in every Boot configuration, where the pair is one action and a power cut between the halves has nowhere to sit, so the order is unfalsifiable there. TRUE in `Historical_BootWriteThenRearm.cfg`, which splits it in the order every call site shipped until 0x09BD — the `fs.put` and then the `rsk_fs::request_rescrub` beneath it — and is RED at `MarkerNeverLies` on a reset landing in the window: the marker stands over the copy the write superseded, and the worker that owed the re-arm is gone, so no later boot runs the lap. TRUE in `Historical_BootRearmThenWrite.cfg` too, the same split re-arming FIRST — the order the tree SHIPS now, the `rsk_fs::request_rescrub_if` and then the `fs.put_over` beneath it, crates/rsk-fido/src/clientpin.rs:826-834 — which is GREEN over its whole space. So what discharges the FALSE arm is NOT that the order is immaterial — it is not — but that those rows are about the marker's other defects (`BugMarkerBeforeScrub` and `BugRekeyKeepsTheMarker`) and the order now has rows of its own — the `Historical_Boot*` pair, which scripts/assumption_gate.py lists under this constant, so no count of them is typed here either. It is settled in the code, and by an oracle rather than by a count: every production path that supersedes a pre-OTP record re-arms AHEAD of that write, `Cut::assert_re_armed_before` in crates/rsk-fs/src/storage.rs holds that order per site off the medium's own op log, and the rule is stated where the function is defined (crates/rsk-fs/src/lib.rs:48-63). NO COUNT of those sites is written here, for the reason RSKeyBootHardening already gives beside the same command — the count is what rotted. `git grep -nE 'rsk_fs::(request_rescrub|request_rescrub_if|attempt_rescrub)\\(' -- crates`, outside rsk-fs's own definition and its `*_tests.rs` drivers, is the live roster: its first spelling answered fifteen when this sentence landed (`b67a50a`) and thirty-one thirty-four commits later (`14224cc`), and both of those numbers carry a commit because neither is the tree's. Nor is the occurrence the unit a reader should count: four wipe paths re-arm a SECOND time AFTER their sweep, to recover a head re-arm the medium refused, so a grep that counts occurrences and reads `precedes` literally refutes a claim the tree holds. `RamStorage` still cannot reach the window — it cannot tear, and a failed `put` clears the marker under either order — so the host twin runs on a medium that stops serving mid-command (crates/rsk-fs/src/fs_tests.rs:392)."
# Which way it fails: SECURITY, and this one is measured rather than argued. The
# collapse can only HIDE a break, like the coverage arms below — but the break it
# hides is a superseded pre-OTP-sealed copy left readable in a raw flash dump for
# the life of the device, because the marker that survives the cut is exactly
# what stops any later boot running the lap. The window is one reset wide.
risk = "security"

[[assumption]]
constant = "AlwaysUvShipped"
statement = "The shipped image is built without `--features always-uv`, so `gate.alwaysUv` is a free state variable a platform toggles rather than the compiled default every reset restores."
discharged_by = "The build itself: `firmware/Cargo.toml`'s default feature set, and the `firmware-always-uv` column of docs/assurance-matrix.md, whose settling question already names SEC-FIDO-001. Both arms run: every configuration the shipped image is about pins it FALSE, and AlwaysUv.cfg runs the whole invariant set with it TRUE."
# Which way it fails: TOWARDS more gating. A build that ships alwaysUv demands a
# token for every makeCredential and getAssertion, so the arm the shipped tree
# does not take is the stricter one — a coverage question, not a security one.
risk = "coverage"

[[assumption]]
constant = "WidePerms"
statement = "The five permission subsets `PermSets` carries are enough: the eleven a host can also obtain reach no state the five do not."
discharged_by = "Both arms run, and the wide one is now falsifiable. FALSE in every configuration the tiers are about, TRUE in PermWide.cfg, which draws `ps` from all sixteen subsets of `Perms` and checks the whole invariant set — and TRUE in PermWideMut_BugStopUsingKeepsPerms.cfg and PermWideMut_BugConsumeKeepsMcGa.cfg, which run the same widening with one defect armed each and are required RED. Until those, no mutant ran on this arm at all: its green said the run finished, not that anything watched it. What they buy is that the wide arm's observers can fail, NOT that the widening is load-bearing — no switch in the roster is killed only under it, and PLAT-MODEL-001 records why the `Perms` alphabet rather than the domain is the route to the stronger claim. The narrow arm was never a description of the code and is no longer claimed to be one: driving `client_pin` over all 256 requestable permission bytes on both permission-bearing subcommands (crates/rsk-fido/src/clientpin_perms_tests.rs) obtains ALL SIXTEEN, because 0x09 refuses only `be` and a `pcmr` travelling with company. What the wide arm discharges is the consequence, not the premise."
# Which way it fails: COVERAGE, and only coverage. A subset the model never
# builds is a permission combination no configuration runs -- it cannot make an
# invariant hold that would otherwise break, it can only hide a break. That is
# why the arm exists rather than an argument, and why it is a separate
# configuration: the widening's wall cost was measured on AlwaysUv.cfg's REDUCED
# ladder, and the ratio and what it projects are recorded beside that emit in
# formal/gen-configs.sh -- not retyped here. An earlier draft put that ratio on
# widening Shipped.cfg's own scope, which is the ladder the projection says the
# tier cannot afford, so the number was attached to a run nobody made.
risk = "coverage"

[[assumption]]
constant = "ForceChangeModelled"
statement = "`gate.forceChange` — EF_MINPINLEN[1], the forced-PIN-change flag — is a gate the module can leave out of the configurations the tiers are about, because a state it can only PRUNE reaches no violation the tiers would otherwise see."
discharged_by = "Both arms run. FALSE in every configuration the tiers are about, TRUE in ForceChange.cfg — which sets the flag from authenticatorConfig and checks the whole invariant set — and in `BugForceChangeIgnored`'s own configurations, whose defect is unreachable on the FALSE arm by construction — scripts/assumption_gate.py prints that roster under this constant, so it is not counted here. The FALSE arm is an ARGUMENT and is written as one: adding a record field that is constant FALSE for a whole run is a bijection on reachable states, so the arm can add no behaviour. The argument is then CHECKED, and not by this sentence: the safety tier re-run after the constant landed carries the same states, the same distinct count and the same depth for `Shipped.cfg`, `AlwaysUv.cfg` and `PermWide.cfg` as the record taken before it existed. Those numbers live in `formal/runs.toml` and in the generated results table, which is where they are read off — an earlier draft of this sentence claimed the measurement in the past tense before any run had finished, and a review caught it by comparing file times. PLAT-MODEL-010 is the row this closes: `crates/rsk-fido/src/clientpin.rs:388-394` refuses token issuance after the PIN has verified, and the module carried three conjuncts where the code has four — PLAT-MODEL-010's own sentence, propagated rather than re-derived, and true of the module as it stood at that row's `evidence_commit` (`f5577ab`), which is the anchor a bare pair of cardinals needs to stop reading as a live claim."
# Which way it fails: COVERAGE. The flag only ever DISABLES an issuing door, so a
# configuration that cannot set it explores a superset of the token-issuing
# behaviours -- it can hide no break, only pay for states that prove nothing. The
# arm exists rather than an argument because the flag is reachable from every
# PIN-set state, and Shipped.cfg already pays 77 563 872 distinct states.
risk = "coverage"
