[[exception]]
id = "MX-POL-001"
module = "RSKeyAppletPolicies.tla"
line = 140
shape = "clause"
site = "PivKeyOp"
clause = 'pivPolicy # "never"'
kind = "narrowing"
production = "PIN policy NEVER needs no PIN, so a key operation at such a slot has no freshness to spend; ONCE and ALWAYS both do, and the firmware spends at both (crates/rsk-piv/src/auth.rs)."
why = '''
Two of the three PIN policies are treated as one. The narrowing is safe in the
direction the module argues — a NEVER slot has nothing to spend — and unfalsified
in the other: nothing drives a NEVER slot that DOES spend, so a firmware that
started clearing `pin_fresh` at an unauthenticated slot would be a behaviour
change this model cannot see.

And a switch alone will not buy it — measured, not argued. Built as
`BugNeverSlotSpendsFreshness` and run at `Policies.cfg`'s constants against all
six invariants, the mutant is GREEN over a state space IDENTICAL to the shipped
one, 9 200 521 states and 331 776 distinct in both arms: spending at a NEVER
slot reaches no state the other policies do not already reach, so only the EDGES
differ and no state predicate can be written that sees it. The debt is a
recorder at the STEP, and here that is an invariant, which is a `[[property]]`
row and the registries that read it. `owed` names the configuration, not the
work.
'''
mutant = "owes"
owed = "PolicySolo_BugNeverSlotSpendsFreshness.cfg"

