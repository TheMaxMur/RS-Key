owed = "SeamSolo_BugDecipherPinSpentLikeSig.cfg"
carried_by = "NAR-ASSIGNMENT-HOLES"

[[exception]]
id = "MX-SEAM-007"
module = "RSKeyAppletSeams.tla"
line = 466
shape = "clause"
site = "PgpKeyOp"
clause = 'r = "pw1"'
kind = "narrowing"
production = "The requirement-side twin of the line above: `psig` is the freshness the specification leaves behind, and it is spent by a signature under the one-shot status. The implementation also spends it on a PSO:CDS it refuses past the PIN check (5352d50) and on every ATTEST past its touch, served or refused, which the model has no action for; that can only take a status away."
why = '''
Kept apart from MX-SEAM-006 for the reason the ghost exists at all. The two
clauses are the implementation half and the requirement half of one fact, and
they are what makes `BugSigPinNotSpent` fall structurally rather than through its
own `viol` assignment; narrowing them together would let a mutant repair the
property it is meant to break.

`BugDecipherGhostSpentLikeSig` widens THIS half alone and is refused at
`NoKeyOpOnTheAdminStatus`. Which conjunct fell is the whole content of the run
and is recorded here because the invariant's NAME would not carry it: `viol` is
EMPTY in the counterexample, so it is not the ghost recorder that fell but the
STRUCTURAL clause `held["pw1"] = psig`, with held.pw1 TRUE against psig FALSE
after a PSO:DECIPHER under the one-shot status. That is the SERVED direction —
the implementation keeping a freshness the requirement has retired — and it is
also why MX-SEAM-006, which moves the implementation half instead, is still
owed: a spend that only takes PW1.82 down reaches no clause here at all. With
the switch off the configuration is GREEN. The code twin is a measured GAP.
'''
mutant = "SeamSolo_BugDecipherGhostSpentLikeSig.cfg"
carried_by = "NAR-ASSIGNMENT-HOLES"

