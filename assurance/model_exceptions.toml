#
# THE PLACES A MODEL DELIBERATELY NARROWS, and what each of them owes.
#
# A `.tla` module here is checked exhaustively over the surface it names, so
# every clause that takes something OUT of that surface moves a piece of the
# product beyond every mutant the module has. `RSKeyAppletSeams`'s `Reselect`
# hard-coded `\/ a = Oath` twice — once to clear the statuses OATH did not keep
# through a re-SELECT, once to stop the conformance recorder firing at it — and
# for the whole life of that module, deleting either changed the input of no
# gate. This file is the ledger those clauses were missing, and stage 6's exit
# criterion is its contract: an exception in a model with no row here reddens
# the row, and a row here naming an exception the model no longer has reddens it
# the other way.
#
# WHICH EXCEPTIONS EXIST IS DERIVED, never stored.
# scripts/model_exception_gate.py scans every `formal/*.tla` for three shapes —
# a narrowing operand or `IF` condition, a set literal that omits what a sibling
# has, a `CASE` that answers for part of its domain — over each module's OWN
# vocabulary, resolved through `EXTENDS`. A roster typed here and typed again
# into the gate's regex is the failure this tree has already paid for four
# times: the list in the source shrinks, the copy in the guard shrinks with it,
# and the registry stays "complete" over a shorter list. Measured while this
# landed: scoping the vocabulary to the module's own text hid `RSKeyTokenGate`'s
# only narrowing, because the eleven operations it narrows are defined in the
# module it extends.
#
# HAND-WRITTEN FIELDS ONLY: id, kind, production, why, mutant, owed, carried_by.
# `module`, `line`, `shape`, `site`, `clause`, `against` and `omits` address the
# derived site and are held against it, so a clause edited rather than removed is
# a finding rather than an unrelated diff.
#
# kind
#   narrowing   a hole in the model standing for a fact about the product: this
#               applet, this reference, this operation, and not its siblings
#   dispatch    a per-case answer the guard test read as a hole. A label, and a
#               label can be wrong — nothing here can check it, the way nothing
#               in assurance/deleters.toml can check a `class`
#   mutant-arm  a defect the module carries on purpose, driven by a configuration.
#               The one kind that may never say `owes`
#
# mutant
#   <name>.cfg  the configuration that drives this clause. Held BOTH ways: the
#               file must be in formal/, and it must switch a `Bug…` constant the
#               row's own definition reads, so a row cannot claim a mutant that
#               belongs to a different clause
#   owes        no configuration refutes this narrowing yet. Then `owed` names the
#               one that would, and THAT file must not exist — pay the debt and
#               the row goes red until it claims what it paid
#
# READ THE `owed` COLUMN AS DEBT, NOT AS A PLAN. Most rows still owe a mutant
# and the price below is why. A narrowing in the seam family costs one switch in
# RSKeyAppletSeams.tla's CONSTANTS and in gen-configs.sh's `SEAM_BUGS`,
# one arm in `seam_target`, a requirement-side statement for the clause to
# violate — the ones that have none cost an invariant in `SEAM_INV` and a
# `[[property]]` in assurance/properties.toml with it — two generated
# configurations (`SeamMut_…`, `SeamSolo_…`), and a regeneration of the other
# thirty in the family, which all carry every switch. It costs ZERO rows in
# formal/floors.txt: `SeamMut_*.cfg` and `SeamSolo_*.cfg` are already wildcard
# families required RED, and `LatMut_*`/`LatSolo_*`/`PolicyMut_*`/`PolicySolo_*`
# are too. What it does cost is a re-record of the whole TLC tier, because
# formal/runs.toml stores that matrix row by row and every published run-count is
# counted out of it. The configurations themselves run in about a second each —
# it is the re-record that costs 103 minutes, and it is paid ONCE however many
# rows a wave clears, which is why the OATH default-open family was paid in one
# wave rather than a row at a time.
#
# AND WHAT A SWITCH CANNOT PAY, so the next wave does not re-derive it. The seam
# invariant sees a status HELD outside the selection that bought it and nothing
# else, so a narrowing whose defect makes a status go FALSE — a code-less OATH
# that LOCKS, a policy that spends freshness it never established — reddens no
# configuration at all. Those rows owe a requirement-side statement first, and
# an invariant is not free here: it is a `[[property]]` in
# assurance/properties.toml, which is the registry the matrix, the evidence
# bundles and the generated pages all read. MX-SEAM-005 is out for a reason of
# its own, and its row states it.
#
# The other price a seam switch pays is a code twin: formal/comutants.toml is
# closed-world over `SeamMut_*`, so a switch with no host-testable twin cannot
# land — `pending` is floored at zero and the floor may only go down.
#
# How many rows are in each state is DERIVED: scripts/model_exception_gate.py
# prints it on every green run. A count typed into this paragraph is the column
# assurance/platform.toml's header records having got wrong.

[[exception]]
id = "MX-SEAM-001"
module = "RSKeyAppletSeams.tla"
line = 135
shape = "set"
site = "Refs"
clause = "Refs"
against = "RSKeyRetryLattice.tla:Refs"
omits = ["pivPuk", "rc"]
kind = "narrowing"
production = "PIV's PUK and OpenPGP's resetting code are real references with real verifiers (crates/rsk-piv/src/lib.rs, crates/rsk-openpgp/src/pin.rs), but neither leaves an in-RAM security status behind: each is PRESENTED inside a RESET RETRY and spends a counter, which is the lattice module's subject and not this one's."
why = '''
The seam module is about who HOLDS a status and what ends it, so a reference
that grants nothing has nothing to hold. The narrowing is the reason the two
modules can share a name and disagree about it, and it is exactly the assumption
to attack the day a recovery reference starts opening a command on its own.
'''
mutant = "owes"
owed = "SeamSolo_BugRecoveryRefHoldsStatus.cfg"

[[exception]]
id = "MX-SEAM-002"
module = "RSKeyAppletSeams.tla"
line = 216
shape = "clause"
site = "ClearedFor"
clause = 'r = "oathCode"'
kind = "narrowing"
production = "OATH is default-OPEN: `validated = !code_set` (crates/rsk-oath/src/lib.rs), so a deselect of a code-less applet leaves it unlocked rather than locked."
why = '''
Every other reference falls to FALSE when its applet loses the selection; this
one falls to "unlocked unless a code is provisioned". Without the exception the
shipped tree would be red at `ClearedFor`; with it, the clause decides both
directions at once, and only one of them is a run. `BugDeselectKeepsOathUnlock`
drives that one — a deselect that leaves a PROVISIONED OATH unlocked, refused at
the first SELECT away. The other, a code-less OATH that LOCKS, is refuted by
nothing here and cannot be: a status that is FALSE is never one held outside its
selection, so it owes a requirement-side statement rather than a switch.
'''
mutant = "SeamSolo_BugDeselectKeepsOathUnlock.cfg"
carried_by = "NAR-OATH-REMOVAL"

[[exception]]
id = "MX-SEAM-003"
module = "RSKeyAppletSeams.tla"
line = 221
shape = "clause"
site = "AllCleared"
clause = 'r = "oathCode"'
kind = "narrowing"
production = "The same default-OPEN rule one path over: a card reset and a power cycle rebuild the applet from `new()`, and a code-less OATH comes back unlocked (crates/rsk-oath/src/lib.rs)."
why = '''
Its own row rather than a share of MX-SEAM-002, for the reason
`BugUnscopedOtpCancel` has its own switch in the sibling module: the same
requirement in a different function, and the two paths have already diverged once
— `CardReset` was pinned to a no-op by an `UNCHANGED` naming a variable its own
ELSE branch assigned, so the reset path was not modelled at all while the
deselect path was. `BugResetKeepsOathUnlock` drives it through `CardReset`, and
the trace is not MX-SEAM-002's: the reset selects NOTHING, so the status stands
outside every selection rather than inside the wrong one. The locking direction
is unrefutable here for the reason it is there.
'''
mutant = "SeamSolo_BugResetKeepsOathUnlock.cfg"
carried_by = "NAR-OATH-REMOVAL"

[[exception]]
id = "MX-SEAM-005"
module = "RSKeyAppletSeams.tla"
line = 251
shape = "clause"
site = "Reselect"
clause = "a = Oath"
kind = "narrowing"
production = "The recorder: `ReselectPreservesAccessStatus` is a conformance claim about every applet's access status, and OATH's OTP PIN is exempted in the writer rather than in the invariant, because the exemption belongs to that applet. The PIN is Nitrokey's password-safe extension — a YubiKey answers 6D00 to INS B1–B5, so no oracle speaks for it — and `select` never lets it survive a SELECT (crates/rsk-oath/src/lib.rs). OATH's VALIDATE is not exempt: a YubiKey 5.8.0 keeps it through a re-SELECT, measured twice."
why = '''
The one OATH narrowing left in `Reselect`. The `held'` step used to exempt the
whole applet — OATH re-locked on every SELECT, with no oracle reading behind it,
and a second row owed a mutant for that step. The reading retired it: the step
now drops only `oathOtpPin`, and the VALIDATE surviving is the rule.

`BugOathReselectUnrecorded` is this sentence, measured. It is refused at
`ReselectPreservesAccessStatus`, and the DIRECTION is the one that says the
exemption is load-bearing rather than decorative: the counterexample SELECTs
OATH, verifies its OTP PIN, re-SELECTs, and the recorder fires because
`oathOtpPin` fell TRUE -> FALSE with the exemption gone. With the switch off the
same configuration is GREEN over the shipped seam space. The code twin is killed
by crates/rsk-oath/src/reselect_tests.rs: a re-SELECT that kept the OTP PIN
would open the password safe.

The step's own `a = Oath`, the `ELSE IF` that drops the PIN, is MX-SEAM-011.
'''
mutant = "SeamSolo_BugOathReselectUnrecorded.cfg"

[[exception]]
