one, 9 200 521 states and 331 776 distinct in both arms: spending at a NEVER
slot reaches no state the other policies do not already reach, so only the EDGES
differ and no state predicate can be written that sees it. The debt is a
recorder at the STEP, and here that is an invariant, which is a `[[property]]`
row and the registries that read it. `owed` names the configuration, not the
work.
'''
mutant = "owes"
owed = "PolicySolo_BugNeverSlotSpendsFreshness.cfg"

