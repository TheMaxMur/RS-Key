[[exception]]
id = "MX-SEAM-010"
module = "RSKeyAppletSeams.tla"
line = 589
shape = "clause"
site = "FactoryWipe"
clause = 'r = "oathCode"'
kind = "narrowing"
production = "`Fs::factory_wipe` (crates/rsk-fs/src/fs.rs) takes the access code with everything else, so the applet comes back code-less and therefore open — the fresh-card state again, reached the other way."
why = '''
Not a share of MX-SEAM-009, because the two differ in what they leave standing:
the wipe is FLASH-only and never sees an applet, so every in-RAM status here
stands over freshly-defaulted verifiers until the reboot both callers queue. The
model folds the wipe and that reboot into one step, and this clause is what makes
the folded step agree with the initial one. `BugWipeWithoutItsReboot` separates
them, and it is the fold itself that the run measures: the wipe alone leaves a
PIV status standing over freshly-defaulted verifiers at `sel = NoApplet`, which
is the seam invariant's own shape. So what is owed here is no longer a mutant
but the split — a wipe and a reboot as two steps, with the window between them.
'''
mutant = "SeamSolo_BugWipeWithoutItsReboot.cfg"
carried_by = "NAR-OATH-REMOVAL"

