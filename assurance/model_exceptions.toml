module = "RSKeyAppletSeams.tla"
line = 461
shape = "clause"
site = "PgpKeyOp"
clause = 'r = "pw1"'
kind = "narrowing"
production = "EF_PW_PRIV[0] = 0 makes PW1 no. 81 valid for exactly one use: crates/rsk-openpgp/src/keys.rs spends it, and its two callers decide when — pso.rs after every PSO:CDS past its PIN check, attest.rs after every ATTEST past its touch. PW1 no. 82 — PSO:DECIPHER and INTERNAL AUTHENTICATE — carries no such rule and is not spent."
