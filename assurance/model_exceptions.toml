the shipped tree is red at the INITIAL state, which is what says the clause is
reached and load-bearing rather than one nothing branches on. One direction
only: a WIDER exemption weakens the invariant, so no configuration can make that
half fail, and it stays an argument about which states can reach it.
'''
mutant = "SeamSolo_BugCodelessOathIsAStatus.cfg"
carried_by = "NAR-OATH-REMOVAL"

