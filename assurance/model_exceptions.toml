kind = "narrowing"
production = "`PivAlwaysSpendsFreshness` is a claim about PIN-policy-ALWAYS slots only: one VERIFY buys one operation there (crates/rsk-piv/src/auth.rs), while a ONCE slot keeps its freshness for the whole session by design."
why = '''
The recorder is narrowed one policy value tighter than the spend it watches. The
clause above spends at ONCE and at ALWAYS; this one records a failure to spend at
