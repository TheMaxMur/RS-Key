#
# The coverage ledger: every [workspace] member, classified. The rule this file
# exists for: NO CRATE FALLS OUT SILENTLY. The first two drafts of the formal-
# verification roadmap enumerated subsystems from memory of findings and missed
# four crates — including the second-largest in the tree. A ledger written from
# memory is how that happens; scripts/assurance_gate.py holds this one against
# Cargo.toml in both directions instead.
#
# Classes and what each obliges:
#   state-modelled    holds security state, a formal/ module models it (model=)
#   state-partial     modelled in part; the gap and its roadmap module are named
#   state-unmodelled  holds security state no module covers yet; planned= names
#                     the roadmap module so the hole is a plan, not an oversight
#   pure              pure functions; evidence= names the differential/KAT/proof
#                     files, and the gate checks they exist
#   out-of-scope      not part of the security argument; reason= says why
#   embedded-binary   thumbv8m-only, not host-checkable; reason= names coverage
#
# "Modelled" here means state-machine modelling. Kani totality proofs and fuzz
# targets exist across most crates regardless of class — this ledger tracks the
# one evidence kind that is either present or silently absent.

[crate.firmware]
class = "embedded-binary"
reason = "no_std binary: boot, worker sequencing, board halves of Hooks/Platform. The boot path's cross-boot state — the EF_HARDENED lap and scratch-word lock carry — is RSKeyBootHardening (M7), precisely because this crate has no host tests; the FIDO state it builds is reconstructed host-side in rsk-device (ctap.rs:73-86). Worker scheduling and USB bring-up remain implementation mechanics, with transport state owned by RSKeyTransport."

[crate.rsk-wipe]
class = "out-of-scope"
reason = "flash-erase utility, runs once in a maintainer's hands; not part of the runtime security argument."

[crate.rsk-fido]
class = "state-modelled"
model = "RSKeySecurityState"

[crate.rsk-device]
class = "state-partial"
model = "RSKeySecurityState"
gap = "presence arbitration is modelled and Kani-proved; capability gating is RSKeyAdminSurface. Dispatcher selection/reset semantics are RSKeyAppletSeams; the remaining fast-path wiring is single-dispatch glue rather than a separately modelled state machine."

[crate.rsk-sdk]
class = "state-partial"
model = "RSKeyAppletSeams"
gap = "Dispatcher::current is the seam module's sel. APDU command chaining remains outside RSKeyTransport, which covers CTAPHID framing rather than the SDK's per-applet chain buffer."

[crate.rsk-piv]
class = "state-partial"
model = "RSKeyAppletSeams"
gap = "status lifetime is RSKeyAppletSeams; PIN/PUK budgets are RSKeyRetryLattice; NEVER/ONCE/ALWAYS slot policy and freshness spending are RSKeyAppletPolicies. Key material and touch I/O stay below these state abstractions."

[crate.rsk-openpgp]
class = "state-partial"
model = "RSKeyAppletSeams"
gap = "status lifetime is RSKeyAppletSeams; PW1/PW3/RC budgets are RSKeyRetryLattice; algorithm-attribute changes invalidating the old key pair are RSKeyAppletPolicies. MSE repointing and the per-slot UIF value space remain below the abstraction."

[crate.rsk-oath]
class = "state-partial"
model = "RSKeyAppletSeams"
gap = "status lifetime and access-code removal are RSKeyAppletSeams; calculation's access-code and touch gates are RSKeyAppletPolicies. The MAC access code has no retry budget, so its byte-level mutual-auth acceptance remains differential-oracle territory rather than a fabricated lattice counter."

[crate.rsk-otp]
class = "state-partial"
model = "RSKeyAppletSeams"
gap = "oathOtpPin status is in RSKeyAppletSeams; protected-slot configure/update/delete/swap and the combined use/session anti-replay step are RSKeyAppletPolicies. The six-byte slot code has no retry counter; four physical slots collapse to one symmetric lifecycle in the model."

[crate.rsk-vendor]
class = "state-partial"
model = "RSKeySecurityState"
gap = "ConfigOp/plat in the security model; the config-write pipeline it shares with rsk-mgmt (persist_dev_conf) is RSKeyAdminSurface now. Still open: UNLOCK is modelled wider than its real gate (mse_ready + lock_engaged)."

[crate.rsk-display]
class = "state-partial"
model = "RSKeyTrustedDisplay"
gap = "the confirm ceremony (WhatIsConfirmedIsWhatIsShown, decomposed as SEC-DISP-001..003) is modelled; the wait owner and the fourth PIN door stay in RSKeySecurityState. The menus, settings flows and the device-PIN screens are navigation over that same armed-touch chokepoint, not separate security state."

[crate.rsk-ui]
class = "state-partial"
model = "RSKeyTrustedDisplay"
gap = "hit_confirm's disjoint Allow/Deny zones are the modelled seam (OnlyAllowConfirms's Rust owner); rendering, fonts and the settings codec are pure functions under their own 12 Kani proofs and render tests — no screen-transition state lives in this crate (the ceremony state machine is rsk-display's)."

[crate.rsk-usb]
class = "state-partial"
model = "RSKeyTransport"
gap = "the CTAPHID reassembler's channel/sequence/length state machine is modelled (M8); the async transport loop's bounded-write liveness (the 0x075D wedge fix) is guarded by the FrameSink seam's own mutation-tested regression, and the CCID/keyboard framing and secure_pin codec are single-step, Kani-proved and unit-tested."

[crate.rsk-fs]
class = "state-partial"
model = "RSKeyStore"
gap = "the committed store, the delete write-order and the present-cache soundness are modelled (M3 lifted powercut_model.rs to TLA+ and ties R0p to it); values are two opaque tokens so a content-corrupting defect is out of reach, and Fs::factory_wipe's two-phase sweep is the security module's ordering (SeedLeadsTheWipe), not this one's — its own truncation guard is roadmap M5/M7."

[crate.rsk-store]
class = "state-partial"
model = "RSKeyStore"
gap = "the Storage contract it implements — atomic append, an enumeration-completeness flag — is taken as RSKeyStore's backend assumption; the two-partition counter/main ring, is_counter_fid routing, wear and page reclaim, and compact are backend mechanics the model abstracts."

[crate.rsk-rescue]
class = "state-partial"
model = "RSKeyAdminSurface"
gap = "the operator-presence gate on every privileged command is modelled (PrivilegedOpNeedsPresence); the commands' own payloads — phy identity records, KEYDEV signing, the fuse/rollback state machines — are single-step data handling carried by the crate's five test files, not a state machine."

[crate.rsk-mgmt]
class = "state-partial"
model = "RSKeyAdminSurface"
gap = "the enabled-set lifecycle is modelled (mask writes, the lock-code-only write, the clamp as a construction). The TLV codec itself — well-formedness, merge widths, the two-parsers refusal — is single-step and carried by the crate's tests; still zero Kani proofs."

[crate.rsk-crypto]
class = "pure"
evidence = ["crates/rsk-crypto/src/base64url_kani.rs", "fuzz/fuzz_targets/aes_gcm.rs", "fuzz/fuzz_targets/chachapoly.rs"]

[crate.rsk-mldsa]
class = "pure"
evidence = ["crates/rsk-mldsa/src/round_kani.rs", "fuzz/fuzz_targets/mldsa_roundtrip.rs", "fuzz/fuzz_targets/mldsa_verify.rs"]
note = "byte-exact vs ACVP KATs; -87 is a recorded stack dead-end, not a gap."

[crate.rsk-rsa-asm]
class = "pure"
evidence = ["crates/rsk-rsa-asm/src/kani.rs"]
note = "functional division spec + the sieve, proved."

[crate.rsk-ec]
class = "pure"
evidence = ["crates/rsk-ec/src/tests.rs"]
note = "zero Kani proofs and NOT a gap: byte-identical differential vs p256/p384/k256/p521 — a differential against a reference beats a proof here."

[crate.rsk-sha512]
class = "pure"
evidence = ["fuzz/fuzz_targets/sha512_diff.rs"]
note = "zero Kani proofs and NOT a gap: differential vs the sha2 crate."

[crate.rsk-led]
class = "pure"
evidence = ["crates/rsk-led/src/kani.rs"]

[crate.rsk-bip39]
class = "pure"
evidence = ["crates/rsk-bip39/src/kani.rs"]

[crate.rsk-slip39]
class = "pure"
evidence = ["crates/rsk-slip39/src/kani.rs", "crates/rsk-slip39/src/tests.rs"]

[crate.rsk-bench]
class = "out-of-scope"
reason = "latency statistics for the on-device harness; not part of the security argument."
