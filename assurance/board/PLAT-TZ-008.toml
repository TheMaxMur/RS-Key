assumption = "PLAT-TZ-008"
outcome = "pass"
method = "Authorize PIV PIN and management access, confirm their live state, queue a nonzero CCID IN packet, then submit a forbidden NS USBCTRL store. Keep the PC/SC session open until USB removal. The production fatal fence runs before the diagnostic witness reads gateway admission, USB IRQ/pull-up, all endpoint controls and payload bytes. Recover the record after watchdog reset, inspect initial PIV authority before ICC power-on, then check refusal and fresh authorization over CCID. A disposable no-fence image must fail the same runner."
boot_config = "Disposable combined no-touch S/NS diagnostic image; production fatal cleanup is unchanged, with a witness after cleanup and a watchdog in place of the final endless halt. Reset is a test mechanism and is not added to the production fatal path."
expected = "PASS = USB detaches before watchdog expiry after an observed pending packet; the retained fault record shows closed admission, disabled USB interrupts/pull-up, empty endpoint controls and zero payload, and PIV authority is absent at boot while fresh authorization succeeds; omitting the fence fails these checks. FAIL = admission or USB data remains live, authority survives reset, or the no-fence control passes. INCONCLUSIVE = pending data, exact image, reset or fault witness cannot be established."
board = "rs-key-0001, RP2350 QFN60, 4 MiB QSPI flash, chipid 0x170d3860ecf780fe, ARM selected, secure boot disabled."
stepping = "RP2350 A2"
firmware_sha256 = "9d6ed070cd6aa11c4598cb807302c8ea178aefe602f5a13af395807580bd52b2"
first_boot_capture = "assurance/board/PLAT-TZ-2026-11-03-capture.json"
actual = "Measured on 2026-11-03. PIN and management authorization were observed before the forbidden NS USBCTRL store, after queuing a nonzero CCID packet. The real fatal fence produced the expected BusFault, closed gateway admission, disabled USB interrupts and pull-up, and cleared every endpoint buffer control and payload byte. USB removal preceded the four-second watchdog timeout. The recovered boot had no PIV authority before ICC power-on; PIN and management operations were refused, and fresh authorization succeeded. The paired no-fence ELF failed the same physical runner for missing cleanup: FENCED with flags 193 instead of 223, the correct 0x8200 cause, target 0x50110000 and watchdog reason 1. Thus the negative result followed the actual forbidden store, not a missing packet or an unexecuted probe."
arm_taken = "PASS. PASS = USB detaches before watchdog expiry after an observed pending packet; the retained fault record shows closed admission, disabled USB interrupts/pull-up, empty endpoint controls and zero payload, and PIV authority is absent at boot while fresh authorization succeeds; omitting the fence fails these checks. FAIL = admission or USB data remains live, authority survives reset, or the no-fence control passes. INCONCLUSIVE = pending data, exact image, reset or fault witness cannot be established."
