assumption = "PLAT-TZ-009"
outcome = "pass"
method = "Compare all 7936 scratch code/padding bytes with the exact ELF. Execute a scratch-resident control on both cores, then try first/last-word stores on each core during normal execution and while core0 holds the production temporary flash MPU window. Check writable data controls. Enter BOOTSEL through Worker::reboot, prove picoboot serves actual SRAM with a public write/read control, then submit only the first block of the exact UF2 and read the overlapping ROM erase bitmap. Reload the complete diagnostic image and repeat startup observations. Review the RP2350 address map, which removes RP2040's non-striped SRAM mirror."
boot_config = "Disposable combined no-touch diagnostics with the production scratch initializer and MPU plans. The diagnostic control occupies linker-retained scratch padding. The partial UF2 transfer targets firmware sector zero, never the persistent store or OTP, and requires an immediate complete reload before application use."
expected = "PASS = exact code/padding matches before use and after reset/reload, both-core execution and data-store controls complete, all code stores fault with copy retention, and the old firmware remains absent while ROM uses 0x20081c00..0x20082000 as its erase bitmap. FAIL = a code store succeeds, execution is refused, bytes differ, or old firmware resumes after the partial UF2 transfer. INCONCLUSIVE = exact bytes, SRAM readback, ROM bitmap or full reload cannot be established."
note = "Primary references: RP2350 Datasheet section 4.2, page 338, https://pip-assets.raspberrypi.com/categories/1214-rp2350/documents/RP-008373-DS-2-rp2350-datasheet.pdf and https://github.com/raspberrypi/pico-bootrom-rp2350/blob/master/src/nsboot/usb_virtual_disk.c, FLASH_ERASED_SECTORS_BASE and _update_current_uf2_info. The ROM bitmap is initialized by a UF2 transfer; merely entering BOOTSEL is insufficient."
board = "rs-key-0001, RP2350 QFN60, 4 MiB QSPI flash, chipid 0x170d3860ecf780fe, ARM selected, secure boot disabled."
stepping = "RP2350 A2"
firmware_sha256 = "9d6ed070cd6aa11c4598cb807302c8ea178aefe602f5a13af395807580bd52b2"
first_boot_capture = "assurance/board/PLAT-TZ-2026-11-03-capture.json"
actual = "Measured on 2026-11-03. All 7936 scratch code/padding bytes matched the exact ELF through the host CRC and the diagnostic bytewise load-image comparison. Both cores executed the scratch control and wrote allowed data; first/last code-word stores faulted with CFSR 0x82 on each core, both normally and while core0 held the observed production flash MPU window. The code remained intact. BOOTSEL reached the selected ROM serial, served a 256-byte SRAM write/read control exactly, and retained the old application absent after one original UF2 block. Its overlapping erase bitmap was exactly 01 followed by 1023 zero bytes at 0x20081c00. A complete image reload then passed all twenty startup/protection scenarios again. The ordinary touch-enabled image was restored and checked. The primary RP2350 SRAM map removes the RP2040 non-striped execution mirror; the record note retains those references."
arm_taken = "PASS. PASS = exact code/padding matches before use and after reset/reload, both-core execution and data-store controls complete, all code stores fault with copy retention, and the old firmware remains absent while ROM uses 0x20081c00..0x20082000 as its erase bitmap. FAIL = a code store succeeds, execution is refused, bytes differ, or old firmware resumes after the partial UF2 transfer. INCONCLUSIVE = exact bytes, SRAM readback, ROM bitmap or full reload cannot be established."
