# This file was `PLAT-TIMER-001.toml` until 2026-09-05, and its `method` asked
# for a run long enough to cross the COUNTER's wrap. That is 2^64 microseconds,
# 584,542 years: no run walks it, and an `expected` written over a route nothing
# can take is an expectation that can never be read against anything. The row it
# belonged to is discharged now on the reading half alone; this record follows
# the half that was rewritten, and it is a record about the 32-bit ALARM
# COMPARATOR and not about `embassy_time::Instant`.
#
# THE FIRST REWRITE CARRIED THE SAME DEFECT ONE NOTCH SMALLER, and the correction
# is what the run below is built out of. It asked for a NO-TOUCH image "because
# the run has to hold a presence wait open for the keepalives" -- and a no-touch
# build has no presence wait at all: firmware/src/presence.rs:231-234 is
# `#[cfg(feature = "no-touch")] { rsk_sdk::Presence::Confirmed }`, which is what
# PLAT-BUILD-004 already says in its own words. The configuration deleted the
# instrument the method named, so PASS was unreachable and the INCONCLUSIVE arm
# was forced. Two facts came out of reading that, and both changed the run. The
# keepalives are REQUEST-scoped, not board-scoped: crates/rsk-usb/src/ctaphid.rs:775
# arms `Timer::after_millis(KEEPALIVE_MS)` inside the per-request loop and breaks
# out of it when the handler resolves, and crates/rsk-usb/src/ccid.rs:408 is the
# same shape for WTX -- an unattended board produces neither. And a host that
# does produce them arms a fresh short alarm on every request it sends, which
# re-arms the comparator and repairs a missed match in microseconds. Wire traffic
# MASKS this defect rather than exposing it, so the run below is quiet and its
# observable is the one the board produces on its own.
#
# WHAT IT IS NOT EVIDENCE FOR, so that a PASS here cannot be read onward:
# SEC-FIDO-L01, L02 and L03. The presence window is a busy poll on
# `wrapping_sub`, the token and walk windows are `saturating_sub` over a `u64`
# millisecond count checked on command arrival, and the longest of them is
# 600000 ms against a wrap of 4294.967296 s. The registry row says the same in
# its own words and carries no `supports`.
#
# THE THREE ARE PLAT-TIMER-003's since 2026-09-05, and that row reads THIS
# recording for them -- not this record's verdict, the recording underneath it,
# for a different question: whether the counter advances at all. So the two are
# one run and two claims, and `expected` below now says which parts of the
# series belong to which, rather than leaving that to a reader holding both.

assumption = "PLAT-TIMER-002"
method = """Power a DEFAULT-image board and LEAVE IT ALONE for at least 8589.934592 s -- two comparator periods, 2 h 23 min 9.93 s -- rounding up, so 2 h 24 m is the figure to run. No replug, no reset. THE LENGTH IS DERIVED, and in two steps rather than one, because the first version of this record collapsed them and got the arithmetic wrong: it called two periods "the shortest run that crosses at least one boundary whatever that phase is", and that is false. The period is 2^32 microseconds = 4294.967296 s = 71 min 34.967296 s. (1) A run of length L from an unknown phase p crosses a boundary iff L > 2^32 - p, so the worst phase needs ONE period and not two -- 71 min 35 s already guarantees a crossing whatever the phase at boot was. (2) What the second period buys is a different thing, and it is the reason to run it: the first crossing lands at T - p, which is at most one period in, so two periods always leave a full period AFTER the crossing -- and FAIL below is a stall of up to a whole period, which a run ending at the crossing could not tell from a run that simply stopped. NOTHING MAY TALK TO THE BOARD INSIDE THE WINDOW, and that is load-bearing rather than convenient: every CTAPHID and CCID request arms a fresh short alarm the moment it lands (crates/rsk-usb/src/ctaphid.rs:775, crates/rsk-usb/src/ccid.rs:408), which re-arms the comparator and repairs a missed match before anything could see it, so a chatty host does not strengthen this run, it empties it. Prove the silence instead of assuming it: on a host, capture the bus for the whole window (usbmon, or Wireshark's USB capture) and keep the capture beside this record; on a charger there is no host to prove anything about, and that is the simpler arm for SILENCE and the weaker one for everything else -- no bus capture, no journal to read, and so no reboot instrument at all -- which is why that arm owes a supply that can be shown not to have dropped, a logging supply or a current trace kept beside this record, and answers INCONCLUSIVE without one. THE OBSERVABLE IS THE LED, and the board produces it alone -- no host, no finger, nothing held open. One render task per backend is spawned on the high-priority executor at firmware/src/main.rs:1072 (ws2812, the default), firmware/src/main.rs:1010 (gpio) or firmware/src/main.rs:1018 (pimoroni), and each loops on an alarm it re-arms for as long as the board has power: firmware/src/led.rs:618 and firmware/src/led.rs:727 are 5 ms, firmware/src/led.rs:692 is the gpio soft-PWM's 2 ms period. One of those -- or the worker's 16 ms button poll, firmware/src/worker.rs:307 -- is the earliest deadline in the queue at every instant of the run, so the arm that straddles each crossing is one of them and nothing has to be arranged for it to be. What a camera sees is the render: the ambient effect is a ~2 s breathing cycle once a host has configured the device and a twinkle before that, and the gpio and pimoroni backends blink 500 ms on, 500 ms off in both of those states. Record it end to end -- a camera with a running clock in frame, or a photodiode into a logging ADC. SAMPLE WELL ABOVE THE AMBIENT CADENCE, ten frames a second or better, and not the one frame a second the run's length makes tempting: the cadence is 0.5 s on the blinking backends, and a sampler near that rate aliases into a constant, which reads as the FAIL below rather than as an instrument that was too slow. WHAT THIS RECORD DOES NOT YET HAVE, said the way PLAT-FLASH-001 says it. The crossing is not announced by the device, so it is located by arithmetic over the recording's own clock rather than pinned to a device event, and the run therefore proves the ABSENCE of a stall across a window that certainly contains a boundary rather than pinning the survival to the boundary itself. The device's own clock IS readable, and the first version of this record was wrong to say that no instrument in this tree reports the device's uptime: every audit-journal entry is stamped with the ms-since-attach of firmware/src/usb_attach.rs:34-36 -- firmware/src/worker.rs:469 is where the dispatch hands it over -- and tools/rsk/audit.py:170 prints it as the `uptime` column. But reading it costs a command, and a command inside the window is the traffic that masks the defect, so it BRACKETS the run instead of sampling it -- and THE CLOSING STEP HAS TO WRITE, which the first version of this sentence got wrong: enumerate, `rsk audit enable` (PIN and one touch, before the window opens), go quiet, close with `rsk audit disable` (crates/rsk-fido/src/vendor.rs:518 appends the EV_AUDIT_CFG before the flag clears) or with `rsk audit verify` (crates/rsk-fido/src/journal.rs:559 appends an EV_CHECKPOINT; that arm additionally needs a provisioned OTP DEVK, so `disable` is the one every board can run), and only THEN `rsk audit log`, whose newest entry is what dates the run on the device's own counter as well as on the host's. A READ-ONLY CLOSE DATES NOTHING. AUDIT_READ appends no entry at all -- crates/rsk-fido/src/vendor.rs:481 is a bare `journal::vendor_read` -- so after a quiet window the newest entry is still the PRE-WINDOW enable, carrying the uptime it had then. And `EV_BOOT` is appended LAZILY, on the first journalled event of a power cycle (crates/rsk-fido/src/journal.rs:215-217), so a reboot inside the window followed by a read-only close writes nothing and the exported window is BYTE-IDENTICAL with and without one. MEASURED against this tree's own journal code, on the host rather than on a board, with enable at 1000 ms and 8589935 ms of silence: read-only close, newest `uptime` 1000 ms, and the rebooted run byte-identical to the quiet one; writing close, newest `uptime` 8590935 ms on the quiet run against a second `EV_BOOT` and 4294967 ms on the rebooted one. An uptime the device volunteers with no command behind it, or a boundary it signals on its own, is the second instrument this row still owes, and it is the one that would turn this from an absence into a location."""
boot_config = """The DEFAULT image, and this time with no deviation from the shipped configuration at all -- the run needs no finger and no ceremony, so the no-touch build the first version asked for is not merely unnecessary, it is the build with nothing left to observe. Both halves of what is under test are set by this tree's own build: firmware/Cargo.toml enables embassy-rp's `time-driver`, which is what fixes the tick at 1 MHz and so fixes the comparator's period, and firmware/src/main.rs:561 takes `embassy_rp::config::Config::default()`, whose clk_ref is XOSC at 12 MHz. A build that changed either would be a different period and a different run. TWO THINGS THE IMAGE MUST NOT BE. Not `LED_KIND=none`, which compiles no render task at all and so removes the only observable an unattended board has; the default is `ws2812`, and gpio and pimoroni serve here equally. And not a board whose stored LED configuration has been dimmed to zero or put in steady mode, because both stop the render from changing while the alarms underneath it keep running, and this run reads the render. The factory `EF_LED_CONF` is what the expectation below is written against."""
expected = """The alarm comparator's wrap is invisible to everything above it. PASS = across a run of at least two periods with no host traffic inside the window, the recorded LED never stops changing -- no interval longer than 10 s in which it holds one value, against an ambient cycle of 1 s on the blinking backends and about 2 s on the breathing one -- and the bus capture (or the absence of a host) shows the window was quiet. AND THE BOARD NEITHER REBOOTED NOR LOST ITS SUPPLY: on the bracketed arm no second `EV_BOOT` in the post-window journal and a closing `uptime` accounting for the whole recording, on the charger arm a supply shown not to have dropped. That condition sits on the PASS and not only on the FAIL because the mirror is real: a board that browns out every thirty seconds never reaches a crossing at all, and its recording is a render that never stops changing -- this row's PASS over a run that tested nothing. FAIL = one interval of the order of the period itself, up to 71 min 35 s, in which the LED holds a single value and then resumes. That is what a missed match costs: the deadline is not late by a millisecond, it waits for the counter's low half to bring the same armed value round again, and it is the ONE alarm the whole queue is served by, so what stalls is every timer on the device at once. A FAIL REFUTES THE STATEMENT -- scripts/platform_gate.py:1337 maps `fail` to `refuted` -- so the interval alone is not enough, and two causes that have nothing to do with the comparator produce exactly it. A brown-out that recovers leaves a dead stretch and then repaints the render. A probe that halts a core and resumes it does the same, and TIMER0's DBGPAUSE makes that a DOCUMENTED way to stop this counter -- assurance/board/PLAT-TIMER-003.toml refuses a debugger by name and this row did not. So a FAIL is owed, beside the interval: no debugger attached at any point in the window; a supply shown not to have dropped; and, on the bracketed arm, no second `EV_BOOT` and a closing `uptime` accounting for the whole recording. INCONCLUSIVE = a run shorter than two periods; a recording with a gap in it, because a crossing that cannot be shown to have been watched is not a crossing that was survived; ANY host traffic inside the window, because a request re-arms the comparator and would repair a missed match before the LED could show it, which would make the run an observation of the host rather than of the wrap; a debugger attached at any point, since a halted core stops this counter by design and the run is then about the probe; a supply that dropped, or a second `EV_BOOT` in the post-window journal, or a closing `uptime` materially shorter than the recording -- a reboot, which the second `EV_BOOT` is what names, both repaints the render and restarts the comparator's phase, while a short `uptime` with NO such entry is the counter having stopped, the last arm below; neither the stall nor its absence is this row's to read on either; the charger arm run with no supply record, which has no reboot instrument at all; and an image or an LED configuration with no animation in it -- `LED_KIND=none`, brightness zero, steady mode -- which observes an absent instrument rather than a wrap; and a series that stops and NEVER resumes before the recording ends, which is not this row's FAIL at all -- a comparator whose counter has stopped can be observed neither to miss a match nor to make one, so this row has nothing left to read. WHAT THIS RECORDING SETTLES HERE AND NOT IN assurance/board/PLAT-TIMER-003.toml, which reads the same series for progress. The FAIL above is that row's PASS: a stall of the order of one period that ENDS is a counter that went on counting and brought the armed value round again. The stall that never ends is that row's FAIL and this row's INCONCLUSIVE, above. And the one arm both records answer the same way is a freeze beginning less than a period before the recording ends, inconclusive for both because nothing has yet told the two apart -- which is the second thing the second period buys, beside the one the method already names."""
outcome = "planned"
