# docs/unsafe.md justifies the sweep's two `unsafe` sites as Rust invariants.
# Whether the sweep removes what a request leaves is a different question, and
# only a board running the linked image answers it.

assumption = "PLAT-UNSAFE-014"
method = "Flash a `--features bench` build of this tree and run `tests/55_stack_residue.py`. It stores an OATH TOTP credential whose HMAC-SHA1 key is a fixed 20-byte pattern, stops the sweep through vendor INS 0x15, runs CALCULATE, and counts three patterns in core0's dead stack: the key, and the key XORed with the HMAC inner and outer pads, the block the `hmac` crate leaves in its frame. Then it restarts the sweep, runs CALCULATE again, counts again, and deletes the credential."
boot_config = "A BENCH IMAGE (`--features bench`), never the shipped one: the probe exists only there. Its sweep is the shipped sweep; the feature adds the probe, the stop switch the sweep reads, and the latency harness, none of which runs on a CALCULATE."
expected = "With the sweep stopped, the probe finds at least one of the three patterns after CALCULATE; that is the control, and without it an empty count proves nothing. The one expected is the key XORed with the outer pad: `hmac_sha1` XORs a single block in place, key to inner pad to outer pad, and leaves the last. PASS = the control finds a pattern and the run with the sweep running finds none of the three. FAIL = the run with the sweep running still finds one, which is a secret the sweep left behind. A control that finds nothing is neither: the probe cannot see this residue, and the run says nothing about the sweep."
outcome = "planned"
board = ""
stepping = ""
firmware_sha256 = ""
first_boot_capture = ""
actual = ""
