# Every key, nonce, blinding factor and pinUvAuthToken rests on this source. A
# statistical test of the WHITENED output is not this measurement: whitening
# passes over a stuck source, which is the whole failure mode.
#
# WHAT THIS RECORD REPLACES, and it is why the criterion below spends a paragraph
# on its own threshold. assurance/board/PLAT-TRNG-001.toml asked for "min-entropy
# at or above the datasheet figure" at "every qualified corner", and neither half
# exists: the RP2350 datasheet of 29 July 2025 publishes no min-entropy per bit
# (§12.12.1 p.1212 asserts compliance and gives a generation RATE), §12.12.2
# p.1213 records that the vendor's software does not configure the settings Arm's
# characterisation procedure provides, and the part holds no NIST ESV or ENT
# listing. A PASS clause naming a number nobody published is a route no passing
# world walks — PLAT-TIMER-001's 584,542-year run one axis over — so the threshold
# here is this record's own and is argued rather than cited.
#
# AND THE VERDICT IS READ AT THE SHIPPED SAMPLE SPACING, not at the bootrom's.
# The listing that makes the raw stream readable sets the sample period to 0
# for throughput, and 0 is the most correlated stream this part offers, while
# the product spaces its samples 1000 cycles apart. A `fail` is gate-forced to
# `refuted`, so a verdict taken at 0 would refute a row about a stream the
# device never draws. The period-0 capture is kept as the CONTROL.
#
# AND IT IS ONE DIE ON ONE DESK. The corners that record also asked for are
# PLAT-TRNG-003, which is `accepted-risk` and owes no record; a run taken outside
# desk conditions answers INCONCLUSIVE below rather than widening this one.
assumption = "PLAT-TRNG-002"
method = """Capture the RAW pre-whitening ROSC stream from ONE board with a bench image, then estimate its min-entropy off-line. THE CAPTURE NEEDS NO INSTRUMENT BEYOND THE BOARD, which is the premise the row this replaces got wrong: write TRNG_DEBUG_CONTROL (0x138) with AUTO_CORRELATE_BYPASS, TRNG_CRNGT_BYPASS and VNC_BYPASS all SET, write SAMPLE_CNT1 (0x130) with 0, then read EHR_DATA0 through EHR_DATA5 in a loop. That is the bootrom's own sequence, printed in the RP2350 datasheet of 29 July 2025 at §12.12.4.1 p.1214 as `sample_cnt1 = 0; trng_debug_control = -1u` followed by reads of EHR_DATA, and shipping pico-sdk uses it in `src/rp2_common/pico_rand/rand.c`. Read EHR_DATA5 LAST on every block, because §12.12.3 makes that read what clears the result registers and a loop that does not will re-read a stale block. TAKE THE CAPTURE TWICE, and which one carries the verdict is the part a reader must not get backwards: once with SAMPLE_CNT1 at the shipped 1000, which is THE ONE THE CRITERION IS READ OFF, and once at 0, which is the bootrom's throughput setting and the MOST correlated stream this part offers, kept as the control. The bypass bits are independent of the sample period, so both captures are raw. Stream at least 1,000,000 consecutive raw samples in each, hash both captures, and record both hashes and the bench image's own sha256 here. THE ESTIMATE: run the SP800-90B §6.3 non-IID estimator suite over the capture and take the MINIMUM over the estimators, which is what that document defines H_min to be; run §5's IID permutation tests as well and record whether they pass, because an IID-track estimate over a source that fails them is the shape that produces a flattering number. THE SECOND HALF, on the same board in the same session, and it is the only way this project can put a RATE behind firmware/src/main.rs:646: re-enable the three checks, then read AUTOCORR_STATISTIC (0x134, p.1218) over a FIXED TEN-MINUTE WINDOW at `sample_count` 25, the driver default, and over a second ten-minute window at the shipped 1000, recording for each window BOTH the trip count and the number of EHR blocks the part produced inside it. THE BASIS IS WALL CLOCK AND NOT BLOCKS, and this field read `over the same number of blocks` until the clause was priced: SAMPLE_CNT1 is the cycles BETWEEN samples, so the two settings differ in throughput BY DESIGN, and PLAT-TRNG-001's own hardware observation — the 48-byte seed is two EHR blocks and took 30-105 s at 25 against about 1.5 s at 1000 — puts one block at roughly 15-50 s there against roughly 0.75 s here. Matching this record's own capture length would then be about 5,200 blocks, which at the 25 setting alone is somewhere between 22 and 75 hours by that same observation: not unsatisfiable, but the same family as the `0 < 0` conjunct one field over, a run nobody takes. TEN MINUTES is the smallest window that still yields hundreds of blocks at the shipped setting — roughly 800, against a dozen to forty at 25, and that gap is itself part of the answer — while both windows stay inside one bench session. Equal TIME is the honest comparison when the settings are designed to differ in throughput, and recording the block count beside the trip count leaves the per-block rate derivable anyway, so the change of basis costs the reader nothing it had. What stands behind that raise today is one wall-clock observation of a boot on one Waveshare unit, recorded at `2cdcc282e9605d601631b4b06727b2f746325727`, and a boot time is not a health-check failure rate. THE BENCH IMAGE IS NOT FOR A PROVISIONED KEY: its whole purpose is to hand a host the source the product whitens, so it goes on a throwaway board and the board is re-dragged afterwards."""
boot_config = """A BENCH IMAGE, and its identity matters here more than on any other record because this is deliberately not the shipped firmware. Build it from this tree with the bypass writes the method names, no applet, no store and no USB identity that could be mistaken for the product; record its sha256 in `firmware_sha256` and keep the capture's hash beside it. THE SHIPPED IMAGE CANNOT TAKE THIS MEASUREMENT AT ALL, said because a reader may expect it to: firmware/src/main.rs:647 is the only `Trng::new` in the tree and it constructs the driver with all three bypasses CLEAR, so every byte the product can produce has already been through the von Neumann balancer and the two continuous checks. A run taken on the shipped image measures the WHITENED output, which is the test this row's statement says cannot answer the question, and it answers INCONCLUSIVE. Desk conditions, one board, one stepping recorded in `stepping`; temperature, supply and process are PLAT-TRNG-003's and this record must not be read as reaching them."""
expected = """The raw source clears the floor the shipped whitening needs at the sample spacing the product uses, and the floor is THIS RECORD'S OWN rather than a vendor's. WHY HALF A BIT PER RAW BIT, argued here because the record this replaces cited a datasheet figure that does not exist, and argued in the direction a review had to correct once already: a von Neumann debiaser emits AT MOST one bit per two raw bits, so if h is the raw min-entropy per bit and R the balancer's output-per-input rate, the input min-entropy standing behind one whitened bit is h/R, and R is at most one half. At h = 0.5 that is at least one full bit, AT EVERY RATE THE BALANCER CAN ACHIEVE, and at a slower real rate more. SO THE FLOOR IS SUFFICIENT FOR THAT COUNTING BOUND AND IT IS NOT NECESSARY, which is the opposite of what this field said first: below 0.5 the bound stops holding, the device does not, and a real source at h = 0.25 sits at R near 0.13 and still clears one bit per whitened bit. Von Neumann's output is exactly uniform for any fixed bias, so bias alone never starves it; what does is CORRELATION between consecutive samples, which is the thing `sample_count` was raised to reduce and the thing the non-IID track is chosen to see. That is why the verdict is read off the capture at the SHIPPED spacing and not off the bootrom's period-0 one. It is deliberately not derived from §12.12.1's `approximately 7.5 kb/s of entropy`, which is a rate and not a per-bit figure. PASS = the SP800-90B §6.3 non-IID estimator suite, run over at least 1,000,000 consecutive raw samples captured with all three bypass bits SET and SAMPLE_CNT1 AT THE SHIPPED 1000, returns a minimum-over-estimators min-entropy of at least 0.5 bits per raw bit, AND the period-0 control capture and the AUTOCORR_STATISTIC readings at `sample_count` 25 and at 1000 were TAKEN over the two equal-time windows `method` names — trip count and block count both — and are recorded in `actual`. THE SECOND CONJUNCT IS A RECORDING OBLIGATION AND NOT A COMPARISON, and that is deliberate rather than loose: on a healthy unit the autocorrelation check may trip zero times at BOTH settings, so a clause demanding a strict decrease from zero would be a route no passing world walks — which is the defect this whole split exists to remove, reintroduced one conjunct further in. What the two numbers are for is the row's prose and not its verdict: a trip rate that does not fall at 1000 says the raise firmware/src/main.rs:646 made bought something other than what its comment claims, and that is worth recording whichever way it comes out. FAIL = the SHIPPED-SPACING capture's estimate comes back below 0.5 bits per raw bit, on the die this project owns and at the conditions it runs at. That refutes this row's statement in the statement's own terms — the floor is what the row claims and the floor is what was missed — and it deliberately claims no more. What it costs the device stays OPEN: the counting bound the floor secures is sufficient and not necessary, so a real balancer rate below one half spends more raw bits per whitened bit and may still carry a full bit into each, and nobody here has measured that rate. It is not a small open question, because every key, nonce, blinding factor and pinUvAuthToken drawn after boot rests on the seed either way and PLAT-TRNG-001's three continuous checks pass such a source by construction. A FAIL here is a demand for the rate measurement, not a proof the device is broken; overstating it is how the record this replaces came to name a figure nobody published. A FAIL is gate-forced to `refuted` (scripts/platform_gate.py:1337 maps `fail` to `refuted`), so it owes two things beside the number: TRNG_DEBUG_CONTROL and SAMPLE_CNT1 READ BACK after the capture and recorded, and the capture's own hash. A bypass write that did not take yields a WHITENED capture, and a whitened capture estimating low is a broken instrument rather than a weak source, which is the nearest thing to this row's failure that is reachable by accident. INCONCLUSIVE = any run that is not about the source at the spacing the statement names, and each arm is one way to get there: a verdict read off the period-0 CONTROL capture rather than the shipped-spacing one, which is a stream the device never draws and the mismatch this record was rewritten to remove; a capture shorter than the length the estimator suite is specified over; a capture taken through the shipped image, or with any bypass bit clear on read-back, which is whitened output and is the very test the statement says cannot answer this; a capture whose EHR_DATA5 read was not last on every block, since that read is what clears the result registers and a stale block repeats itself into the stream; an estimate taken on the IID track over a capture that fails SP800-90B §5's permutation tests, which is the flattering-number shape; a run at a temperature or a supply outside desk conditions, which is PLAT-TRNG-003's question and not this one's; and a result ASSEMBLED FROM MORE THAN ONE BOARD, because this row is one die: a spread across parts is PLAT-TRNG-003's claim and not this one's, so a second board is a second run of this row and never a wider one."""
