#
# The SECOND assumption registry: the ones no model constant can carry.
#
# `assurance/assumptions.toml` holds a Boolean TLA constant some configuration
# assigns both ways and some reachable definition reads. That shape is what makes
# a model assumption falsifiable — you discharge it by running the other arm —
# and it refuses everything here by construction: `M7-Q2` written there answers
# `in the registry but no configuration assigns it`, and so does a recorded board
# PASS, and so does `tools/emu` fidelity. A second FILE rather than a `class`
# field on the first, because the field would be a hand-written discriminator
# choosing which rules apply: measured, deleting `PowerOnClearsScratch2` from the
# first registry reddens it in one line, and a `class = "platform"` on that same
# entry would leave the orphan rule satisfied and the both-arms rule skipped.
#
# HAND-WRITTEN FIELDS ONLY: id, statement, class, discharge, discharge_owner,
# status, failure_direction, and the link lists. Which candidates exist is
# DERIVED by scripts/platform_gate.py from four sources and printed, never
# stored — the same rule properties.toml states, for the same reason.
#
# Read the `status` column first. **How many are discharged is DERIVED, not typed
# here** — scripts/platform_gate.py prints it on every run and the generated
# docs/platform-assumptions.md opens with it. The typed copy that used to stand
# in this paragraph read `Two of fifty-eight` against a tree holding three of
# sixty-eight, and nothing gated it; it was wrong about the HOW as well, since
# only two of the three were discharged by reading (a manifest, and a model
# against the code it abstracts) and the third by a run. Nothing here is evidence
# about a board yet; every other row is an obligation with an owner and a named
# route, and the routes that end at a board this repository must not touch are
# exactly the rows whose `discharge_owner` is `maintainer` — a count the
# generated page derives, and the same expression that decides which rows owe a
# record under `assurance/board/`.
#
# Twenty-five of them arrived in one merge, from the six evidence bundles closed
# alongside SEC-FIDO-001 and -007. They were written blind to each
# other and three ids were proposed twice or three times over; the numbers moved
# and the statements did not, and each renumbering is recorded in the `registered`
# field of the bundle that proposed it. Not one of them added a maintainer-owned
# row, and neither did the store-backend section at the foot of this file: the
# board obligation is the LIVE count of `discharge_owner = "maintainer"` rows,
# which is what scripts/platform_gate.py's `board_rows` returns and the only
# number the generated page prints. `BOARD_ROW_FLOOR` never appears on the page,
# and the GATE's rule over it is a MINIMUM — `at least the floor` — so that a row
# deleted with its record is a red gate rather than a smaller table. Re-measured
# 2026-09-05 with thirteen rows live: `audit(board_floor=12)` and `=13` are both
# green and only `=14` fires. WHAT PINS THE TWO EQUAL IS THE SUITE AND NOT THIS
# RULE, and the two catch opposite edits, which is why the registry does not
# contradict itself by carrying both. `test_the_obligation_and_the_page_count_the_same_rows`
# asserts the obligation IS the constant, so a row ADDED without ratcheting the
# constant is red there while the gate stays green on it (13 >= 12);
# `test_the_record_vocabulary_is_ratcheted` holds the constant at `>= 13`, so a
# row DELETED and the constant lowered in the same diff is red there while the
# gate stays green on that.

# ---- Reset and the boot ROM --------------------------------------------------

[[assumption]]
id = "PLAT-RESET-001"
class = "reset"
statement = "A real RP2350 power-on reset clears `WATCHDOG.scratch2`, so the PIN soft-lock the previous cycle recorded does not ride through it."
discharge = "A board measurement: write a known value to WATCHDOG.scratch2, cut power at the supply — not a warm reset, because firmware/src/pin_lock.rs writes the word on every CBOR dispatch, so the read must come from the first boot after — and read it back. tests/54_sram_residue.py is the shape; the register is not SRAM, so it needs its own probe."
discharge_owner = "maintainer"
status = "pending"
# Towards MORE locking, not less: a word that rides a power cycle carries the
# mismatch batch with it. The undefined-register case is a third possibility and
# is already handled — the tag makes garbage read as clear.
failure_direction = "usability: a soft lock that outlives the power cycle it was meant to end"
covers = ["slice:AS-AUTH-4", "model:PowerOnClearsScratch2"]
discharges = ["PowerOnClearsScratch2"]
# `TheWholeLockRides` and not `MarkerNeverLies`: the marker is `EF_HARDENED`, a
# flash record, and nothing about it rides the watchdog word.
supports = ["SEC-BOOT-002"]

[[assumption]]
id = "PLAT-ROM-001"
class = "boot-rom"
statement = "M7-Q2: the boot ROM's BOOTSEL return path leaves `WATCHDOG.scratch2` as the firmware left it, so a drop to the bootloader is not a way to shed the soft lock."
discharge = "A board measurement on the same rig as PLAT-RESET-001, with the vendor applet's reboot-to-BOOTSEL in place of the supply cut, and the read taken on the boot after the bootloader is left. No datasheet clause states it either way; a vendor erratum would settle it as well."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security: a host that can reach the vendor AID could clear a soft lock the retry ladder imposed"
# The measurement cannot be taken until the drop itself is known to work, which
# is the other row's whole content.
depends_on = ["PLAT-ROM-002"]
supports = ["SEC-BOOT-002"]

[[assumption]]
id = "PLAT-ROM-002"
class = "boot-rom"
statement = "The vendor applet's reboot really reaches the bootloader: `tests/51_secure_reboot.py` has no runner in this tree, because the emulator has no bootloader to fall into."
discharge = "TAKEN on 2026-09-03, and the reading is deliberately not the script's. `tests/51_secure_reboot.py --bootsel` ran against a no-touch board — the plain run drives P1=0x00, the warm reset, and only `--bootsel` takes the P1=0x01 path this row is about — and exited 0 over `SELECT vendor AID -> 9000` and `REBOOT (P1=0x01) -> 9000`. That is not the discharge: its last line reads `secure-reboot PASS (BOOTSEL requested)`, and a request is not an arrival — the same line would print over a warm reset, which is the FAIL this row names. What settles it is the host afterwards, read separately and captured under assurance/board/: the device re-enumerated as the RP2350 mass-storage bootloader, its drive mounted, and the PC/SC reader list came back empty, so the CCID interface is gone. Both halves, because `expected` names the drive and the interface, and it is the interface half that rules out the warm reset. The board was re-dragged with a UF2 afterwards, which is why the run wants a throwaway board and not the provisioned one."
discharge_owner = "maintainer"
status = "discharged"
evidence = [
  "assurance/board/PLAT-ROM-002-2026-09-03-enumeration.txt",
  "assurance/board/PLAT-ROM-002-2026-09-03-reboot.log",
  "assurance/board/image-2026-09-03.txt",
]
board_revision = "RP2350 A4"
revalidated_by = "The dispatch the drop rides, and the boot configuration it is a fact about. The applet half is the INS_REBOOT arm of crates/rsk-vendor/src/lib.rs, which reads the P1 byte, and the board half is the reset_to_usb_boot call in firmware/src/worker.rs it ends at — a second P1 value routed there, or a reboot taken by some other route, is a different drop and this run says nothing about it. The configuration half unsettles it outright: a stepping other than the one recorded, secure boot switched on (which changes what the bootloader exposes to a host), or an image other than firmware-no-touch, where the reboot is presence-gated and the run measures the gate rather than the drop."
evidence_commit = "7904f012e8387e44b4b8629e32ee2a5e00eb0255"
failure_direction = "availability: a reboot that lands nowhere leaves a key that cannot be updated in the field"
covers = ["board-only:51_secure_reboot"]
supports = ["SEC-ADM-001"]

[[assumption]]
id = "PLAT-MEM-001"
class = "memory"
statement = "SRAM does not survive the drop to BOOTSEL, so a seed unwrapped in RAM is not readable through the bootloader."
discharge = "TAKEN BY `control` ALONE, on the maintainer's ruling of 2026-09-04, over a run of 2026-09-03. `python tests/54_sram_residue.py control` was driven against an image whose UF2 and ELF sha256 are both kept — assurance/board/PLAT-MEM-001-2026-09-03-control.log and assurance/board/image-2026-09-03.txt — and reproduced the 2026-08-05 outcome, tests/54_sram_residue.py:48, exactly: 4 KiB of `.text` byte-exact against the ELF, the whole 532480-byte dump zero at one distinct value, and the 256-byte pattern written through picoboot reading straight back. Those two are the halves assurance/board/PLAT-MEM-001.toml's `expected` calls PASS, and that `expected` was committed before the board was powered, which is what makes this a discharge rather than a criterion fitted to a result. The second arm is RETAINED, not met: `residue` has no reader of its own — it calls the same `check_readable` and `settled` raises out of it ahead of the region scan, ahead of the verdict and ahead of `--expect` — so it is a demand on a boot configuration where SRAM SURVIVES the drop and not on a re-run of this board, and the better the platform behaves the more certainly it refuses to answer. WHAT THE NARROWED ROUTE STILL REFUSES: a mismatching `.text` window is a FAIL and catches the wrong image, which is the mix-up the control exists for; zeros with a write-back that does not come back are INCONCLUSIVE, the picoboot-only-answers-zeros case; a short dump is INCONCLUSIVE, because regions the verdict covers went unread; and a `.data` window zero over a dump that is not is INCONCLUSIVE, the partial clear that would leave the stack and the keygen heap intact. PASS needs both halves and zeros alone are not one of them. WHAT IT DOES NOT SETTLE: that `worker::reboot`'s scrub works. The platform cleared main SRAM, not our code, and a dump that is zero everywhere cannot tell those apart — this is a platform result about this silicon and this boot configuration, and nothing here is evidence about the firmware's own wipe."
discharge_owner = "maintainer"
status = "discharged"
evidence = [
  "assurance/board/PLAT-MEM-001-2026-09-03-control.log",
  "assurance/board/image-2026-09-03.txt",
]
board_revision = "RP2350 A4"
revalidated_by = "The dispatch the drop rides, and the boot configuration the result is a fact about. The dispatch half is PLAT-ROM-002's: the INS_REBOOT arm of crates/rsk-vendor/src/lib.rs and the reset_to_usb_boot call in firmware/src/worker.rs it ends at. It has to be that warm drop — holding the button through a replug is a power-on reset, which loses SRAM for reasons this row is not about — so a reboot routed anywhere else is a different drop and this run says nothing about it. The configuration half unsettles it outright: a stepping other than the one recorded; secure boot switched on, which changes what the bootloader exposes to a host and turns the script's own refusal branch, picoboot serving nothing, into the answer in place of this one; a picotool other than the recorded version, or any picotool serving memory differently, since the entire reading is a picoboot save and a picoboot load; and a build whose RAM layout moves `.data`, because the window the verdict is read from is that section's address and size out of the ELF. tests/54_sram_residue.py is the fourth: it is the instrument, and a change to check_readable's decision table changes what a PASS here means."
evidence_commit = "7904f012e8387e44b4b8629e32ee2a5e00eb0255"
failure_direction = "security: a plaintext seed readable over the bootloader's mass-storage interface"
depends_on = ["PLAT-ROM-002"]
# `slice:AS-RAM-6` and not a row of its own: the slice's assumption IS this
# statement — a copy the code can no longer reach satisfies the seed-ordering
# invariant whatever the memory holds — and a second entry would be two answers
# about one measurement.
covers = ["board-only:54_sram_residue", "slice:AS-RAM-6"]
supports = ["SEC-FIDO-007"]

