# ---- The store backend the model abstracts -----------------------------------
#
# Where the four come from, corrected: NOT from assurance/crates.toml, which an
# earlier draft of this header credited with "already NAMES these four". Read by
# content, its `rsk-store` row (assurance/crates.toml:95) names SIX things —
# atomic append, an enumeration-completeness flag, the two-partition counter/main
# ring, `is_counter_fid` routing, wear and page reclaim, and compact — and REBOOT
# RECOVERY is not among them at all. The four are stage 5's exit criteria —
# `atomicity/tear semantics, scan completeness, reboot recovery и partition
# routing`, FORMAL_VERIFICATION_ROADMAP.md:1329-1331 — and the ledger's six
# overlap them without either list containing the other. Two of the ledger's six
# get no row here on purpose: wear and page reclaim, and compact. Both are
# liveness — a store that stops reclaiming fills up and refuses writes, which is a
# denial of service and not a false answer about a committed record — and neither
# has a recorded falsification, where each of the four does. That decision is now
# a list rather than a sentence:
# assurance/crates.toml's `abstracts` field produces one `backend:rsk-store/…`
# candidate per obligation and each row below CLAIMS one, so a row deleted from
# this file alone leaves a candidate no entry claims and the gate goes red. Before
# that list these four were notes with a status column: measured, deleting all
# four, or PLAT-STORE-004 alone, or PLAT-STORE-003 alone, left every rule at
# exit 0.
#
# The layer split is a measured one, not a taxonomy. Three of the four had no row
# anywhere; the fourth, tear, had one for the SILICON only (PLAT-FLASH-001) — the
# layer the defect was NOT at. third_party/sequential-storage.patch items 2 and 3
# record both guarantees FALSE in the library this tree vendors.

[[assumption]]
id = "PLAT-STORE-001"
class = "model-abstraction"
statement = "The tear guarantee PLAT-FLASH-001 makes about the silicon holds one layer up too, in the KV library: a torn append or remove leaves the old record or a detectably bad one, never a plausible wrong one. This is a property of the VENDORED FORK, not of `sequential-storage` 8.0.0."
discharge = "Two things, and neither is in the tree. First a recorded verdict for fuzz/fuzz_targets/kv_durability.rs, the target that FOUND the upstream defect: third_party/sequential-storage.patch item 3 records that upstream's `remove_item_inner` erased pages from `find_first_page(PartialOpen).unwrap_or_default()`, which falls back to page 0 in the normal steady state of a closed frontier page plus an open buffer page. That inverted the oldest-first erase order, so a power cut mid-remove erased the NEWEST copy first and left an OLDER copy live, which `fetch_item` then returned — exactly the plausible wrong one PLAT-FLASH-001 rules out, false in the library until this fork fixed it, and no board run of tests/29_reset_power_cut.py could have discharged it because the defect sits ABOVE the medium. Second a rule that the fork is what actually builds: [patch.crates-io] is wired in three manifests (Cargo.toml:177, fuzz/Cargo.toml:443, tools/emu/Cargo.toml:84) and nothing holds the three together, so a workspace that missed one would link upstream 8.0.0 with the defect back and every host test still green."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security: a remove torn by a power cut that restores an older committed value rolls back whatever that record gates — on a PIN-retry record it hands back spent attempts"
covers = ["backend:rsk-store/tear"]
depends_on = ["PLAT-FLASH-001"]
supports = [
  "SEC-STORE-001",
  "SEC-STORE-002",
  "SEC-STORE-003",
  "SEC-STORE-004",
  "SEC-STORE-005",
  "SEC-STORE-006",
]

[[assumption]]
id = "PLAT-STORE-002"
class = "model-abstraction"
statement = "The backend's enumeration-completeness flag is honest: `for_each_key` answering *complete* means every committed key was yielded, which is what lets `Fs::scan` decide the whole FID space and read a cold absence O(1) instead of probing for it."
discharge = "A test driving a SELECTIVE, single-page read fault at the `Storage` seam and asserting `for_each_key` answers false. The UNCONDITIONAL case is already covered and an earlier draft of this row said it was not: crates/rsk-store/src/tests.rs:395-404 `a_faulted_walk_reports_itself_incomplete` mounts a store, writes a live key, sets `fail_reads` and asserts the walk answers false; it predates this row and scripts/check.sh:514 runs it on every gate. What that test cannot reach is the shape the defect had. The mock says so itself at crates/rsk-store/src/tests.rs:59-62: `fail_reads` fails every read `unconditionally and for every address — which no torn write produces`, so it stands for a chip or bus fault, and a walk whose FIRST read fails is refused before it can report a truncated set as complete. Item 2 of third_party/sequential-storage.patch is the other shape: upstream's page-advance loop swallowed a page-state Err via `_ => continue`, so ONE unreadable page mid-ring was skipped and the walk still reached the None terminator and reported complete. Only a fault that answers for one address and not the rest distinguishes the fork from upstream, and no test in this tree can pose one. The claim itself is stated only in two COMMENTS, crates/rsk-fs/src/fs.rs:100-106 and crates/rsk-fs/src/fs.rs:295-302, each arguing it from the backend's internals rather than from anything that runs. The fork tells Corrupted (a fully-migrated source, safe to skip) from a genuine read fault and aborts on the second — so the guarantee is the FORK's, which is what PLAT-STORE-001 carries. crates/rsk-store/src/lib.rs:179-181 ANDs the two partitions' walks, so the flag is only ever as honest as the weaker ring."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security: a walk reporting complete after skipping a page makes `Fs::scan`'s `decided.fill` mark every un-yielded FID authoritatively absent for the rest of the boot — the false-absent that reads as `not provisioned` and opens every gate testing `has_data`"
covers = ["backend:rsk-store/scan-completeness"]
depends_on = ["PLAT-FLASH-001", "PLAT-STORE-001"]
supports = ["SEC-STORE-002"]

[[assumption]]
id = "PLAT-STORE-003"
class = "model-abstraction"
statement = "GIVEN a medium that tears the way PLAT-FLASH-001 asserts, a reboot recovers the committed store: after any number of power cuts every key whose write or remove returned cleanly reads back exactly, and only the operation the cut interrupted is ambiguous — its old value or its new one, never a third older one. The `GIVEN` is the whole narrowing and it is what makes this row dischargeable by a mock; the medium half is PLAT-FLASH-001's and is not restated here. firmware/src/main.rs:555 runs `Fs::scan` once at boot, and every later absence answer is that one walk's."
discharge = "A run record naming a verdict, which is the half that does not exist. The CONTRACT is asserted already: fuzz/fuzz_targets/kv_durability.rs states it in as many words in its header and drives one `MapStorage` partition directly, and fuzz/fuzz_targets/power_cut.rs torments the whole rsk-fs stack over the same power-cuttable mock. Both are on the weekly roster — scripts/fuzz-all.sh:41 takes it from `cargo fuzz list` rather than a hand-written table, so neither can silently fall off it. What nothing does is READ those verdicts: `kv_durability` appears in no workflow, no docs page, no script and no assurance file, so its result is a green shard nothing cites. Why this row is `model-abstraction` and not `flash`, decided by measurement rather than by taxonomy: the class is the whole difference between a discharge that must name silicon and one that need not. Marked `discharged` with `evidence = [\"fuzz/fuzz_targets/kv_durability.rs\"]` this row is exit 0 under `model-abstraction` and exit 1 under `flash` — `PLAT-STORE-003: a flash discharge records no 'board_revision'`. As the statement stood before the `GIVEN`, `flash` was the honest class and the row was mis-classed. Narrowing the statement is the better repair: classing it `flash` would oblige a stepping for a defect that sits ABOVE the medium, which is exactly the mistake PLAT-STORE-001 exists to undo — a software question parked behind hardware that cannot answer it — and this row's `discharge_owner` is `contributor`, who under AGENTS.md may not produce a board revision at all. What the narrowing does NOT buy, in the reading this row carried until the hole was closed: `model-abstraction` accepted any path that existed, so `evidence = [\"README.md\"]` on this row was also exit 0, measured. That half is now `check_evidence`'s `PROSE_PAGE` rule and it belongs to every row of the class rather than to this one: a `.md` that no generator both CLAIMS and MARKS is refused as evidence anywhere in the registry, whatever its case, and so is a directory and any spelling git's listing does not have — `docs`, `README.MD`, and a generator-claimed page with its own header line deleted, were each exit 0 after the rule's first version, measured. So is a page rendered FROM this registry, which that version admitted through its own carve-out: `evidence = [\"docs/platform-assumptions.md\"]` on this row was exit 0 while that page prints this row's `discharge` verbatim. What the rule still does not buy is relevance: an artifact of legal shape and no bearing on the claim, `deny.toml`, is exit 0 on this row today, measured, and only a reader stops that. Nor does it stop a `*_gate.py` DECLARING a page it does not write, because nothing here runs a generator — that move now costs a second edit, since the page must carry the marker too."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security: a reboot that resurrects a superseded value rolls back whatever it gates — a signature counter, or a PIN-retry ladder that hands back spent attempts"
covers = ["backend:rsk-store/reboot-recovery"]
depends_on = ["PLAT-FLASH-001", "PLAT-STORE-001"]
supports = ["SEC-STORE-001", "SEC-STORE-002"]

[[assumption]]
