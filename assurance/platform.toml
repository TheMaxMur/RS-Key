class = "model-abstraction"
statement = "`is_counter_fid` is a correct routing table over every FID the firmware persists: a record is read back from the partition it was written to, and the counter/main split never leaves a live FID on the other side."
discharge = "A derivation reading the FID constants out of the applet crates and holding them against the table, which scripts/partition_routing_gate.py is: it takes the constant NAMES out of the doc comment over `is_counter_fid`, resolves each to a `const … : u16` in a crate that is not rsk-store, and holds all four copies to the values that come back. What it does NOT settle is this row's statement, and that is why the status has not moved: the ROSTER is that doc comment, so a hot record declared at its home and named nowhere over the table derives nothing and no copy is measured against it — `over every FID the firmware persists` stays a judgement `rsk-store` makes and a reader checks. Before that row existed: crates/rsk-store/src/lib.rs:88 is a hand-written `matches!` over four bare literals (0xC000, 0xC001, 0x0093, 0xCC01) whose named homes are in other crates: `EF_COUNTER` at crates/rsk-fido/src/consts.rs:333 and `EF_CRED_CTR` at crates/rsk-fido/src/consts.rs:340. Table and constants therefore drift without a compile error, and the set HAS moved once — `EF_CRED_CTR` joined it at 0x0821 after 0x081D had been writing that FID to main. crates/rsk-store/src/lib.rs:145-152 records what the resulting state costs: a copy in the wrong partition is invisible to `read` yet yielded by every `for_each_key`, so authenticatorReset's sweep loops on it until its progress bound gives up. FOUR hand-written copies of the set, not two, and an earlier draft of this row missed the one that matters. `git grep -l is_counter_fid` reaches nine files — this registry and its generated page, assurance/crates.toml, CHANGELOG.md, docs/assurance-vector.md, formal/README.md, the two rsk-store sources, and fuzz/fuzz_targets/power_cut.rs. That last one is the fourth copy: fuzz/fuzz_targets/power_cut.rs:76-78 spells the same four literals into a `FIDS` array, and its own comment at :67-75 records that the set has ALREADY drifted there twice — the mirror it replaced listed three of the four and missed `EF_CRED_CTR` (0xC001, rewritten on every getAssertion), and the selector was `& 7` over nine entries, so `0xCC01` could never be written by any input while the sweep asserted it absent on every one. A whole partition routing was in the roster and out of the fuzzer's reach. So this row's subject is not hypothetical drift; it is drift that has happened twice in the copy the row was written without. What holds the table today is crates/rsk-store/src/tests.rs:244-264, which lists the same four numbers a third time and would move WITH a wrong edit — and which names the `power_cut` miss at :250-251, so the two copies that drifted are the two nothing derives."
