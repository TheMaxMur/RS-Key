[[assumption]]
id = "PLAT-TRNG-002"
class = "trng"
statement = "The RAW ring-oscillator source clears the floor the shipped whitening needs — at least half a bit of min-entropy per raw bit, measured AT THE SAMPLE SPACING THE PRODUCT USES, on the die this project owns and at desk conditions. HALF A BIT IS SUFFICIENT AND NOT NECESSARY, and which way round is the point rather than a hedge: a von Neumann debiaser emits at most one bit per two raw bits, so at 0.5 bits per raw bit every whitened bit is backed by a full bit of input min-entropy AT EVERY RATE THAT BALANCER CAN ACHIEVE, and at a slower real rate by more. Below the floor the BOUND stops holding, not the device — von Neumann's output is exactly uniform for any fixed bias, so bias alone never starves it and what actually threatens it is CORRELATION between samples, which is what `sample_count` buys (PLAT-TRNG-001) and what the non-IID estimators are chosen to see. Neither of the two things this tree already has can answer it: the three continuous checks PLAT-TRNG-001 reads detect a source that has DIED and pass a degraded one, and a statistical test of the WHITENED output passes over a stuck source, which is what whitening is for. What rests on the floor is the 48-byte DRBG seed firmware/src/handler.rs:64 declares and firmware/src/handler.rs:65 fills at every boot, and every key the device mints afterwards."
discharge = "A BENCH IMAGE AND SP800-90B, and the route is REACHABLE — the first thing this split corrects, because the row it came from said the raw source needs an image `this tree does not ship` and left a reader picturing an exotic rig. The raw pre-whitening samples are readable in software on a stock part: TRNG_DEBUG_CONTROL (0x138, RP2350 datasheet of 29 July 2025, p.1219) exposes AUTO_CORRELATE_BYPASS, TRNG_CRNGT_BYPASS and VNC_BYPASS, and that datasheet's own bootrom listing at §12.12.4.1 p.1214 sets `sample_cnt1 = 0` and `trng_debug_control = -1u` and reads EHR_DATA to stream raw TRNG ROSC samples — shipping pico-sdk does the same in `src/rp2_common/pico_rand/rand.c`. THE RUN, in assurance/board/PLAT-TRNG-002.toml: that bypass configuration on one board, at least 1,000,000 consecutive raw samples captured and hashed into the record, then the SP800-90B §6.3 non-IID estimator suite over them. AT THE SHIPPED `SAMPLE_CNT1`, AND THAT IS A CORRECTION rather than a detail: the bootrom listing sets the sample period to 0 because it wants throughput, and 0 is the MOST correlated setting this part offers, while the product spaces its samples 1000 cycles apart. A verdict taken at 0 would be about a stream the device never draws, and this row's own FAIL is gate-forced to `refuted` — so the criterion is read off the 1000 capture and the 0 capture is kept beside it as the correlated control, which is also what makes the pair say whether the spacing bought anything. AND A SECOND HALF THE SAME SESSION CAN TAKE: AUTOCORR_STATISTIC (0x134, p.1218) read with the checks re-enabled at `sample_count` 25 and at the shipped 1000 on the same unit, which is the only way this project can put a RATE behind firmware/src/main.rs:609 — what stands behind it today is one wall-clock observation of a boot on one Waveshare unit at `2cdcc282e9605d601631b4b06727b2f746325727`, and a boot time is not a health-check failure rate. WHY THE CRITERION NAMES NO DATASHEET FIGURE, said here because the row this was split from named one and there is none. §12.12.1 p.1212 makes a bare compliance assertion and gives `approximately 7.5 kb/s of entropy`, which is a RATE and not min-entropy per bit; §12.12.2 p.1213 records that `software does not configure the ROSC length and sample count settings provided by the Arm characterisation procedure`, so the vendor declined the procedure that would have produced one; and the part holds no NIST ESV or ENT listing. `PASS = min-entropy at or above the datasheet figure` was therefore a clause no passing world could walk. The record names its own threshold and justifies it there instead, which is the whole of what changed. WHAT THIS RUN DOES NOT REACH, said because a PASS read as covering it would be read wrong: one die, one desk, one temperature and one supply — the corners are PLAT-TRNG-003's — and the whitening itself, since the capture bypasses it, so this measures the SOURCE and says nothing about how many raw bits the shipped path spends per EHR block."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security, and the size of the claim is what a `fail` here must not overstate, since the gate forces one to `refuted`: the floor is SUFFICIENT AND NOT NECESSARY, so an estimate below it WITHDRAWS the counting bound standing behind the 48-byte seed rather than establishing a weak one — a real source at h = 0.25 sits at a balancer rate near 0.13 and still carries a full bit into every whitened bit, and nobody here has measured that rate. What a `fail` establishes is exactly that much: the argument behind every key, nonce, blinding factor and pinUvAuthToken drawn after boot is gone, and the measurement that would settle whether the secrets themselves are weak is one this project has never taken. That open half is the serious one, because PLAT-TRNG-001's three continuous checks pass a degraded source by construction — a source that IS weak is noticed by nothing on the device, which is what separates this row from that one, whose failure stalls the boot — and the observable, if there is one, is a host that guesses a credential"
# The raw capture is only evidence about the SHIPPED device because the shipped
# device leaves the whitening and the three checks in the state that row reads;
# a bypass bit set in the product would make this measurement about a different
# machine. The same shape PLAT-ROM-001 uses for a measurement that needs another
# one settled first.
depends_on = ["PLAT-TRNG-001"]
# MOVED here from PLAT-TRNG-001 on 2026-09-05, and the two ids are NOT carried for
# the same reason — the first version of this comment said they were, and a review
# refuted it. SEC-FIDO-003 is the one the route serves: a grant that "never
# authorizes again" needs the next pinUvAuthToken to be UNGUESSABLE and not merely
# different, which is a min-entropy claim, and this is the only one of the three
# rows whose run could establish it. The reading they came from removes the
# stuck-source arm and nothing else, and PLAT-TRNG-003 cannot carry a property at
# all, because a row that ACCEPTS a risk and supports one publishes that property
# as conditional on something nobody is going to retire, while the condition
# SEC-FIDO-003 needs is the one THIS row is scheduled to answer.
#
# SEC-FIDO-008 IS INHERITED, NOT RE-DERIVED, and the argument above is not about
# it. It is `NoLiveTokenWithoutPinRecord` — a live token implies EF_PIN exists —
# which is a structural fact about which record is present, and no entropy figure
# decides one: a token drawn from a dead source is as live as any other. It is
# carried because dropping a `supports` link would be a scope change smuggled into
# a split whose whole job is to move claims rather than retire them. Whether it
# belongs on a TRNG row at all is a real question and this change does not settle
# it — one line here, and the maintainer's to take off.
supports = ["SEC-FIDO-003", "SEC-FIDO-008"]

[[assumption]]
id = "PLAT-TRNG-003"
class = "trng"
statement = "Nothing in this project qualifies the raw source at the TEMPERATURE, SUPPLY and PROCESS corners. PLAT-TRNG-002 is one die on one desk, and a ring oscillator's entropy is a function of the jitter its corner leaves it, so a source that measures well at room temperature on a bench supply is not thereby a source that measures well in a warm pocket, on a hub that sags, or on the next wafer. The gap is ACCEPTED here rather than scheduled, and its severity is UNKNOWN rather than low."
discharge = "ACCEPTED, and the two routes are dead for DIFFERENT reasons — which is what makes this something other than an ordinary expensive row. THE EQUIPMENT: a thermal chamber, a programmable supply and enough parts for a process spread, none of which this project has, and hardware is the maintainer's alone under AGENTS.md. That much is only cost. THE REFERENCE IS THE HALF THAT DOES NOT COME BACK: there is no vendor number a corner result could be held against. §12.12.2 p.1213 of the RP2350 datasheet of 29 July 2025 records that `software does not configure the ROSC length and sample count settings provided by the Arm characterisation procedure` — the vendor declined the procedure — §12.12.1 p.1212 publishes a generation rate and no min-entropy per bit, and the part holds no NIST ESV or ENT listing. So even a fully instrumented corner run would produce a number with nothing to compare it to except a threshold this project chose for itself, which is a self-consistency check and not a qualification. WHY THIS IS NOT PLAT-CRYPTO-002'S SHAPE, and the difference is the reason this is a row instead of a sentence inside that one: that row accepts a residual it argues LOW, and it argues it FROM EVIDENCE IN THIS TREE — four command surfaces read for whether any hands a host a time-resolved observation, and arithmetic over a window table whose stride is in the source. THIS ROW CAN MAKE NO SUCH ARGUMENT AND MUST NOT LOOK AS THOUGH IT DOES. It has no in-scope half to read, no vendor figure to lean on and no measurement in either direction, so sitting under the same status word is the only thing the two have in common. WHAT WOULD TAKE THE ACCEPTANCE OFF, since an `accepted-risk` row may carry no `revalidated_by`: Raspberry Pi publishing a characterisation or a min-entropy figure for this ROSC; an ESV or ENT listing appearing for the part; an independent corner qualification of an RP2350 TRNG published by anyone; or this project acquiring the chamber and the supply, at which point the row becomes a maintainer-owned board obligation with a record of its own — and not before, because a `planned` record for a run no equipment can take is the dead route this split exists to remove."
# `vendor` and not the `maintainer` the class would suggest, nor the
# `contributor` PLAT-CRYPTO-002 uses. There is no source half here for a
# contributor to read, and `maintainer` is refused for that row's own stated
# reason: it would owe an assurance/board/PLAT-TRNG-003.toml carrying PASS and
# FAIL arms for a run no equipment in this project can take, which is precisely
# the shape this split was opened to delete. What is left is the party that could
# produce the missing half — the characterisation Raspberry Pi declined — and the
# field records that rather than pretending somebody here will do it. First
# `vendor` row in this registry; the vocabulary already had the word and no
# instance, which is the shape this file otherwise refuses, so it is worth saying
