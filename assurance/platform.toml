# --- the four inventory categories stage 10 names and this file did not hold ---
# `scripts/platform_gate.py`'s CLASSES vocabulary already had all four names and
# no row used any of them, so the exit form "no platform statement without an
# entry" was met over a set that did not contain them. None of the four is
# DERIVABLE today — the four derivations produce slice ids, model constants,
# board-only suites and `unsafe` sites, and a hardware peripheral is none of
# those — so these are hand-written with no `covers`, exactly like the six rows
# that already are. That is the honest shape and it is also the weakness: a
# category with no candidate source is a category this page cannot force.

# ---- The TRNG: one route, split in three -------------------------------------
# `PLAT-TRNG-001` carried three claims of very different reachability under one
# id until 2026-09-05 — that the health check catches a dead source, that the raw
# source has entropy, and that both hold at every corner the datasheet qualifies
# — and its PASS clause named a number that does not exist. `PASS = min-entropy
# at or above the datasheet figure`: the RP2350 datasheet of 29 July 2025
# publishes no min-entropy per bit, §12.12.2 p.1213 records that Raspberry Pi's
# software does not configure the settings Arm's characterisation procedure
# provides, and the part holds no NIST ESV or ENT listing. That is
# `PLAT-TIMER-001`'s 584,542-year run and `PLAT-MEM-001`'s `residue` arm a third
# time: a route no passing world can walk.
#
# TWO OF THE ROW'S OWN PREMISES WERE FALSE AS WELL, and the split is where they
# are corrected rather than dropped. The raw source needs no exotic bench rig —
# the same datasheet's bootrom listing (§12.12.4.1 p.1214) streams it with two
# register writes and shipping pico-sdk does the same — so the entropy
# measurement is REACHABLE, and it is `PLAT-TRNG-002`. And the failure is not
# silent: the checks are continuous, a failed one presents no result and zeroes
# EHR_DATA, AUTOCORR_ERR latches, and a source that has died stalls the boot
# before USB comes up. What is genuinely invisible is a DEGRADED source that
# still passes, and that is the only thing left in the security row.
#
# THE CLASSES FOLLOW THE ROUTES, the way the timebase's do: `HARDWARE_CLASSES` in
# scripts/platform_gate.py is, in its own words, "the classes whose discharge is a
# measurement on silicon, and so must record the stepping". This row's discharge
# is a reading of a dependency pin, a driver default and one assignment, so it is
# `build-configuration` and owes no stepping; `PLAT-TRNG-002`'s is a measurement
# on silicon and `PLAT-TRNG-003`'s would be, so both stay `trng`. THE BOARD
# OBLIGATION DOES NOT MOVE: this row leaves it and `PLAT-TRNG-002` takes its
# place, and `PLAT-TRNG-003` owes no record because a `planned` record for a run
# no equipment here can take is one more route no world walks.

[[assumption]]
id = "PLAT-TRNG-001"
class = "build-configuration"
statement = "The RP2350 TRNG's three health checks are CONTINUOUS, this image leaves all three armed, and they fail CLOSED: `embassy_rp::trng::Config::default()` clears every bypass bit and `Trng::new` writes them into TRNG_DEBUG_CONTROL, firmware/src/main.rs:609 edits `sample_count` and nothing else, and on a failed check the part presents no result and every EHR_DATA register reads zero. So a source that has DIED cannot be drawn from: at boot that stalls before the USB pull-up goes up, and at the 64 KiB DRBG reseed (firmware/src/handler.rs:78) it wedges or halts the operation in flight. That the surviving source has ENTROPY is a DIFFERENT claim and PLAT-TRNG-002's, not this row's: three continuous checks are a dead-source detector, never an entropy estimator."
discharge = "READ on 2026-09-05, and it is the reading half of a route that used to carry three claims of very different reachability under one id. FOUR READINGS. (1) ALL THREE CHECKS ARE ARMED, and the image WRITES that rather than inheriting a reset value: `embassy_rp::trng::Config::default()` sets `disable_autocorrelation_test`, `disable_crngt_test` and `disable_von_neumann_balancer` all `false`, and `Trng::new`'s `initialize_rng` writes those three bits into TRNG_DEBUG_CONTROL (0x138) on every construction. firmware/src/main.rs:601 takes that default, firmware/src/main.rs:609 edits `sample_count` alone, and firmware/src/main.rs:610 is the tree's ONLY `Trng::new`, and no first-party Rust assigns any of the three bypass fields: `git grep -E 'disable_autocorrelation_test|disable_crngt_test|disable_von_neumann_balancer' -- 'firmware/*.rs' 'crates/*.rs' 'tools/*.rs'` exits 1. THE THREE NAMES AND THE PATHSPEC ARE BOTH THE POINT, not tidiness. Unscoped, that grep answers this row's own prose and the page generated from it, so a claim about what the tree contains would be falsified by writing it down — PLAT-TIMER-001 records that trap one row over. And `disable_` alone over the same pathspec is NOT empty, which is why the command is the three field names and not the prefix — and the count is worth getting right, because the first version of this sentence got it wrong: FOUR hits in TWO files, two test names in crates/rsk-fido/src/vendor_tests.rs and two `disable_raw_mode` calls in tools/tui/src/main.rs, because git's pathspec matching lets `tools/*.rs` cross a `/`. The revision is pinned in Cargo.lock: embassy-rp 0.10.0 at git rev 6c28443489ad5940ab8c1824c090b1f8a7233bf6. (2) THEY ARE CONTINUOUS, AND THERE IS NO START-UP TEST. RNG_ISR (0x104, RP2350 datasheet of 29 July 2025, p.1217) carries VN_ERR — 32 identical consecutive bits — CRNGT_ERR — two equal consecutive 16-bit blocks — and AUTOCORR_ERR, and each is evaluated as a block is produced rather than once at reset — AUTOCORR_ERR latching after four failures in a row rather than on the first, which the driver's own comment quotes from the register description. That datasheet describes no start-up test and no Adaptive Proportion Test, which is worth writing down because SP800-90B's health-test vocabulary makes a reader expect both: what this part gives is a per-block continuous test and nothing else. (3) THEY FAIL CLOSED AND LOUDLY, which is the half the row this was split from had backwards. §12.12.3 p.1213: on failure no results are presented and the EHR_DATA registers all read as 0, so TRNG_VALID.ehr_valid stays low and no byte reaches the caller; AUTOCORR_ERR is LATCHED — in the datasheet's own words the RNG then ceases functioning until the next reset — and the interrupt-clear register does not lift it: what the driver does instead is assert TRNG_SW_RESET and re-initialise, which is the loop below and not a recovery. This firmware's boot draw is the BLOCKING one: firmware/src/handler.rs:63 takes the `Trng` and firmware/src/handler.rs:65 fills 48 bytes through `blocking_fill_bytes`, whose not-valid branch soft-resets and re-samples on AUTOCORR_ERR and panics on anything else. Either way the boot does not finish — it is the 30-105 s stall firmware/src/main.rs:602-608 records, taken before the bus pull-up (firmware/src/usb_attach.rs:8) — and a device that never enumerates is not a device handing out predictable keys. AND THE BOOT IS NOT THE ONLY DRAW, which the first version of this reading missed: firmware/src/handler.rs:78 calls the same `blocking_fill_bytes` again on every `RESEED_INTERVAL` (firmware/src/handler.rs:57, 64 KiB of DRBG output), so a source that dies AFTER boot meets the same loop on an ENUMERATED device, inside whatever operation asked for the bytes. Loud in a second way — a wedged command or a `panic-halt` freeze rather than a device that never appears — and still not a quiet weak key, which is the claim. (4) WHAT `sample_count = 1000` DOES, AND WHAT IT DOES NOT. SAMPLE_CNT1 (0x130, p.1218) is the number of rng_clk cycles BETWEEN two consecutive ROSC samples, so 25 -> 1000 buys DECORRELATION and costs generation time; it does not change the 192 bits an EHR block carries and it adds no entropy to any of them. Why it was raised is on record and was measured on hardware at `2cdcc282e9605d601631b4b06727b2f746325727`: at 25 the autocorrelation check failed on nearly every block on one Waveshare unit and the driver soft-reset in a loop, an inverter-chain change did NOT help, and 1000 gives a seed in about a second and a half. THREE THINGS THIS DOES NOT SETTLE. That the surviving source has ENTROPY — the checks catch a source that has DIED and a merely DEGRADED one passes all three, which is the single failure this row's statement deliberately leaves open and PLAT-TRNG-002's whole subject. WHICH loud arm a CRNGT or VN failure takes: `blocking_wait_for_successful_generation` branches on `autocorr_err` alone and panics otherwise, and whether the part drops TRNG_BUSY with `ehr_valid` low on those two is a clause this reading does not have — a stall and a `panic-halt` freeze are both loud and neither is a quiet weak key, so the claim survives either answer while the answer stays unread. And NOTHING IN THIS TREE BACKS THE FAIL-CLOSED CLAUSE: the driver's `read_ehr_registers_into_array` copies EHR_DATA0 through EHR_DATA5 with no zero check and firmware/src/handler.rs:63 does not inspect the seed it gets, so `no byte reaches the caller` rests on the datasheet's promise that `ehr_valid` stays low and on no code here — a part that ever raised that flag over zeroed result registers would seed the DRBG with 48 zero bytes and nothing would say so. And the CORNERS: everything above is about what this image configures at desk conditions, and temperature, supply and process are PLAT-TRNG-003's. TWO THINGS THE READING FOUND AND THIS CHANGE REPAIRED, because they were firmware comments rather than registry entries and they were two copies of ONE claim: firmware/src/handler.rs:44 told the reader the block was drawn only through a working ROSC config with the chain at zero, and firmware/src/handler.rs:61 repeated it as a draw through the ROSC config the caller set on the `Trng`. No such configuration ever existed on this branch: `2cdcc282e9605d601631b4b06727b2f746325727` replaced the `inverter_chain_length = InverterChainLength::None` assignment with the `sample_count = 1000` one and dropped the `InverterChainLength` import, and left both sentences standing — so from 2026-06-18 the shipped image ran the driver's DEFAULT chain length while its own doc comment called that setting catastrophic, and `git grep inverter_chain_length` answered with no Rust at all. Both lines now say what the code does — the draw finishes because of `sample_count`, and the chain length is the driver's — which is what that commit's own message already recorded when it wrote that an inverter-chain change did NOT help. THE BEHAVIOUR WAS NEVER WRONG AND THE EXPLANATION OF IT WAS, for eleven weeks, which is why this belongs in a reading's discharge rather than in a fix: nothing about the image changed when the sentences did."
discharge_owner = "contributor"
status = "discharged"
evidence = [
  "Cargo.lock",
  "firmware/src/handler.rs",
  "firmware/src/main.rs",
]
revalidated_by = "Three edits, each of which makes this reading false while leaving its text true-looking, and the first is not in this tree at all. A DIFFERENT EMBASSY: the embassy-rp revision in Cargo.lock, because `Config::default()`'s three `false`s, the TRNG_DEBUG_CONTROL write inside `initialize_rng` and the blocking path's soft-reset-on-AUTOCORR loop are that crate's code and not this repository's — a driver that stopped writing the register would leave every sentence here intact and the subject unconfigured. A DIFFERENT CONFIGURATION: firmware/src/main.rs, where any of the three `disable_*` fields set true, a `sample_count` other than 1000, or a second `Trng::new` changes what is armed or how far apart the samples are taken. A DIFFERENT DRAW: firmware/src/handler.rs, where moving the seed from `blocking_fill_bytes` to the async `fill_bytes` swaps the failure handling for the interrupt handler's, which WARNS on CRNGT_ERR and VN_ERR and clears them WITHOUT waking the waker, so `fill_bytes`'s `poll_fn` answers `Poll::Pending` for ever: not the absence of a stall but a SILENT one, and this row's `loudly` would then be false of the path the device actually uses."
evidence_commit = "578a924e4adb172d15b879008de228c68a98cdbc"
failure_direction = "coverage, and saying so is the correction this split makes: the row this was scoped out of read `security, and silently — nothing downstream can notice`, which is false of the failure it named. A source that DIES is the loudest thing this firmware does, since the boot never reaches the USB pull-up. What a failure of THIS reading costs is a reader who takes three continuous dead-source checks for an entropy guarantee, and a bypass bit or an async draw that turns the loud arm quiet. The weak key is real and it is PLAT-TRNG-002's direction, not this one's"
# NO `supports`, and the reason is narrower than the first version of this
# comment claimed. It said a DISCHARGED row REMOVES A CONDITION and may not carry
# `supports`; that is false of this registry — five of the discharged rows carry
