[[assumption]]
id = "PLAT-BUILD-005"
class = "build-configuration"
statement = "Every shipped image is built with `CONSTANT_MEMORY_ACCESS_PATTERN 0`, and that is a DEFERRAL with a price rather than a default nobody read. The vendored header defaults it to 0 and recommends that value for Cortex-M (`crates/rsk-rsa/csrc/bignum_config.h`), and `crates/rsk-rsa/build.rs` passes no `-D` for it, so there is no build knob: turning it on is a source edit. Read out of the source, the other arm does two things. It replaces `table_entry = temp + four_bits * modulus_length_bytes` with a call to `bignum_table_select`, which scans ALL sixteen entries branchlessly on `usub8`/`sel` and copies the chosen one into scratch; and it prepends an in-place cycle-following transpose that re-lays the table into 8-word blocks for that scan. Neither has ever been built here, and not merely never exercised: `bignum_table_select` sits inside `#if CONSTANT_MEMORY_ACCESS_PATTERN` in `crates/rsk-rsa/csrc/bignum_asm.S`, so at 0 it is not assembled at all, and the transpose is under the same guard in `crates/rsk-rsa/csrc/bignum_high_level.c`."
discharge = "A build and a board, in that order, and neither has been taken — every number below is COUNTED FROM THE SOURCE and none of it is a measurement. (1) Build `firmware` with the flag defined and confirm `bignum_table_select` is in the image. That is minutes, and it settles the size cost, which is not only flash: both halves are RAM-resident by section — the C carries `BIGNUM_RAMFUNC`, which is `section(\".data.bignum_hl\")`, and the asm's whole translation unit is `.section .data.bignum_asm` — so the flag spends SRAM on a part whose stack ceiling is already the binding one. (2) A board, because nothing else can run it: `crates/rsk-rsa/build.rs` compiles the C and the asm only for `target_os = \"none\"`, so no host test and no `tools/emu` run reaches this arm at all, and the transpose's correctness is exercised by an on-card RSA sign at each of the three widths and by nothing else. The Bellcore check in `crt::private_op` turns a wrong transpose into a refused signature rather than a bad one, so a passing on-card sign IS the proof — and a failing one is a key that stops working, which is why this may not be turned on blind. (3) Time one PIV GENERAL AUTHENTICATE or one OpenPGP PSO:CDS on each arm for the real cost. Counted from the instruction mix, `bignum_table_select` reads 16 x `half` bytes per window where the shipped arm reads `half`, against a window that already spends four squarings and one multiply, so the overhead is of the order of a tenth of the private operation and is LARGER at RSA-2048 than at RSA-4096 — the multiply cost grows quadratically in the width and the table scan only linearly. WHAT TAKES THE DEFERRAL OFF, since an `accepted-risk` row may carry no `revalidated_by`: `PLAT-CRYPTO-002` being re-opened by any of its triggers, or a board becoming available for the three widths — whichever comes first. The flag is the fix; this row exists so that not taking it is a decision with a price rather than a header default."
discharge_owner = "contributor"
status = "accepted-risk"
out_of_scope_by = "docs/limitations.md#cryptography"
failure_direction = "split, and the split is why it is deferred rather than taken: leaving it 0 keeps the residual `PLAT-CRYPTO-002` argues is LOW, while turning it on today would put an arm nothing in this tree can execute onto the four USB-reachable private-key surfaces, where a wrong result is a refused signature and a refused signature is a key that no longer works"
depends_on = ["PLAT-CRYPTO-002"]

