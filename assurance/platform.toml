[[assumption]]
id = "PLAT-CRYPTO-002"
class = "crypto-primitive"
statement = "The RSA private operation's secret-indexed window lookup is a LOW residual, and what makes it low is the OBSERVATION rather than the code. The nibble that picks the window is a nibble of `dP`/`dQ`; it lands in the BASE ADDRESS of a fixed-size contiguous read and nowhere else, so the instruction sequence, the operand widths and the call counts per window are the same for all sixteen values. Four command surfaces reach it — PIV GENERAL AUTHENTICATE (`crates/rsk-piv/src/auth.rs`, `slot_key_op`'s RSA arm), OpenPGP PSO:CDS (`crates/rsk-openpgp/src/pso.rs`, `try_pso`), INTERNAL AUTHENTICATE (`crates/rsk-openpgp/src/internalaut.rs`, `try_internal_aut`) and PSO:DECIPHER (`crates/rsk-openpgp/src/keys.rs`, `rsa_decipher`), all through `crt::private_op` — and per-operation blinding does not cover it: all three `blind_pair` sites randomise the BASE, and `dp`/`dq` go to the asm untouched. Nor is there a cache to carry it — both ends of the access are SRAM in the shipped image and the RP2350's cache sits in front of QSPI flash. It is LOW and not CLOSED because reading the window sequence needs a TIME-RESOLVED observation inside one operation, and the only attacker holding one is the power/EM prober docs/threat-model.md declares out of scope; a host that can time whole operations only sees one scalar per signature, over an exponent that never changes."
discharge = "Two halves, and the split is what keeps this row honest. (1) The in-scope half is readable and is a contributor's: whether any USB-visible surface hands a host a time-resolved observation inside one private operation. None does today: on all four surfaces the private operation runs to completion before any response byte leaves — `slot_key_op` fills its buffer and only then calls `dyn_auth_resp`, and the 61xx / GET RESPONSE chaining that may follow is transport-level (`crates/rsk-device/src/ccid.rs`) over a buffer already computed. So the host measures one end-to-end latency per operation, and the exponent is fixed for the life of the key, which makes that latency the same scalar for every signature and empty of per-window information. A response that streamed, chunked or progress-reported from inside the modexp would refute it, and so would a second observer on the same operation. (2) The silicon half is a board measurement, named here and deliberately not registered as a second maintainer-owned row: whether an RP2350 SRAM read costs a different number of cycles for a different address at all. That is unmeasured in BOTH directions, and what stands in for it is arithmetic rather than a measurement — the sixteen entries are `temp + k * half` with `half` a multiple of 32 bytes (`crates/rsk-rsa/src/lib.rs`, `sign_crt`), so every entry shares its address bits below 32 and every read is a contiguous multiple-of-32-byte run. A striped organisation whose period divides 32 bytes cannot tell the entries apart, and a bank selected by high address bits holds the whole table, which is at most 4 KiB. That bounds the mechanism; it does not measure it. WHAT RE-OPENS IT, since an `accepted-risk` row may carry no `revalidated_by`: a private-operation response a host can observe more than once (streaming, chunking, a progress indicator, an interrupt-driven partial reply); a build in which core 1 or a DMA channel runs against this modexp on a USB-reachable path, which today only keygen does (`firmware/src/core1.rs` takes prime-search jobs and nothing else); a measurement that an RP2350 SRAM read's cycle count follows its address; or a change to the window table that stops the sixteen entries sharing a 32-byte-multiple stride. `PLAT-BUILD-005` being taken retires the residual instead of re-opening it."
# `contributor` and not the `maintainer` the silicon half would suggest. What
# this row asserts is a SEVERITY, and the half that can falsify it is the
# in-scope half above, which is source. A second maintainer row would owe a
# board record for a question no board here is scheduled to answer, and would
# make the reader think the severity waits on silicon when it does not.
discharge_owner = "contributor"
status = "accepted-risk"
out_of_scope_by = "docs/limitations.md#cryptography"
failure_direction = "security, and only through the boundary: if an in-scope observation turns out to be time-resolved, or if an RP2350 SRAM read's cycle count does follow its address, what the pattern exposes is `dP`/`dQ` themselves — a long-lived private key, over four surfaces a host drives at will"

