[[assumption]]
id = "PLAT-THREAT-002"
class = "threat-model"
statement = "A PIN-derived record stays rooted in the public chip serial until its own reference is PRESENTED after the burn. The boot passes move every record sealed under the key base alone; re-keying a PIN-derived one needs the secret, so it happens in `check_pin`'s fallback (`crates/rsk-openpgp/src/pin.rs:277`). PW1 is presented by ordinary use; PW3 gates only the admin surface and may not be presented again after provisioning, and an OpenPGP resetting code may never be. Until then a flash dump plus the public serial opens the DEK copy behind that reference — every OpenPGP private key and the AES key with them — and a PW3 still on its published default needs no search at all. PIV's PUK is the same shape one crate over (`crates/rsk-piv/src/lib.rs:1337`), without a DEK behind it."
discharge = "Three routes, and the smallest one that CLOSES it is the third. (1) The operator: present PW3 once and set the resetting code again after the burn, which is what docs/production.md now says — a cure, not a guarantee. (2) An arm byte in the verifier record, which is cheaper than it sounds: `PIN_FORMAT_V1` is written at `crates/rsk-openpgp/src/pin.rs:775` and read by nothing, so the arm can ride that byte with no length change, and an older build ignores it — but a FOURTH byte would fail `check_pin`'s length test while `verifier_unusable` still called the record usable, which refuses TERMINATE DF's escape hatch. It tells the card what it cannot otherwise know: a verifier is an opaque hash, so a code set before the burn and one set after are indistinguishable. The burn BOOT is not the unknown — `crates/rsk-fido/src/seed.rs:535` already computes it — what stops a deletion there is that it destroys a recovery credential the owner configured. (3) Seal the DEK copies under an outer device-rooted layer that a boot pass can move, as `crates/rsk-oath/src/seal.rs:42` and `crates/rsk-otp/src/seal.rs:55` already do for their key-base-rooted blobs. The verifier stays brute-forceable and becomes worth nothing without the card; a downgrade fails CLOSED, because every reader gates on the format byte (`crates/rsk-openpgp/src/pin.rs:340`). That is a persistent-format change and the maintainer's call."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security in the reading direction: a reader who takes the burn for a completed migration reads the at-rest claim as covering references that have not been presented since"
supports = ["SEC-BOOT-001"]

