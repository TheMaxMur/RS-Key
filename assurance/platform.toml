# ---- The timebase: one route, split in three ---------------------------------
# `PLAT-TIMER-001` carried BOTH halves of its own route until 2026-09-05 — a
# reading of the clock source against the boot configuration, AND a board run
# long enough to cross the counter's wrap — and the second half is 584,542 years
# out, so no world walks it, true or false. That is `PLAT-MEM-001`'s `residue`
# defect and worse in one respect: `residue` at least answers on a different boot
# configuration, and no configuration makes this counter roll over. The reading
# is below and is taken. The only wrap a bounded run can cross is the 32-bit
# ALARM COMPARATOR, and that is a different mechanism against a different
# register, which is why it is `PLAT-TIMER-002` and why that row carries no
# `supports`.
#
# A THIRD ROW, and it repairs the split rather than extending it. `PLAT-TIMER-001`
# kept `supports` over three liveness properties while its own discharge said the
# PROGRESS those three need was unread and unregistered. A discharged row REMOVES
# A CONDITION — docs/platform-assumptions.md says exactly that — so what it
# removed was the RATE, the only thing it establishes, and the condition the
# properties actually rest on was left owned by nothing while the page went on
# showing them covered. `PLAT-TIMER-003` owns progress now and carries the three.
# It walks on PLAT-TIMER-002's recording rather than on a fourth unattended run,
# and the two stay separate claims with separate FAIL signatures — a stall that
# ENDS against one that does not — which both `expected`s say in their own words.
#
# THE CLASSES FOLLOW THE ROUTES, and deliberately rather than to dodge a rule:
# `HARDWARE_CLASSES` in scripts/platform_gate.py is, in its own words, "the
# classes whose discharge is a measurement on silicon, and so must record the
# stepping". This row's discharge is a reading of a dependency pin, a feature set
# and a `ClockConfig`, so it is `build-configuration` and owes no stepping;
# PLAT-TIMER-002's and PLAT-TIMER-003's are both measurements on silicon, so both
# are `timers` and both owe one. The counts move with them, and they are why
# `BOARD_ROW_FLOOR` moved: `board_rows` counted twelve before this split and
# twelve after it and counts thirteen now, and the `timers` class held one row
# before and holds two.

[[assumption]]
id = "PLAT-TIMER-001"
class = "build-configuration"
statement = "The timebase every timeout is measured against is a 1 MHz 64-bit tick count that no run can wrap: `embassy_time::Instant` is a `u64` of ticks, `embassy-rp`'s driver reads RP2350 `TIMER0`'s NATIVE 64-bit counter rather than extending a 32-bit one in software, and the image pins the rate at 1 MHz — so the roll-over the timeout arithmetic would have to survive is 2^64 microseconds, about 584,542 years. That the counter also ADVANCES is a DIFFERENT claim and PLAT-TIMER-003's, not this row's."
discharge = "READ on 2026-09-05, and it is the first half of the route this row used to carry; the second half is PLAT-TIMER-002 because no run walks the one written here. FOUR READINGS AND ONE DIVISION. (1) `embassy_time::Instant` is `ticks: u64` and nothing narrows it. (2) The driver reads the silicon's own 64-bit value: `now()` takes `timerawh`, then `timerawl`, then `timerawh` again and retries while the two high reads disagree, concatenating `(hi as u64) shifted 32 | lo`. That is a TORN-READ guard over a hardware 64-bit counter, not a software roll-over extension — the halves are joined, never accumulated, and the SVD the PAC is generated from marks TIMERAWH and TIMERAWL read-only. The revision is pinned in Cargo.lock: embassy-rp 0.10.0, embassy-time 0.5.1 and embassy-time-driver 0.2.2 all at git rev 6c28443489ad5940ab8c1824c090b1f8a7233bf6. (3) The rate is 1 MHz twice over. firmware/Cargo.toml:13 enables embassy-rp's `time-driver`, whose feature body is `embassy-time-driver?/tick-hz-1_000_000`; no manifest in this tree names a `tick-hz-*` feature of its own — `git grep tick-hz -- '*Cargo.toml'` exits 1 — so the driver crate's own no-feature fallback, `TICK_HZ = 1_000_000`, would give the same answer. firmware/src/presence.rs:137 asserts it at COMPILE time. TWO THINGS ABOUT THAT READING ARE NOT WHAT THEY LOOK LIKE, and both are here because nothing else in the tree says them. The grep is SCOPED because the unscoped one falsifies itself: this sentence used to say that `git grep tick-hz` over the tree answers nothing else, which was true of the tree it was written against and false of the tree it now sits in — three hits, every one of them this row's own prose and the page generated from it. A claim about what the tree contains cannot be spelled so that writing it changes the answer. And the citation to the manifest is INVISIBLE to the citation gate, so that gate's green says nothing about it: scripts/citation_gate.py:556 sets `EXTS` to `rs|sh|txt|py`, and no `.toml` line reference anywhere in this tree is therefore pinned or re-checked. A pre-existing class with other members — assurance/properties.toml:101, assurance/threat_clauses.toml:216-218 and formal/runs.toml:66 among them — which this row names rather than closes; read that line by CONTENT. (4) The boot configuration is the default one: firmware/src/main.rs:524 takes `embassy_rp::config::Config::default()` and edits only the XOSC startup delay, so the clocks are `ClockConfig::crystal(12_000_000)` with `ref_clk` from XOSC at div 1, hence clk_ref 12 MHz, and embassy's RP2350 arm writes `TICKS.timer0_cycles = clk_ref / 1_000_000`, which is 12. THE DIVISION: 2^64 ticks at one per microsecond is 18446744073709.55 s, 213503982.33 days, 584,542.05 years of 365.25 days. The route this row used to demand is refused by arithmetic and not by cost. THREE THINGS THIS DOES NOT SETTLE, and one of them is owned by nothing. The compile-time pin is not on every arm: firmware/src/presence.rs:137 sits under `cfg(all(not(feature = \"no-touch\"), not(feature = \"display\")))`, so the display build and the no-touch builds rest on the feature alone. That the counter ADVANCES is unread here and is PLAT-TIMER-003's, and this sentence read `unregistered anywhere` until that row was opened on 2026-09-05: it was true, and it sat beside a `supports` over three liveness properties that need progress and not rate, which is the defect the third row exists to close. Nothing in this tree's CODE would still notice a stopped tick — no assert, test or proof covers it — and the honest instrument remains a recording of an alarm-driven cadence, since a counter that stopped would freeze that render permanently; what changed is that PLAT-TIMER-003 asserts on it, over the recording PLAT-TIMER-002's run already produces. And the counter is NOT the read-only part an earlier reading of this row took it for: RP2350 TIMER0 at 0x400b0000 exposes TIMEHW and TIMELW as WRITE-ONLY halves of the same 64-bit value (the SVD's own words are `to change time write to timelw before timehw`), beside PAUSE, LOCKED and SOURCE. So the 64-bit wrap is unreachable by a RUN and reachable by a WRITE; what this tree has is no user of any of them, in the firmware or in embassy-rp."
discharge_owner = "contributor"
status = "discharged"
evidence = [
  "Cargo.lock",
  "firmware/Cargo.toml",
  "firmware/src/main.rs",
  "firmware/src/presence.rs",
]
revalidated_by = "Four events, each of which makes the division above false while leaving this row's text true-looking. A DIFFERENT EMBASSY: the embassy-rp / embassy-time / embassy-time-driver revision in Cargo.lock, because the hi/lo/hi read, the `tick-hz-1_000_000` feature body and the no-feature fallback are all that crate family's code and not this tree's. A DIFFERENT TICK RATE: firmware/Cargo.toml's embassy-rp feature list, where dropping `time-driver` or adding any `tick-hz-*` re-points TICK_HZ, together with firmware/src/presence.rs, whose compile-time assert is the only thing that would catch it and catches it on one build arm of three. A DIFFERENT CLOCK: firmware/src/main.rs's `embassy_rp::config::Config::default()`, since a ClockConfig whose clk_ref is not an integer multiple of 1 MHz turns `TICKS.timer0_cycles` into a truncating division and the tick stops being a microsecond. And A FIRMWARE THAT WRITES THE TIMER: any use of TIMER0's TIMEHW, TIMELW, PAUSE or SOURCE puts the counter under software control — the one thing that would let a bounded run reach the 64-bit wrap, and the one thing IN SOFTWARE that would let the count stop; the ways it can stop with no software touching it — a dead XOSC, a TICKS block that quits — are PLAT-TIMER-003's and no trigger list reaches them. THAT FOURTH TRIGGER HAS NO MECHANICAL FORM, and it is written down here rather than left for a reader to assume it has one. `revalidation_inputs` reads this field for in-tree paths and that sentence names none, so nothing in the freshness axis moves for it. MEASURED on 2026-09-05, both directions: a TIMER0 write committed into the LED module — a firmware source file this row does not list — left this row FRESH, the platform gate at exit 0 and the generated page byte-identical, while the same edit committed against firmware/src/main.rs, which the third trigger DOES name, flipped it STALE, listed that file under `Behind` and reddened the gate. So the first three triggers are checked and