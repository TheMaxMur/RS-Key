evidence_commit = "4f2b659ca6a96ba85bd84dc14355d8508e3c616b"
failure_direction = "split, and it is the split this row has always carried, now scoped to the rate: a tick that is not a microsecond scales every window by one factor — 12x if the TICK divisor is read off the wrong clk_ref — so slow turns each timeout into a wedge (availability) and fast retires a live grant early (usability). Neither direction opens a gate, which is why this is not a security row"
