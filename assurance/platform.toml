status = "pending"
failure_direction = "security: a FID changing sides across a firmware upgrade reads absent on the new build while its old value stays live in the other ring — a rollback on a counter, and on a gate record an absent read is what opens the gate"
covers = ["backend:rsk-store/partition-routing"]
supports = ["SEC-STORE-002"]
