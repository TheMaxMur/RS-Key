class = "model-abstraction"
statement = "`EF_MINPINLEN`'s `forceChangePin` byte IS a gate: `clientpin.rs` refuses `getPinToken` with `PinInvalid` and both permissions-based doors with `PinPolicyViolation` when it is set, AFTER the PIN has verified. `PinAttemptEnabled` and `PinAttemptPolicy` carried three conjuncts where the code has four, so a defect that waives the pending change was a live token the model could not see — and one has shipped (bcd 0x09AE)."
discharge = "Modelled, and THREE of the four sentences the route this replaces wrote were wrong — each found by review, none by a gate. `gate.forceChange` is set by ConfigOp (config.rs:483 refuses it without a PIN) and cleared by changePIN. It is NOT cleared by setPIN: `store_new_pin` (clientpin.rs:945-969) touches no EF_MINPINLEN byte, and the route's `cleared by both PIN writes (store_new_pin, clientpin.rs:1260)` was wrong twice over — :1260 is inside `store_local_pin`, the panel flow, which this module has no action for. Setting the flag also ENDS the session token and the persistent grant (config.rs:500-503); the first model had them `UNCHANGED`, which is the shipped tree carrying its own defect at the third of three sibling sites. The route also promised the code twin `already exists in the suite`; it did not, and was built here (formal/comutants.toml [BugForceChangeIgnored], phase2_count 30 -> 31) and killed. What held: `BugForceChangeIgnored` drops the guard and goes RED on `NoAuthorizationBypass` at depth 8 in both configurations, and the counterexample is a token ISSUED over a standing gate, not a refusal wearing another code. `ForceChange.cfg` is GREEN, and its states, distinct count and depth are the results table's to print — this row names the configuration and not the numbers, because a hand-typed copy of a generated count is the one thing this registry cannot keep true."
discharge_owner = "contributor"
status = "discharged"
evidence = ["formal/RSKeySecurityState.tla", "formal/ForceChange.cfg", "formal/comutants.toml"]
revalidated_by = "a new reader or writer of EF_MINPINLEN[1]: the model carries the flag at the two get_pin_token doors, the changePIN clear and the reset sweep, and `git grep -n 'force_change_pending\\|clear_force_change' -- crates` is the list it is held to — a fourth site, or a second clear, unsettles it"
