[[assumption]]
id = "PLAT-TOOL-003"
class = "tool-tcb"
statement = "Kani/CBMC is sound for the arithmetic its harnesses bound, and the solver that ran is the pinned one."
discharge = "Not the recorded identity, which is what an earlier reading of this row proposed and what re-measuring it refutes. This row's STATEMENT is a conjunction — `Kani/CBMC is sound for the arithmetic its harnesses bound` AND `the solver that ran is the pinned one` — and an identity record settles the second conjunct only. The precedent is measured, not argued: the sibling row PLAT-TOOL-004 already HAS the identity half whole — tlaplus 1.7.4 pinned by flake.lock, `formal/run-tlc.sh` recording the jar's sha256 prefix — and is still `pending`, because in its own words what is not dischargeable by any of that is the soundness of the checker itself. Flipping this row on an identity record would leave the two tool-TCB rows answering differently about the same shape of claim, so it stays pending and this field records why. WHAT WAS MEASURED, on the maintainer's machine, with the commands: `ls ~/.kani/` → one bundle, `kani-0.67.0`; `~/.kani/kani-0.67.0/bin/cbmc --version` → `6.8.0 (cbmc-6.8.0)`, and the banner a run prints is `CBMC version 6.8.0 (cbmc-6.8.0) 64-bit arm64 macos`; `bin/kissat --version` → `4.0.1`; `strings bin/cbmc`, grepped for `^cadical-`, → `cadical-2.0.0`, the back end `--sat-solver cadical` selects; `cat rust-toolchain-version` → `nightly-2025-11-21-aarch64-apple-darwin`; `cat rustc-version` → `rustc 1.93.0-nightly (53732d5e0 2025-11-20)`. `bin/` ships cbmc, goto-analyzer, goto-cc, goto-instrument and kissat as PREBUILT binaries and `toolchain` as a symlink into ~/.rustup. TWO CLAIMS THIS FIELD CARRIED ARE CORRECTED RATHER THAN DELETED. `kissat` appearing nowhere in the repository is false: `grep -rI kissat` answers five files, of which three are assurance/bundle/SEC-FIDO-001.toml:258, SEC-FIDO-002.toml:344 and SEC-FIDO-003.toml:338, each writing `beside kissat 4.0.1` in the cbmc row's `provenance`. And the three bundles no longer disagree: every `[[tool]] name = \"cbmc\"` row now carries one reconciled `version` measured off the install, where SEC-FIDO-001.toml:257 wrote `the one cargo-kani 0.67.0 ships; CaDiCaL 2.0.0 as the SAT back end`, SEC-FIDO-003.toml:337 the same sentence with the SAT version dropped, and SEC-FIDO-002.toml:343 the CBMC banner naming no SAT back end at all. Of the three, `CaDiCaL 2.0.0` was the only claim checkable off the binary, and it checks out. THE VERSION HALF is pinned and now held twice: `KANI_VERSION: \"0.67.0\"` at .github/workflows/ci.yml:155, .github/workflows/deep-checks.yml:354 and :446, against the line docs/testing.md:307 tells a reader to run. The caveat this field used to carry — that scripts/kani_gate.py read only deep-checks.yml, so an edit to ci.yml:155 alone was invisible — is CLOSED: scripts/kani_gate.py:389-409 reads every workflow's `env:` block and scripts/kani_gate.py:697-708 refuses a disagreement, and assurance/toolchain.toml's `cargo-kani` row holds the same three literals against a `pin`. Measured both ways: moving ci.yml:155 alone is rc=1 at both rows, and with the disagreement clause deleted alone it is rc=0 again. WHAT WOULD SETTLE THE IDENTITY HALF, and why it is not a sentence in this file: a hash of the fetched bundle, recorded where a gate RE-READS it. assurance/toolchain.toml's `cbmc` row stays `unpinned` for a reason this measurement does not move — `cargo kani setup` fetches the bundle into ~/.kani/, outside the tree, so no file here is one a `provenance` could open, and a hash whose only source is the moment somebody typed it is what that registry's own header refuses. Recording today's five strings as a `pin` would be exactly that. HERMETICITY IS DELIBERATELY NOT PART OF THIS ROW: `cbmc` and `kissat` are prebuilt binaries inside the fetched bundle, not built by the `cargo install` a flake input would replace, so packaging cargo-kani would not settle it either. Making the shell hermetic is a real and separate obligation and belongs to whichever row states one. The SOUNDNESS half is not settleable here at all, which is why this row, like PLAT-T