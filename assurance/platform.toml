[[assumption]]
id = "PLAT-TIMER-002"
class = "timers"
statement = "The 32-bit alarm comparator survives its own wrap. `embassy-rp` arms `TIMER0.ALARM0` with the LOW 32 bits of a deadline — `TIMER.alarm(n).write_value(timestamp as u32)` — so once per 2^32 microseconds, 71 min 35 s, the value armed is numerically BELOW the counter's running low half and the match can only arrive after that half has wrapped. What makes the truncation safe is that it is paired with a full 64-bit re-read: `check_alarm` compares the stored `u64` deadline against `now()` before it wakes anything. This firmware arms a short alarm continuously — 2 ms or 5 ms in the LED render, 16 ms in the worker — so exactly one such truncated arm straddles every crossing, and a bounded run reaches it without arranging anything."
discharge = "A board run long enough to cross the COMPARATOR's wrap, which is the only wrap a bounded run can cross — the 64-bit counter's is 584,542 years out, and that is PLAT-TIMER-001. THE SPECIFICATION IS THE DRIVER'S OWN COMMENT, at the `TIMER.alarm(n).write_value(timestamp as u32)` in `set_alarm`: `Note that we're not checking the high bits at all. This means the irq may fire early if the alarm is more than 72 minutes (2^32 us) in the future. This is OK, since on irq fire it is checked if the alarm time has passed.` — and `check_alarm`'s else arm: `Not elapsed, arm it again. This can happen if it was set more than 2^32 us in the future.` `72 minutes` is that comment's rounding; the register is 2^32 microseconds, 4294.967296 s, 71 min 34.97 s, and the run has to be timed against the exact figure and not the rounded one. THE RUN, in assurance/board/PLAT-TIMER-002.toml: a DEFAULT-image board powered and LEFT ALONE for two full periods, with its LED recorded. Two things about it are the opposite of what the first version of this record asked for, and both were measured rather than argued. Its observable is BOARD-SCOPED: firmware/src/led.rs:618 and firmware/src/led.rs:692 re-arm a 5 ms and a 2 ms alarm for as long as the board has power, needing no host and no finger, and one of them — or firmware/src/worker.rs:307's 16 ms button poll — is the earliest deadline in the queue at every instant, so the arm that straddles each crossing is one of them. And the run is QUIET: a CTAPHID or CCID request arms a fresh short alarm as it lands (crates/rsk-usb/src/ctaphid.rs:775, crates/rsk-usb/src/ccid.rs:408), which re-arms the comparator and repairs a missed match in microseconds, so wire traffic MASKS this defect instead of producing it — and the keepalives the first version wanted flowing are inside those per-request loops, so an idle board makes none of them anyway. ONE PERIOD IS WHAT GUARANTEES A CROSSING, not two: a run of length L from phase p crosses iff L > 2^32 - p, so the worst phase costs one period. The second period is there because the first crossing lands at most one period in, so two leave a full period AFTER it — and the failure below is a stall of up to a whole period, which a run ending at the crossing could not tell from a run that stopped. WHAT THE RUN DOES NOT REACH, said here because a PASS read as covering it would be read wrong: `check_alarm`'s else arm — `Not elapsed, arm it again` — runs only when the IRQ fires while the stored deadline is still in the future, which needs a deadline at least 2^32 microseconds out. The longest alarm anything in this tree schedules is 600 ms, and the only deadline that far out is the `u64::MAX` the queue's `next_expiration` returns when nothing is pending — which this firmware never produces, because the LED render and the worker keep the queue populated. So a PASS here is compatible with that arm being wholly broken; its route is a driver-level test or a firmware that arms a long alarm, and not a board run. WHAT IT DOES NOT SERVE, said here because the row it was split out of claimed it and could not: NOT SEC-FIDO-L01, L02 or L03, and this row carries no `supports` for that reason. They are PLAT-TIMER-003's, which reads THIS row's recording for a different question — whether the counter advances at all — so the recording is shared and the claims are not. A stall of the order of one period that ENDS is this row's FAIL and that row's PASS, since only a running counter brings the armed value round again; a series that stops and never resumes is that row's FAIL and leaves this one INCONCLUSIVE, since a comparator whose counter is dead can be observed neither to miss a match nor to make one; and only a freeze beginning less than a period before the recording ends is inconclusive for both, which is the second reason the run is two periods and not one. The presence window is a busy poll — crates/rsk-device/src/presence.rs:215 compares `board.now_us().wrapping_sub(start)` against the timeout and spaces its polls with `block_for`, which spins on `Instant::now()` and arms no alarm at all — so it is wrap-immune by construction and the comparator is not in it. The pinUvAuthToken and stateful-walk windows are `saturating_sub` over a `u64` millisecond count, checked when a command ARRIVES rather than by a timer, and the longest window the firmware ever measures is crates/rsk-fido/src/consts.rs:392's `PUAT_MAX_USAGE_PERIOD_MS` at 600000 ms — 7.16 times SHORTER than the wrap this row is about. This row tests the comparator, not `Instant`."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "availability, and at most once per 71 min 35 s of uptime: a deadline armed across the comparator's wrap that is missed is not late by a millisecond but by up to a whole further period, and `set_alarm` uses ONE alarm channel for the whole queue, so what stalls is every timer on the device at once — the LED render whose period is firmware/src/led.rs:692, the worker's button poll, and any transport timeout in flight. Nothing opens: the operation wedges rather than completes, which is the same direction PLAT-TIMER-001 names and the reason neither is a security row"
# The comparator can be observed to miss or to make a match only while the
# counter is still moving, which is the other row's whole content — the shape
# PLAT-ROM-001 already uses for a measurement that needs another one first.
depends_on = ["PLAT-TIMER-003"]

[[assumption]]
id = "PLAT-TIMER-003"
class = "timers"
statement = "The timebase ADVANCES: RP2350 `TIMER0`'s counter keeps counting for as long as the board has power, so every deadline armed against it is eventually reached and every spin on `Instant::now()` eventually ends. This is the condition the three liveness properties rest on and PLAT-TIMER-001's RATE reading is not: `EveryOpQuiesces`, `EveryWaitReleases` and `EveryWalkCloses` are EVENTUALLY claims, so a tick twelve times slow still releases every wait and closes every walk twelve times later, and only a tick that STOPS falsifies them. Nothing in this tree asserts it — firmware/src/presence.rs:137 pins the RATE at compile time and on one build arm of three, and no assert, test or proof anywhere covers progress."
discharge = "PLAT-TIMER-002'S RECORDING, READ FOR A DIFFERENT QUESTION, and shared deliberately rather than thriftily: the alternative is a second unattended two-hour run producing the same series. THE INSTRUMENT, AND WHY IT WITNESSES PROGRESS — per backend, because the first version of this sentence gave one mechanism to three and only one of them has it. What all three share is the STEP: each advances one step per `Timer` await and per nothing else — firmware/src/led.rs:618 (ws2812, the default), firmware/src/led.rs:727 (pimoroni) and firmware/src/led.rs:692 (the gpio soft-PWM's 2 ms period). WHAT DIFFERS IS WHAT THE STEP PAINTS. Only ws2812's frame is a function of the loop's own counter: firmware/src/led.rs:589 declares it, firmware/src/led.rs:596 advances it once per await, firmware/src/led.rs:607 is the only thing that reads it, and firmware/src/led.rs:536's `effect_sparkle` re-rolls it every eight steps. GPIO AND PIMORONI TAKE THEIRS FROM THE CLOCK: both call `Blinker::tick` (firmware/src/led.rs:353) — at firmware/src/led.rs:695 and firmware/src/led.rs:719 — which compares `Instant::now()` against a stored phase end at firmware/src/led.rs:361 and flips the phase when it is reached. THE CONCLUSION SURVIVES THE CORRECTION, and twice over rather than by luck: a stopped counter never returns the await, so no backend takes a step at all; and a clock-driven frame that somehow did step would read a frozen `Instant::now()` and paint the same colour anyway. So on all three a frame that CHANGES is a witness that the await returned, and an await returns only when the counter reached the value `set_alarm` armed; a stopped counter holds the last frame for ever and nothing on the device repairs it. THE CHAIN, named so that a reader can see what produces the observable and what reads it: XOSC at 12 MHz drives clk_ref, which firmware/src/main.rs:524's default `ClockConfig` selects; clk_ref drives the TICKS block embassy enables with `timer0_cycles` = 12; that block increments TIMER0's counter once per microsecond; the counter reaches ALARM0; `TIMER0_IRQ_0` runs `check_alarm`; the queue wakes the render task spawned at firmware/src/main.rs:1025, firmware/src/main.rs:963 or firmware/src/main.rs:971; the task writes a frame; and a camera or a photodiode is what reads it. No host, no finger and no command appears anywhere in that chain. WHY NO READING DOES IT, and the trait contract is the part that surprises: `Driver::now`'s own documentation promises monotonic in the sense of `a greater or equal value than earlier calls`, which a stopped counter satisfies exactly — the contract does not contain this claim, so reading it cannot establish it. The hardware guarantee is a datasheet clause about the very silicon a run would be taken on. And the last in-tree reading — that no code writes TIMER0's PAUSE, SOURCE, LOCKED or the write-only TIMEHW/TIMELW halves, in this firmware or in embassy-rp — already sits inside PLAT-TIMER-001, and it is a reading of what the image does NOT do, which cannot establish what the silicon DOES. Of those four only PAUSE stops the count: SOURCE swaps the tick for clk_sys cycles, which is a RATE change and PLAT-TIMER-001's axis, and LOCKED only freezes write access. What no reading reaches at all is the clock underneath — a dead XOSC, or a TICKS block that quits, leaves every register this tree can name unwritten and the counter still. WHAT THE SHARED RECORDING SETTLES HERE AND NOT THERE, because two rows on one recording is where a reader stops telling them apart: this row reads the series for a stall that NEVER ENDS, PLAT-TIMER-002 for a stall of the order of one period that DOES end, and the verdicts do not move together. A stall that resumes is this row's PASS and that row's FAIL. A series that stops and never resumes is this row's FAIL and leaves that row INCONCLUSIVE rather than joining it. The one arm they share is a freeze beginning less than a period before the recording ends, inconclusive for both, and assurance/board/PLAT-TIMER-003.toml makes it a condition on the reading rather than only on the length."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "split, and the security half is the one PLAT-TIMER-002 does not have. A stopped counter WEDGES everything that awaits a `Timer` — the LED render, the worker's 16 ms button poll (firmware/src/worker.rs:307), and any open presence wait, whose crates/rsk-device/src/presence.rs:215 busy poll then compares a frozen `now_us` against its timeout for ever — and that is availability, the comparator's direction. But the windows measured on command ARRIVAL do not wedge, they stop counting: the pinUvAuthToken's rolling and absolute caps are `saturating_sub` over a millisecond count that no longer grows, so a grant minted before the stop never retires, while the USB stack, which is interrupt-driven rather than timer-driven, goes on answering. A live grant that outlives its cap is security, and silently. Not an ambiguity but a rule: what AWAITS a timer wedges, what SUBTRACTS two clock readings freezes open"
# A clk_ref under 1 MHz STOPS this tick rather than slowing it: embassy-rp writes
# `timer0_cycles = clk_ref_freq / 1_000_000`, an INTEGER division, so `the divisor
# is 12 and not 0` is PLAT-TIMER-001's reading and a precondition of this claim.
depends_on = ["PLAT-TIMER-001"]
# MOVED here from PLAT-TIMER-001 on 2026-09-05, and it is the whole reason this
# row exists. Each of the three is an EVENTUALLY claim, so none of them is
# decided by the rate that row reads and every one of them is falsified by a
# tick that stops. `supports` means the properties that REST on this assumption,
# the way PLAT-TRNG-002's does, and not the ones it establishes: this row is
# `pending`, so what the three have gained is an owner and a route, not evidence.
# It read `PLAT-TRNG-001's` until 2026-09-05, when the TRNG split moved that row's
# `supports` off it and left this sentence pointing at a row with none — the same
# rot this file keeps recording, one file over and inside the comment that defines
# the word.
supports = ["SEC-FIDO-L01", "SEC-FIDO-L02", "SEC-FIDO-L03"]

