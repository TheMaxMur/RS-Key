#
# Which secrets this device holds in RAM, and which of a request's exits each one
# is wiped on. `docs/threat-model.md`'s Zeroization clause has claimed since it
# was written that key-grade material is wiped "when its use ends: session state
# and PIN/UV tokens on drop, transient key copies at end of scope including error
# paths, and the transport/exchange buffers as soon as a message completes". No
# inventory stood behind that sentence. There was no list of which secrets it is
# about, no statement of which exit each wipe is on, and no record at all of the
# one exit where nothing runs: this firmware links `panic-halt`, so a panic spins
# with no unwinding, no destructor and every secret in the frame resident.
#
# NOT a roster. `scripts/secrets_gate.py` derives which sources carry key-grade
# material, how many wipes each has, how many of those sit below an early exit of
# their own function, which types wipe themselves on drop, whether the source can
# observe a cancel at all, and which scrubs the reboot path calls. What is stored
# here is only what a script cannot decide: what the secret IS, which exits its
# wipe is on, and why the ones it is not on are allowed to be.
#
# SCOPE is the device image — `crates/` and `firmware/`. `tools/` is out because
# the exits below are the device's: a halt that runs no destructor, a reboot that
# clears SRAM, a dispatch a cancel cannot unwind. A host process has none of
# those, and a row for one would answer questions that are not about it. The
# exclusion is stated rather than silent: `out_of_scope_sites` is derived too, so
# a new host secret shows up as a number that moved.
#
# EXITS. Four are answered per row; the fifth is derived once for all of them.
#
#   success   the request completed and the answer went out
#   error     the request returned an error, including every `?` on the way
#   cancel    the entry was declined or a CTAPHID_CANCEL arrived. Only the
#             sources that take a PIN entry or read a cancel frame observe one —
#             the worker's dispatch is synchronous, and a cancel sets a flag
#             rather than unwinding an applet — so `n/a` here is DERIVED, and a
#             source that starts taking a PIN entry stops being allowed to say it
#   reboot    the secure-reboot / BOOTSEL drop, where `worker::reboot` runs its
#             scrubs and then the platform clears SRAM
#   panic     NOT a field. It is one fact about every row at once and is derived
#             from the panic strategy; `RES-PANIC-HALT` below is what it owes
#
# ANSWERS.
#
#   explicit   a `.zeroize()` in this source runs on that exit. On `error` and
#              `cancel` this is only allowed where NO wipe sits below an early
#              exit of its own function, which is counted per row
#   on-drop    a type defined here wipes itself when it drops, so the exit is
#              covered by construction. Same restriction on the two early exits
#   partial    at least one of the source's wipes sits BELOW an early exit of its
#              own function, so that exit is not covered. The count is in
#              `skippable`, and the row owes `RES-ERROR-EARLY-EXIT`
#   wiper      `worker::reboot` calls a scrub that reaches this secret. Which
#              scrubs those are is derived from its body into `reboot_wipers`;
#              the row NAMES the one it means in `wiper` and repeats it in the
#              reason, so deleting that scrub reddens this row by name
#   platform   nothing in this source runs on the reboot; what covers it is the
#              SRAM clear, registered as `PLAT-MEM-001` and DISCHARGED on a
#              board — the platform's clear, never a wipe of ours, and only for
#              the silicon and boot configuration it names — `RES-SRAM-CLEAR`
#   not-wiped  the secret is resident on that exit. A finding, or a residual
#   n/a        the exit cannot occur for this secret
#
# `sites`, `skippable`, `wraps` and `bearers` are DERIVED and held against the
# tree in both directions. Nothing here is read for truth: a wipe deleted from a source
# moves its count and reddens its row, and a source that starts holding a secret
# arrives with no row at all. A hand-written count in a register is the defect
# this programme keeps finding — `assurance/crates.toml`'s header records two
# roadmap drafts enumerating crates from memory and missing four.
#
# What no rule here can say. First, and bluntly: this is a roster of WIPES, not
# of secrets. A source earns a row by wiping, wrapping, or defining a self-wiping
# type, so a source that unseals a key and never touches it again has no row and
# owes no answer — the shape a secret inventory would most like to catch is the
# one the derivation is blind to. Second, whether a wipe is REACHED: `skippable`
# is syntax, not control flow — `clientpin`'s `perform_builtin_uv` returns on
# four entry outcomes without touching `pin`, and the caller that owns that
# buffer wipes it on all four — so the number bounds the question rather than
# answering it. Third, whether the compiler kept the write: `RES-COMPILER-ELIDES`
# carries that half, which is a disassembly question and not a source-reading one.

# The threat clause the whole register sources to. It served no registered
# property when this file was written and it still serves none — the threat
# gate's tally counts `assurance/properties.toml` rows, and these are not
# properties. What has changed is that the clause is no longer behind nothing:
# every row below is an answer to one of its sentences, and the gate holds that
# the clause is really declared and is really a defence.
clause = "docs/threat-model.md#TM-ZEROIZATION"

# DERIVED from `worker::reboot`'s body, in call order. A wipe dropped from the
# reboot path is then a finding rather than an edit — which is not hypothetical:
# audit run-34 #23 is the last time one was missing from it.
reboot_wipers = [
    "ctap.scrub_secrets",
    "ccid.scrub",
    "rng.borrow_mut().scrub",
    "otp_kbd::scrub",
    "core1::scrub",
]

# DERIVED over `tools/`, so the scope note above cannot quietly stop being true.
out_of_scope_sites = 11

# ---------------------------------------------------------------------------
# Residuals
# ---------------------------------------------------------------------------

[[residual]]
id = "RES-PANIC-HALT"
applies = "register"
paths = ["panic"]
what = """
Every secret live in a frame at the moment of a panic: PIN buffers, unsealed \
private keys, the device seed, the DRBG state, and both fused keys if the panic \
lands inside the one operation that reads them."""
why = """
`firmware/Cargo.toml` links `panic-halt` and `firmware/src` defines no \
`#[panic_handler]` of its own, so a panic spins in place: nothing unwinds, no \
`Drop` runs, and no explicit wipe below the panic point runs either. Every \
`on-drop` and `explicit` answer in this file is therefore an answer about the \
four other exits and none of them is about this one. Halting is the right \
behaviour — a `no_std` unwinder is not on the table, and a handler that walked \
RAM looking for secrets would be a larger attack surface than the one it \
closes — but the threat model stated the wipes without stating this exception, \
and an unstated exception is the shape this programme was set up to find. What \
bounds the exposure is that a panic is not a host-reachable state: the fuzz \
targets exist to keep it that way, and `docs/threat-model.md` already treats a \
panic-halt as a denial of service rather than a disclosure. What it does not \
bound is a panic reached with a key unsealed, where the secret stays in SRAM \
until the next power cycle."""
revalidate = """
A `#[panic_handler]` appearing under `firmware/src`, or `panic-halt` leaving \
`firmware/Cargo.toml` — the gate derives both and goes red on either, because a \
handler that could wipe makes every row's exits worth re-reading. Also: any \
change that makes a panic reachable from unauthenticated input, which would \
move this from a residual to a finding."""

[[residual]]
id = "RES-COMPILER-ELIDES"
applies = "register"
paths = ["success", "error", "cancel"]
what = """
Whatever the optimiser deleted. Every `explicit` and `on-drop` answer here is \
read out of the SOURCE; none of it is read out of the ELF."""
why = """
`zeroize` writes through `write_volatile` and fences after it, which is what \
makes the crate's wipes survive optimisation, so the ordinary case is sound by \
construction. What is not covered is the copies the compiler made and this \
register never names: a spilled register, an inlined `memcpy` staging buffer, a \
return slot. Those are unnameable in source, and the only instrument that could \
see them is a disassembly of the shipped image."""
revalidate = """
A toolchain bump, an opt-level or LTO change in `firmware/Cargo.toml`'s release \
profile, or a switch to a non-volatile wipe. `scripts/elf_gate.py` is where an \
image-level check would live if one is written; nothing reads the ELF for this \
today."""

[[residual]]
id = "RES-ERROR-EARLY-EXIT"
applies = "rows"
paths = ["error", "cancel"]
what = """
The wipes that sit below an early exit of their own function — 300 of the 446 \
in scope, spread over 43 of the 57 sources. On a `?` that fires above one, that \
wipe does not run."""
why = """
The threat model says transient key copies are wiped at end of scope "including \
error paths", and that sentence was never held against anything. It is not \
refuted by the count either: the number is SYNTAX, and three shapes make it \
overcount. The `?` can be in a branch the wipe is not under; the buffer can be \
owned by a caller that wipes it whatever this function returns \
(`clientpin`'s `perform_builtin_uv` returns on four entry outcomes without \
touching `pin`, and `builtin_uv` above it wipes on all four); and a value \
carried in a `Zeroizing` or a self-wiping type is wiped by the early return \
itself. What the count does establish is that the claim is not free — it holds \
per statement, and no artifact in this tree has yet checked it per statement."""
revalidate = """
The count moving in either direction is held by the gate per row. Closing this \
means a per-statement analysis — reachability of each wipe from each early exit \
— which is stage 9D's open half and is not attempted here."""

[[residual]]
id = "RES-SRAM-CLEAR"
applies = "rows"
paths = ["reboot"]
what = """
Every secret still in a stack frame, a static, or a heap allocation when the \
device reboots or drops to BOOTSEL, on all the rows whose reboot answer is \
`platform` rather than a named scrub."""
why = """
`worker::reboot` wipes the live transports, the FIDO state, the DRBG, the OTP \
keyboard buffers and core1's mailbox, and then nothing in software touches the \
stacks — which carry the deepest secrets, RSA primes and EC scalars. What is \
supposed to cover them is the platform clearing main SRAM across the drop, and \
that is registered as `PLAT-MEM-001`, whose status is now **discharged**: the \
2026-09-03 run of `tests/54_sram_residue.py` is on the record with the sha256 of \
the image it ran on, and it is read against an `expected` committed before the \
board was powered. So the reboot answer for 48 of the 57 rows rests on a \
measurement rather than on an open assumption — and on a PLATFORM measurement, \
which is the whole of what these rows may claim from it: the silicon cleared \
that memory, `worker::reboot` did not, and a dump that is zero everywhere cannot \
tell those two apart. The `control` half is what was taken; the `residue` half, \
which is the one that would measure a scrub, is unsatisfiable on a board that \
clears SRAM and is owed on a configuration that does not."""
revalidate = """
`PLAT-MEM-001` moving again — the discharging run has happened and turned this \
from an open assumption into a platform measurement, and a refuting one would \
turn 47 rows from `platform` into `not-wiped`. Also an RP2350 stepping other than A4, \
secure boot turned on, any change to the boot configuration, or a reboot route \
other than `reset_to_usb_boot` / `SCB::sys_reset`: each invalidates the run that \
discharged it. This is the register that names which rows depend on it."""

[[residual]]
id = "RES-LIBRARY-TEMPORARIES"
applies = "rows"
paths = ["success", "error", "cancel"]
what = """
The copies inside dependencies that no wipe in this tree can reach: `Copy` \
temporaries in the RustCrypto curve arithmetic, digest internals, and the heap \
limbs `num-bigint-dig` allocates for itself."""
why = """
The threat model accepts these three by name and this register does not \
re-litigate them; what it adds is WHICH rows they are about, which was not \
recorded anywhere. `num-bigint-dig` has no scrubbing `Drop` of its own — every \
value `rsk-rsa` owns rides in a `Zeroizing`, and a temporary the library \
allocates internally does not — and it is the only allocating dependency the \
device links, so it is also the only place an allocator can hand a freed secret \
to the next caller. Short-lived, library-internal, not wipeable without forking \
the crates."""
revalidate = """
A new dependency doing key-grade arithmetic, a RustCrypto or `num-bigint-dig` \
major bump, or any of the three gaining a zeroizing `Drop` upstream — the last \
would let a row upgrade its answer instead of citing this."""

[[residual]]
id = "RES-CORE1-SIEVE"
applies = "rows"
paths = ["reboot"]
what = """
`CORE1_SIEVE`, the static small-prime sieve core1 owns, when core1 is wedged. \
It carries the candidate stream of a live RSA keygen."""
why = """
The two sieves are single-core-exclusive by construction — each `&mut` lives on \
exactly one core — so `core1::scrub` cannot clear core1's from core0 without \
aliasing a live reference across cores. It asks core1 to wind down and waits, \
bounded; a core1 that never answers is faulted, which is what latches \
`DEGRADED`, and its sieve stays resident. Audit run-34 #23 is where this was \
found and the bounded wait is the fix that came out of it. The residue is a \
sieve state, not a prime: the mailbox's found primes and the job seed ARE \
cleared from core0, which is what `scrub_found` and `scrub_job` are for."""
revalidate = """
Any change to the sieve ownership rule in `firmware/src/core1.rs`, to \
`SCRUB_WAIT_ITERS`, or to what latches `DEGRADED`. Also `RES-SRAM-CLEAR`'s own \
trigger: the SRAM clear is what covers this residue today, so a stepping that \
stops clearing SRAM turns it from a window into a persistent one."""

