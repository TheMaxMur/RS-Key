[[secret]]
file = "crates/rsk-crypto/src/drbg.rs"
secret = "the HMAC-DRBG key and V — the keystream behind every nonce, blinding factor and generated key on the device"
bearers = ["HmacDrbg"]
sites = 4
skippable = 0
wraps = 0
success = "explicit"
error = "on-drop"
cancel = "n/a"
reboot = "wiper"
wiper = "rng.borrow_mut().scrub"
residual = []
why = "`scrub` and the `Drop` impl wipe the same two fields, so a DRBG that goes out of scope on any non-panic path takes its state with it. The reboot path reaches it through `rng.borrow_mut().scrub`, which only destroys the current session's keystream — the next boot reseeds from the TRNG."

