#
# What the linked DEFAULT image may contain, for `scripts/elf_gate.py`.
# HAND-WRITTEN FIELDS ONLY: which ELF, which sections may be writable AND
# executable, which allocator symbols the image is allowed to define, and which
# section carries the vector table. Where the segments land, whether they fit the
# `firmware/memory.x` regions, whether any of them overlaps the KV store and what
# the image actually links are DERIVED and printed, never stored.
#
# Scope, said here rather than discovered later: the DEFAULT profile only.
# `scripts/check.sh` rebuilds this path three more times below the row — 16 MB,
# display, no-touch — so a second profile needs its own build and its own row,
# and the four `no-touch` images are the ones that remove the physical consent
# gate the P0-launch authorization properties are about. That is a named gap.

[image]
profile = "default"
elf = "target/thumbv8m.main-none-eabihf/release/firmware"

# `.data` is writable AND executable on purpose: it carries the routines that
# must not run from XIP flash. Moving only `SMALL_PRIMES` there once made keygen
# 1.36x SLOWER — `IncrementalSieve::step` has to come with it — and the RSA
# assembly is in the same position. The rule is therefore "exactly this one", not
# "none": a second W+X segment is a page whoever can write RAM can also run.
writable_executable = [".data"]

# The image HAS a heap. `firmware/src/main.rs` declares
# `#[global_allocator] static HEAP: ZeroingHeap` over 128 KiB — `LlffHeap` behind
# a wrapper that wipes each block as it is freed — and docs/unsafe.md site 4 is
# its initialisation, sites 5–9 the wrapper. AGENTS.md's "no_std, no alloc" is
# a rule about new code, not a description of the tree, and until this row
# nothing held the surface: a second allocator or a `malloc` arriving through a
# dependency was invisible. `__rust_dealloc` is not on the list, and its absence
# says nothing about frees: the shim is emitted only where the inliner keeps it.
# The first, byte-wise wrapper kept one; the word-wise wrapper is called from its
# 148 call sites directly, as the bare `LlffHeap` was before either.
allocator = ["__rust_alloc", "__rust_realloc", "__rust_alloc_error_handler"]

vector_section = ".vector_table"

# Every compiler whose output is IN the image, read out of the image's own DWARF
# (`DW_AT_producer`, one per compile unit) and not out of `rustc -vV`, which
# names the compiler on the PATH — the one that WOULD build it. Measured on this
# profile at `9cafee7`: 165 compile units, 164 from the pinned rustc and ONE from
# a 2021 nightly, the prebuilt `cortex-m` `asm/lib.rs` blob that ships as an
# object and is never recompiled. `scripts/ct_gate.py` publishes the MAJORITY
# producer as "built by" and claimed the set was held here while nothing held it,
# so a third compiler could arrive through a dependency and be invisible to both.
#
# A rustc bump moves this list, deliberately: the toolchain the image was built
# by is a fact worth re-reading, and the pin moving without this moving is the
# case that would otherwise be silent.
producers = [
    "clang LLVM (rustc version 1.96.0 (ac68faa20 2026-05-25))",
    "clang LLVM (rustc version 1.59.0-nightly (c5ecc1570 2021-12-15))",
]
note = "The partition table fences the KV store from BOOTSEL; nothing fenced it from the linker, which is the overlap rule here."
