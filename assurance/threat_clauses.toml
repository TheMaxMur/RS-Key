#
# Which threat each registered property is against. `docs/threat-model.md` is the
# root of the evidence chain every assurance claim here hangs from, and it was
# cited by exactly one word — the file name — on 33 rows of
# `assurance/properties.toml`. "This property is against the threat model" names
# no threat: a property with no clause behind it is either mis-scoped or
# unnecessary, and neither was visible.
#
# A CLAUSE is one addressable unit of that page: any heading, or any list item.
# That set is DERIVED by `scripts/threat_gate.py` straight from the markdown,
# and this file must name every unit exactly once — so a new bullet arrives as a
# clause nobody classified rather than as prose nothing traces to. What cannot be
# derived is the naming and the judgement, and that is all this file holds:
#
#   id     the stable name a `source` entry cites, as `docs/threat-model.md#ID`.
#          It is a registry id, NOT a rendered anchor — the page carries no HTML
#          anchors and gains none for this. Renaming one is a two-file edit.
#   where  the clause's FIRST LINE, verbatim. It is a content lock, not a line
#          number: text moves down the page without rotting it, and a reworded or
#          deleted clause goes red. What it does NOT see is a rewrite BELOW that
#          first line — the same blind spot `formal/citations.lock` has, kept
#          because this page's first line is its thesis while its body is edited
#          constantly. Measured by `threat_gate.clause_bodies` over
#          `git log --reverse 3d6ec61 -- docs/threat-model.md`: 34 bodies changed
#          with their first line intact against 12 first lines reworded, so a lock
#          over the whole body would have fired on 20 of those 30 commits and been
#          suppressed like any alarm that is usually noise. `rests_on` is the
#          narrow lock for the sentences that could not afford to be under it.
#   kind   `defence` — the page states a defence or a defended threat here, so a
#          property may serve it; `context` — assets, an out-of-scope
#          declaration, a stated residual, a third-party result, a process. A
#          `context` clause cannot be cited: "serving" the asset list is not a
#          claim. Each carries the `why` in one sentence.
#   rests_on
#          the sentences UNDER a first line that some verdict argues FROM, held
#          against the body of the clause they belong to. Whitespace-normalised,
#          so a re-wrap is not a rewrite and a reword still is. Which ones are
#          owed is READ OFF the tree rather than remembered — an `[[untraced]]`
#          whose `why` names a clause id owes a pin inside that clause, and a
#          clause whose body hands part of its claim to a `PLAT-…` assumption
#          owes one on the sentence naming it — so a new dependency arrives owing
#          a pin instead of arriving unlocked. What it cannot reach: a sentence
#          load-bearing for a reason no entry here states.
#
# WHEN A PROPERTY TRACES — one rule, written down because leaving it implicit is
# what let two entries below contradict each other in a first draft. A property
# traces to a clause when that clause states the THREAT it defends against, even
# where the clause's list of examples does not name its applet; it is untraced
# when the page states no such threat in any form. So `SEC-POL-005` traces to
# `TM-HOST-GATES` (an access secret guarding a privileged mutation IS that
# clause, though its enumeration lists OATH and PIV and no OTP) while
# `SEC-POL-006` did NOT, for as long as the page said nothing about replay:
# re-emitting a counter is not a gate, and reading `TM-HOST-GATES` generously
# enough to cover it would have been the mis-mapping this rule exists to refuse.
# What ended it was writing `TM-HOST-OTP-REPLAY`, which is the only thing that
# ever ends a `missing-clause`. The enumeration gap is a docs finding of its own,
# not the reason for a verdict.
#
# The `[[untraced]]` half is the finding, not a blank. A P0-family property with
# no clause means one of exactly two things and has to say which: `missing-clause`
# (the page does not state a threat this tree defends against) or
# `defends-nothing` (the property is against nothing). ONE row is here now, the
# p0-launch `SEC-FIDO-007`, and its verdict is neither of those two: every P0b row
# has a root, and the last two to get one were the applet-policy pair
# `TM-HOST-ALGO-CHANGE` and `TM-HOST-OTP-REPLAY`. Both were written the way this
# programme now requires — the code read FIRST, which dropped three sentences
# before the draft (an at-rest erase, an unconditional "never repeats", and a rule
# that would have covered `TERMINATE DF`) and weakened seven more when an
# independent review read the same code again. That second pass is the argument
# for having it: reading first is not the same as reading enough, and every one of
# the seven was a sentence the author had already checked. Before them, two
# clauses were written to close the store rows, and the second is worth reading
# twice, because the first pass named the wrong absence. That pass read "the page
# states no power-interruption threat, though the whole store tranche is against
# one"; the page states one now (`TM-HOST-POWER-CUT`) and it roots exactly ONE of
# the four store rows, because `RSKeyStore.tla` gives `Delete` the only cut point.
# The other three were against a FAILED READ, a different threat — not because a
# cut cannot cause one (a torn item header is deterministic AND returns
# `Error::Corrupted`, so `crates/rsk-store/src/lib.rs`'s old "a cut cannot
# produce a read fault" was false and the comment says so now), but because the
# cut clause is about what a write leaves behind and in what order, while these
# three are about a read the medium refused, whoever caused it.
# `TM-HOST-READ-FAULT` states that threat and roots all three. Its own open half
# is written into it: the walk meets `Error::Corrupted` and skips it on purpose,
# so whether any host-reachable page state makes a per-key `fetch_item` return an
# error is unmeasured — and the clause's three rules are spelled so that the
# answer does not change them.
#
# Every [[untraced]] row also names an `owner`, from scripts/platform_gate.py's
# four roles — borrowed rather than re-picked, like the word floor above it, and
# for its reason: this is a register of obligations and an obligation nobody owns
# is a wish with a verdict column. What would END the finding is already typed by
# `verdict` and needs no second field: `missing-clause` says write the clause,
# and `defends-nothing` is a decision rather than a deferral. The row left is
# `maintainer`'s, and that is the shape of what is left: every `missing-clause`
# finding — a page standing behind code that already defends the threat — has been
# closed by a contributor writing the clause, and what does not close that way is
# a decision about what this project will never claim.
#
# Both records here take a fixed set of keys now, and so does the file. Neither
# had one: a key added to a [[clause]] or an [[untraced]] was held by no rule and
# shown to no reader, which is the hole matrix_gate's [[question]] had, asked of
# this file — and the same question one level out found the file's own tables
# unguarded too.

