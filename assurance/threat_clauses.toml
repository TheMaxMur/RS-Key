[[clause]]
id = "TM-ZEROIZATION"
kind = "defence"
where = "## Zeroization"
# Three sentences the zeroization contract rests on, pinned because every one of
# them is BELOW the locked first line: the claim `rsk_secret::Secret` and the
# clippy.toml ban now hold by construction, the residuals no type reaches, and a
# measurement with a stated revalidation trigger that covers the reboot exit.
#
# The fourth is owed rather than chosen: the body hands the SRAM half of its
# claim to `PLAT-MEM-001`, and `check_rests_on` demands a pin on the sentence
# naming it — without one that hand-off can be deleted and the clause reads as
# a defence the firmware implements, which is the one reading the registry row
# and this pin both refuse.
rests_on = ["""
Key-grade material in RAM is wiped (`zeroize`, volatile writes) when its use
ends: session state and PIN/UV tokens on drop, transient key copies at end of
scope including error paths, and the transport/exchange buffers as soon as a
message completes (requests carry PINs and imported keys).""", """
Accepted residuals: `Copy` temporaries inside RustCrypto curve arithmetic and
digest internals, in stack slots until a later frame overwrites them. The
working buffers `num-bigint-dig` allocates inside its own arithmetic — a
division's, a modular inverse's, a modular exponentiation's — it frees
unwiped; `rsk-rsa` holds a key's values, its blinding values and a private
operation's result and intermediates in a `Secret` or a key type whose `Drop`
wipes them, except the primes and `d` of a key `RsaKey::from_p_q` refuses. The
heap closes both for what it holds: it wipes each block as it frees it
(`ZeroingHeap` in `firmware/src/main.rs`), so a freed buffer's bytes do not
outlive the free. A `num-bigint-dig` value of eight limbs or fewer is held inline,
not on the heap, and a local one stays in its stack slot like those temporaries.""", """
This is a property of the silicon revision and boot
configuration, so it is re-measured when either moves; the explicit wipes stay as
depth in case a future one keeps SRAM.""", """
It discharges `PLAT-MEM-001` in the platform
registry ([platform-assumptions.md](platform-assumptions.md)) — read the row for
the transcript, the picotool version, and what the result does *not* establish,
which is that the firmware's own scrub works."""]

