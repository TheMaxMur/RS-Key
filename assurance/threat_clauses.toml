[[clause]]
id = "TM-HOST-ALGO-CHANGE"
kind = "defence"
where = "- **A key must not outlive the algorithm attribute it was made under.** An"
rests_on = ["""
the card reads that record again at the moment of every *private-key*
operation: `PSO:CDS`, the asymmetric arm of `PSO:DECIPHER` and `INTERNAL
AUTHENTICATE` take one byte of it to decide whether the slot is RSA or EC
before they touch the key.""", """
drops that slot's private key and the stored public key it would go on serving
*first* — whenever the store reports the slot present — and only then writes the
new value. A key the present cache reads absent while the backend still holds it
is not dropped, and the attribute goes in over it."""]

[[clause]]
id = "TM-HOST-OTP-REPLAY"
kind = "defence"
where = "- **A Yubico OTP the host watched being typed must not validate twice.** The OTP"
rests_on = ["""
`SWAP` leaves the stored counter alone too — but it moves the record to the
*other* slot index, and the RAM half travels with it, because the pair belongs
to the public id inside the record and not to the slot number that record
happens to sit at.""", """
**Six residuals, and the rule above hides none of them.**""", """
And the move that carries the pair is not atomic: `SWAP` writes the two records
one after the other and swaps the RAM halves only once both are through, with
nothing to undo a step that failed. A refused second write answers `6581` with
the first already landed, and so does a refused delete — the answer is read now,
but where the record write has already gone in it buys the report and not the
state. That direction still leaves one public id in two slots with only one of the
two session halves its own, and the other slot can then type a position that id
has already typed this power cycle"""]

