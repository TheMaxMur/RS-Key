[[cell]]
# The four images that remove the gate the statements are about.
properties = [
  "SEC-FIDO-001", "SEC-FIDO-002", "SEC-POL-004", "SEC-ADM-002",
]
columns = [
  "firmware-no-touch", "firmware-no-touch-pqc", "firmware-no-touch-fips",
  "firmware-no-touch-fips-pqc",
]
feature = "no-touch"
cfg = ["firmware/src/presence.rs"]
hook = "rsk_sdk::UserPresence"
disposition = "out-of-scope"
basis = "gate-compiled-out"
why = """
`no-touch` replaces the button watcher with an instant auto-confirm \
(`firmware/src/presence.rs`), so the physical-consent gate these four \
statements are ABOUT is not in the image: "the live authorization its own gate \
requires", "a presence decision produced for one transport", "a confirmed \
physical press", "a Confirmed operator presence". The claim is not weakened \
here, it is not made — and the tree already treats these builds that way. None \
of the four is published, `firmware/Cargo.toml` says "Never ship a no-touch \
build", and `release-build.yml` refuses to create a release carrying one. \
"No-touch image" in the singular is the phrasing that hid four packages."""

# ---- Settling questions -----------------------------------------------------
#
# One per column that still carries a `gap` cell. Required: a gap with no
# question is a shrug with a verdict column, and it is the shape in which a
# whole axis goes unexamined for a year. No counts here on purpose — the
# generated page prints them, and a number written twice is a number that rots.
#
# "NEVER SHIPPED" DISPOSES OF NOTHING, and three of the questions below used to
# be parked on it. This axis is a buildable configuration and not a list of
# publications, and the argument that an image no release carries is out of
# scope by definition is refuted from both ends by columns already in the file.
# One end: `firmware-pico` is unpublished and disposed of in FULL, so being
# unpublished did not stop a column being decided. The other: eight columns are
# told "never ship" in firmware/Cargo.toml's own words — a ninth, `core1-stats`,
# by reference to the benches — and four of the eight are the `no-touch`
# packages this file exists for, the ones that remove the physical-consent gate
# the P0-launch authorization properties are ABOUT. A rule retiring a column for
# not being shipped retires those four, which is the reason there is a matrix at
# all. What disposes of a cell is what the tree COMPILES, which the generated
# page derives per column: the crates this configuration resolves unlike the
# default build, and how many of the column's open rows are owned by one of them.
#
# EVERY QUESTION NAMES AN OWNER AND A ROUTE OUT — roadmap §6 stage 0's last exit
# bullet, which asks for an owner and a decision, or a deferral with a review
# point. `owner` is scripts/platform_gate.py's four-role vocabulary, borrowed
# rather than re-picked: that file chose it because "someone should look at this"
# names nobody, which is the same reason it is wanted here, and a second
# vocabulary would be two answers to one question. `maintainer` is the role that
# means a decision no derivation can produce, per AGENTS.md's maintainer-only
# list.
#
# `settled_by` is the review point, and it is an EVENT and not a DATE. The
# calendar half is already argued down for the sibling register — platform_gate:
# "a trigger for a measurement nobody has made is a placeholder, and 17
# placeholders are what a required field would produce today" — and that
# argument is adopted, though not by analogy, because the two registers face
# opposite ways: `revalidated_by` asks what would UNSETTLE a settled result,
# which a pending row cannot answer, and this asks what would SETTLE an open
# one, which is answerable exactly when the question is well posed. What rules a
# date out here is narrower. Enforced, a `review_by` reddens scripts/check.sh on
# a day nobody touched the tree and the repair is to move the date — a red that
# names no defect and teaches the reader to reset the timer. Unenforced, it is
# the field-nothing-reads a [[cell]] is refused for carrying. Neither is a check.
# What prompts the review instead is the row itself: the page is regenerated and
# byte-diffed on every run, so a new package, feature, board or property
# reprints every question below in the same diff that adds the column.
#
# The four values are this file's own disposition table read backwards, so each
# names the [[cell]] the question would become:
#   evidence   a check.sh row (or a proof) built at THIS column, which does not
#              exist yet -> `covered`/`conditional` on `check-sh-rows`
#   absence    the property's code or the gate it is about is not in this image
#              -> `out-of-scope` on `crate-absent`/`gate-compiled-out`
#   sameness   this column compiles the property's code as another does ->
#              `equivalent` on `same-cargo-features`
#   ruling     a decision no derivation can produce; `owner` is then maintainer
# Two of the four are ones the tree can refuse: `sameness` where the derived
# closure delta is non-empty — the answer the three measurement columns were
# parked on — and `absence` on a column that enables no feature production Rust
# gates on and compiles every open row's owner, which is every board preset.
# What none of it can do is tell six real words from six nonsense ones; four
# candidate rules for that were measured against the questions below and all
# four were refuted by them (the list is in matrix_gate.check_question).

[[question]]
column = "firmware-no-touch"
owner = "contributor"
settled_by = "absence"
text = """
Beyond the four presence statements: which rows depend on a presence decision \
only INDIRECTLY — a reset is reached through a touch, so does `SEC-FIDO-006`'s \
torn-reset argument still describe an image where the touch is instant?"""

[[question]]
column = "firmware-no-touch-pqc"
owner = "contributor"
settled_by = "absence"
text = "As `firmware-no-touch`, plus: does advertising ML-DSA-44 in `getInfo` change any authorization path, or only the algorithm list?"

[[question]]
column = "firmware-no-touch-fips"
owner = "contributor"
settled_by = "absence"
text = "As `firmware-no-touch`, plus the `fips-profile` question: the locked algorithm policy also raises the PIN floor, so which retry/gate properties are re-measured under it?"

[[question]]
column = "firmware-no-touch-fips-pqc"
owner = "contributor"
settled_by = "absence"
text = "The union of the `firmware-no-touch`, `firmware-fips` and `firmware-pqc` questions; no evidence is measured on the three-feature combination at all."

[[question]]
column = "firmware-fips"
owner = "contributor"
settled_by = "evidence"
text = """
`fips-profile` changes `rsk-fido` and `rsk-piv` — the PIN policy and the \
permitted algorithm set. `check.sh` runs the `rsk-fido` and `rsk-piv` test \
suites under it, so the question is narrow: does any P0-family invariant's \
model take the PIN floor or the algorithm set as a parameter, and if so, was \
it re-checked at the profile's values?"""

[[question]]
column = "firmware-fips-pqc"
owner = "contributor"
settled_by = "evidence"
text = "As `firmware-fips`, on the combination with `advertise-pqc`; the pair is published and nothing measures the two features together."

[[question]]
column = "firmware-pqc"
owner = "contributor"
settled_by = "evidence"
text = "`advertise-pqc` only adds ML-DSA-44 to the `getInfo` algorithm list — is that the whole delta for every P0-family row, or does the larger credential/attestation path move with it?"

[[question]]
column = "firmware-strong-pin"
owner = "contributor"
settled_by = "evidence"
text = "A six-code-point floor and a trivially-guessable-PIN refusal. Does any P0-family statement quantify over PIN values, or do they all treat the PIN as an opaque secret whose policy is someone else's row?"

[[question]]
column = "firmware-strong-pin-pqc"
owner = "contributor"
settled_by = "evidence"
text = "As `firmware-strong-pin`, on the combination with `advertise-pqc`."

[[question]]
column = "firmware-always-uv"
owner = "contributor"
settled_by = "evidence"
text = """
`always-uv` ships `alwaysUv` ON, which changes what `SEC-FIDO-001`'s gate \
DEMANDS rather than whether it is enforced — and `SEC-FIDO-006B` is about \
the alwaysUv gate surviving a reset, with a compiled-in default this column \
moves. Do the model's gate constants cover the alwaysUv-on arm? THE MODEL \
HALF IS ANSWERED: `AlwaysUvShipped` is AS-AUTH-2 in \
`assurance/assumptions.toml`, and `formal/AlwaysUv.cfg` runs `TypeOK` plus \
the eight P0-launch invariants with it TRUE — GREEN over 31 451 172 distinct \
states at depth 51, per `formal/runs.toml`. Read the cfg for that count, \
never this sentence: it said "all six invariants", and the file has carried \
nine entries in every commit it has ever had, so the number was wrong when \
it was written rather than gone stale — a count restated beside a file is a \
count that disagrees with it. THE CODE HALF IS NOT, and its cost is a number \
rather than an omission: `cargo test -p rsk-fido --features always-uv \
--target "$HOST"` came back 496 passed, 176 failed and 1 ignored — the \
harness's own `running 673 tests`, rc 101 — run at commit `709cb52`, because \
alwaysUv with no PIN answers `PUAT_REQUIRED` and the suite is written \
against the default door. The run is NAMED here because the sentence it \
replaces was not: `is 493 passed and 176 FAILED`, present tense, no commit, \
no date, over a suite that grows most weeks — a measurement written as a \
property of the column. The commit IS the date and is deliberately the only \
half written here: git dates a sha exactly, and `scripts/run_count_gate.py` \
refuses a second copy of a day its generated regions already print — the \
tier-run table of `docs/assurance-vector.md` prints this one, and typing it \
again here reddens that row (driven, EXIT=1). Write the target the way \
`scripts/check.sh` does: this said `aarch64-apple-darwin`, which is one \
maintainer's host triple pinned into a shared register, and CI runs the same \
row at `x86_64-unknown-linux-gnu`. And say which convention the denominator \
uses, because this tree has two and they differ by exactly the one ignored \
test: 673 is passed + failed + IGNORED, which is the number the harness \
prints and the number every count below is in. The pair 446/172 is NOT a \
superseded version of this one and must not be reconciled with it: it is \
what `assurance/bundle/logs/cargo-test-always-uv.log` holds, over 619 tests, \
and 619 counts the same way — two true measurements of a growing suite, \
which is why the bundle's own framing of that log is the thing to fix and \
not this number. The 669 that stood here was the third convention, passed + \
failed with the ignored test dropped; under the log's it was 670, and no \
reader could have told the two apart. So no `check.sh` row exercises this \
column, and `covered` may rest only on the default build or on such a row — \
the matrix has no basis for "the model half is checked at this column's own \
constant", which is evidence-schema work and not a cell anybody can fill \
here."""

[[question]]
column = "firmware-always-uv-pqc"
owner = "contributor"
settled_by = "evidence"
text = "As `firmware-always-uv`, on the combination with `advertise-pqc`."

[[question]]
column = "firmware-strict-up"
owner = "contributor"
settled_by = "evidence"
text = "`strict-up` demands a touch on EVERY assertion, dropping the silent `up:false` pre-flight. That strengthens the gate — but `SEC-FIDO-002` is about presence decisions not crossing transports, and this column produces strictly more of them. Is the model's transport arity still the right one?"

[[question]]
column = "firmware-strict-up-pqc"
owner = "contributor"
settled_by = "evidence"
text = "As `firmware-strict-up`, on the combination with `advertise-pqc`."

[[question]]
column = "firmware-display"
owner = "contributor"
settled_by = "evidence"
text = """
This column is NOT `default + display`: it also sets `flashSize = 16M` and \
`ledKind = none`, and it re-routes user presence through the panel's \
Approve/Deny instead of the button. Each non-display row therefore has to \
answer three questions, not one — and the flash-geometry half is the same \
16 MB question the board axis carries. It reaches the three `SEC-DISP-*` rows \
too, which is why they are `gap` here and not `covered`: the ceremony's \
evidence — `formal/Display.cfg`, the `rsk-ui`/`rsk-display` host tests and the \
