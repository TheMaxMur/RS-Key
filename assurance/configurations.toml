The largest feature delta in the tree: five crates, and it re-imposes the \
presence/PIN gates on device-config writes that the DEFAULT build leaves \
ungated. `SEC-ADM-002` and `SEC-ADM-004` are about exactly that surface, so \
this column is the one where their disposition may be STRONGER than the \
default's — which the matrix has no way to say until someone measures it."""

[[question]]
column = "keygen-bench"
owner = "contributor"
settled_by = "evidence"
text = """
A debug vendor command (INS 0x13) that `firmware/Cargo.toml` says never to \
ship, and it exposes a timing oracle over the primality primitives. Its \
never-shipped half is settled above; its sameness half is settled by \
measurement, and against the hoped-for answer — the closure is NOT the default \
build's, so `same-cargo-features` is refused here by derivation rather than by \
opinion. No cargo-feature column can ever earn that basis, because the feature \
NAMING the column is in that column's own closure by construction, which makes \
"is it equivalent" a question the derivation answers before it is asked. What \
the derivation does say is how narrow the delta is, and the page counts it: the \
crate set is the default build's exactly and `firmware` is the only crate whose \
features move, so all but one of the open rows here own code that resolves \
identically. What is left is not derivable — does a vendor INS answering on \
this image, gated by nothing, reach a statement whose own crate did not move? \
`SEC-BOOT-002` is the row where that is not even the question, because \
`firmware` is its owner."""

[[question]]
column = "core1-stats"
owner = "contributor"
settled_by = "evidence"
text = """
As `keygen-bench`: INS 0x12 exposes per-core candidate/find rates, which time \
the RSA keygen prime search. The measurement lands in the same place and for \
the same reason — the crate set is the default build's, `firmware` alone moves \
— so this column's narrowness is not inherited from that one's, it is \
re-derived on every run and printed beside this row."""

[[question]]
column = "bench"
owner = "contributor"
settled_by = "evidence"
text = """
As `keygen-bench`, and the one of the three the measurement separates rather \
than groups: `bench` is not a `firmware`-only delta. It turns on \
`rsk-fido/bench` and pulls `rsk-bench` into the image, so the `rsk-fido`-owned \
rows and `SEC-BOOT-002` are open on a column where the code they are ABOUT is a \
different compilation, and the rest are not. It is also the only one of the \
three with `check.sh` rows — and none of them is evidence for a P0-family \
statement: `clippy (bench fw)` and `clippy (bench host)` are lints, and \
`test (bench)` selects `rsk-fido` under the name FILTER `bench`, which \
`--list` answers with the harness's own four selector tests and one \
`#[ignore]`d timing loop — no invariant among them. So `covered` has nothing to \
rest on here either, and the open question is the `keygen-bench` one plus \
whichever `rsk-fido` statements a second timing entrypoint can reach."""

