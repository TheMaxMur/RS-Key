UNEXERCISED, and the sharper half is the question `waveshare-touch-lcd` already \
asks: should the tree build this preset, or is the panel a knob of \
`firmware-display-keys`? The board file's `bl_pwm_slice`/`bl_pwm_channel` exist \
only to keep it shaped like a `display` board it is never built as, which is \
the shape of the answer."""
