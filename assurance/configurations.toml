properties = [
  "SEC-FIDO-003", "SEC-FIDO-004", "SEC-FIDO-005", "SEC-FIDO-006",
  "SEC-FIDO-006A", "SEC-FIDO-006B", "SEC-FIDO-006C", "SEC-FIDO-007",
