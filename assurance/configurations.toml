[[question]]
column = "largeblob-ext"
owner = "contributor"
settled_by = "evidence"
text = """
The sharpest orthogonal feature: it serves the CTAP 2.3 `largeBlob` extension \
INSTEAD OF the 2.1 `largeBlobKey` + `authenticatorLargeBlobs` pair (the spec \
forbids both), it carries four `check.sh` rows, and it has zero flake packages \
— so nothing in the release axis would ever have given it a cell. Does the \
swapped surface move any credential-management or authorization transition the \
P0-launch models name?"""

[[question]]
column = "preview-sign"
owner = "contributor"
settled_by = "evidence"
text = """
Yubico's draft previewSign extension, off by default: a registration that asks \
for it gains an ARKG seed and a second attestation object, and an assertion \
signs the site's digest behind the same UP and UV gates, storing nothing. Does \
either path move a gate, a counter or a record a P0-launch model names?"""

