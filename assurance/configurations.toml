  "SEC-POL-005", "SEC-POL-006", "SEC-SEAM-001", "SEC-SEAM-002",
  "SEC-SEAM-003", "SEC-SEAM-006", "SEC-ADM-004", "SEC-BOOT-001",
  "SEC-BOOT-002", "SEC-TRANS-001", "SEC-TRANS-002", "SEC-TRANS-003",
]
columns = ["abrobot-4m"]
same_as = "firmware"
knob_delta = [
  "flash.kvmain_kb=1408", "flash.size_mb=4", "led.kind=ws2812",
  "led.max_leds=4", "led.order=grb", "led.pin=16",
  "presence.active_high=False", "presence.pin=23", "presence.source=gpio",
  "usb.vidpid=RSKey",
]
disposition = "equivalent"
basis = "same-cargo-features"
why = """
Identical cargo-feature closure AND the default flash geometry (4 MB, 1408 K \
KV main), so the axis that could reach a persisted-state property is \
unmoved. What is left is the LED backend, which reaches no P0-family \
statement at all, and the presence SOURCE — a GPIO button on 23 instead of \
BOOTSEL. FOUR rows are deliberately NOT in this list and stay `gap`: the \
ones whose statement QUANTIFIES OVER a presence decision — SEC-FIDO-001's \
gate, SEC-FIDO-002's per-transport touch, SEC-POL-004's confirmed physical \
press and SEC-ADM-002's Confirmed operator. Claiming those while the \
column's own question asks whether this button has BOOTSEL's semantics would \
be the two halves of one cell disagreeing. The four reset clauses used to be \
refused beside them, on the argument that an operator only ever REACHES a \
reset through a touch, and that argument is withdrawn as the wrong KIND: it \
is about reachability, and applied evenly it takes a row this cell already \
claims — SEC-FIDO-003's own statement names `reset` among the invalidations \
it quantifies over, and it has been in this list since the cell was written. \
What the four clauses actually say is what a PREFIX of an authenticatorReset \
leaves in the store, and `crates/rsk-fido/src/reset.rs` puts the whole \
presence gate — `shows_confirm`, then the ceremony — ahead of the first \
sweep, which samples no button. The source of the press decides whether the \
sweep RUNS; the write ordering it is torn in the middle of is the same \
compiled code at the same geometry. The one thing this does not claim is the \
reverse direction: BOOTSEL sampling stalls XIP and a GPIO read does not, so \
the column removes a hazard from the reset path rather than adding one."""

[[cell]]
properties = [
  "SEC-SEAM-001", "SEC-SEAM-002", "SEC-SEAM-003", "SEC-TRANS-001",
  "SEC-TRANS-002", "SEC-TRANS-003",
]
columns = ["firmware-2mb"]
same_as = "firmware"
knob_delta = [
  "flashSize=2M", "kvmain=896K",
]
disposition = "equivalent"
basis = "same-cargo-features"
why = """
Identical cargo-feature closure — the gate re-derives it — so the delta is the \
knobs listed above: flash geometry, LED wiring, the presence pin, and the panel's \
serial link. These six statements are about in-RAM state only: the applet \
security status that lives for the duration of a selection, and the CTAPHID \
reassembly buffer. \
Neither reads `PK_FLASH_SIZE`/`PK_KVMAIN_LEN`: inside the firmware image \
`firmware/src/flash_storage.rs` is their only consumer. Not in the tree — \
`rsk-wipe/src/main.rs` reads `PK_FLASH_SIZE` too, from its own `build.rs`, \
which is a separate binary and is what the next sentence is about. Every other \
row on this column stays \
`gap`, because the store IS what the geometry changes: `check.sh` rebuilds \
`rsk-wipe` once per board because a change that stopped `BOARD` reaching the \
wiper once left a 16 MB board's whole KV store standing behind a "successful" \
wipe. Those rebuilds mean something only because of the row beside them, \
`check.sh: rsk-wipe refuses an unknown flash size`, which fails a wiper that \
links with no board at all — it used to fall back to 4 MB at EXIT=0, so the \
per-board loop passed whether or not `BOARD` was reaching it. Cited with the \
`check.sh:` prefix because that label carries no parentheses, and the shape \
rule alone sees 52% of the row namespace.

Re-decided when `display.spi_freq_hz` moved 62.5 -> 80 MHz with the PIO panel \
transport, because that knob is no longer only a panel knob: the transport takes \
its wire rate from `clk_sys / 2`, so this column now runs the whole part at \
160 MHz where every other one runs 150. That is a real difference and it is \
recorded in `docs/limitations.md`, but it does not reach these six. They are \
statements about which state survives a selection and how a reassembly buffer is \
bounded — no clause in `RSKeyAppletSeams` or `RSKeyTransport` quantifies over \
time, a rate, or a deadline, so a core that retires instructions faster cannot \
make one of them true or false. A property that DID depend on timing would owe a \
`conditional` here instead, and none of the six is one."""

