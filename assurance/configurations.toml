[[question]]
column = "waveshare-touch-lcd"
owner = "maintainer"
settled_by = "ruling"
text = """
The trusted-display BOARD without the `display` feature: 16 MB geometry, no \
addressable LED, and panel pins compiled as inert constants. The geometry \
question is `firmware-16mb`'s. The sharper half is now measured rather than \
asked: this preset IS buildable without `--features display` — `build.rs` \
parses the `[display]` keys with no `CARGO_FEATURE_DISPLAY` gate — and nothing \
in `check.sh` builds `firmware` on it at all. The board loop builds `rsk-wipe`, \
and both `BOARD=` firmware rows pin `waveshare-one`. So the column is real and \
WHOLLY UNEXERCISED, and what is left to decide is whether the tree should build \
it, or whether it should be a knob of `firmware-display` instead."""


