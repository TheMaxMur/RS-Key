[[question]]
column = "abrobot-4m"
owner = "maintainer"
settled_by = "evidence"
text = """
The narrowest column with anything open, and it is now one group and one \
question: does a GPIO button on 23 (active-low) deliver the \
Confirmed/Cancelled semantics the presence model assumes of BOOTSEL — same \
debounce, same cancellation, same per-transport arbitration? Only the four \
rows that quantify over a presence decision are still open on it. The four \
reset clauses used to be held here as reached-through-a-touch; that is a \
reachability argument and it is withdrawn in the cell above, where applied \
evenly it would have taken SEC-FIDO-003 out with them. What is left is \
genuinely about the button: `crates/rsk-device/src/presence.rs` arbitrates \
the scope and `firmware/src/presence.rs` holds the latch, and both compile \
identically here — the one arm that moves is the raw sample."""

