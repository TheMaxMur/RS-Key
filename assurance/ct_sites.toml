#
# The constant-time sites `scripts/ct_gate.py` reads out of the shipped ELF, and
# what each first-party caller of one IS. HAND-WRITTEN FIELDS ONLY: a site's id,
# symbol, class and statement, and a caller's symbol and the protocol surface it
# stands for. Everything else — how many copies of a site the image carries,
# which functions inline it, whether any branch inside one reads flags set from a
# buffer load — is DERIVED from the image and printed, never stored.
#
# The caller list is held BOTH WAYS. A surface that stops routing through the
# comparator vanishes from the image and reddens as a stale entry; one that starts
# reddens as an unregistered inliner. That direction is the point: the finding
# `docs/ct-audit.md` records twice is a compare that BYPASSED the comparator, and
# a roster derived only from the registry could not see one appear.

[[site]]
id = "CT-CMP-001"
symbol = "rsk_crypto::mac::ct_eq"
class = "comparator"
statement = "The canonical comparator's inlined copies lower to a loop whose only branch is governed by the public length counter, and its accumulator is reduced branchlessly."

# --- the surfaces the image says inline it -------------------------------------
# One line per first-party frame the DWARF inline chains name — EVERY frame, not
# just the outermost. `surface` is the protocol operation a reader of
# docs/ct-audit.md would recognise; it is the half no derivation can produce.
#
# Why every frame: keyed on the outermost, a bypass added BESIDE a surviving
# call in the same enclosing function is invisible. Driven by an independent
# review — `cmd_update` moved back to a slice `!=` over the access code while
# `cmd_configure` kept the comparator, and the row stayed green with the page
# still listing the surface as routing through it. The per-crate forwarders are
# in the list for the same reason: they are frames the chains name.

[[caller]]
symbol = "rsk_crypto::pinproto::verify"
surface = "CTAP pinUvAuthProtocol MAC verify"

