# Human-reviewed δC/Step ownership. scripts/token_refinement_gate.py derives
# domains, flash keys, the Fs write API, the permission set and the module graph,
# then refuses any unowned writer/outcome producer.
#
# `disposition` is roadmap stage 4 item 4, and every entry answers it: `step`
# implements the named abstract Step (the default, and the only one that may
# carry an `op`), `stutter` moves security-visible state the abstraction does not
# observe, `out-of-scope` is a real gate outside the abstraction's vocabulary.
# The gate DERIVES which of those a site can be — a writer that moves an A bit
# cannot be a stutter, and one that moves none cannot be a step — so the field is
# checked in both directions rather than believed.
#
# `column` names the configuration that changes the site's reachability, out of
# the columns docs/assurance-matrix.md derives. `test_only` and `generic` are
# derived too: the first from the crate's module graph, the second from whether
# the function writes a fid it was handed.

