# ---- The three GUARD axes -----------------------------------------------------
#
# `NoAuthorizationBypass` is four clauses and only the first — the token and its
# permission — had a ledger. The walk's owning channel, the retry budget's soft
# lock and the reset window were owned NOWHERE, which is what made "the ledger
# covers the property" a sentence about a quarter of it.
#
# A guard writes no token field, so every rule on the writer axes above is silent
# here: `visible` is None on all three and the disposition is `out-of-scope` with
# its formal basis, because tier A carries no channel, no retry counter, no soft
# lock and no clock. That is not a gap being waved through — it is the
# complementary source obligation the A map names, and B states each of them.
#
# The sites are DERIVED, and over three units rather than one: `pin_lock` and
# `restore_pin_lock` have ZERO callers inside `rsk-fido` — the board marshals the
# lock — so a family scanned over the applet alone derives an empty roster and
# passes over it.

[[walk_owner]]
file = "crates/rsk-fido/src/state.rs"
