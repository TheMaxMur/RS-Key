# --- the removals `Fs` performs on its own behalf ------------------------------
# Derived, held both ways, and separate from the roster above for the reason the
# header gives: neither of that roster's two scope rules can see them.

[[fs_removal]]
file = "crates/rsk-fs/src/fs.rs"
line = 518
method = "factory_wipe"
call = "self.storage.remove(fid)?;"
rearms = true
scrub = "re-arms"
why = "the device-wide wipe, and the reason this table exists. Its `compact()` tail reads as an exemption and is not one: the lap sits behind every `?` above it, and neither caller reboots on a failure — `worker.rs` folds the wipe to `.is_ok()` and skips the reboot, `rsk-display`'s `pin.rs` paints \"wipe failed\" and returns — so a medium that dies after the first tombstone leaves the verifier superseded, the marker latched, and no boot ever lapping (measured on a `Cut` medium: `factory_wipe = Err(MemoryFatal)`, the verifier gone, EF_HARDENED live). The success path is the same rule: EF_HARDENED is in neither the preserve set nor `first`/`last`, so the sweep drops it in phase 1 in flash-ring order, after an arbitrary prefix of tombstones. Hence the re-arm at the HEAD, ahead of the first append — and best-effort, unlike the gated re-key sites, because on a wipe \"leave the record in force\" means leave the secrets live. No tail retry: phase 1 removes EF_HARDENED itself, so on the `Ok` path the marker is provably gone, and on the `Err` path the `?` returns before any retry could run."

[[fs_removal]]
