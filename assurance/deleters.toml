[[fs_removal]]
file = "crates/rsk-fs/src/fs.rs"
line = 823
method = "meta_delete"
call = "self.storage.remove(EF_META)?;"
rearms = false
scrub = "deferred-to-caller"
why = "EF_META going away once its last head is dropped. Nothing sealed is superseded here — the blob is a plaintext map of fid to a short head (`[algo, pin_policy, touch]`, plus a cached public point), never `Sealed` payload, so there is no chip-serial-rooted copy for a lap to scrub. The record the head belonged to is the caller's, and the caller is a `[[site]]` row."
