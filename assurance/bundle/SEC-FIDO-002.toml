# THE NEGATIVE OBLIGATION, over four wait owners and two cancel producers.
#
# Stage 1A п.3's ten-group contract for `SEC-FIDO-002`, the P0-launch row whose
# scope note had a cycle in it and whose cut is the reason this bundle can be
# written at all: stage 4 owns the NEGATIVE obligation of this property for ALL
# scopes — CTAPHID, CCID, OTP and panel — because that is the content of the
# property; the POSITIVE formalisation of the CCID and OTP transports stays with
# §8B and stage 6 and blocks `FV-M4` from nothing. Everything below is written
# to that line, and `property.statement` / `property.subjects_absent` draw it
# where a reader will trip over it rather than in a footnote.
#
# Like its two predecessors this bundle closes no stage and raises no status:
# `SEC-FIDO-002` is `BOUNDED` before it and `BOUNDED` after it. What it adds
# that neither of them had is a bounded tier RE-RUN for the record (seven
# harnesses, today, with `/usr/bin/time -l` beside them) and a code twin driven
# by hand to the NAME of every test that fell and the DIRECTION each fell in.
#
# Four findings about the tree are recorded here rather than fixed, and three of
# them are about the derivations rather than about the property:
#
#  * `rust = 2` is INFLATED, and worse than the same finding on `SEC-FIDO-007`.
#    `assurance_gate.grep_word` returns `f.name`, so this property's rust axis is
#    the list `['presence.rs', 'presence.rs']` — two entries carrying the SAME
#    string. One of the two files has three genuine `Refines` tags; the other has
#    ZERO and is credited for one prose sentence in its module doc;
#  * and the two owner derivations in the tree DISAGREE about it. `evidence_gate`
#    derives the freshness inputs through the `Refines` TAG and gets one file;
#    `assurance_gate` derives the column through a bare word grep and gets two.
#    So the file the vector counts as an owner is a file the freshness axis will
#    never watch;
#  * `kani = 2` UNDERCOUNTS. `crates/rsk-device/src/presence_kani.rs` carries
#    seven `#[kani::proof]` harnesses and the column reads the two whose names
#    contain the snake-cased invariant. `docs/authorization-slice.md:90-92` had
#    the number right already; the gate cannot see it;
#  * the ghost-completeness gate holds a SIBLING's ghost. `scripts/ghost_gate.py`
#    fixes `INVARIANT = "NoAuthorizationBypass"` at module level, and this
#    property's own ghost — two writers, `formal/RSKeySecurityState.tla:432` and
#    `formal/RSKeySecurityState.tla:445` — is held by no route ledger at all.

# ---- 1. Property, subject and owners -----------------------------------------

[property]
id = "SEC-FIDO-002"
invariant = "NoCrossTransportTouchConsumption"
# `assurance/properties.toml:101` is the FIRST sentence of `statement` below and
# is verbatim; the two after it are this bundle's own scope note and stand in no
# registry. The registry sentence is NEGATIVE in both halves: never applied,
# neither a confirm nor a cancel. What it does not say — and stage 4's scope
# note is explicit that it must not be read as saying — is that a CCID or an OTP
# ceremony is correctly DELIVERED. That is the positive formalisation, it
# belongs to §8B and stage 6, and nothing below is evidence for it. Read
# `subjects_absent` and `s_positive_half` together before citing this row.
statement = "A presence decision produced for one transport is never applied to another — neither a confirm nor a cancel. The obligation is NEGATIVE and it ranges over all four wait owners; that a CCID, OTP or on-panel ceremony is correctly SERVED is a different claim and is not made here."
subjects = ["requirement", "abstract model", "Rust source"]
subjects_absent = ["FFI", "binary", "hardware", "integration"]
# The one CTAPHID-shaped piece of evidence in the bundle, said here so it cannot
# be read wider: `HostCancel`, `Arbiter::request_cancel` and
# `no_cross_transport_touch_consumption_cancel`'s FIDO arm are about the CTAPHID
# cancel PRODUCER. What they buy for CCID and panel is that nothing reaches them,
# never that their own ceremony works.
subjects_ctaphid_reading = "the confirm half is producer-agnostic — one physical hold, whoever asked — but every CANCEL row in this bundle is about a producer, and there are exactly two: CTAPHID (`Arbiter::request_cancel`, crates/rsk-device/src/presence.rs:118-122) and the OTP frame protocol (`cancel_otp_wait`, :129-137). For `SCOPE_CCID` and for an on-panel flow the negative obligation is discharged by ABSENCE — no API can originate a cancel from either — which is AS-XT-3 and is a grep over the tree, not a proof. A reader who takes `no_cross_transport_touch_consumption_cancel`'s CCID arm for evidence that a CCID ceremony behaves correctly has read a proof about who may END a wait as a proof about who may RUN one"
requirement = [
  "CTAP 2.1 §11.2.9.1.4 — a CTAPHID_CANCEL is scoped to its own channel; crates/rsk-device/src/presence.rs:13-14 cites it as the requirement the arbiter implements",
  "CTAP 2.3 §6.1 / §6.2 — a makeCredential and a getAssertion each spend their own user-presence test, which is the requirement behind one hold serving one ceremony",
  "and NOTHING states the OTP or on-panel halves: the Yubico OTP frame protocol is not a FIDO specification and an on-panel ceremony is this device's own, so two of the four owners have no external requirement to be checked against",
]
threat_clause = "docs/threat-model.md#TM-HOST-TWO-TRANSPORTS"
# AND THE CLAUSE LINKS RATHER THAN COVERS. Read at docs/threat-model.md:228-248,
# the whole bullet and not the enabled-applications one that ends at :227: it
# establishes the PREMISE this property exists for — CTAP2 and U2F are served
# over CCID as well as CTAPHID, so a second, easier path reaches the same applet
# — and then makes a claim about SHARED SESSION STATE, not about scoped
# presence. Its one adjacent sentence, at :234-235, "Every operation still
# spends the same PIN, the same pinUvAuthToken and the same physical touch",
# runs the OTHER way round from this property: it says the touch requirement
# cannot be skipped by changing transport, where this property says a touch
# produced for one transport may not be consumed by another. Its pinned test,
# `both_transports_answer_from_one_session_state`
# (crates/rsk-device/src/ccid_tests.rs:734), is about `&RefCell<FidoState>` —
# and presence arbitration is not in `FidoState` at all; it is a `static
# Arbiter` in `rsk-device`. The clause also names TWO transports where the
# invariant ranges over four owners:
# `grep -n "cancel\|cross-transport\|arbitrat" docs/threat-model.md` returns
# NOTHING, and the OTP keyboard and the on-panel ceremony appear nowhere on the
# page.
threat_clause_reading = "LINKS, does not cover. The clause is the reachability premise plus a shared-state claim; the property is a scoping rule about a presence DECISION, and the page states no such rule anywhere. Worse in the direction that matters for a lock: `assurance/threat_clauses.toml:216-218` gives this clause a `where` line and NO `rests_on` pin, so the only content-locked text is its first line — the sentence about the same physical touch, the nearest thing on the page to this property, can be reworded with the threat gate green. What would fix it is a clause of its own naming the presence decision and the four owners; `crates/rsk-device/src/presence.rs:4-21` already carries the argument in prose, which is the wrong place for a threat-model premise — the same shape PLAT-THREAT-001 is open on for the channel id"
# The three genuine `Refines … — SEC-FIDO-002` tags the registry greps for, all
# in one file and all on the ARBITER rather than on the wait.
owners_tagged = [
  "crates/rsk-device/src/presence.rs:109 Arbiter::pending_for — the advertisement half",
  "crates/rsk-device/src/presence.rs:117 Arbiter::request_cancel — the CTAPHID cancel's scope test",
  "crates/rsk-device/src/presence.rs:128 Arbiter::cancel_otp_wait — the second writer of the same flag, with its own scope test",
]
# AND THE `rust` COLUMN COUNTS A SECOND FILE THAT CARRIES NO TAG.
# `grep -c Refines firmware/src/presence.rs` is 0. It is credited because
# `assurance_gate.grep_word` (scripts/assurance_gate.py:220-222) compiles
# `\bNoCrossTransportTouchConsumption\b` and searches the whole file text, and
# that file's module doc says the arbitration "carries the Kani harnesses for
# `NoCrossTransportTouchConsumption`" at firmware/src/presence.rs:19. A sentence
# ABOUT the invariant is indistinguishable to that regex from a tag OWNING it.
owners_column_reading = "the column is worse here than the same finding on SEC-FIDO-007, and the tell is in the derivation's own output: `grep_word` returns `f.name`, so this property's `rust` list is `['presence.rs', 'presence.rs']` — the two files are `crates/rsk-device/src/presence.rs` and `firmware/src/presence.rs` and their BASENAMES collide, so `rust = 2` is `len()` over a list whose two members are the same string. Anything downstream that de-duplicated it would read 1. The `Refines` regex (scripts/assurance_gate.py:103) belongs to `check_tags`, which VALIDATES a tag and never counts one"
owners_derivations_disagree = "and the tree's two owner derivations do not agree about this property. `evidence_gate.evidence_inputs` (scripts/evidence_gate.py:449-455) walks the same `production_rust` list but matches through `assurance_gate.TAG`, so its answer is the ONE tagged file; `assurance_gate.derive` (:408) matches the bare word, so its answer is two. Measured both ways in one process. The consequence is not cosmetic: `freshness` watches the inputs `evidence_inputs` derives, so the second file the vector credits as an owner is a file no freshness verdict will ever notice changing"
# The third owner of the cancel decision, which NEITHER derivation credits: the
# CHANNEL filter, one crate out.
owners_untagged_third = "crates/rsk-usb/src/ctaphid.rs:88-92 `is_cancel_frame` compares the frame's channel id against the active `cid` BEFORE `request_cancel()` is called at :781, and :762 gates the whole CANCEL watch on `up_pending()`, which is `pending_for(SCOPE_FIDO)`. So the CTAPHID cancel is filtered twice — by channel in `rsk-usb` and by transport in `rsk-device` — and only the second half is tagged. That file carries three `Refines` tags, all of them SEC-TRANS-*"
# The file all five co-refutation patches edit. It is the tagged owner, which is
# the healthy case and not the one SEC-FIDO-007 found.
owners_co_refuted = ["crates/rsk-device/src/presence.rs"]
# The unit tests that kill those patches, recorded here because they count in NO
# derived column: `assurance_gate`'s `rust` axis drops filenames containing
# `tests`, and its `test` axis reads only `tests/**/*.py`, which is why `test = 0`.
owners_of_the_kills = [
  "crates/rsk-device/src/presence_tests.rs:278 w4c_no_cancel_crosses_a_transport_boundary — every (owner, canceller) pair the two host-reachable cancels can form, asserting Timeout",
  "crates/rsk-device/src/presence_tests.rs:143 a5_a6_request_cancel_only_bites_under_the_fido_scope",
  "crates/rsk-device/src/presence_tests.rs:160 a7_a8_cancel_otp_wait_only_bites_under_the_otp_scope",
  "crates/rsk-device/src/presence_tests.rs:393 one_hold_never_serves_two_transports",
  "crates/rsk-device/src/presence_tests.rs:471 a_scope_change_mid_wait_moves_the_advertisement_and_the_cancel_right",
]
# The ghost, and who holds it. THE ANSWER IS: this property's mutants, and
# nothing else.
clause_ghost = "two writers of the name, formal/RSKeySecurityState.tla:432 (TouchConfirm) and :445 (TouchCancel), and NO route ledger: scripts/ghost_gate.py:62-64 fixes `INVARIANT = \"NoAuthorizationBypass\"` at module level with the comment 'One name, because a second ghost would want…'. What holds this ghost instead is the verdict ratchet on its five mutants — delete TouchConfirm's write and Solo_BugTouchNotSpent.cfg goes GREEN, which `formal/floors.txt:Solo_*.cfg` turns into `!! expected RED` and exit 1. That is per-mutant coverage and not per-route: a ghost route no mutant reaches would be unheld, and today there are two routes and five mutants across them"
clause_structural = "the second conjunct, `(pres.granted = \"cancel\") => (pres.cancelBy = pres.scope)` at formal/RSKeySecurityState.tla:1739 — and AS-XT-6 argues it is INERT, because TouchCancel writes the ghost in the same step it sets `granted`. The comment above the invariant (:1732, 'Ghost half: TouchConfirm only') is therefore inaccurate in the direction that matters: the cancel half has a ghost write of its OWN, and the structural conjunct is a backstop for a producer that does not exist"

