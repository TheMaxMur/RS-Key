# ---- 8. Mutation verdicts ----------------------------------------------------

# EIGHT rows, which is `bundle_gate.VERDICT_FLOOR` exactly. SIX are model-level
# — the five solo mutants and the whole-set row — and TWO are code-level; no row
# here mutates a gate script or this file, so unlike `SEC-FIDO-008`'s group the
# floor is cleared on the model and the code alone. It is cleared by a margin of
# nothing, and the eighth row is the weakest of the eight: it carries FOUR
# comutants as one transcribed verdict, and its own `fell` says so — the driver
# prints `killed` and not the name of the test that fell, so those four have a
# verdict and no assertion behind them. Drop that row and the group is at seven,
# under the floor.

[[mutation]]
level = "B"
mutant = "BugUnscopedCancel — `request_cancel`'s `wait_scope == SCOPE_FIDO` test deleted, armed ALONE"
invocation = "formal/run-tlc.sh Solo_BugUnscopedCancel.cfg"
expected = "RED: NoCrossTransportTouchConsumption"
verdict = "RED: NoCrossTransportTouchConsumption, 549 states, 189 distinct, depth 5, 1 s"
fell = "NoCrossTransportTouchConsumption — TypeOK and this invariant are the whole INVARIANTS block, so the RED cannot be a neighbour's"
direction = "modelled"
reading = "the counterexample is LocalCeremonyStart(otp) → HostCancel → TouchCancel and it ends with `scope = otp`, `cancelBy = fido`, `granted = cancel`: a CTAPHID cancel ended a wait the OTP frame protocol owns. The inverse — a cancel refused where its own transport raised it — cannot fail this invariant at all, because the implication only reads states whose `granted` is already `cancel`; it would show up as a Timeout where a Cancelled was owed, which is what `a_cancel_from_the_owning_transport_ends_the_wait` exists to catch and it did not fire."

[[mutation]]
level = "B"
mutant = "BugPanelCancelable — the CCID half of the same scope test KEPT and the panel half lost, armed alone"
invocation = "formal/run-tlc.sh Solo_BugPanelCancelable.cfg"
expected = "RED: NoCrossTransportTouchConsumption"
verdict = "RED: NoCrossTransportTouchConsumption, 678 states, 237 distinct, depth 5, 1 s"
fell = "NoCrossTransportTouchConsumption, at `scope = panel`, `cancelBy = fido`, with the finger still down"
direction = "modelled"
reading = "this is the narrow mistake somebody could actually make while believing the rule is kept — `pres.scope \\in {Fido, Panel}` instead of `pres.scope = Fido` — and it is E45's own case: an on-panel ceremony is nobody's to cancel. It matters that the trace reaches `panel` and not `ccid`: the CCID arm of the guard survives this mutant untouched, so the row says the PANEL half is separately load-bearing rather than that the guard as a whole is."

[[mutation]]
level = "B"
mutant = "BugUnscopedOtpCancel — the SECOND writer of the same `cancel_requested` flag loses its own scope test"
invocation = "formal/run-tlc.sh Solo_BugUnscopedOtpCancel.cfg"
expected = "RED: NoCrossTransportTouchConsumption"
verdict = "RED: NoCrossTransportTouchConsumption, 664 states, 233 distinct, depth 5, 1 s"
fell = "NoCrossTransportTouchConsumption, at `scope = panel`, `cancelBy = otp`"
direction = "modelled"
reading = "the pair with the row above is the content: the cancel flag has two writers in two functions, and the same shape of defence in each. This one falls with `cancelBy = otp` where the other falls with `cancelBy = fido`, which is what says the two guards are separately load-bearing rather than one of them riding the other — the reason formal/RSKeySecurityState.tla:498-504 gives for this mutant existing at all instead of being folded into BugUnscopedCancel."

[[mutation]]
level = "B"
mutant = "BugNoDropStaleCancelAtEntry — the cancel drop at wait ENTRY removed, armed alone"
invocation = "formal/run-tlc.sh Solo_BugNoDropStaleCancelAtEntry.cfg"
expected = "RED: NoCrossTransportTouchConsumption"
verdict = "RED: NoCrossTransportTouchConsumption, 383 states, 167 distinct, depth 4, 0 s"
fell = "NoCrossTransportTouchConsumption, at `scope = otp`, `cancelBy = fido`, reached through HostCancelLatched"
direction = "modelled"
reading = "the shortest counterexample of the five and the one whose FIRST action is the finding: HostCancelLatched, a cancel raised while `scope = NoOwner` — during a FIDO dispatch that never opened a wait, which WAIT_SCOPE spans anyway — and then eaten by the next transport's wait. It is not the same defect as an unscoped guard: the guard is intact here and the latch is what crosses the boundary, which is why the exit clear at crates/rsk-device/src/presence.rs:230-233 cannot substitute for the entry clear at :195-197."

[[mutation]]
level = "B"
mutant = "BugTouchNotSpent — the `spent` latch never set, armed alone; the CONFIRM half rather than the cancel half"
invocation = "formal/run-tlc.sh Solo_BugTouchNotSpent.cfg"
expected = "RED: NoCrossTransportTouchConsumption"
verdict = "RED: NoCrossTransportTouchConsumption, 4953 states, 1375 distinct, depth 7, 1 s"
fell = "NoCrossTransportTouchConsumption, on the GHOST rather than on the structural conjunct — TouchConfirm reads `usedBy` in the same step it rewrites it, so no state carries the evidence"
direction = "modelled"
reading = "the deepest of the five at 7, and the only one whose falsifying step is a CONFIRM: PressDown → LocalCeremonyStart(otp) → TouchConfirm → LocalCeremonyEnds → LocalCeremonyStart(panel) → TouchConfirm, with the pre-state's `usedBy = otp` against a panel-owned wait. One unbroken hold served two ceremonies. The inverse — a latch that spends a press nobody used — makes the antecedent false and cannot fail this invariant; it would show as a ceremony that could not be confirmed, which `a_hold_that_satisfied_a_ceremony_is_spent_by_it` asserts against."

[[mutation]]
level = "B"
mutant = "all five switches against the WHOLE invariant set — the attribution question SEC-FIDO-007 answered the other way"
invocation = "formal/run-tlc.sh Mut_Bug{UnscopedCancel,PanelCancelable,UnscopedOtpCancel,NoDropStaleCancelAtEntry,TouchNotSpent}.cfg"
expected = "RED, and on THIS property's name rather than a sibling's"
verdict = "5 of 5 RED: NoCrossTransportTouchConsumption — 538/183/5, 688/235/5, 687/244/5, 383/167/4 and 4918/1369/7 states/distinct/depth"
fell = "NoCrossTransportTouchConsumption on every one, first among six invariants checked"
direction = "modelled"
reading = "TLC reports the FIRST invariant a mutant violates, so a whole-set row naming this property is a fact about ALL_INV and not only about the defect: formal/gen-configs.sh:105-107 puts this invariant in that list, where the two structural facts are deliberately kept out — which is why the same experiment on SEC-FIDO-007 reports a sibling's name and this one does not. The credit for these five does not depend on `comutate.solo_index` reading the invariant-named configuration, and that is the difference between the two bundles rather than a difference between the defects."

[[mutation]]
level = "code"
mutant = "the same defect in production Rust: formal/comutants.toml's BugUnscopedCancel hunk over crates/rsk-device/src/presence.rs, applied in a detached worktree at HEAD"
invocation = "cargo test -p rsk-device --target aarch64-apple-darwin, over the patched worktree, under /usr/bin/time -l"
expected = "killed, and the failures in the BYPASS direction rather than the over-refusal one"
verdict = "killed, 8.20 s — `test result: FAILED. 75 passed; 3 failed; 0 ignored`"
fell = "presence::tests::a5_a6_request_cancel_only_bites_under_the_fido_scope, ::w4c_no_cancel_crosses_a_transport_boundary and ::a_scope_change_mid_wait_moves_the_advertisement_and_the_cancel_right — all three named by the log, which is why this was driven by hand: scripts/comutate.py prints a verdict and not the name of the test that fell"
direction = "modelled"
reading = "the direction is the whole content and the log spells it out three times. `a5_a6` fails with 'CTAPHID_CANCEL reached a wait scoped to 0', left `true` right `false` — the cancel LANDED where it must not; `w4c` with 'FidoCancel ended a wait owned by 0', left `Cancelled` right `Timeout` — the wait ENDED where it should have timed out; the third the same pair. Not one of the three says 'should have been cancelled and was not'. That inverse is the shape 2 of 24 co-refutation patches in this tree scored a kill on, and reading the message rather than the exit code is what tells them apart. Scope `0` is SCOPE_NONE, so the FIRST pair the sweep breaks on is the on-panel one."

[[mutation]]
level = "code"
mutant = "the other four comutants of this property — BugPanelCancelable, BugUnscopedOtpCancel, BugNoDropStaleCancelAtEntry, BugTouchNotSpent"
invocation = "python3 scripts/comutate.py run <Bug>, driven weekly by .github/workflows/deep-checks.yml:476-479"
expected = "killed by the tree's own suite, `cargo test -p rsk-device`"
verdict = "killed — the recorded `expect` of all four in formal/comutants.toml, re-driven WEEKLY as a GATING row: 'every recorded code-level kill must still go red, and a new GAP is an abstraction-fidelity finding'"
fell = "not recorded, and that is the honest gap in this row: the driver prints `killed` and not the name of the test that fell, so the four have a verdict and no assertion behind it"
