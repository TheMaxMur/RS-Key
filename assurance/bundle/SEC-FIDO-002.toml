[[assumption]]
id = "AS-AUTH-3"
statement = "A CTAPHID channel id is a routing label the sender writes, so channel ownership is a scoping rule and never an authentication one."
kind = "threat model"
discharger = "a clause of docs/threat-model.md; crates/rsk-fido/src/state.rs states it in prose today. Sharper for THIS property than for SEC-FIDO-001, and in the direction that bounds the claim: `Arbiter::request_cancel` takes NO channel argument and cannot tell one CTAPHID channel from another, so this property is about TRANSPORTS and stops there. The channel half is enforced one crate out, at crates/rsk-usb/src/ctaphid.rs:88-92, where `is_cancel_frame` compares the frame's cid against the active one before the arbiter is ever called — and that site is tagged for SEC-TRANS-* and not for this row"
