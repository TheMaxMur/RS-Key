# ---- 7. Assumptions and TCB / trust dependencies -----------------------------

# NINE rows. Two of them are deliberately the ids SEC-FIDO-001's bundle uses,
# because they are the same standing assumptions and a fresh id would create a
# candidate `assurance/platform.toml` claims nowhere; the other seven are this
# property's own, with the prefix AS-XT-. Six need a NEW registry entry and one
# needs an EXISTING entry's `covers` extended — the proposals are written out in
# the shape that file uses, and until they are merged `platform_gate.py` reports
# each as derived-and-claimed-by-no-entry. That is the both-ways rule working.

[[assumption]]
id = "AS-XT-1"
statement = "The bounded tier proves the arbiter's cross-executor flags under a SEQUENTIAL reading of their atomics, and the interleaving it checks is one the harness scripts rather than every schedule two executors can produce."
kind = "tool TCB"
discharger = "a checker that models the ordering, or a source argument that the four flags admit no schedule the harness's own interleaving misses. MEASURED, not assumed: the artifact carries Kani's own `warning: Kani currently does not support concurrency … atomic_load (6) … atomic_store (6)`. What makes it load-bearing rather than pedantic is that the arbiter exists FOR the concurrency — crates/rsk-device/src/presence.rs:72-77, one `static`, the interrupt executor and the worker, `&self` on every method — so `Ordering::Release`/`Acquire` on `cancel_requested` and the `Relaxed` write in `cancel_otp_wait` are proved by nothing here"
expressible = "no — a fact about what the prover models, not a constant a configuration could assign"
registered = "yes — assurance/platform.toml PLAT-TOOL-005, pending, class tool-tcb, refining PLAT-TOOL-003. Written BY this bundle: the registry has a row for Kani's SOUNDNESS and none for what it declines to model"

[[assumption]]
id = "AS-XT-2"
statement = "`Owners` — the four SCOPE_* bytes plus `Panel`, the model-only split of SCOPE_NONE — is the whole domain a presence decision can be produced for or applied to."
kind = "model fidelity"
discharger = "reading the byte and its writers: crates/rsk-device/src/presence.rs:26-32 defines exactly four SCOPE_* constants and firmware/src/worker.rs:434, :528, :663, :665 are every `set_wait_scope` call site in the tree; formal/RSKeySecurityState.tla:127-144 maps them and splits SCOPE_NONE because `request_cancel` refuses in both halves while only one can be ENDED by a touch — collapsing them left the panel unable to own a ceremony at all, which the module records. What would falsify it is a fifth interface: `wait_scope` is an `AtomicU8` and nothing bounds it, so a new transport arrives as an owner no configuration and no harness checks"
expressible = "no — a set, not a boolean; and it is fixed in the module rather than in a .cfg, so unlike RPs or Channels it cannot be widened by a configuration at all"
registered = "yes — assurance/platform.toml PLAT-PRES-001, pending, class model-abstraction. Proposed as PLAT-MODEL-012 and renumbered on merge: two sibling bundles proposed that same number for other statements, and the three presence rows took an area of their own — the statements did not move"

[[assumption]]
id = "AS-XT-3"
statement = "No API in the tree can originate a cancel from SCOPE_CCID or from an on-panel flow, so a CCID or panel ceremony is uncancellable by ABSENCE of a producer rather than by a guard anything checks."
kind = "model fidelity"
discharger = "a whole-tree grep, and it is a grep rather than a proof, which is the point of writing it down. `git grep -n 'cancel_requested.store(true'` is exactly two sites, both scope-tested and both tagged; `set_cancel_requested` has six production call sites and every one passes a literal `false`; the one site passing `true` is crates/rsk-device/src/presence_kani.rs:158, a harness. The Kani cancel clause RESTS on this: `board.attempted[SCOPE_CCID]` stays false because the harness raises only the two cancels that exist, so 'a CCID wait cannot be cancelled at all' is the harness's construction and not its conclusion. A third writer added anywhere falsifies it with every harness still green"
expressible = "no — a statement about which call sites exist, which no model constant can carry"
registered = "yes — assurance/platform.toml PLAT-PRES-002, pending, class model-abstraction; proposed as PLAT-MODEL-013 and renumbered on merge with its two neighbours. It is the row that says how much of the negative obligation for two of the four owners is evidence and how much is absence"

[[assumption]]
id = "AS-XT-4"
statement = "The `display` build implements the one-hold-one-ceremony latch somewhere else: it compiles `ButtonWait` out entirely and the panel's own release debounce takes over."
kind = "build configuration"
discharger = "the firmware-display and waveshare-touch-lcd matrix cells, which are `gap` for this property today. firmware/src/presence.rs:99-101 gates the button backend on `not(feature = \"display\")` and :163-166 swaps `Presence` to `crate::display::TouchPresence`; crates/rsk-display/src/presence.rs:45-48 clears the stale cancel in the panel's OWN loop, not in `ButtonWait::wait`, which is why formal/RSKeySecurityState.tla:461-466 says `OpenWaitFor` stands for two different drops and BugNoDropStaleCancelAtEntry removes both at once. The module states the direction at :468-472 — NARROWER than a display build, so it keeps a defence that build implements elsewhere rather than one it does not have"
expressible = "no — a feature flag's effect on which module runs the ceremony, not a boolean the model reads"
registered = "yes — assurance/platform.toml PLAT-BUILD-003, pending, class build-configuration. Its discharge_owner is `contributor` and not the `maintainer` this bundle proposed: the route is the two matrix cells and the display build's own ceremony code, all of it host-testable in crates/rsk-display, and the glass is PLAT-DISPLAY-001's"

[[assumption]]
id = "AS-XT-5"
statement = "On the four `no-touch` images no presence DECISION is produced at all, which is why this property's cells there are `out-of-scope` and not `gap` — and the arbitration code is still compiled in, so 'the decision is gone' and 'the code is gone' are different sentences."
kind = "build configuration"
discharger = "reading the cfg arms, and it is decided rather than open. firmware/src/presence.rs:202-258: `request` and `request_ceremony` return `Presence::Confirmed` unconditionally under the feature, `poll_pressed` returns false, and `ButtonPresence::wait` is `cfg(not(feature = \"no-touch\"))`, so `ButtonWait::wait` — the only caller of `set_up_pending(true)` on a non-display build — is never reached and `up_pending()` is constantly false. The three tagged owners ARE in those images. firmware/Cargo.toml says 'Never ship a no-touch build' and release-build.yml refuses to release one"
expressible = "no — a cargo feature's effect on reachability, not a model constant"
registered = "yes — assurance/platform.toml PLAT-BUILD-004, pending, class build-configuration"

[[assumption]]
id = "AS-XT-6"
statement = "The invariant's structural conjunct — `(pres.granted = \"cancel\") => (pres.cancelBy = pres.scope)` — is INERT on the current module: no reachable state falsifies it that TouchCancel's ghost write has not already marked in the same step."
kind = "model fidelity"
discharger = "a configuration checking the conjunct alone, which the tree has a family for — formal/SoloClause_*.cfg, three of them today — or the module changing. ARGUED FROM THE MODULE TEXT AND NOT RUN, which is the whole caveat: TouchCancel (formal/RSKeySecurityState.tla:439-450) sets `granted = \"cancel\"` and writes `viol` in the same step; every other writer of `pres` either requires WaitOpen (`granted = \"none\"`) or is OpenWaitFor / ClosedWait / VolatileCleared, all of which put `granted` back to `\"none\"`; and `viol` is only ever grown, never shrunk. So the conjunct's arm can be reached by nothing the ghost has not caught. It is a backstop for a producer that does not exist yet — the same shape as a model constant nothing branches on"
expressible = "no — a statement about the reachable state graph, not a constant. It is also why the invariant's own comment at :1732 is wrong to call TouchConfirm the ghost half's only writer"
registered = "yes — assurance/platform.toml PLAT-PRES-003, pending, class model-abstraction; proposed as PLAT-MODEL-014 and renumbered on merge with its two neighbours"

[[assumption]]
id = "AS-XT-7"
statement = "TLC is sound for this model and the recorded verdict for a configuration is the verdict that run produced; fourteen of this property's sixteen mechanised results are TLC's."
kind = "tool TCB"
