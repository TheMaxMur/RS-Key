# formal/runs.toml, and their `peak_memory_mb` is a CEILING and is labelled as
# one in every row.

# THE HUMAN COLUMN IS A RECONSTRUCTION, AND ITS AGGREGATE DOES NOT FIT THE
# WINDOW IT IS DATED IN. The fifteen rows below total 320 human_minutes, and the
# six bundles this one arrived with total 1709 — 28.5 hours, every one of them
# stamped `freshness.measured = 2026-08-30` inside a window that runs from
# `31c21a7` (2026-08-30 22:03:52 +0300) to `b185fc3` (2026-08-31 01:24:37),
# which is 3 h 21 min. NO TIMER PRODUCED ANY OF THEM: they are attended time
# reconstructed after the fact, and every `basis` below says so in its own row
# rather than leaving a reader to find this paragraph. They are kept because
# they are the only cost signal the programme has, not because they are
# measurements.
#
# AND THE SHIPPED BOUND HERE IS NOT THE ONE THE OTHER FIVE BUNDLES CARRY over a
# byte-identical artifact — `317703de…`, the same log in six directories. 3705
# is a CEILING this artifact states about ITSELF, the banner's 3641MB heap plus
# 64MB offheap, so it is derived from the log rather than transferred to it. The
# 2940 MiB the five siblings carry is a `/usr/bin/time -l` SAMPLE of a DIFFERENT
