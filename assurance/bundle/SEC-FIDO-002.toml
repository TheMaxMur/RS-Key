# ---- 3. Method and scope/bounds ----------------------------------------------

# EIGHT rows: four mechanised tiers, two reviews and one mutation. There is no
# tier A — no requirement gate exists for this property, because the requirement
# root covers only one of its four owners (see property.threat_clause_reading) —
# and no trace row: no TraceSecurity configuration checks this invariant, which
# is what `trace 0 of 0` in docs/assurance-vector.md:64 is.

[[method]]
obligation = "tier B: the invariant over the whole reachable space of the shipped constants"
method = "model-check"
artifact = "formal/RSKeySecurityState.tla::NoCrossTransportTouchConsumption Shipped.cfg"
bound_rps = 2
stops_rps = "nothing this invariant can express — it names pres.granted, pres.cancelBy, pres.scope and the ghost, and no constant. What two costs it is reach alone: a falsifying presence state that first arises over a third relying party is not in the set searched"
bound_channels = 2
stops_channels = "nothing this invariant can express, and note which arity this is NOT: the transport count is `Owners`, a five-element set fixed in the module, so no .cfg can widen it. What two costs is reach — a cross-transport consumption that first arises over a third concurrent channel is not in the set searched"
bound_max_retries = 8
stops_max_retries = "nothing at all. The ladder is off this property's path, and at the shipped value it is not a shrink either; what it buys is that the PIN doors are reachable at the depth the image has"
bound_mismatch_limit = 3
stops_mismatch_limit = "nothing at all, for the same reason as the ladder it pairs with — no clause of this invariant names a mismatch counter, and three IS the shipped limit"
bound_max_clock = 1
stops_max_clock = "nothing this invariant can express. What one Tick costs is reach: a falsifying state that needs a second unit of elapsed time is not in the set searched"
bound_reset_window = 0
stops_reset_window = "nothing this invariant can express. What zero costs is reach: a reset STARTED inside the shipped window is a prefix no run here produces, so a presence decision crossing a transport during a legitimate in-window reset is not in the set searched"
shipped_relation = "MaxRetries and MismatchLimit ARE the shipped MAX_PIN_RETRIES (8) and PIN_MISMATCH_LIMIT (3); RPs and Channels are 2 against an unbounded device; MaxClock 1 is the smallest value at which Tick is not dead; ResetWindow 0 runs the window closed only. NONE OF THE SIX IS ON THIS PROPERTY'S PATH — the invariant names `pres.granted`, `pres.cancelBy`, `pres.scope` and the ghost, and no constant. What the six buy it is the reachable set a falsifying state would have to appear in; what they cost it is nothing it can express. The bound that IS on its path is not in this list and is not a configuration knob at all: `Owners` is a five-element SET fixed in the module at formal/RSKeySecurityState.tla:144, so the transport arity cannot be widened by a .cfg — AS-XT-2"
cfg = "none"
features = "none"

[[method]]
obligation = "tier B: the other arm of all three registered scope constants, against this invariant"
method = "model-check"
artifact = "AlwaysUv.cfg PermWide.cfg ForceChange.cfg"
bound_arms_run = 3
stops_arms_run = "the fourth standing assumption. Three of the four `scripts/assumption_gate.py` tracks have both arms run against this invariant; PowerOnClearsScratch2 lives in RSKeyBootHardening and no configuration checking this property takes either of its arms, so nothing here says whether a power-on that fails to clear scratch2 can carry a presence decision across a transport"
bound_rps = 2
stops_rps = "a falsifying state that first arises over a third relying party, on all three arms"
bound_channels = 2
stops_channels = "a falsifying state that first arises over a third concurrent channel, on all three arms"
bound_max_retries = 2
stops_max_retries = "nothing — the ladder is off this property's path, so eight rungs down to two is free here in a way it is not for SEC-FIDO-001"
bound_mismatch_limit = 1
stops_mismatch_limit = "nothing, for the same reason: no clause names the mismatch counter, so one against the shipped three costs this invariant no term"
shipped_relation = "three configurations, one per constant: AlwaysUvShipped TRUE (formal/AlwaysUv.cfg), WidePerms TRUE (PermWide.cfg, one relying party) and ForceChangeModelled TRUE (ForceChange.cfg). The retry ladder is REDUCED on all three — 8:3 becomes 2:1 — and for THIS invariant that shrink is free in a way it is not for SEC-FIDO-001, because neither constant appears in the property. What the three rows buy is that of the four standing assumptions `scripts/assumption_gate.py` tracks, THREE have both arms run against this property; the fourth, PowerOnClearsScratch2, lives in RSKeyBootHardening and the overlap with the configurations checking this invariant is ZERO. That is a stronger position than SEC-FIDO-001 and SEC-FIDO-007, which each have one such constant"
cfg = "none"
features = "none"

[[method]]
obligation = "non-degeneracy: the invariant can go red, on a name that is its own, at five different (owner, canceller) pairs"
method = "model-check"
artifact = "Solo_BugUnscopedCancel.cfg Solo_BugPanelCancelable.cfg Solo_BugUnscopedOtpCancel.cfg Solo_BugNoDropStaleCancelAtEntry.cfg Solo_BugTouchNotSpent.cfg"
bound_invariants_checked = 2
stops_invariants_checked = "anything about the other eight invariants. Each row checks TypeOK and this name alone, which is what makes a RED this property's rather than a sibling's — and the price is that a state falsifying two at once is seen here as falsifying one"
bound_armed_switches = 1
stops_armed_switches = "any defect that needs TWO of the model's bug switches at once. One armed switch per row is what attributes the kill, and a cross-term between two injected defects is not a state any of the five reaches"
bound_isolated_rows = 5
stops_isolated_rows = "a sixth way for this invariant to fail. Five arms are five defects somebody wrote a switch for, so non-degeneracy is shown for those five and for no failure mode nobody modelled"
bound_counterexample_depth_max = 7
stops_counterexample_depth_max = "nothing — the depths are MEASURED trace lengths and not a bound the configurations impose. What they say is that the five land on four different (scope, cancelBy) pairs rather than all tripping on the first; what they cannot say is that a longer trace would find nothing else"
shipped_relation = "each of the five arms ONE Bug* switch with every other FALSE and checks TypeOK and this invariant and nothing else, which is what tells a kill from a neighbouring invariant's. Unlike SEC-FIDO-007 the Solo rows are not the only place this property is observed to fail: its invariant IS in `formal/gen-configs.sh:105-107`'s ALL_INV, so the five `Mut_` twins that check the whole set report THIS name too — measured, all ten, and that is the `b_mut_twins` row. The four cancel counterexamples land at depths 4, 5, 5 and 5 and the confirm one at 7, on four DIFFERENT (scope, cancelBy) pairs, which is what says each reaches its own boundary rather than all five tripping on the first"
cfg = "none"
features = "none"

[[method]]
obligation = "tier C: the cancel clause at code level — the wait that ends Cancelled was cancelled by the transport that owns it"
method = "bounded proof"
artifact = "crates/rsk-device/src/presence_kani.rs::no_cross_transport_touch_consumption_cancel"
bound_budget_polls = 3
stops_budget_polls = "any defect that first appears on a fourth poll. The shipped wait polls for its whole ten-second budget at a 16 ms tick — hundreds of iterations — and every one past the third is outside this harness"
bound_unwind = 6
stops_unwind = "nothing beyond the poll budget it covers. At 6 against a budget of 3 the unwinding is slack, so it is not the binding bound on this row and BUDGET_POLLS is; too small would be loud rather than silent, because Kani fails the unwinding assertion"
bound_scopes = 4
stops_scopes = "an arbiter handed a scope byte that is none of the four. `scope` is drawn symbolically over the four SCOPE_* values and assumed to be one of them, so a fifth byte reaching the arbiter is outside the proof"
bound_cancel_producers = 2
stops_cancel_producers = "a cancel from a producer that is neither host path. Both host cancels are raised or not in every slice, so the interleaving of THOSE two is symbolic and a third source of cancellation is not modelled"
bound_stale_cancel_arm = 1
stops_stale_cancel_arm = "the stale-cancel drop at the wait's EXIT. Of the two drops only the one at entry is pinned here; observing the other needs a second wait, which is a unit test's and not this harness's"
shipped_relation = "BUDGET_POLLS is 3 and the unwind bound 6 (crates/rsk-device/src/presence_kani.rs:20-25), against a shipped wait whose budget is MIN_TIMEOUT_SECS 10 s at a 16 ms poll — about 625 iterations. `scope` is fully symbolic over the four SCOPE_* bytes and both host cancels are raised or not in every slice, so the interleaving is symbolic; what is NOT symbolic is the SCHEDULE, because Kani reads the arbiter's atomics sequentially and says so — AS-XT-1. There is no `cfg(kani)` constant shrink on this path: `git grep -n 'cfg(kani)' crates/rsk-device/src` outside the harness files is one hit, the `mod proofs` hook at crates/rsk-device/src/presence.rs:260. SEC-FIDO-001's method table says CTAP_MAX_MESSAGE's shrink puts 'all seven presence_kani.rs harnesses' over a two-continuation transport; measured here, that constant is real for the crate build and INERT for these seven — `RESP_CAP` lives in ctap.rs and ccid.rs and none of the seven constructs either"
cfg = "kani"
features = "kani-soft"

[[method]]
obligation = "tier C: the confirm clause, and the premise it reasons from proved rather than assumed"
method = "bounded proof"
artifact = "crates/rsk-device/src/presence_kani.rs::no_cross_transport_touch_consumption_confirm crates/rsk-device/src/presence_kani.rs::a_hold_that_satisfied_a_ceremony_is_spent_by_it"
bound_ceremonies = 2
stops_ceremonies = "a hold that spans three ceremonies. Two is what the harness runs, the second on a finger that never lifted, and the model's TouchConfirm is what covers a longer hold"
bound_budget_polls = 3
stops_budget_polls = "any defect that first appears on a fourth poll of either ceremony, the same shrink as the cancel row"
bound_unwind = 6
stops_unwind = "nothing beyond the poll budget it covers; at 6 against 3 polls the unwinding is slack on this row too"
bound_scopes = 4
stops_scopes = "a ceremony whose scope byte is none of the four. The two scopes are independently symbolic over the four SCOPE_* values, which is the whole alphabet the type admits and nothing outside it"
shipped_relation = "two ceremonies under independently symbolic scopes, the second running on a finger that never lifted. Stated as one implication rather than an `assume`, so no premise can silently go unreachable, and the premise itself is the second harness rather than an assumption. The Rust proved is STRONGER than the model needs: `spent` carries no owner, so a still-held press confirms for nobody — including the same transport again — while the model's `usedBy` only forbids the CROSS-transport case. Two ceremonies is the bound: a hold spanning three is not proved here and the model's TouchConfirm is what covers it"
cfg = "kani"
features = "kani-soft"

