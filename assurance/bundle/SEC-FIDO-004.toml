# ---- 8. Mutation verdicts ----------------------------------------------------

[[mutation]]
level = "B"
mutant = "BugPpuatIsAGate — EF_PAUTHTOKEN put back in the deferred gate phase, armed ALONE against this invariant alone"
invocation = "formal/run-tlc.sh Solo_BugPpuatIsAGate.cfg"
expected = "RED: NoAccessibleSecretWithoutGate"
verdict = "RED: NoAccessibleSecretWithoutGate, 1 649 404 states, 194 256 distinct, depth 13, 4 s"
fell = "clause 3, RSKeySecurityState.tla:1788 — read off the final state of the counterexample, which has gate.ppuat TRUE, pin.set FALSE, store.cred empty and viol empty, so neither of the other two clauses could have been the one"
direction = "modelled"
reading = "the falsifying state is a persistent grant record standing with EF_PIN already deleted, reached because ResetSweepGates' intra-phase order is a disjunction: with the grant in phase 2 the sweep may take the PIN first and ResetAborts before it takes the grant. The inverse — a grant revoked EARLY — cannot fail this implication at all, because it makes the antecedent false. The configuration checks TypeOK and this invariant and nothing else, so the RED cannot be a neighbour's."

[[mutation]]
level = "B"
mutant = "the same switch against the whole six-invariant set"
invocation = "formal/run-tlc.sh Mut_BugPpuatIsAGate.cfg"
expected = "RED, and on THIS invariant rather than a sibling, because the shallowest violation the switch produces is this one"
verdict = "RED: NoAccessibleSecretWithoutGate, 1 789 255 states, 208 160 distinct, depth 13, 5 s"
fell = "the same clause at the same depth as the solo row, on a trace body with the same md5"
direction = "modelled"
reading = "this row is what says the solo configuration is not doing the work: when the whole set is checked TLC still reports this name first. The pair with the solo row is the direction that matters for attribution — a switch whose multi-invariant run reports a sibling is the shape SEC-FIDO-007 had to correct a credit rule for, and this switch is not it."

[[mutation]]
level = "B"
mutant = "BugResetGatesFirst — the two sweep phases swapped, in the configuration purpose-built to isolate THIS invariant"
invocation = "formal/run-tlc.sh Solo_NoAccessibleSecretWithoutGate.cfg"
expected = "RED: NoAccessibleSecretWithoutGate, and formal/gen-configs.sh:305-307 says the configuration exists because this invariant is the one no switch names as its target"
verdict = "RED: NoAccessibleSecretWithoutGate, 425 619 states, 58 661 distinct, depth 11, 2 s"
