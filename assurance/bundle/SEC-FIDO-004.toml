reading = "the direction here is the finding. Both configurations arm BugPpuatIsAGate; one has the consumer fix and one does not, and they produce the same counterexample, so the FALSE arm changes the reachable set — 1 665 877 generated against 1 789 255 — without changing what falls or where. Nothing in this tree's recorded evidence therefore depends on FixPpuatRequiresPin's value, and the configuration that exists to reproduce E77 reproduces the state E77's producer half leaves rather than the use E77 was."

[[mutation]]
