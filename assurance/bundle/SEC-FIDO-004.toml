#
# THE OWNER-TAG COUNTERPART. Stage 1A п.3's ten-group contract over a
# MODELLED-ONLY row whose derived `rust` column reads 2 and whose two tags are
# both DOWNSTREAM of the record the invariant's live clause is about.
#
# `SEC-FIDO-004` `NoAccessibleSecretWithoutGate`: cfgs=39 mut=2 co=2 kani=0
# fuzz=0 rust=2 test=0. It sits between the two bundles already in the roster —
# more configurations than either, and no bounded proof at all — and it was asked
# for because `SEC-FIDO-007` found a tag on the wrong half of an implication and
# this property was the strongest candidate for the same shape.
#
# THE MEASUREMENT CONFIRMED IT, AND FOUND THREE MORE THINGS BESIDE IT:
#
#  * the invariant is a THREE-clause conjunction and all five of its recorded RED
#    rows fall on the same clause — four of them on the same 13-state behaviour,
#    three of those byte-identical. `mut = 2` and five REDs are one defect
#    observed five times, not a spread;
#  * the first clause, the ghost, is DEAD BY CONSTRUCTION in every configuration
#    that could carry it BUT ONE, and in that one the search reports the third
#    clause first. `viol = {}` in every recorded counterexample;
#  * `Historical_E77.cfg` is the only configuration in the tree that takes the
#    consumer fix out, and its counterexample is byte-identical to the one from a
#    configuration that leaves the fix in. The arm exists and decides nothing.
#
# None of the four is fixed here. `assurance/bundle/SEC-FIDO-007.toml` is the
# worked precedent for a bundle recording a defect it does not repair, and the
# repair for the first one moves locked citation spans, which is its own change.

# ---- 1. Property, subject and owners -----------------------------------------

[property]
id = "SEC-FIDO-004"
invariant = "NoAccessibleSecretWithoutGate"
# `assurance/properties.toml:115`, verbatim.
statement = "No live secret is reachable while the gate record that protects it is gone."
# §4.1's subject classes. TWO are covered. `requirement` is absent for the reason
# the next two fields give: the registered root states that gates EXIST, and the
# clause this property's every recorded failure falls on is about a record that
# root never names.
subjects = ["abstract model", "Rust source"]
subjects_absent = ["requirement", "FFI", "binary", "hardware", "integration"]
requirement = [
  "docs/threat-model.md:27-29 `TM-HOST-GATES` — the registered root, and it is three lines naming WHICH gates exist: PINs/UV with retry counters and lockout, touch on FIDO operations and OpenPGP UIF, OATH access codes, PIV management-key auth",
  "docs/threat-model.md:40-47 `TM-HOST-POWER-CUT` — the clause that actually states this property's rule: `no gate comes up softer on the next boot than it went down`, with a torn authenticatorReset dropping the PIN or alwaysUv record while leaving a credential usable as its worked example. It is NOT the registered root, and it names EF_PIN, EF_ALWAYS_UV and a credential — never the persistent grant",
  "CTAP 2.2 §6.5.5.7.2 step 12 / .3 step 11 — the producer's requirement, cited by the tree at crates/rsk-fido/src/clientpin.rs:413-416 and crates/rsk-fido/src/seed.rs:306-307 and by the model at formal/RSKeySecurityState.tla:723-725, and named in the property registry by nothing",
  "CTAP 2.2 §6.8.2 step 4 — the consumer's, cited at crates/rsk-fido/src/credmgmt.rs:249 and formal/RSKeySecurityState.tla:1166",
]
threat_clause = "docs/threat-model.md#TM-HOST-GATES"
# IT LINKS, IT DOES NOT COVER, and the direction of the gap is measurable.
# `TM-HOST-GATES` is a defence entry: it asserts that gates exist and lists five
# families of them. This property is a COEXISTENCE rule — a secret may not be
# reachable while the record that gates it is gone — and the clause states no
# such rule, no ordering, and no record. The sentence that does state it is a
# different clause of the same page, `TM-HOST-POWER-CUT`, which is registered as
# nobody's root here; and even that one names EF_PIN, EF_ALWAYS_UV and a
# credential, which is clause 2. The clause every one of this property's five
# recorded failures falls on is about EF_PAUTHTOKEN, which no clause of the
# threat model mentions at all.
threat_clause_reading = "the anchor is topical and one layer too general: TM-HOST-GATES says gates exist, this property says a secret may not outlive one. What would fix it is either a re-source onto TM-HOST-POWER-CUT — whose `no gate comes up softer` sentence IS clause 2 — or a threat-model sentence naming the persistent pcmr grant and the rule crates/rsk-fido/src/reset.rs:221-226 already states in prose: the grant's ABSENCE is the restrictive state, so it goes with the secrets and a torn prefix can only ever revoke it early. The registry names one clause and no specification section (assurance/properties.toml:116), which is what SEC-FIDO-006 does not do for the same reset — it names CTAP 2.3 §6.6 beside the clause"
# THE INVARIANT IS THREE CLAUSES, and naming them apart is what the rest of this
# bundle is about. formal/RSKeySecurityState.tla:1777-1788.
clause_ghost = "RSKeySecurityState.tla:1778 — `\"NoAccessibleSecretWithoutGate\" \\notin viol`. One writer: CmBeginViaPpuat at :1195"
clause_credential = "RSKeySecurityState.tla:1779 — `Idle => ((store.cred # {} /\\ SeedReachable /\\ pin.everSet) => pin.set)`. A usable credential on a key that has ever had a PIN implies the PIN record"
clause_structural = "RSKeySecurityState.tla:1788 — `Idle => (gate.ppuat => pin.set)`. The clause the model's own comment at :1780-1787 says it could not carry until eab4b5c: no stranded grant record may EXIST, not merely be refused"
# The files carrying the `Refines … — SEC-FIDO-004` tag the registry greps for.
# Both landed in one commit, 324636e0, on 2026-08-15.
owners_tagged = [
  "crates/rsk-fido/src/credmgmt.rs:253 authorized_by_ppuat",
  "crates/rsk-fido/src/reset.rs:227 is_fido_gate_fid",
]
# AND ONE OF THE TWO IS ON THE CONSEQUENT. `authorized_by_ppuat` writes nothing:
# its whole structural act is `if !ctx.fs.has_data(EF_PIN) { return false }`
# (credmgmt.rs:263-265), a TEST OF `pin.set` — the consequent of clause 3 — after
# which it refuses. It can make neither side of `gate.ppuat => pin.set` true or
# false. In the model it is `FixPpuatRequiresPin`, and RSKeySecurityState.tla
# :1780-1787 says in as many words that the structural clause is `a strictly
# stronger claim than the fix under consideration` — that fix `refuses the record
# and leaves it stranded`. The tag names the clause the function is explicitly
# NOT the owner of. What it does own is clause 1, the ghost, whose only writer
# CmBeginViaPpuat is guarded by exactly this function's model twin.
owners_tag_reading = "the second tag survives the same reading and the first does not. reset.rs:227 `is_fido_gate_fid` owns the DESTRUCTION order — EF_PAUTHTOKEN's absence from the phase-2 set is what stops the grant outliving EF_PIN across a cut — and both of this property's co-refutation patches are against that file, so it is a real owner of clause 3's second falsification route. credmgmt.rs:253 is a consequent test tagged onto a clause the module says it cannot carry, and it is the legitimate owner of a DIFFERENT clause of the same invariant. Neither is the producer"
# THE PRODUCER IS UNTAGGED, and it is the sole way to make the antecedent true.
owners_untagged_producer = "crates/rsk-fido/src/seed.rs:319 — `put_sealed32(dev, fs, EF_PAUTHTOKEN, &tok)` inside `ensure_ppuat` (seed.rs:309-324). `git grep -n EF_PAUTHTOKEN` over crates/ firmware/ tools/ returns one put_sealed32 and it is this one; the only other writer-shaped site is `clear_ppuat`'s force_delete at seed.rs:338, which removes the record. 0x09D9 adds a third: `crates/rsk-fido/src/seed.rs:508` hands EF_PAUTHTOKEN to `migrate_slot`, which re-seals the record under the current kbase arm without minting one"
owners_producer_reading = "the model names it and the code does not. MintPpuat (RSKeySecurityState.tla:726-731) is the ONLY action assigning `gate.ppuat = TRUE`, and its own comment cites `clientpin.rs:414-419, seed.rs:302-313` — so the module points at the two Rust sites, and neither carries a Refines tag of any kind. The sharpest form of it is six lines long: `clear_ppuat`, the function immediately below `ensure_ppuat` in the same file, DOES carry a tag (seed.rs:336, `Refines RSKeySecurityState!NoTokenAfterInvalidation — SEC-FIDO-003`). The producer is untagged next to a tagged destroyer. `git log -S` over seed.rs shows this property's tag was never there"
# What the `rust` column measures, MEASURED rather than argued — see the two
# mutation rows that drove it.
rust_column_reading = "`assurance_gate.grep_word` matches the bare invariant name anywhere in a production file and returns FILE NAMES (scripts/assurance_gate.py:220-222), so `rust = 2` counts files that MENTION the invariant. Driven both ways: a SECOND tag inserted into reset.rs leaves the column at 2, and the tag added to seed.rs takes it to 3. So the missing producer tag costs the column exactly one, and the column is the only derivation in the tree where its absence could ever have shown — and it shows as a number one lower, never as a finding"
# The files the co-refutation patches touch, which the derived column cannot see.
owners_co_refuted = ["crates/rsk-fido/src/reset.rs"]
# The tests that kill the code twin, recorded here because they count in NO
# derived column: the `rust` axis drops filenames containing `tests`, and the
# `test` axis reads only `tests/**/*.py`.
owner_of_the_kill = [
  "crates/rsk-fido/src/reset_tests.rs:626 the_gate_set_defers_every_record_whose_absence_is_permissive",
]
# It used to be these three. The two torn-wipe tests stopped owning this kill when
# provisioning began minting the grant (bcdDevice 0x09CB): `ensure_seed` runs at the
# end of `reset`, so the record the mutant defers is deleted and re-minted anyway and
# the state those tests watch for — the ISSUED value standing over a deleted PIN —
# is no longer reachable through them. Measured, not argued: under the patch the one
# tear point that loses the PIN reports `grant_is_issued=false`, and the suite falls
# from three tests to one. The survivor is the structural test that reads the gate
# set itself, which is what the patch actually changes.
retired_owners_of_the_kill = [
  "crates/rsk-fido/src/reset_tests.rs:1163 a_torn_reset_never_leaves_a_grant_without_its_pin",
  "crates/rsk-fido/src/reset_tests.rs:1184 a_torn_device_wide_wipe_never_leaves_a_grant_without_its_pin",
]
# AND THE SECOND FINDING. Five configurations report this invariant RED. Every
# one of them falls on clause 3.
clause_attribution = "read out of the five recorded counterexamples, not inferred: Historical_E77, Mut_BugPpuatIsAGate and Solo_BugPpuatIsAGate end in a state whose trace body is BYTE-IDENTICAL — 404 lines, one md5 — and Mut_BugSetPinKeepsPpuat differs from them in two lines, `gate.ppuatStale` at states 4 and 5. All four end at `ResetAborts` with `store.cred = {}`, `viol = {}`, `pin.set = FALSE` and `gate.ppuat = TRUE`, which falsifies clause 3 and leaves clauses 1 and 2 with their antecedents false. Solo_NoAccessibleSecretWithoutGate reaches the same falsifying shape two states earlier. So no recorded run in this tree observes clause 1 or clause 2 failing, and `formal/README.md`'s own `The clause nobody owned` section describes exactly this for ResetNeverWeakensSurvivingState and answered it with SoloClause_*.cfg — a machine this invariant has never been put through"

# ---- 2. Commit, build and features -------------------------------------------

[build]
commit = "31c21a771734c1fc87f093c38125bffbee47c558"
tree_state = "the recorded TLC rows were taken at b819ee5 and `git diff b819ee5..31c21a7 -- formal/*.tla formal/*.cfg formal/*.sh` is EMPTY, so they describe the model at this commit. The working tree was NOT clean while this was written: sibling bundle work was landing uncommitted edits across CHANGELOG.md, assurance/, docs/, scripts/ and formal/ throughout, and the untracked FORMAL_VERIFICATION_ROADMAP.md was present. Two of those touch this bundle's inputs and both were checked rather than assumed. `formal/RSKeySecurityState.tla`'s uncommitted diff is COMMENT-ONLY — two hunks at :45 and :169-170, one and two lines each side, both net-zero and both above line 200 — so nothing in that file shifted, every line number cited here was re-verified against the working tree, and the invariant still begins at :1777. New `PermWideMut_*` configurations arrived in formal/ mid-session and moved the assumption gate's arm counts; none of them names this invariant, so `cfgs` did not move. `formal/gen-configs.sh` gained 69 lines in the same window, and EVERY `gen-configs.sh:<line>` in this file is the WORKING-TREE number — the tree this bundle is committed in — rather than 31c21a7's: `formal/gen-configs.sh:75` and `:106` sit above the first insertion and did not move, while the four past line 200 — `:296-300`, `:305-307`, `:305-306` and `:305` — stood at lines 227-231, 236-238, 236-237 and 236 at that commit, 69 lines earlier in the file, and were re-taken by content. `build.commit` above stays at 31c21a7 all the same, and has to: `scripts/evidence_gate.py:459-490` dates a bundle by a commit git can resolve, and the commit that will carry this file does not exist while it is being written — so the field names the commit the TLC rows and the code twin were taken at, and the citations name the file a reader will open. The visible consequence is intended: once these formal/ inputs land in a commit that is not an ancestor of 31c21a7, the freshness axis reports this bundle behind them, which is that axis working and not a citation rotting. The code twin was driven in a worktree checked out at 31c21a7, not against the working tree. Every line number here was verified by CONTENT first; `scripts/citation_gate.py:368-374` now derives the evidence bundles into its corpus off the directory, so the ones it can resolve — `.rs`, `.sh` and `.txt` — are held by a gate as well"
matrix_column = "firmware"
cargo_features = "the default workspace feature set, with no feature flag added or removed — the code twin's slice is `cargo test -p rsk-fido` on that default, and no configuration here selects a build"
board_knobs = "BOARD unset, LED_KIND unset, the default 4 MB layout — and nothing here reads any of the three, which is why the equivalence below is over the whole column set"
host_triple = "aarch64-apple-darwin"
firmware_triple = "thumbv8m.main-none-eabihf"
machine = "18 cores, macOS 27.0 aarch64 — the figure TLC's own banner records in every artifact below, so this line and the logs cannot disagree"
# A model check plus a host-test slice read no board preset and no flash
# geometry, so the two feature-identical columns carry the same evidence.
equivalent_columns = ["firmware-pico", "waveshare-one"]

# ---- 3. Method and scope/bounds ----------------------------------------------

# SEVEN ways and no prover. `kani = 0` is CORRECT rather than unfilled and
# AS-F004-5 is the row that says why: the C-tier reset bridge has no field for
# the record clause 3 is about, so a harness written over it could not state the
# property. No harness invented below, and no TLC run performed for this bundle —
# every model verdict is a row of `formal/runs.toml` recorded at b819ee5, whose
# raw log is the artifact beside it.

[[method]]
obligation = "the invariant over the whole reachable space at the SHIPPED constants"
method = "model-check"
artifact = "formal/RSKeySecurityState.tla::NoAccessibleSecretWithoutGate + Shipped.cfg::NoAccessibleSecretWithoutGate"
bound_rps = 2
stops_rps = "a falsifying state that first arises over a third relying party. The clause names two booleans and no relying party, so what two costs is reach and not a term"
bound_channels = 2
stops_channels = "a falsifying state that first arises over a third concurrent channel — reach again, for the same reason"
bound_max_retries = 8
stops_max_retries = "nothing by shrinking: eight IS the shipped ladder, and this is the ONE of the four green configurations that runs it. The ladder is off this property's path and is what makes the PIN doors reachable at all"
bound_mismatch_limit = 3
stops_mismatch_limit = "nothing by shrinking, for the same reason as the ladder it pairs with — three IS the shipped mismatch limit"
bound_max_clock = 1
stops_max_clock = "any falsifying state that needs a second unit of elapsed time. One Tick is the whole clock here"
bound_reset_window = 0
stops_reset_window = "the in-window arm. At zero a reset may start only at clock 0, so a gate record dropped during a legitimate power-up-window reset is a prefix no run on this row produces"
shipped_relation = "MaxRetries and MismatchLimit ARE the shipped MAX_PIN_RETRIES (8) and PIN_MISMATCH_LIMIT (3) at crates/rsk-fido/src/consts.rs:368,372; RPs and Channels are 2 against an unbounded device; MaxClock 1 is the smallest value at which Tick is not dead; ResetWindow 0 runs the window closed only. THE RETRY LADDER IS NOT ON THIS PROPERTY'S PATH — `gate.ppuat => pin.set` names two booleans and no constant — but the ladder is what makes the PIN doors reachable, so what the six buy is the state set a falsifying state would have to appear in. And this is the ONE row of the four GREEN configurations that runs the shipped ladder at all: the other three set MaxRetries 2 and MismatchLimit 1, and two of those run one RP"
cfg = "none"
features = "none"

[[method]]
obligation = "the same invariant on the other arm of the three standing assumptions that have one"
method = "model-check"
artifact = "AlwaysUv.cfg::NoAccessibleSecretWithoutGate + PermWide.cfg + ForceChange.cfg"
bound_rps = 2
stops_rps = "a falsifying state that first arises over a third relying party, on all three arms — and on two of the three the count is 1, so those rows have no second relying party at all"
bound_channels = 2
stops_channels = "a falsifying state that first arises over a third concurrent channel, on all three arms"
bound_max_retries = 2
stops_max_retries = "the six rungs between two and the shipped eight. All three arms run the reduced ladder, so the shipped constants are Shipped.cfg's alone"
bound_mismatch_limit = 1
stops_mismatch_limit = "the two mismatches between one and the shipped three, on all three arms"
bound_configurations = 3
stops_configurations = "any arm of a standing assumption that no configuration takes. Three arms are three rows, and of the four configurations asserting this invariant three are the alwaysUv arm the default image does not build"
shipped_relation = "three arms and one caveat that is the honest half. AlwaysUvShipped is TRUE here and FALSE on Shipped.cfg, so BOTH arms of that assumption check this invariant; of the four configurations that ASSERT it, PermWide.cfg is the only one on WidePerms' TRUE arm and ForceChange.cfg the only one on ForceChangeModelled's — the roster's other configurations taking either arm are mutants, which name this invariant in order to fall past it rather than to assert it. The caveat: all three run a REDUCED ladder (2:1 against the shipped 8:3, formal/AlwaysUv.cfg:6-7) and PermWide.cfg and ForceChange.cfg run ONE relying party. So of the four configurations that assert this invariant GREEN, three are the alwaysUv arm the default image does not build, and the shipped constants are Shipped.cfg alone"
cfg = "none"
features = "always-uv is modelled as the compiled default on the AlwaysUv arm, not built — no image was produced for any row here"

[[method]]
obligation = "non-degeneracy: the invariant CAN go red, and the red names it rather than a sibling"
method = "model-check"
artifact = "Solo_NoAccessibleSecretWithoutGate.cfg::BugResetGatesFirst + Solo_BugPpuatIsAGate.cfg"
bound_invariants = 2
stops_invariants = "anything about the rest of the invariant set. Each configuration checks TypeOK and this name and nothing else — which is what tells this kill from a neighbour's, and it is needed here because on a multi-invariant configuration TLC reports the first violated name and it need not be this one"
bound_armed_switches = 1
stops_armed_switches = "any defect needing two switches at once. One armed switch is what attributes the red to the defect that was injected"
bound_counterexample_states = 11
stops_counterexample_states = "nothing — eleven is a MEASURED trace length and not a bound the configuration imposes. It is the shorter of the two rows; the same clause needs thirteen on the other"
bound_depth = 11
stops_depth = "nothing, for the same reason: the depth is what the search found and not a cap it was given, so it cannot say that a longer trace would find nothing else"
shipped_relation = "the two bounds above are Solo_NoAccessibleSecretWithoutGate.cfg's, the SHORTER of the two rows; Solo_BugPpuatIsAGate.cfg needs 13 states and depth 13 for the same clause. Each configuration checks TypeOK and this invariant and NOTHING ELSE — formal/Solo_NoAccessibleSecretWithoutGate.cfg:50-52 and formal/Solo_BugPpuatIsAGate.cfg:50-52 — and arms exactly one Bug* switch with every other FALSE, which is what tells this kill from a neighbouring invariant's. It is needed in a way it is not on Shipped.cfg: formal/gen-configs.sh:106 puts this invariant in ALL_INV, so on a multi-invariant configuration TLC reports the first violated name and it need not be this one — measured, Solo_BugSetPinKeepsPpuat.cfg reports NoTokenAfterInvalidation under the same switch whose Mut_ twin reports this invariant"
cfg = "none"
features = "none"

[[method]]
obligation = "which of the three clauses the recorded verdicts are actually about"
method = "exhaustive sweep"
artifact = "formal/runs.toml + assurance/bundle/logs/SEC-FIDO-004/tlc-Historical_E77.log + assurance/bundle/logs/SEC-FIDO-004/tlc-Solo_NoAccessibleSecretWithoutGate.log"
bound_clauses = 3
stops_clauses = "two clauses of three. Only one is observed to fail anywhere in this tree, so for the other two there is no evidence that a red is even reachable"
bound_red_rows = 5
stops_red_rows = "nothing by sampling — five is every row of `formal/runs.toml` whose verdict names this invariant, and every one of the five has its raw log in the backed-up tier. What exactness does not buy is discrimination: the apparatus reports all five the same way"
bound_distinct_counterexamples = 2
stops_distinct_counterexamples = "any failure mode outside the two traces. Both end at the same action with the same two fields set, so the five red rows are two observations and not five"
bound_clauses_observed = 1
stops_clauses_observed = "non-degeneracy for the two clauses nothing falsifies. One of three is observed to fail; the other two are asserted by every configuration and refuted by none, which is the state a passenger conjunct would also be in"
shipped_relation = "the sweep is EXACT and not sampled: every row of formal/runs.toml whose verdict names this invariant is five, every one of the five has its raw log in the backed-up tier, and every one of the five final states was read. Two distinct counterexamples: a 13-state one shared by four rows (three of them byte-identical over the 404-line trace body, the fourth differing in the two lines that carry gate.ppuatStale) and an 11-state one. Both end at ResetAborts with gate.ppuat TRUE and pin.set FALSE. The bound that matters is the last: ONE of three clauses is observed to fail anywhere in this tree, and the apparatus reports all five as `RED: NoAccessibleSecretWithoutGate` without distinguishing them"
cfg = "none"
features = "none"

[[method]]
obligation = "the production side: which sites own each half of clause 3, and whether the tagged owners are among them"
method = "review"
artifact = "crates/rsk-fido/src/seed.rs::ensure_ppuat + crates/rsk-fido/src/credmgmt.rs::authorized_by_ppuat + crates/rsk-fido/src/reset.rs::is_fido_gate_fid"
bound_tagged_owners = 2
stops_tagged_owners = "any owner outside the two tagged sites. This is a count of SITES and not a shrink of a shipped constant, because a review has no other unit"
# 0x09D9 SUPPLIED THIS ROW'S OWN FALSIFIER, which is the bound working rather than
# rotting: the boot pass now re-seals EF_PAUTHTOKEN (seed.rs:508), a second
# writer-shaped site. It rewrites the record under the current arm and produces no
# grant, so clause 3's argument is unchanged — but the write side this bundle read
# is no longer the whole of it. The count is what was reviewed, and it stands.
bound_producer_sites = 1
stops_producer_sites = "a second producer. One `put_sealed32` of the record is the whole write side that was read, so the argument is as complete as that grep is"
bound_consumer_sites = 3
stops_consumer_sites = "a reader the three do not include, and any claim about ORDER: the count says which sites read the record, never that a reader runs after the producer it depends on"
bound_sweep_sites = 2
stops_sweep_sites = "any phase of the wipe outside the two sweep predicates. One puts the record in the SECRETS phase and one keeps it out of the GATES phase, and a third classification site would be outside the review"
bound_files_in_argument = 5
stops_files_in_argument = "anything in a sixth file. Five files carry the argument, two of them only through cfg-gated projections that reach no image"
bound_crates = 2
stops_crates = "a site in a third crate. The argument spans two, so a consumer of this record outside them is not covered"
shipped_relation = "one producer (seed.rs:319, the sole put_sealed32 that MINTS the record; 0x09D9's boot re-seal at seed.rs:508 writes it again and mints nothing); three consumers (seed.rs:302 load_ppuat, credmgmt.rs:266 through it, and clientpin.rs:418 which is also the producer's call site); two sweep sites (reset.rs:275 is_fido_fid, which puts the record in the SECRETS phase, and reset.rs:248 is_fido_gate_record, which keeps it out of the GATES phase). Five files — seed.rs, credmgmt.rs, clientpin.rs, reset.rs and crates/rsk-device/src/ctap.rs:201,236, the two cfg-gated projections — across rsk-fido and rsk-device. This bound is a count of sites and not a shrink of a shipped constant, because a review has no other unit; the honest reading of that is in the counterpart bundle and it applies here too"
cfg = "the two projection sites at rsk-device/src/ctap.rs are cfg-gated and reach no image; every other site above is unconditional production code"
features = "none"

[[method]]
obligation = "the code twin: the same defect injected into production Rust, driven against the tree's own suite"
method = "mutation"
artifact = "formal/comutants.toml::BugPpuatIsAGate + crates/rsk-fido/src/reset.rs::is_fido_gate_record + crates/rsk-fido/src/reset_tests.rs::a_torn_reset_never_leaves_a_grant_without_its_pin"
bound_patch_hunks = 1
stops_patch_hunks = "any defect the single hunk cannot express. The patch reverts one commit in the shipped file, so what is driven is that defect and not the class it belongs to"
bound_patched_files = 1
stops_patched_files = "a defect that has to span two files"
bound_tests_fallen = 1
stops_tests_fallen = "which assertion is load-bearing. One test falls now and the count says the mutant died, not that the test was written for this property — it reads the gate set, which is what the patch edits. It was three before provisioning began minting the grant; see retired_owners_of_the_kill for why the two torn-wipe tests no longer reach the state"
