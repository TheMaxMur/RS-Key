direction = "modelled"
reading = "the reading is a correction of the configuration's own comment. It was written on 2026-08-12 to demonstrate BugResetGatesFirst falsifying the credential clause; the structural clause was added later, and the search now reaches it at depth 11 through ResetAborts with no credential in play. The comment at formal/gen-configs.sh:305-306 is stale for a second reason as well — `no switch names this invariant as its target` stopped being true on 2026-08-13, sixteen hours after it was written, when formal/gen-configs.sh:75 gave BugPpuatIsAGate exactly that target."

[[mutation]]
level = "B"
mutant = "the consumer fix taken out beside the producer switch — FixPpuatRequiresPin = FALSE, the only such configuration in the tree"
invocation = "formal/run-tlc.sh Historical_E77.cfg"
expected = "RED reproducing E77: a stranded grant USED on a key whose PIN record is gone, which is the ghost clause"
verdict = "RED: NoAccessibleSecretWithoutGate, 1 665 877 states, 196 340 distinct, depth 13, 4 s — and NOT on the ghost"
