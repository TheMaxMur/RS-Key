b_mut_names_this_invariant = "all three Mut_ twins report THIS invariant and not a sibling's — Mut_BugCredBeforeRp RED: NoUnmanageableCredential, 7031 states, 1893 distinct, depth 7, identical to its Solo_ twin's counts. That is the opposite of SEC-FIDO-007's experience, and the mechanism is formal/gen-configs.sh:185-187: a Mut_ configuration lists its target invariant FIRST, and TLC reports the first invariant violated. The attribution question that bundle had to answer therefore does not arise here"
b_historical_e76 = "Historical_E76.cfg GREEN — 986 872 269 states, 77 563 872 distinct, depth 58, 1927 s, complete search, from formal/runs.toml's safety tier recorded at 9cafee7. THE RUN OF THE NEW CONTENT NOW EXISTS: the file carries the counterfactual repair (formal/gen-configs.sh:322), formal/floors.txt:Historical_E76.cfg asks GREEN of it, and the recording answers. What that GREEN is evidence OF is the repair, not the property — the one-line control Mut_BugSeedDoesNotLead.cfg is still RED: NoUnmanageableCredential at 1 875 109 states, so the green is the conjunct at RSKeySecurityState.tla:1405 doing work rather than an invariant nothing can break. The superseded reading is kept in this bundle's header: the old verdict was RED at those same 1 875 109 states, and it was a finding about the roster — the two files were then byte-identical. Note what the new run costs: the SAME 77 563 872 distinct states Shipped.cfg finds, at the same depth 58, for 36 072 more states generated and 11 s LESS wall clock"
b_denominator = "of the forty configurations naming the invariant: 5 GREEN (AlwaysUv, ForceChange, Historical_E76, PermWide, Shipped), 6 RED naming it (3 Solo_, 3 Mut_) and 29 RED naming another property first — 12 NoAuthorizationBypass, 6 NoTokenAfterInvalidation, 5 NoCrossTransportTouchConsumption, 3 NoAccessibleSecretWithoutGate (Historical_E77 among them) and 3 ResetNeverWeakensSurvivingState. A configuration CHECKING an invariant is not evidence about it, and this is what that costs on this row: 29 of the 40 are a mutant of something else. The fortieth was a second copy of another when this was written and is now the one distinct experiment nothing else runs, so the denominator is forty distinct. RE-DERIVED against the safety tier recorded at 9cafee7, and the prediction the superseded split carried was right in both halves: E76 moved RED to GREEN, `7 RED naming it` became six, and the fifth assertion arrived"

# THE CODE TWIN, driven. One of three; the other two are the register's.
c_twin = "the two hunks of formal/comutants.toml:96-123 applied to crates/rsk-fido/src/credential.rs in a detached worktree at this commit, then `cargo test -p rsk-fido --lib --target aarch64-apple-darwin`: FAILED, 667 passed; 2 failed; 1 ignored, 11.75 s. The patch moves `bump_rp` from ahead of the EF_CRED write to behind it — the shipped file, not a model edit"
