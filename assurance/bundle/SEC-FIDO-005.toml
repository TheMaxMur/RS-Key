id = "AS-CRED-3"
statement = "No action of `RSKeySecurityState` can fail a flash write: the model's only tears are `PowerCut` and `ResetAborts` between two writes that succeeded, so an `Fs::put` returning `Err` — and a best-effort rollback that itself fails — is outside every configuration this property is checked on."
