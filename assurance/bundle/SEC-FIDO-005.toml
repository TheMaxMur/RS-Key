# `scripts/platform_gate.py:1890-1918` derives every id below and fails in BOTH
# directions until an entry claims it.
#
# INTEGRATOR: merging the proposals flips four `registered` fields in this file
# from `no` to `yes` — AS-CRED-2, AS-CRED-3, AS-CRED-4 and AS-CRED-5. They read
# `no` today because that is what the registry says today, and `check_bundles`
# compares `registered.startswith("yes")` against the registry in both
# directions, so a `yes` written ahead of the merge is a claim the registry does
# not make and a `no` left after it is the same error mirrored.

[[assumption]]
id = "AS-CRED-1"
statement = "`store.cred` and `store.rpent` are SETS of relying parties — one credential per RP — so the EF_RP count byte that `bump_rp` increments and `decrement_rp` decrements does not exist in the model, and neither does any interleaving that needs two credentials of one relying party."
kind = "model abstraction"
discharger = "the store slice of stage 5, and until then the two host tests that reach where the model cannot: crates/rsk-fido/src/credmgmt_tests.rs:2166 deleting_one_of_two_credentials_writes_back_to_its_own_rp_slot exists precisely because `decrement_rp`'s write-back path (credmgmt.rs:715) is a fourth EF_RP write that no sole-credential test reaches. The count is where this property's sharpest unmodelled failure would live: a count that under-runs deletes the EF_RP record with a credential still behind it, which is the invariant's forbidden direction, and crates/rsk-fido/src/credential.rs:937-942 says in its own comment that a 256th credential once recorded 255 and did exactly that (audit run-35)"
expressible = "no — a cardinality, not a boolean; scripts/assumption_gate.py accepts a boolean CONSTANT and nothing else"
registered = "yes — assurance/platform.toml PLAT-MODEL-002, pending, whose statement is this assumption in as many words and whose `supports` already names SEC-FIDO-005. Its `covers` needs `slice:AS-CRED-1` beside the AS-AUTH-6 it holds; an extension, not a new row"

[[assumption]]
id = "AS-CRED-2"
statement = "`r \\in store.rpent` means the EF_RP record for r is REACHABLE by the management surface, and in the shipped tree it means only that the record exists: both surfaces additionally require the read to succeed, the count byte to be positive and the rpId to unseal."
kind = "model fidelity"
discharger = "reading the two surfaces apart, and there is no run behind it. crates/rsk-fido/src/credmgmt.rs:364, :368 and :402 and crates/rsk-fido/src/passkeys.rs:113, :117 and :122 are the six `continue`/error arms; the third pair does not even agree — enumerate_rps answers CtapError::Other for the whole walk while for_each_rp skips one record. Of the three the read-failure arm is the one a live medium reaches, and docs/threat-model.md:60-93 states it as a threat of its own. What would discharge this is either a second model variable for `listable` or a test at each surface driving a refused EF_RP read and asserting what the owner is shown"
