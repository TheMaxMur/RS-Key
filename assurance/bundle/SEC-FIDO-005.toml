#
# `SEC-FIDO-005` `NoUnmanageableCredential`: cfgs=40 mut=3 co=3 kani=0 fuzz=0
# rust=3 test=0 — the same ten groups, the same floors, the same
# `scripts/bundle_gate.py` the first two are held to.
#
# Three things about it are worth reading before the table:
#
#  * `FORMAL_VERIFICATION_ROADMAP.md:2538-2543` says this property "числится в
#    `threat_clauses.toml` `[[untraced]]` с вердиктом `missing-clause`", and that
#    the stage-4 exit is therefore unreachable BY DEFINITION. That is STALE.
#    `assurance/properties.toml:123` roots it at `TM-HOST-CRED-REVOCABLE` today
#    and `scripts/threat_gate.py` serves the edge; the only `[[untraced]]` row
#    left is `SEC-FIDO-007`'s. This bundle's first job was to check that, and its
#    second was the harder question the programme has been burned by — whether
#    the clause COVERS the property or merely links to it. It covers, and it
#    covers MORE than the invariant asserts. `property.threat_clause_reading`
#    carries the quotes.
#  * `kani = 0` here is a CORRECT zero, in the sense `SEC-FIDO-007` established
#    for its own, but for a different reason: there, the neighbouring reset
#    harnesses are deliberately WIDER than the invariant; here there is no
#    neighbouring harness at all — `crates/rsk-fido/src/credmgmt_kani.rs`'s four
#    proofs are three of SEC-FIDO-001's Begin decisions and one of SEC-FIDO-003's,
#    and no Kani harness in this tree draws an `EF_CRED`/`EF_RP` pair. So the
#    method group below has no `bounded proof` row, and
#    `result.k_no_bounded_proof` says which obligation that leaves with no
#    machine-checked source evidence and what would close it.
#  * ONE OF THE FORTY CONFIGURATIONS WAS A SECOND COPY OF ANOTHER, AND IS NOT
#    ANY MORE. `diff formal/Historical_E76.cfg formal/Mut_BugSeedDoesNotLead.cfg`
#    was EMPTY when this bundle was written — both emitted with identical
#    arguments — so the `cfgs = 40` denominator counted 39 distinct
#    configurations. `formal/gen-configs.sh:322` now emits the first as
#    `emit Historical_E76.cfg BugSeedDoesNotLead TRUE TRUE` and the `Mut_` loop
#    at `:329` still passes FALSE, so the two files differ at exactly one line —
#    `48c48`, `FixSweepDropsCredsBeforeRpEntries` — and the forty are forty
#    distinct configurations. THE FINDING SURVIVES AS ITS REPAIR: what E76 now
#    runs is the counterfactual repair nothing else in the tree runs, and the
#    tier recorded at 9cafee7 has RUN it — GREEN over a complete search, where
#    the superseded twin aborted RED. Every number on this bundle's E76 rows is
#    re-derived from that record; the RED reading is kept as the roster finding
#    it was — see `result.b_historical_e76`.

# ---- 1. Property, subject and owners -----------------------------------------

[property]
id = "SEC-FIDO-005"
invariant = "NoUnmanageableCredential"
# `assurance/properties.toml:122`, verbatim.
statement = "Every live credential is reachable by the management surface: its EF_RP entry exists."
# §4.1's subject classes. THREE are covered — the requirement is real (the next
# two fields), the model asserts the invariant on four configurations, and three
# production files carry the tag — and the fifth entry of `subjects_absent` is
# not a class but the obligation this bundle has no machine-checked source
# evidence for, named where a reader of the subject list will meet it.
subjects = ["requirement", "abstract model", "Rust source"]
subjects_absent = [
  "FFI",
  "binary",
  "hardware",
  "integration",
  "bounded proof over the Rust source — no harness in this tree bounds the implication at the code level",
]
subjects_absent_reading = "the missing obligation is exactly this: that `credential_store`'s ordered writes and `decrement_rp`'s removal keep `EF_CRED ⊆ EF_RP` over an ARBITRARY interleaving of flash outcomes, rather than over the write budgets two host tests enumerate. What stands in its place is `crates/rsk-fido/src/credential_tests.rs:648` and `crates/rsk-fido/src/credmgmt_tests.rs:2265`, which sweep a failure budget across the sequence and assert the implication at every failing point — evidence, and bounded by a loop rather than by a solver. What would close it: a harness over `rsk-fs`'s `Fs` with a symbolic write/delete outcome per step, in the shape `crates/rsk-fs/src/powercut_kani.rs` already has for the store's own tears, asserting `has_data(EF_CRED + s) => has_data(EF_RP + j)` after `credential_store` and after `delete_credential`. It is NOT written here: adding a harness would move the derived `kani` column and the status word with it, which is stage 4's call and not a bundle's"
requirement = [
  "CTAP 2.3 §6.8 authenticatorCredentialManagement — enumerateRPs (0x02/0x03), enumerateCredentials (0x04/0x05) and deleteCredential (0x06), the surface the property is named for",
  "docs/threat-model.md:94-115 `TM-HOST-CRED-REVOCABLE` — the clause, which states the implication in prose and states the write ORDER that buys it",
  "assurance/properties.toml:123 — the registry's own `source`, both of the above, and the row `threat_gate.py` now serves",
]
threat_clause = "docs/threat-model.md#TM-HOST-CRED-REVOCABLE"
# AND IT COVERS. This is the field `SEC-FIDO-007` had to answer `no` to, so the
# comparison is the point. That clause (TM-ZEROIZATION) was topical and not the
# claim; this one states the claim: "a credential whose `EF_RP` entry is missing
# is one `getAssertion` signs with happily and neither surface will show you" IS
# `store.cred \subseteq store.rpent` in prose, over the same two records, naming
# the same two browse surfaces the model's `store.rpent` abstracts. It goes on to
# state the ordering the model's `RegisterWriteA`/`RegisterWriteB` encode — "the
# `EF_RP` entry is written before the credential, and the credential goes before
# the count that names it" — and the reset carve-out `BugSeedDoesNotLead` is the
# mutant of: "**The resets are not, and this page will not pretend otherwise.**"
threat_clause_reading = "a covering, and the two places it is WIDER than the invariant are what a reader owes. First, the clause's subject is `see and revoke`, and the invariant formalises only `its EF_RP entry exists` — the clause itself says the gap out loud (`what a strand costs is DISCOVERY, and revocation only so far as revoking a thing means finding it first`), and the code side of that gap is `result.r_management_surface`: an EF_RP record that exists but does not READ, does not carry a positive count, or does not UNSEAL is skipped by both surfaces, and the model's set membership cannot tell any of the three from a healthy record. Second, the clause admits a residual the invariant does not — `a torn wipe can still strand a credential, and what the ordering buys is that the survivor is undecryptable rather than that it does not exist` — while `Shipped.cfg` is GREEN, because `KeepOpen` (RSKeySecurityState.tla:309) empties `store.cred` the moment the last seed copy goes. The clause and the model do not disagree; the model equates `undecryptable` with `absent`, and AS-CRED-4 is the row that says so. Neither widening is a mis-mapping: the clause is about these records, these surfaces and this order, which is what `SEC-FIDO-007`'s anchor was not"
# The three files `assurance_gate.grep_word` counts as `rust = 3`. Read the
# derivation before the column: it matches the bare invariant name anywhere in a
# production file (`kani`/`tests` names dropped) and returns FILE NAMES, so a
# second tag in a counted file moves nothing.
owners_tagged = [
  "crates/rsk-fido/src/credential.rs:795 credential_store — the producer of the ANTECEDENT (`store.cred`) and the site that writes the consequent first",
  "crates/rsk-fido/src/credmgmt.rs:687 decrement_rp — the sole destroyer of the CONSEQUENT (`store.rpent`)",
  "crates/rsk-fido/src/passkeys.rs:89 for_each_rp — the management surface, which is what `unmanageable` MEANS",
]
# BOTH HALVES OF THE IMPLICATION ARE COVERED, and the grep that shows it is
# `grep -rn NoUnmanageableCredential crates/ firmware/`: five hits, three of them
# in production files, one per half plus the reader. That is a better tag set
# than `SEC-FIDO-007`'s, whose single tag sat on the consequent alone.
owners_tag_reading = "covered, and two named gaps rather than a wrong tag. The gaps are the SOLE producer of the consequent, `crates/rsk-fido/src/credential.rs:901 bump_rp`, which writes `rec[0] = 1` into a fresh EF_RP record and carries no tag of any kind; and `crates/rsk-fido/src/reset.rs`, which destroys BOTH sides in one sweep, carries six `Refines` tags for four OTHER properties (SEC-FIDO-004, -006, -006A, -006B, -006C at :35, :105, :199, :217-219, :285) and none for this one — while being the file `formal/comutants.toml`'s third co-mutant patches and the file whose model twin `ResetSweepSecrets` produces the deepest counterexample this property has. Neither absence moves the derived column: `credential.rs` and `reset.rs` are one file each, and `credential.rs` is already counted"
# Every production site that writes either side, enumerated because the tag set
# names three functions and the sites are ten — eight entries, of which the third
# names the three best-effort rollbacks together.
owners_writers = [
  "crates/rsk-fido/src/credential.rs:853 — `bump_rp(...)?` inside `credential_store`, the EF_RP write that LEADS the credential (the order the threat clause states)",
  "crates/rsk-fido/src/credential.rs:888 — `fs.put(EF_CRED + slot, ...)`, the antecedent's only producer",
  "crates/rsk-fido/src/credential.rs:867, :884, :890 — the three best-effort `let _ = decrement_rp(...)` rollbacks, each itself a flash write",
  "crates/rsk-fido/src/credmgmt.rs:672 — `delete_credential`'s `fs.delete(EF_CRED + slot)`, the antecedent's destroyer, ahead of the RP work",
  "crates/rsk-fido/src/credmgmt.rs:711 — `let _ = fs.delete(EF_RP + j)` at count zero, the consequent's destroyer",
  "crates/rsk-fido/src/credmgmt.rs:715 — `fs.put(EF_RP + j, ...)` on the write-back path, the count decrement that does NOT delete",
  "crates/rsk-fido/src/passkeys.rs:284 — the trusted-display delete's `let _ = decrement_rp(...)`, the same effect keyed by slot",
  "crates/rsk-fido/src/reset.rs — the wipe, which deletes the seed first and then sweeps EF_RP and EF_CRED in flash-ring order (the clause's stated carve-out)",
]
owners_readers = [
  "crates/rsk-fido/src/credmgmt.rs:335 enumerate_rps — CTAP 0x02/0x03, the host's browse surface; it walks EF_RP and never EF_CRED",
  "crates/rsk-fido/src/passkeys.rs:89 for_each_rp — the trusted-display Passkeys view, the second EF_RP walk",
  "crates/rsk-fido/src/credmgmt.rs:640 find_resident — deleteCredential's own EF_CRED scan, which is why a strand costs discovery and not revocation outright",
]
# The three files `formal/comutants.toml` patches for this property, which the
# derived `co = 3` counts and no tag names.
owners_co_refuted = [
  "crates/rsk-fido/src/credential.rs — BugCredBeforeRp, two hunks",
  "crates/rsk-fido/src/credmgmt.rs — BugDeleteRpBeforeCred, two hunks",
  "crates/rsk-fido/src/reset.rs — BugSeedDoesNotLead, one hunk",
]
# The tests that kill them, recorded here because they count in NO derived
# column: `assurance_gate`'s `rust` axis drops filenames containing `tests`, and
# its `test` axis reads only `tests/**/*.py`.
owner_of_the_kill = "crates/rsk-fido/src/credential_tests.rs:648 a_failed_registration_never_leaves_a_credential_without_its_rp and its mirror at :702 a_failed_registration_leaves_neither_the_credential_nor_its_rp_entry; for the delete half, crates/rsk-fido/src/credmgmt_tests.rs:2265 a_torn_delete_never_leaves_a_credential_without_its_rp"

