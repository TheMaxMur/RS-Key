stops_model_actions_that_can_fail = "every one of the five leaks. No action of the model can FAIL a flash write, so an `Err` returned by `Fs::put` and a best-effort rollback that itself fails are outside every configuration in this bundle"
bound_tear_producers = 2
stops_tear_producers = "a tear anywhere but between two writes that succeeded. Both producers act between successful writes, so the failure mode where the write itself returns an error is not a tear this model can produce"
shipped_relation = "CHANGELOG.md [0.4.11] `Still open, same class, and named here` names five sites as open, same class, `so the next sweep starts from a list`: the power-cut window between the RP bump and the credential write; `delete_credential` removing EF_CRED and then answering `NotAllowed` when the EF_RP write fails; `decrement_rp`'s own `let _ = fs.delete(EF_RP + j)`; the trusted-display delete swallowing the same failure; and `largeblobext::discard`. MEASURED AGAINST THE INVARIANT, AND THIS IS THE ANSWER: none of the five can falsify it. Every one strands an EF_RP entry OVER a credential that is gone or never landed — `rpent \\supset cred`, the direction `cred \\subseteq rpent` does not constrain — which is precisely why the shipped order was chosen. What the model hides is therefore not a defect in this property's direction but the five leaks themselves: no action of `RSKeySecurityState` can FAIL a flash write (the two tear producers are `PowerCut`, RSKeySecurityState.tla:1522, and `ResetAborts`, :1484, and both act between two writes that succeeded), so an `Err` returned by `Fs::put` and a best-effort rollback that itself fails are outside every configuration. AS-CRED-3 is the row that owns it, and `SEC-STORE-006 NoSilentOrphan` is where that direction is asserted instead"
