expressible = "no — a missing transition, not a constant; adding it changes `Next` and every configuration's state count with it"
registered = "yes — assurance/platform.toml PLAT-CRED-002, pending. PLAT-FLASH-001 is the nearest existing row and is NOT it: that assumption is about the SILICON's tear behaviour under a supply cut, and this one is about the model omitting the medium's `Err` return, which is a different half of the same sentence"

[[assumption]]
id = "AS-CRED-4"
statement = "`KeepOpen` equates `the seed that opens it is gone` with `the record is not there`, so a reset that leaves an undecryptable EF_CRED record behind is `store.cred = {}` in the model — which is why Shipped.cfg is GREEN over a wipe the threat clause says can still strand a credential."
kind = "model abstraction"
discharger = "reading the clause and the operator together, and this is the one place where they appear to disagree. docs/threat-model.md:107-111 says `a torn wipe can still strand a credential, and what the ordering buys is that the survivor is undecryptable rather than that it does not exist`; formal/RSKeySecurityState.tla:305-309 defines `store.cred` as `the records that still OPEN` and empties both fields when the last seed copy goes. So the two agree in substance and differ in what a record IS. It matters because the discrepancy is invisible from either side alone: a reader of Shipped.cfg's GREEN would conclude the wipe strands nothing. What discharges it is a model that carries the record and its openability apart, which is the same second variable AS-CRED-2 wants"
expressible = "no — a definition, not a constant"
