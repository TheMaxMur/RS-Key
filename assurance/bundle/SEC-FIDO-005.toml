gate_registry = "assurance-gate: SEC-FIDO-005 NoUnmanageableCredential MODELLED-ONLY cfgs=40 mut=3 co=3 kani=0 fuzz=0 rust=3 test=0 — and this bundle moves none of them. `cfgs=40` is still the finding rather than the evidence, for one reason now instead of two: twenty-nine of the forty are mutants of some other property that merely CHECK this one. The other reason is gone — one of the forty WAS a byte-identical copy of another and is not any more, so the forty are forty distinct configurations and the number did not have to move for the meaning to. `rust=3` counts files and not tags, so tagging bump_rp would move nothing and tagging reset.rs would move it by one"

