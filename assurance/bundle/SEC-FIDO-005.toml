b_solo_cred_before_rp = "Solo_BugCredBeforeRp.cfg RED: NoUnmanageableCredential — 7031 states, 1893 distinct, depth 7, 1 s. The trace is PressDown, RegisterStart, TouchConfirm, RegisterTouched, RegisterWriteA (which under the switch writes the CREDENTIAL first), PowerCut — and the quiescent state the cut leaves is `store = [seed |-> TRUE, cred |-> {r1}, rpent |-> {}]`: a live, decryptable passkey with no entry either browse surface can find"
