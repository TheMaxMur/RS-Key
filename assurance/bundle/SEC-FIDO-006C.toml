statement = "The relational pre-state is a GHOST in both tiers — `snap` in the model, `ResetSnapshot` in the Rust α — and no shipped image holds it, so nothing in the firmware can observe or enforce this clause at runtime."
kind = "model fidelity"
discharger = "nothing to run, and that is the content: the write ORDER is the whole implementation. What supports it runs in the other direction and is machine-checked — scripts/check.sh's `assurance-trace image identity` row builds the default image twice, poisoning reset_assurance.rs and reset_refinement_kani.rs before the second, and requires the two loadable images byte-identical. A device that had swept the marker early would answer every command exactly as one that had not"
expressible = "no — the absence of a runtime check is not something a configuration can assign"
registered = "yes — assurance/platform.toml PLAT-MODEL-014, accepted-risk, which already supports this property and carries `slice:AS-RESET-2`, and `slice:AS-SEAL-4` beside it now. Its own `failure_direction` already names the one guard that applies here: the projection's `delete` takes its phase from the production classifier rather than a second list"

[[assumption]]
id = "AS-SEAL-5"
statement = "One `store.seed` boolean stands for two flash records in the model, and this clause's α does NOT make the same collapse — `owner_seed_reachable` disjoins the plain record, the soft lock's wrapped copy and the RAM copy, where the model has one field."
kind = "model fidelity"
discharger = "reading the two apart, and for this clause the gap is wider than for its siblings. crates/rsk-fido/src/reset_assurance.rs:96-98 disjoins three sources; formal/RSKeySecurityState.tla has `store.seed` and `ram`. So the soft-locked device — the wrapped copy present, the plain record gone, which is exactly the state a partly-torn seed loop leaves — is a state the α can distinguish and no configuration can. The clause is about the seed, so this is the collapse that costs it most"
expressible = "no — the model has one field where the code has two, and expressing the alternative needs a second VARIABLE"
registered = "yes — assurance/platform.toml PLAT-MODEL-004, pending, which carries the same collapse for two other properties and covers `slice:AS-RAM-2` and `slice:AS-RESET-12`, and `slice:AS-SEAL-5` beside them now, with this property in `supports`"

[[assumption]]
id = "AS-SEAL-6"
statement = "The Kani induction domain is deliberately WIDER than the firmware: `well_formed` constrains `volatile.owner_seed` only while a reset is in progress, and the harness draws it as a free symbolic boolean beside an equally free persistent seed."
kind = "model fidelity"
discharger = "reading the bridge, and the direction is the whole of it. For the ASSERTION the widening is sound — a proof over a superset of the reachable states holds of the subset. For the `kani::cover!` it is not: this clause's cover conjoins `owner_seed_reachable`, which the widened domain can satisfy from a RAM copy the device could not be holding, so a reachable-antecedent report is not the same claim as a reachable state. Narrowing the domain changes what all four harnesses prove"
expressible = "no — a scope statement about an existing proof, not a constant"
registered = "yes — assurance/platform.toml PLAT-MODEL-007, pending, whose `discharge` already names the four harnesses of this family and whose `covers` carries `slice:AS-RAM-8` and `slice:AS-RESET-8`, and `slice:AS-SEAL-6` beside them now, with this property in `supports`"

[[assumption]]
id = "AS-SEAL-7"
statement = "The gate phase holds FIVE records and this clause names one of them; `EF_DEVICE_PIN` and `EF_MINPINLEN` are swept in the same phase and appear in no clause, so a torn reset that drops either early is unobserved by every configuration, the harness and the twin here."
kind = "model abstraction"
discharger = "the reset argument covers them and no invariant states it: phase 2 cannot begin until phase 1 has provably emptied the store, and the seed leads phase 1. Both halves are already written down — crates/rsk-fido/src/reset.rs:237-243 says the list is five and the clauses are three. What would discharge it is a fourth clause and a fourth `snap` field, which is a model change and not a measurement"
expressible = "no — a missing clause, not a boolean; `ForceChangeModelled` toggles whether a RECORD exists, not whether a clause names it"
registered = "yes — assurance/platform.toml PLAT-MODEL-011, pending, which already supports this property and whose statement's last sentence IS this argument for the reset family; its `covers` carries `slice:AS-F004-3` and `slice:AS-SEAL-7` now"

[[assumption]]
id = "AS-SEAL-8"
statement = "EF_BACKUP_SEALED is ONE BYTE on flash and the model has ONE BOOLEAN for it, so a marker that is present but not readable, or present with a value nobody wrote, is a state no tier of this ladder can express."
kind = "model abstraction"
discharger = "not by a run: it needs either a second model variable or the argument that the byte's VALUE is never read. The second is nearly available and is not quite the same claim — every consumer tests presence rather than content (`try_has_data` at crates/rsk-fido/src/vendor.rs:1045, `has_data` on the display side), and both writers write the same `[1]`. What is left over is the read that FAILS, which crates/rsk-fido/src/vendor.rs:1035 answers `true` for and which the model has no state for at all. AS-SEAL-1 is the row that assumes that state away at the medium; this row is the one that says the model could not describe it if it happened"
expressible = "no — a record with three states where the model has two needs a second variable, not a constant"
registered = "yes — assurance/platform.toml PLAT-SEAL-001, a new entry written by this bundle, `class = \"model-abstraction\"`, `discharge_owner = \"contributor\"`, `status = \"pending\"`"

[[assumption]]
id = "AS-SEAL-9"
statement = "This clause's model verdict and its co-refutation credit both come from a configuration arming TWO switches, so what its own configuration isolates is the CLAUSE and never the defect."
kind = "tool fidelity"
discharger = "a run of the defect armed alone, which no configuration in the tree performs and which the model text says would be GREEN. The mechanism is derived in `result.x_companion_mechanism` from `SeedLeadsTheWipe` and `KeepSurv`, so the pairing is justified rather than assumed — but the justification is an argument about the model and not a recorded verdict, and the derivation that credits `co = 1` accepts the pair on a NAME lookup in formal/gen-configs.sh's `companion_bug`, not on that argument. What would discharge it is a recorded GREEN of the switch alone, which would also make the argument checkable"
expressible = "yes — every switch is a model constant, and the alone-armed configuration is one file"
registered = "yes — assurance/platform.toml PLAT-SEAL-002, a new entry written by this bundle, `class = \"tool-fidelity\"`, `discharge_owner = \"contributor\"`, `status = \"pending\"`"

[[assumption]]
id = "AS-SEAL-10"
statement = "The TLA+ clause and the Rust α do not state the same sentence: the α adds `owner_seed_reachable` to the antecedent, making it strictly weaker, and this asymmetry belongs to this conjunct alone."
kind = "model fidelity"
discharger = "either the conjunct added to the model's clause or the disjunct removed from the α — and the direction says which is safe to leave. The model's clause is the STRONGER of the two, so its GREEN carries to the α and the harness proves less than the configurations do. That is sound for citing them together and unsound for reading the harness as an independent confirmation, which is what a `kani` column of one invites. The sibling clauses carry `SeedReachable` on both sides and have no such gap"
expressible = "yes — it is a conjunct of a definition, so a variant model states the other reading"
registered = "yes — assurance/platform.toml PLAT-SEAL-003, a new entry written by this bundle, `class = \"model-abstraction\"`, `discharge_owner = \"contributor\"`, `status = \"pending\"`"

[[assumption]]
id = "AS-SEAL-11"
statement = "The shipped image is built without `--features fips-profile`. On that build `backup_export` returns NotAllowed before the marker is ever read, so one of this clause's two consumers is gone and the clause guards a surface that column does not have."
kind = "build configuration"
discharger = "the build itself, and the reading is the content rather than a run: crates/rsk-fido/src/vendor.rs:842-845 refuses export under `cfg!(feature = \"fips-profile\")` ahead of the seal check, and the on-device reveal is disabled on that profile too. So on that column a torn reset that drops the marker re-opens nothing over USB — which makes the property WEAKER there, not stronger, and means a GREEN measured on the default column is not evidence about it. No configuration and no harness runs that column"
expressible = "no — the model has one gate boolean and no notion of a consumer at all, so the arm cannot be assigned"
registered = "yes — assurance/platform.toml PLAT-SEAL-004, a new entry written by this bundle, `class = \"build-configuration\"`, `discharge_owner = \"contributor\"`, `status = \"pending\"`"

[[assumption]]
id = "AS-SEAL-12"
statement = "The marker's SECOND consumer — the on-device recovery-phrase reveal — exists only on a display build, so on that column this clause guards two disclosure surfaces and every rung of the ladder checks it as if it guarded one."
kind = "build configuration"
discharger = "the display columns of the matrix, which are not covered for this property. crates/rsk-display/src/backup.rs:47 conjoins `!st.sealed` into `can_reveal`; the model has one `gate.backupSealed` and no consumer; the fuzz oracle tests one record's presence; and the board script drives the host path only. The reveal is the surface where the host is not in the trust path at all, which is exactly the case seed backup exists for, so the uncovered column is not the marginal one"
expressible = "no — a second consumer is an action the model does not have, not a value a constant takes"
registered = "yes — assurance/platform.toml PLAT-SEAL-005, a new entry written by this bundle, `class = \"build-configuration\"`, `discharge_owner = \"contributor\"`, `status = \"pending\"`"

# ---- 8. Mutation verdicts ----------------------------------------------------

# TEN rows and TEN verdicts, none of them `inverse`. THE SPLIT MATTERS AND IS
# STATED RATHER THAN LEFT TO BE COUNTED: six are level B and mutate the MODEL,
# four are level `code` and are about production Rust or the suite that guards
# it, and NOT ONE mutates a gate script. The verdict floor is eight, and a
# bundle can clear it on gate-script mutations that say nothing about the
# firmware; this one does not, and a reader can check that by reading the
# `level` column.

[[mutation]]
level = "B"
mutant = "BugBackupSealedNotAGate with its companion — EF_BACKUP_SEALED moved out of the gate set and back into the secret phase, against this clause alone"
invocation = "formal/run-tlc.sh SoloClause_ResetKeepsTheBackupSeal.cfg"
expected = "RED: ResetKeepsTheBackupSeal"
verdict = "RED: ResetKeepsTheBackupSeal, 23 504 states, 5 359 distinct, depth 8, 1 s"
fell = "ResetKeepsTheBackupSeal, at state 8 — an Idle state reached by ResetAborts with store.seed TRUE, snap.seen TRUE, snap.seed TRUE, snap.sealed TRUE and gate.backupSealed FALSE. The marker went one state earlier, at ResetSweepSecrets"
direction = "modelled"
reading = "the antecedent is TRUE and the consequent FALSE, and the failing state is the run-36 defect exactly: the one-time export window re-opened over a seed the wipe did not manage to destroy. The INVERSE defect — a marker that outlives the seed it gates — makes the consequent TRUE and cannot falsify this implication at all; it would have to be caught by some other invariant, and none of the twelve Shipped.cfg checks is that one. Read out of the artifact in this bundle: the `Error:` line names this clause, and the final state is the one printed above."

[[mutation]]
