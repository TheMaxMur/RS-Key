#
# THE CLAUSE EVERY PARENT-LEVEL VERDICT ACTUALLY REPORTS. `SEC-FIDO-006C` is the
# third conjunct of `SEC-FIDO-006` (`clause_of = "SEC-FIDO-006"`), and it is the
# one whose gate reads BACKWARDS: `EF_BACKUP_SEALED` is a one-byte marker whose
# ABSENCE is the permissive state, so a torn wipe that drops it over a seed it
# did not destroy re-opens the one-time seed-export window rather than closing
# anything. Its sibling bundles are `SEC-FIDO-006A` and `SEC-FIDO-006B`.
#
# `SEC-FIDO-006C` `ResetKeepsTheBackupSeal`: cfgs=2 mut=1 co=1 kani=1 fuzz=1
# rust=1 test=1, measured by `python3 scripts/assurance_gate.py` at EXIT=0 while
# this was written. It reaches all four rungs of the ladder — model, bounded
# proof, fuzz, board — and the board rung has no recorded run.
#
# Four findings the building of this produced, and only the last is about the
# firmware's own behaviour:
#
#  * `co = 0` FOR THIS CLAUSE IS REFUTED, AND IT WAS REFUTED TWICE OVER.
#    `FORMAL_VERIFICATION_ROADMAP.md` records the clause rows at `co = 0`; the
#    derivation returns `['BugBackupSealedNotAGate']`. Re-measured here against
#    BOTH the committed `scripts/assurance_gate.py` and the uncommitted one
#    another agent is editing in this same tree, and the answer is the same
#    under each — see `x_co_refuted_measured`.
#  * THE COMPANION SWITCH IS NECESSARY, AND THE MODEL SAYS SO IN ITS OWN TEXT.
#    Every configuration arming `BugBackupSealedNotAGate` also arms
#    `BugSeedDoesNotLead`. The reason is derivable without a run and is derived
#    in `x_companion_mechanism` — so the isolation this clause's own
#    configuration buys is of the CLAUSE, never of the defect.
#  * THE BASELINE WAS ALREADY RED WHEN THIS BUNDLE ARRIVED. `python3
#    scripts/bundle_gate.py` exits 1 on all eight existing bundles' `gate_ledger`
#    line, because another agent's uncommitted `assurance/token_refinement.toml`
#    moved a derived count under them. Recorded in `x_baseline_red`, because a
#    new bundle landing into a red gate must not be read as the thing that
#    reddened it.
#  * AND THE ONE BEHAVIOURAL TEST FOR THIS CLAUSE IS A COIN FLIP THAT LOOKS
#    DETERMINISTIC. `a_seed_the_medium_kept_stops_the_wipe_before_the_gates` is
#    green on the shipped tree BY CONSTRUCTION — measured here over sixty fresh
#    processes — and a detector only about 42% of the time on the mutant it is
#    read as catching. `c_coin_flip_control` records what was measured and what
#    was inherited.

# ---- 1. Property, subject and owners -----------------------------------------

[property]
id = "SEC-FIDO-006C"
invariant = "ResetKeepsTheBackupSeal"
# `assurance/properties.toml:153`, verbatim.
statement = "A torn reset never re-opens the one-time seed-export window over a seed it did not destroy: EF_BACKUP_SEALED is the gate that reads backwards."
# THREE subject classes. `hardware` is deliberately absent and so is
# `integration`: no board run of this clause exists, and claiming either would
# make the evidence gate demand a stepping this bundle has no result to name.
subjects = ["requirement", "abstract model", "Rust source"]
subjects_absent = ["FFI", "binary", "hardware", "integration"]
requirement = [
  "docs/threat-model.md#TM-SEED-BACKUP — the clause this property is registered against, and unlike its two siblings' anchor it states the obligation outright. Resolved through assurance/threat_clauses.toml:377, whose `where` is `## Seed backup (the deliberate exception)` at docs/threat-model.md:451; the id is a registry name and not a rendered anchor, which that file's own header says in as many words. The sentence is: after an explicit finalize, export is refused until a full reset regenerates a new seed",
  "the SAME clause, second surface: on the trusted-display flavor the on-device recovery-phrase reveal `runs only inside the same one-time window (and seal closes it)`. So one marker gates two things, and the property is about both",
  "CTAP 2.3 §6.6 authenticatorReset states the END state and its authorization and nothing about a PREFIX of it. Seed backup is a VENDOR surface and is outside CTAP entirely, so for this clause the specification contributes the reset's touch and window and no part of the obligation — which is why the threat-model clause above is the whole requirement rather than a gloss on one",
]
threat_clause = "docs/threat-model.md#TM-SEED-BACKUP"
# The tag the registry's `rust` column counts, and it is ONE line of ONE
# function shared with the two sibling clauses.
owner_tagged = "crates/rsk-fido/src/reset.rs:247 — `Refines RSKeySecurityState!ResetKeepsTheBackupSeal — SEC-FIDO-006C`, on `is_fido_gate_record` at crates/rsk-fido/src/reset.rs:248, whose sibling tags at :245 and :246 carry SEC-FIDO-006A and SEC-FIDO-006B. All three clauses derive `rust = 1` from this one file because `assurance_gate.grep_word` returns FILE names"
# What the tagged predicate is and is not a list of, in its own words.
owner_tag_reading = "crates/rsk-fido/src/reset.rs:237-243 says the list is FIVE and the clauses are three, and that `EF_DEVICE_PIN` and `EF_MINPINLEN` are in the phase and in no clause. Read the tag as `this one of the five`. What makes THIS member different from the other four is at crates/rsk-fido/src/reset.rs:215-220: it is never re-provisioned, its absence is the permissive state, and what it gates is the master seed itself"
# The ordering that IS the property, which carries no tag of its own.
owner_of_the_order = "crates/rsk-fido/src/reset.rs:104-121 — `ctx.state.reset()`, then the fixed two-fid `FIDO_SEED_FIDS` loop, then the secret sweep, then the gate sweep. The comment at crates/rsk-fido/src/reset.rs:118-119 states this clause outright: the secret sweep covers the seed fids too, so a refused seed removal stops the wipe THERE, before the gate phase could drop `EF_BACKUP_SEALED` over a seed still live"
# The gate's TWO consumers, which is the fact that makes its absence dangerous.
owners_that_read_the_marker = [
  "crates/rsk-fido/src/vendor.rs:847 — `backup_export` refuses when `try_backup_sealed` answers true; this is the host `BACKUP_EXPORT` window",
  "crates/rsk-display/src/backup.rs:47 — `can_reveal` conjoins `!st.sealed`; this is the on-device recovery-phrase reveal, and it exists only on a display build",
  "crates/rsk-fido/src/vendor.rs:1035 — `backup_sealed` is `try_backup_sealed(fs).unwrap_or(true)`, so a probe the medium could not answer reads as SEALED. The runtime reader is fail-closed BECAUSE the absent arm is the one that hands out the master seed; the reset is the only path that legitimately makes the record absent, which is exactly what this clause constrains",
]
owners_that_write_the_marker = [
  "crates/rsk-fido/src/vendor.rs:948 — `backup_finalize`, the host `BACKUP_FINALIZE`, behind the PIN gate and a named touch",
  "crates/rsk-fido/src/vendor.rs:1024 — `mark_backup_sealed`, the on-device Settings seal, behind the device PIN and a deliberate hold",
]
# The verification-only Rust twin of the clause.
owner_of_the_alpha = "crates/rsk-fido/src/reset_assurance.rs:122-128 — `reset_keeps_the_backup_seal`, and its conjunction with the two siblings under the parent's name at crates/rsk-fido/src/reset_assurance.rs:130-134"
# What co-refutation patches, and the two tests that stand behind its `killed`.
owner_co_refuted = "formal/comutants.toml:188 — `BugBackupSealedNotAGate`, one hunk over crates/rsk-fido/src/reset.rs, dropping `| EF_BACKUP_SEALED` from the match arm at crates/rsk-fido/src/reset.rs:251"
owners_of_the_kills = [
  "crates/rsk-fido/src/reset_assurance_tests.rs:130 a_backup_seal_swept_with_the_secrets_is_a_reopened_export_window — the deterministic one, and the only test in the tree that states THIS clause behaviourally without a map in the path",
  "crates/rsk-fido/src/reset_assurance_tests.rs:46 reset_property_controls_go_red_on_each_early_gate_mutant — the per-clause negative control; its third arm asserts `!reset_keeps_the_backup_seal`",
  "crates/rsk-fido/src/reset_tests.rs:638 the_gate_set_defers_every_record_whose_absence_is_permissive — a TRANSCRIBER of the match arm the patch edits, and recorded as one",
  "crates/rsk-fido/src/reset_assurance_tests.rs:76 reset_projection_finishes_only_after_every_ordered_phase — the second transcriber",
  "crates/rsk-fido/src/reset_tests.rs:1456 a_seed_the_medium_kept_stops_the_wipe_before_the_gates — the behavioural one, and a coin flip; see c_coin_flip_control",
]

