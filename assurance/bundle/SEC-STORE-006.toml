[[assumption]]
id = "AS-RESET-1"
statement = "A torn flash write leaves the old record or a detectably bad one, never a plausible wrong one. The store model takes this structurally: `Delete` is the only action with a cut point between two backend writes, and the cut sets `dead` rather than inventing a third value"
kind = "platform"
discharger = "a recorded PASS of tests/29_reset_power_cut.py on a throwaway board with a real supply cut — the discharge PLAT-FLASH-001 already names. It is pending and no board has run it, so this is owed rather than held"
expressible = "not in this model. There is no partial write to quantify over — a torn write is the absence of the second one — so the assumption is what makes that abstraction sound rather than something the abstraction establishes"
registered = "yes — assurance/platform.toml PLAT-FLASH-001, status pending, whose `covers` already claims `slice:AS-RESET-1` and whose `supports` already lists all six SEC-STORE-* rows"

[[assumption]]
id = "AS-RESET-6"
statement = "TLC is sound for the finite configurations it checks, and the verdict recorded for a configuration is the verdict that run produced"
kind = "tool TCB"
discharger = "a pinned checker and a recorded artifact. tlaplus 1.7.4 is pinned by flake.lock, formal/run-tlc.sh records the jar's sha256 prefix, and every `[[artifact]]` row below carries its log's own digest"
expressible = "no — a checker cannot check itself, and nothing in this tree re-derives TLC's answer by a second route"
registered = "yes — assurance/platform.toml PLAT-TOOL-004, status pending, whose `covers` already claims `slice:AS-RESET-6` and whose `supports` already lists all six SEC-STORE-* rows"

[[assumption]]
id = "AS-RESET-7"
statement = "Kani/CBMC is sound for the arithmetic its harnesses bound, and the solver that ran is the pinned one — which for cargo-kani means a version number in a workflow file and not a hash in flake.lock"
kind = "tool TCB"
discharger = "the pinned toolchain and a recorded log. cargo-kani 0.67.0 is held by scripts/kani_gate.py's KANI_VERSION; the hash half does not exist, and that gap is the assumption rather than something this bundle closes"
expressible = "no, for AS-RESET-6's reason one row up, and with one gap more: the tool's identity is a string in CI rather than a digest in the lock file"
registered = "yes — assurance/platform.toml PLAT-TOOL-003, status pending, whose `covers` already claims `slice:AS-RESET-7`"

[[assumption]]
id = "TCB-1"
statement = "rustc lowers the `Fs` source this bundle reads to machine code that keeps its meaning. The production half of every refinement claim below is a statement about source, not about the image"
kind = "compiler"
discharger = "the pinned stable toolchain and nothing further. No translation validation exists in this tree and none is claimed here"
expressible = "no — it is the step out of the language the whole slice is written in"
registered = "yes — assurance/platform.toml already claims `slice:TCB-1`, which is why this bundle spends no registry edit on it"

[[assumption]]
id = "AS-RESET-2"
statement = "The 2-FID space these configurations check stands for the whole 16-bit FID space: every invariant below is per-FID, or between a subject and ONE bystander, so a third file adds no shape the pair does not already carry"
kind = "model fidelity"
discharger = "argued rather than discharged. assurance/abstractions.toml NAR-STORE-FIDS records the same narrowing as `bounded-elsewhere` and cites `scopes:RSKeyStore/Fids`; the proof half widens it for the cache clauses alone, over a symbolic FID pair"
expressible = "not inside the model — raising `Fids` to three is a different configuration and a different state count, and no run in this bundle is that run"
registered = "yes — assurance/platform.toml already claims `slice:AS-RESET-2`. The store reading of it is this row's, and the narrowing it names is assurance/abstractions.toml NAR-STORE-FIDS"

[[assumption]]
id = "AS-RESET-3"
statement = "TLC reporting the FIRST invariant it finds violated is a property of the runner and not of the defect, so a Mut_ configuration checking seven invariants may name a sibling. What separates them is the Solo_ configuration beside it, which checks one invariant alone"
kind = "model fidelity"
discharger = "the paired configurations themselves. formal/gen-configs.sh emits a Mut_/Solo_ pair for every Bug* switch, and where this property has both halves both are run and recorded below"
expressible = "yes, and it is: the Solo_ run IS the discharge. Where a property has no Solo_ row of its own this bundle says so rather than borrowing the Mut_ one"
registered = "yes — assurance/platform.toml already claims `slice:AS-RESET-3`"

