[[tool]]
name = "JVM"
version = "openjdk 1.8.0_492, Zulu 8.94.0.17-CA-macos-aarch64"
provenance = "the dev shell's zulu-ca-jdk 8.0.492, which is what run-tlc.sh takes for $JAVA"
invocation = "nix develop -c java -version"
environment = "the same shell every TLC row below ran in"

[[tool]]
name = "cargo-kani"
version = "0.67.0"
provenance = "the version pinned as KANI_VERSION in .github/workflows/ci.yml and read by scripts/kani_gate.py. cargo-kani is in no nix file, so its pin is a number in a workflow rather than a hash in flake.lock — AS-RESET-7 is the row that carries that gap"
