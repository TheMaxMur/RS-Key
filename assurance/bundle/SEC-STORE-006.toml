environment = "aarch64-apple-darwin, default workspace features, --cfg kani"

[[tool]]
name = "rustc"
version = "1.96.0 (ac68faa20 2026-05-25)"
provenance = "the dev shell's pinned stable toolchain, printed by its banner on every command here"
invocation = "nix develop -c rustc -vV"
environment = "host aarch64-apple-darwin; no firmware image is built for anything in this bundle"

[[tool]]
name = "the gate suite"
version = "the tree at the commit this bundle records"
provenance = "scripts/*.py of this checkout, run through the same dev shell"
invocation = "nix develop -c python scripts/bundle_gate.py, and the four gates result.gate_* transcribe"
environment = "the dev shell's python 3; no network and no board on any row"

[result]
m_shipped = "GREEN. Store.cfg checked 6 named invariants over the two-FID space and found no error: 4185 states generated, 364 distinct states found, 0 states left on queue, depth 7"
m_mut_hides_faulted_drop = "RED: NoSilentOrphan. StoreMut_BugDeleteHidesFaultedDrop.cfg: 175 states generated, 61 distinct states found, depth 4. Its state counts are a property of WHEN the race between two workers reached the violation, not of the space: re-running the same configuration printed a different distinct count in this session, which is why the number quoted here is held to this log and to no other"
m_solo_hides_faulted_drop = "RED: NoSilentOrphan. StoreSolo_BugDeleteHidesFaultedDrop.cfg: 175 states generated, 61 distinct states found, depth 4. The solo half, which separates this invariant from NoOrphanedMetadata in the same configuration."
m_no_step_projection = "crates/rsk-fs/src/store_assurance.rs carries three step predicates and deliberately not a fourth for this invariant. The file states the reason at crates/rsk-fs/src/store_assurance.rs:224-228: the sweep pairs `delete_orphaned_metadata` with what `Fs::delete` RETURNED, and a projection over the view alone cannot see the return value"
r_production = "`Fs::delete` computes the metadata answer FIRST, removes the value unconditionally of that answer, and returns the metadata answer at the end — so an `Err` reaches the caller with the value already gone, which is exactly the pair this invariant demands"
r_the_sweep_distinction = "`force_delete` folds the two failures and `force_delete_halves` does not, and crates/rsk-fs/src/fs.rs:619-622 records why a sweep must take the second: one unreadable EF_META head would otherwise abort `authenticatorReset` after a single file, at the same fid on every retry"
r_five_open_sites = "assurance/platform.toml records that CHANGELOG.md's [0.4.11] names five open sites of this class, and that all five strand an EF_RP entry over a missing credential — the direction `store.cred \\subseteq store.rpent` does not constrain. This invariant is where that direction is asserted, and it is asserted on the MODEL: none of the five is closed by anything in this bundle"
t_tier = "formal/runs.toml records the safety tier at 2026-09-18 on 68eaca6; 22 of its rows are Store*.cfg and this bundle cites 3 of them. All three agree with the record on states, on distinct and on depth: assurance/bundle/logs/SEC-STORE-006/tlc-Store.log searched to depth 7, which is what the record reads for Store.cfg. Over the six SEC-STORE bundles exactly one RED row disagrees with the record, StoreMut_BugDeleteMetaOnlyUnderPresent.cfg in SEC-STORE-001 and on states and distinct — the worker race the header records — and one GREEN row does, Store.cfg and on DEPTH alone, where three of the six copies of that run searched one level shallower than the record. No GREEN state or distinct count disagrees anywhere"
r_absent = "no step projection in crates/rsk-fs/src/store_assurance.rs — deliberately, and the file says why — no bounded proof, no host test and no board run. The five open sites CHANGELOG.md [0.4.11] names are not closed by anything here; they are the direction this invariant asserts on the model and nowhere else"
r_registry_reading = "the `gate_registry` line below is scripts/assurance_gate.py's DERIVATION and not a verdict anyone typed: cfgs counts the configurations naming this invariant, mut the solo kills, kani the harnesses whose function name contains the snake of the invariant name, rust the production sites naming it. Where this bundle disagrees with one of those counts it says so in a leaf above rather than changing it"
r_docs = "docs/store-refinement.md is the page this slice's refinement argument is written on, and assurance/properties.toml sources four of the six rows onto it. This bundle does not restate it; it records which runs stand behind it"
t_gate_rows = "scripts/check-assurance.sh runs this bundle through `slice evidence bundle` (scripts/bundle_gate.py) and its bounds through `bundle bounds table` (scripts/bounds_gate.py); the assumption ids are held by `platform assumptions` (scripts/platform_gate.py) and the registry line by `assurance registry` (scripts/assurance_gate.py)"
m_green_reproducibility = "measured in this session rather than assumed: the clean configuration re-run twelve times printed the same states and distinct counts every time and two different depths, which is what formal/floors.txt already records about TLC's depth under two workers. The RED rows are NOT reproducible in states or distinct, and the numbers quoted for them are each held to their own log"
r_column = "the firmware column. assurance/configurations.toml records that SEC-STORE-* cannot argue closure over a column that moves the flash geometry, so the equivalence this row claims is to columns that do not"
gate_ghost = "ghost-gate: ok — 21 action(s) record NoAuthorizationBypass over 24 route(s), consulting 11 guard(s)"
gate_ledger = "token-refinement-gate: GREEN keys=2 api=16 volatile=11/10 persistent=14/5 outcomes=7/6 walk=4 softlock=12 window=2 testonly=1"
gate_assumption = "5 standing assumption(s) AlwaysUvShipped TRUE=5 FALSE=91 ForceChangeModelled TRUE=3 FALSE=93 PowerOnClearsScratch2 TRUE=11 FALSE=4 RekeyOrderModelled TRUE=2 FALSE=13 WidePerms TRUE=3 FALSE=93"
gate_matrix = "matrix-gate: ok — 40 P0-family properties × 31 build configurations = 1240 cells (37 covered, 143 equivalent, 0 conditional, 106 out-of-scope, 954 gap)"
gate_registry = "SEC-STORE-006 NoSilentOrphan MODELLED-ONLY cfgs=12 mut=1 co=1 kani=0 fuzz=0 rust=1 test=0"

