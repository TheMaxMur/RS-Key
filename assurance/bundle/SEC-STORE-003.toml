#
# SEC-STORE-003 `NoRecordLostToMetaWrite` — the flash layer's evidence bundle, written to stage 1A
# item 3's ten-group contract and held to it by `scripts/bundle_gate.py`.
#
# It is one of six that landed together, and the six are one MODEL: every row
# below is a configuration of `formal/RSKeyStore.tla`, so the build, tool,
# assumption and freshness groups are common to all six by construction rather
# than by copying. What is this property's alone is the invariant, the switches
# that reach it, the production sites that refine it, and the costs of ITS runs.
#
# Two things this bundle deliberately does NOT do:
#
#  * it does not borrow a sibling's kill. Nine `Bug*` switches exist and each
#    property cites only the ones that reddened ITS invariant, which is why the
#    mutation groups here are not the same size;
#  * it does not re-measure a number it did not run. Every count in a `[result]`
#    or `[[mutation]]` leaf beside a configuration name is transcribed from the
#    `[[artifact]]` log of that same run, and `bundle_gate.quoted_numbers` holds
#    it there.
#
# One measured caveat, recorded because it changes how a number here reads: a RED
# TLC run stops at the FIRST violation its two workers reach, so its `states` and
# `distinct` counts are not reproducible. Re-running one of these configurations
# in the same session printed a different distinct count. The GREEN runs are
# reproducible in states and distinct; their `depth` is not, which
# `formal/floors.txt` already records and is why no floor stands on it.
#
# The deletion arm, one clause at a time. A mutant going red says the gate
# noticed; it does not say WHICH clause noticed, and a clause that never fires
# alone is one the suite can lose with every row still green. So each of the
# eight gate mutations below was run a second time with the ONE
# `findings.append` that reports it replaced by `pass` — measured on
# SEC-STORE-001, whose clauses are the same code all six are held to, and with
# `scripts/bundle_gate.py` restored by digest after every arm:
#
#  * the `[freshness]` group taken out of this bundle
#    whole gate: exit 1, 1 finding(s); clause gone: exit 0, 0 finding(s)
#    exit 0 — this clause is the only thing that catches it
#  * the first `[[artifact]]`'s `bytes` moved by one
#    whole gate: exit 1, 1 finding(s); clause gone: exit 0, 0 finding(s)
#    exit 0 — this clause is the only thing that catches it
#  * one hex digit of the first `sha256` changed
#    whole gate: exit 1, 1 finding(s); clause gone: exit 0, 0 finding(s)
#    exit 0 — this clause is the only thing that catches it
#  * a `[[cost]]`'s `peak_memory_mb` written as a range
#    whole gate: exit 1, 1 finding(s); clause gone: exit 0, 0 finding(s)
#    exit 0 — this clause is the only thing that catches it
#  * method #1's configuration re-pointed at one that is not in the tree
#    whole gate: exit 1, 2 finding(s); clause gone: exit 1, 1 finding(s)
#    still exit 1, caught by: a 'model-check' row resolving ['.tla'] and no .cfg — a file in the tree is not the artifact this method's own 
#  * the first mutation row's `direction` replaced with a word nobody has to defend
#    whole gate: exit 1, 1 finding(s); clause gone: exit 0, 0 finding(s)
#    exit 0 — this clause is the only thing that catches it
#  * the clean run's state count moved by one in a `[result]` leaf
#    whole gate: exit 1, 1 finding(s); clause gone: exit 0, 0 finding(s)
#    exit 0 — this clause is the only thing that catches it
#  * every `bound_*` of method #1 but one stripped
#    whole gate: exit 1, 2 finding(s); clause gone: exit 1, 1 finding(s)
#    still exit 1, caught by: 19 `bound_*` key(s) over the method rows, under the floor of 24 — a scope sentence beside one bound is the sam
#
# Two of the eight are NOT solely load-bearing, and that is the result rather
# than a defect: a second clause catches the same mutant. Six are, which means
# deleting any one of those six takes a real check out of the tree with nothing
# in this directory going red.
#

[property]
id = "SEC-STORE-003"
invariant = "RSKeyStore!NoRecordLostToMetaWrite"
statement = "A meta_add of one FID never drops another FID's committed metadata record — the 'torn meta_add wiped every existing record' crash, where a faulted EF_META read was rebuilt from empty."
subjects = ["crates/rsk-fs/src/fs.rs::meta_add_reserve — the EF_META rewrite that must preserve every other record (crates/rsk-fs/src/fs.rs:824)", "crates/rsk-fs/src/fs.rs::rebuild_meta — the copy loop that does the preserving (crates/rsk-fs/src/fs.rs:895)", "crates/rsk-fs/src/fs.rs::meta_delete — EF_META's second write site (crates/rsk-fs/src/fs.rs:860)", "crates/rsk-fs/src/store_assurance.rs::meta_add_lost_a_record — the cross-FID step predicate (crates/rsk-fs/src/store_assurance.rs:244)", "crates/rsk-fs/src/powercut.rs::meta_add_landed — the torn-write oracle for the blob (crates/rsk-fs/src/powercut.rs:56)"]
requirement = "docs/threat-model.md TM-HOST-READ-FAULT: a failed read must not be taken for an empty answer. EF_META is one blob shared by every applet, so rebuilding it from an empty read drops every other applet's record in a single write — the 0x077C class of crash"
threat_clause = "docs/threat-model.md#TM-HOST-READ-FAULT"
threat_clause_reading = "assurance/properties.toml sources this row onto docs/store-refinement.md and TM-HOST-READ-FAULT, and the second states the obligation outright. assurance/threat_clauses.toml carries TM-HOST-READ-FAULT at line 169"
owners_writers = ["crates/rsk-fs/src/fs.rs", "crates/rsk-fs/src/store_assurance.rs", "crates/rsk-fs/src/powercut.rs", "formal/RSKeyStore.tla"]
owner_of_the_kill = "formal/RSKeyStore.tla's MetaAdd and MetaDelete disjuncts. Three of the nine switches break this invariant, which is the most of any row of the six"
status_in_the_registry = "MODELLED-ONLY. crates/rsk-fs/src/store_meta_kani.rs's own header says why: a `FaultBackend` holds nothing, so `meta[f]` is not represented and the harnesses prove the guard at the fault site rather than `no record was lost`"

[build]
commit = "982fb2f9af4302a931faea8196e0897c0b4442e9"
tree_state = "clean at capture — `git status --porcelain` in the /Users/maxmur/rs-key-wt-store worktree printed nothing while every run below was taken; the only files this work adds are these bundles and the logs they cite, written afterwards"
matrix_column = "firmware"
cargo_features = "the default workspace feature set, with no `--features` flag on any row; the proof row is `cargo kani -p rsk-fs` on that same set, under its own `--cfg kani`"
board_knobs = "BOARD unset and LED_KIND unset. Nothing on this property's path reads either — `Fs` is generic over the `Storage` trait and the store model carries no flash geometry at all, which is the same reason assurance/configurations.toml records that a column moving the geometry is one SEC-STORE-* cannot argue closure over"
host_triple = "aarch64-apple-darwin"
firmware_triple = "thumbv8m.main-none-eabihf"
machine = "18 cores, macOS 27.0 aarch64 — the figure TLC's own banner records in every log cited below, so the artifact and this line cannot disagree"

[[method]]
obligation = "show that `NoRecordLostToMetaWrite` holds of every reachable state of the flash layer, over the whole action set and not one path through it"
method = "model-check"
artifact = "Store.cfg formal/RSKeyStore.tla"
bound_fids = 2
stops_fids = "any shape that needs a third file — a three-way aliasing of the present map, or a metadata blob holding more records than the pair can put in it. AS-RESET-2 is the row that says why the pair is argued to be enough, and it is argued rather than shown"
bound_values_per_fid = 3
stops_values_per_fid = "nothing about a value the model never writes. Two stored values plus the absent sentinel is what makes an overwrite observable; a third would add no distinction this invariant reads"
bound_variables = 7
stops_variables = "every part of the real `Fs` outside these seven — the dynamic-fid vector, the write generation counter, the sealed-payload layer, and flash geometry of any kind"
bound_invariants = 6
stops_invariants = "whatever is true of the store and is not one of these six. A GREEN run says nothing about a clause nobody wrote down"
bound_bug_switches = 9
stops_bug_switches = "any defect outside the nine formal/gen-configs.sh emits a switch for. The mutation score below is out of those nine and not out of the defects the store can have"
bound_next_disjuncts = 7
stops_next_disjuncts = "any action the model does not have. There is no compaction, no `factory_wipe`, and no concurrent second caller in this Next"
shipped_relation = "the model is `Fs` over a `Storage`, with the medium's failure modes as switches and the geometry left out. What is shipped is one instance of that shape at 16-bit FIDs; what is checked is two FIDs, and AS-RESET-2 is the row that argues the step between them"
cfg = "none"
features = "none"

[[method]]
obligation = "show that the GREEN above is not vacuous — that a configuration which BREAKS `NoRecordLostToMetaWrite` is refused, and refused BY NAME"
method = "mutation"
artifact = "StoreMut_BugMetaAddDropsOnFault.cfg StoreMut_BugMetaWriteTearsBlob.cfg StoreMut_BugMetaDeleteTearsBlob.cfg StoreInductionMut_BugMetaAddDropsOnFault.cfg"
bound_bug_switches_for_this_invariant = 3
stops_bug_switches_for_this_invariant = "the other switches of the nine. A switch that breaks a sibling invariant is evidence about that sibling, and this row does not borrow it"
bound_tiers = 2
stops_tiers = "nothing about a tier this property has no configuration in. Where the count is 1 there is no Solo_ half and the row says so instead of implying one"
bound_recorded_runs = 4
stops_recorded_runs = "every run not in the `[[artifact]]` rows below. A verdict with no log beside it is a sentence, and this bundle carries none"
bound_killed = 4
stops_killed = "whether the kill was for the modelled defect rather than its inverse. That is the `direction` column of every `[[mutation]]` row, read one at a time, and two of twenty-four co-refutation patches in this tree failed exactly there"
bound_store_configurations = 22
stops_store_configurations = "any configuration formal/gen-configs.sh does not emit. The roster is generated, so a defect nobody wrote a switch for has no row anywhere in it"
bound_distinct_states_green = 364
stops_distinct_states_green = "everything the mutants explore beyond the clean run's space. A RED row stops at its first violation, so its own state count is a property of when TLC found the bug and not of the space"
shipped_relation = "a switch is a defect the shipped tree does not have: gen-configs.sh writes every `Bug*` FALSE in Store.cfg, so the mutants say what the model would catch and not what the code does"
cfg = "none"
features = "none"

[[method]]
obligation = "read the production sites the model claims to abstract, and say whether the ordering the invariant rests on is the ordering the code has"
method = "review"
artifact = "crates/rsk-fs/src/fs.rs::meta_add_reserve crates/rsk-fs/src/fs.rs::rebuild_meta crates/rsk-fs/src/fs.rs::meta_delete crates/rsk-fs/src/store_assurance.rs::meta_add_lost_a_record crates/rsk-fs/src/powercut.rs::meta_add_landed"
bound_refinement_markers = 2
stops_refinement_markers = "every site that refines this invariant and says so nowhere. The markers are doc comments, so a site that drifts out of one is invisible to this count"
bound_fs_removal_sites = 4
stops_fs_removal_sites = "removals outside `Fs`. assurance/deleters.toml's own header says its two scope rules cannot see these four, which is why they are a separate table"
bound_fs_source_lines = 895
stops_fs_source_lines = "everything read as prose rather than as code. A line count is the size of what was read, not evidence that it was read correctly"
bound_reviewers = 1
stops_reviewers = "independence. One reader wrote this bundle and read these sites, so nothing here is a second opinion and the row says so rather than leaving the count out"
bound_files_read = 3
stops_files_read = "the rest of the crate. rsk-fs is fifteen source files and this row opened the ones the subjects name"
bound_crate_kani_proofs = 13
stops_crate_kani_proofs = "whether any of them is about THIS invariant. The count is the crate's; the attribution is the registry's NAME match, and this bundle records where the two disagree"
shipped_relation = "this is the only row of the four that touches shipped Rust, and it is a READING rather than a proof. TCB-1 is what carries it to the image"
cfg = "none"
features = "none"

[[method]]
obligation = "carry `NoRecordLostToMetaWrite` out of the model and onto something the host runs: the model's MetaAdd-step violation predicate, projected onto a real `StoreView`"
method = "trace"
artifact = "crates/rsk-fs/src/store_assurance.rs::meta_add_lost_a_record"
bound_view_fids = 3
stops_view_fids = "any shape needing a fourth file. `store_assurance::VIEW_FIDS` is a three-element array, so the host sweep's projection is as narrow as the model's pair plus one"
bound_step_predicates = 3
stops_step_predicates = "the fourth invariant, which has none. crates/rsk-fs/src/store_assurance.rs says why: NoSilentOrphan forbids an answer rather than a state"
bound_kani_proofs_in_crate = 13
stops_kani_proofs_in_crate = "every clause no harness in the crate states. Thirteen proofs is the crate's whole bounded surface, and only five of them ran for this bundle"
bound_harnesses_run = 5
stops_harnesses_run = "the eight this bundle did not run — the four in powercut_kani.rs, the one in fs_kani.rs, and three more of the refinement file. Their verdicts are not here"
bound_symbolic_fids = 24
stops_symbolic_fids = "the shipped 65536. Under `cfg(kani)` `FID_PRESENT_BYTES` is 3, so the map is 24 bits and EF_META is re-aliased to 0x0017 to sit inside it — a shrink crates/rsk-fs/src/store_meta_kani.rs itself lists three consequences of"
bound_cover_properties = 2
stops_cover_properties = "whether the harness reached anything a cover does not name. Two satisfied covers say the assumed domain is non-empty, not that it is the right one"
shipped_relation = "the projection is verification-only and excluded from production builds, so this row says the shipped primitives satisfy the model's clauses — not that the shipped image was checked"
cfg = "none"
features = "none"

