expected = "EXIT=1: the configuration is not in the tree"
verdict = "EXIT=1, ``StoreNope.cfg` is not in the tree — a method row's artifact is the proof it claims, and one nothing resolves is a claim nobody can refute`"
fell = "the method-artifact resolver — a claim nothing resolves is a claim nobody can refute"
direction = "modelled"

[[mutation]]
