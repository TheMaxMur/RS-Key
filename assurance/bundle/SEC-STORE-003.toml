m_mut_meta_write_tears = "RED: NoRecordLostToMetaWrite. StoreMut_BugMetaWriteTearsBlob.cfg: 221 states generated, 77 distinct states found, depth 4. Its state counts are a property of WHEN the race between two workers reached the violation, not of the space: re-running the same configuration printed a different distinct count in this session, which is why the number quoted here is held to this log and to no other"
m_mut_meta_delete_tears = "RED: NoRecordLostToMetaWrite. StoreMut_BugMetaDeleteTearsBlob.cfg: 189 states generated, 64 distinct states found, depth 4. Its state counts are a property of WHEN the race between two workers reached the violation, not of the space: re-running the same configuration printed a different distinct count in this session, which is why the number quoted here is held to this log and to no other"
m_induction = "GREEN. StoreInduction.cfg starts from IndInv rather than Init: 12460 states generated, 1000 distinct states found, 0 left on queue, depth 1 — one step out of every admitted state, which is what makes it an inductiveness probe rather than a reachability run"
m_induction_mutant = "RED: NoRecordLostToMetaWrite. StoreInductionMut_BugMetaAddDropsOnFault.cfg: 1499 states generated, 1002 distinct states found, depth 2. The induction tier's own kill, out of a start set that is not the reachable one."
r_production = "`Fs::meta_add_reserve` reads EF_META and, on `None` with `last_error()` set, returns rather than treating the failure as an empty blob; `rebuild_meta` copies every record that is not the subject's before appending the new one"
c_step_predicate = "crates/rsk-fs/src/store_assurance.rs::meta_add_lost_a_record is cross-FID by construction — the subject's own record is what the write adds, so only a bystander's can be lost, and a state predicate could not have said that"
r_what_the_proofs_do_not_reach = "the records themselves. crates/rsk-fs/src/store_meta_kani.rs says so in its own header, and it is why this row is MODELLED-ONLY beside a crate that does carry two metadata harnesses"
t_tier = "formal/runs.toml records the safety tier at 2026-09-18 on 68eaca6; 22 of its rows are Store*.cfg and this bundle cites 6 of them. Five agree with the record on states, on distinct and on depth. The sixth is GREEN and disagrees on DEPTH alone: the record reads `depth=7` for Store.cfg, and assurance/bundle/logs/SEC-STORE-003/tlc-Store.log searched to depth 6 — the depth nondeterminism m_green_reproducibility measures rather than the worker race. Over the six SEC-STORE bundles exactly one RED row disagrees with the record, StoreMut_BugDeleteMetaOnlyUnderPresent.cfg in SEC-STORE-001 and on states and distinct, and no GREEN state or distinct count disagrees anywhere"
r_absent = "no proof of the clause itself. The two metadata harnesses bound the guard at the fault site; the records are not represented in a `FaultBackend` at all, which crates/rsk-fs/src/store_meta_kani.rs states as the reason this row is MODELLED-ONLY. No host test and no board run"
r_registry_reading = "the `gate_registry` line below is scripts/assurance_gate.py's DERIVATION and not a verdict anyone typed: cfgs counts the configurations naming this invariant, mut the solo kills, kani the harnesses whose function name contains the snake of the invariant name, rust the production sites naming it. Where this bundle disagrees with one of those counts it says so in a leaf above rather than changing it"
r_docs = "docs/store-refinement.md is the page this slice's refinement argument is written on, and assurance/properties.toml sources four of the six rows onto it. This bundle does not restate it; it records which runs stand behind it"
