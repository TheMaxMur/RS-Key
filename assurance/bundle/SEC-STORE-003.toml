verdict = "EXIT=1, `direction 'killed' is not one of ('modelled', 'inverse') — a red run is not evidence until the direction is read`"
fell = "the direction rule — a red run is not evidence until the direction is read"
direction = "modelled"

[[mutation]]
level = "gate"
mutant = "the clean run's state count moved by one in a `[result]` leaf"
invocation = "<edit SEC-STORE-003.toml>; nix develop -c python scripts/bundle_gate.py"
expected = "EXIT=1: the number is in no line of the log it stands beside"
verdict = "EXIT=1, ``4186` `states` is in no line of `assurance/bundle/logs/SEC-STORE-003/tlc-Store.log` — a number printed next to a log is a transcription of it, and re-measuring the run does not re-measure the l`"
fell = "`quoted_numbers` — a number printed next to a log is a transcription of it"
direction = "modelled"

[[mutation]]
level = "gate"
mutant = "every `bound_*` of method #1 but one stripped"
invocation = "<edit SEC-STORE-003.toml>; nix develop -c python scripts/bundle_gate.py"
expected = "EXIT=1: the row is under the per-row bound floor, and the bundle under the group floor"
verdict = "EXIT=1, `1 bound(s), under the floor of 2`"
fell = "`method_bounds` — a scope sentence beside one bound is the row the roster was added to refuse"
direction = "modelled"

[freshness]
measured = "2026-09-18, Europe/Moscow"
expires_on_prover_bump = "tlaplus 1.7.4 or its jar hash — every model verdict here is TLC's, and PLAT-TOOL-004 is the registry entry that says so"
expires_on_toolchain_bump = "cargo-kani 0.67.0 wherever a proof row stands, rustc 1.96.0 for the production reading; AS-RESET-7 is what the first of those rests on"
expires_on_stepping = "nothing here is a hardware result and no row claims one. A stepping change revalidates PLAT-FLASH-001, the entry this property's tear assumption hangs on, and PLAT-FLASH-001 is `pending` on a board test nobody has run"
expires_on_model_change = "formal/RSKeyStore.tla's Next disjunction, its Fids constant, or a tenth Bug* switch entering formal/gen-configs.sh — each moves the space these states were counted over"
expires_on_schema_change = "assurance/properties.toml's field set, or the INVARIANTS ordering formal/gen-configs.sh writes, which is what decides WHICH invariant a Mut_ row reports first"

