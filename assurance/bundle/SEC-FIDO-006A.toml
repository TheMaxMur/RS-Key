#
# THE FIRST CONJUNCT OF `SEC-FIDO-006`, with its own evidence read apart from
# the conjunction's. `SEC-FIDO-006A` `ResetKeepsThePinGate` is `clause_of =
# "SEC-FIDO-006"`; the parent bundle beside this one is about what a composed
# claim's evidence reads as, and this one is about what ONE conjunct's evidence
# turns out to be when nothing else is allowed to stand in for it.
#
# Measured vector at the moment of writing: cfgs=2 mut=1 co=1 kani=1 fuzz=1
# rust=1 test=1. Two configurations, one model switch, one code twin, one
# harness, and two lower rungs that cannot name this clause at all.
#
# Building it produced four findings, and three of them are about the evidence
# rather than the firmware:
#
#  * THE CLAUSE'S OWN COUNTEREXAMPLE FALSIFIES A DIFFERENT PROPERTY TOO. The
#    16-state trace `SoloClause_ResetKeepsThePinGate.cfg` produces ends at a
#    state where `NoAccessibleSecretWithoutGate` — `SEC-FIDO-004`, checked by
#    name on the same GREEN run — is also false. `BugResetGatesFirst` is the
#    sole model owner of BOTH, `Solo_NoAccessibleSecretWithoutGate.cfg` arms it
#    alone against that invariant, and on the code side the two `Refines` tags
#    sit at crates/rsk-fido/src/reset.rs:227 and :245, on a function and its
#    one-line wrapper. Nothing in the recorded tier exhibits a state where this
#    clause falls and `SEC-FIDO-004`'s invariant holds; the separation runs the
#    other way only. See `result.b_the_overlap`.
#  * THE KANI COVER FOR THIS CLAUSE IS NOT A WITNESS FOR THIS CLAUSE'S
#    ANTECEDENT, and the parent bundle says it is. `reset_keeps_the_pin_gate`'s
#    `kani::cover!` names three of the antecedent's four conjuncts and puts the
#    clause's CONSEQUENT in the place of the fourth. DRIVEN, four arms, on a
#    scratch copy of the workspace: conjoining `!snapshot.credential` to the
#    shipped cover leaves it SATISFIED, so the witness it accepts need not
#    satisfy the antecedent at all. The repair is one conjunct and costs
#    nothing. See §8's four `code` rows and `result.c_cover_is_not_a_witness`.
#  * THE TWO LOWER RUNGS HAVE NO CLAUSE A. `fuzz = 1` counts an oracle whose
#    clause-A half is `&&`-folded with clause B's into one boolean
#    (fuzz/fuzz_targets/power_cut.rs:202), and `test = 1` counts an assertion
#    that says an assertion was refused without saying which gate refused it
#    (tests/29_reset_power_cut.py:526-530). Two of this row's four non-zero
#    evidence columns cannot report this clause.
#  * AND THE PARENT BUNDLE MISNAMES THE THREAT CLAUSE'S OTHER CLAIMANT.
#    `assurance/bundle/SEC-FIDO-006.toml:64` says `TM-HOST-POWER-CUT` "is
#    claimed by `SEC-STORE-003` alone". Measured: it is `SEC-STORE-001`
#    (assurance/properties.toml:272); `SEC-STORE-003` sources
#    `TM-HOST-READ-FAULT` at :286. The reading that surrounds it stands.

# ---- 1. Property, subject and owners -----------------------------------------

[property]
id = "SEC-FIDO-006A"
invariant = "ResetKeepsThePinGate"
# `assurance/properties.toml:137`, verbatim.
statement = "A torn reset never leaves secrets standing with the PIN record already destroyed."
subjects = ["requirement", "abstract model", "Rust source"]
subjects_absent = ["FFI", "binary", "hardware", "integration"]
requirement = [
  "CTAP 2.3 §6.6 authenticatorReset — the END state and its authorization, and nothing about a PREFIX of it. Every §6.6 citation on this path is the power-up window or the touch: crates/rsk-fido/src/reset.rs:6, :40 and :255. None attributes an ordering or an atomicity obligation to the specification, because the specification states none",
  "docs/threat-model.md:44-46 — the sentence that IS this clause, in the tree's own words: `no gate comes up softer on the next boot than it went down — a torn authenticatorReset may not drop the PIN or alwaysUv record while leaving a credential usable`. The first half of that dash is clause A and the second is clause B",
  "the model's own form, formal/RSKeySecurityState.tla:1837-1839 — `(Idle /\\ snap.seen) => ((snap.surv # {} /\\ SeedReachable /\\ snap.pin) => pin.set)` — which is the sentence above with the surviving credential written as a non-empty set of relying parties and the gate written as the PIN record's presence",
]
threat_clause = "docs/threat-model.md#TM-HOST-GATES"
# AND THE REGISTERED ANCHOR IS THE CATCH-ALL, NOT THE CLAUSE. Measured on
# assurance/threat_clauses.toml: `TM-HOST-GATES` is a `kind = "defence"` row
# whose `where` is one bullet — docs/threat-model.md:27-29, "PINs/UV with retry
# counters and lockout, physical-touch requirements on FIDO operations and
# OpenPGP UIF, OATH access codes, PIV management-key auth". It names the gate
# this clause is about and states no obligation ACROSS a reset.
threat_clause_reading = "the anchor is topical and the clause that IS the claim sits one bullet down the same page. `TM-HOST-POWER-CUT` (assurance/threat_clauses.toml:161-166) covers docs/threat-model.md:44-46, which states this obligation almost word for word — and it is sourced by exactly ONE registry row. Measured: `grep -c` over assurance/properties.toml gives nineteen rows sourcing `TM-HOST-GATES` and one sourcing `TM-HOST-POWER-CUT`, and that one is `SEC-STORE-001` at :272. The repair is one token in this row's `source`; it is not made here, because assurance/properties.toml is not this bundle's to edit and the registry row is correct as a pointer even where it is loose as a citation"
# The one `Refines … — SEC-FIDO-006A` tag the registry greps for.
owner_tagged = "crates/rsk-fido/src/reset.rs:245, on `is_fido_gate_record` at :248 — the whole of what this row's `rust = 1` counts, and it is one line of a doc comment that carries all three clause tags at :245, :246 and :247"
# The site the clause is actually ABOUT, which carries no tag of its own.
owner_of_the_order = "crates/rsk-fido/src/reset.rs:104-121 — `ctx.state.reset()`, then the fixed two-fid FIDO_SEED_FIDS loop at :113, then the secret sweep at :120, then the gate sweep at :121, all four inside `wipe`; then `ensure_seed` back in `reset` at crates/rsk-fido/src/reset.rs:72, past the `?` at :71 that propagates the wipe's answer. `EF_PIN` is destroyed by the sweep at :121 and by nothing else in this file; the clause is a statement about the ORDER of those five lines and the order is enforced by nothing but their sequence — across two functions since the flash half was extracted, so the five are no longer one straight-line body"
# What the classifier at the tagged site actually holds, in its own words.
owner_membership = "crates/rsk-fido/src/reset.rs:248-253 matches FIVE records — `EF_PIN`, `EF_DEVICE_PIN`, `EF_ALWAYS_UV`, `EF_MINPINLEN`, `EF_BACKUP_SEALED` — and the doc at :237-243 says out loud that the list is five and the clauses are three. This clause owns exactly one member, `EF_PIN` = 0x1080 at crates/rsk-fido/src/consts.rs:358"
# The verification-only Rust twin.
owner_of_the_alpha = "crates/rsk-fido/src/reset_assurance.rs:106-112 — `reset_keeps_the_pin_gate`, whose antecedent has FOUR conjuncts where the model has three, because `owner_credential_usable` at :100-102 is `persistent.credential && owner_seed_reachable` and the model's `SeedReachable` is only the second half of that. The α is therefore the WEAKER implication of the two"
# The invariant this clause overlaps, measured rather than assumed.
owner_of_the_overlap = "crates/rsk-fido/src/reset.rs:227-230 — `is_fido_gate_fid`, a `pub` one-line wrapper that returns `is_fido_gate_record(fid)` and carries `Refines … NoAccessibleSecretWithoutGate — SEC-FIDO-004`. The two properties' code owners are a function and its wrapper, twenty lines apart in one file, and the wrapper adds publicness and nothing else"
# The Rust that would notice a defect in the clause itself.
owners_of_the_kills = [
  "crates/rsk-fido/src/reset_assurance_tests.rs:46 reset_property_controls_go_red_on_each_early_gate_mutant — three mutants, one per clause, each asserted to fail its OWN clause method; the only per-clause negative control anywhere outside formal/",
  "crates/rsk-fido/src/reset_tests.rs:626 the_gate_set_defers_every_record_whose_absence_is_permissive — a transcriber of the match arm at reset.rs:248-253, so it answers `did somebody edit the list` and not `is the order right`",
]

