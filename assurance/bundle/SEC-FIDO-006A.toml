b_shipped = "Shipped.cfg GREEN — 986 836 197 states, 77 563 872 distinct, depth 58, 1984 s, and TLC's own sentence in the log is `Finished in 33min 02s`. The log ends `Model checking completed. No error has been found.`"
b_shipped_names_the_clause = "and that GREEN is a verdict about THIS clause by name, not only through the conjunction. Measured on formal/Shipped.cfg: the INVARIANTS block holds twelve indented names — TypeOK and eleven invariants — and `ResetKeepsThePinGate` is one of them, beside both `ResetNeverWeakensSurvivingState` and `NoAccessibleSecretWithoutGate`. TLC evaluates every listed invariant at every reachable state, so this clause held at each of the 77 563 872 distinct states of that run"
b_solo_clause_pin = "SoloClause_ResetKeepsThePinGate.cfg RED: ResetKeepsThePinGate — 8 729 164 states, 918 170 distinct, depth 16, 18 s by the runner and `Finished in 17s` by TLC. The counterexample is sixteen states: PressDown, RegisterStart, TouchConfirm, PressDown, RegisterTouched, RegisterWriteA, RegisterWriteB, SetPinStart, SetPinClearPpuat, SetPinWrite, ResetStart, TouchConfirm, ResetConfirmed, ResetSweepGates, ResetAborts"
b_which_assertion_fell = "and the direction is read out of the log rather than assumed. The final state, State 16 at ResetAborts, prints `store = [seed |-> TRUE, cred |-> {r1}, rpent |-> {r1}]`, `snap = [pin |-> TRUE, seen |-> TRUE, auv |-> FALSE, surv |-> {r1}, seed |-> TRUE, sealed |-> FALSE]`, `pin = [set |-> FALSE, retries |-> 8, everSet |-> TRUE]` and `ram = FALSE`. Every conjunct of the antecedent is TRUE — Idle because op is NoOp, snap.seen, snap.surv non-empty, SeedReachable through store.seed, snap.pin — and the consequent pin.set is FALSE. The gate went while the secret stood, which is the modelled defect. The INVERSE defect, a wipe that keeps EF_PIN too long, leaves pin.set TRUE and cannot falsify an implication whose consequent it makes true"
b_the_overlap = "AND THAT SAME STATE FALSIFIES `NoAccessibleSecretWithoutGate`. Evaluated by hand on the printed state: that invariant's second conjunct is `Idle => ((store.cred # {} /\\ SeedReachable /\\ pin.everSet) => pin.set)` at RSKeySecurityState.tla:1779, and at State 16 store.cred is {r1}, SeedReachable is TRUE, pin.everSet is TRUE and pin.set is FALSE — false. Its other two conjuncts hold there, so the invariant is false at the state this clause's isolating configuration was built to exhibit. The overlap is structural rather than incidental: `PinRecordDeleted` at :1429 sets everSet to `SecretsLive`, so deleting the PIN record with a secret still live is precisely what keeps the neighbouring antecedent standing"
b_the_overlap_derived = "the derivation agrees. `assurance_gate.co_refuted` credits `BugResetGatesFirst` to this clause and to `NoAccessibleSecretWithoutGate` both — measured in the devshell, and the second credit comes from Solo_NoAccessibleSecretWithoutGate.cfg, which arms that switch alone. So `SEC-FIDO-004`'s co-refutation column and this row's are the same patch counted twice, under two names, from two configurations"
b_the_overlap_bound = "what is NOT claimed: that this clause is subsumed. Solo_NoAccessibleSecretWithoutGate.cfg RED at 425 833 states, 58 718 distinct, depth 11, 2 s, and its falsifying state has snap.surv = {} and gate.ppuat TRUE — it falls on the STRUCTURAL conjunct at RSKeySecurityState.tla:1788, `Idle => (gate.ppuat => pin.set)`, at a state where this clause is vacuously true. So the neighbour catches something this clause does not, and the recorded tier exhibits no state where this clause falls and the neighbour holds. The direction that is measured is the one this bundle states"
b_solo_parent = "Solo_BugResetGatesFirst.cfg RED: ResetNeverWeakensSurvivingState — 23 327 states, 5 331 distinct, depth 8, 1 s. The same switch armed alone against the PARENT, and its counterexample is the THIRD conjunct: snap.surv is empty and snap.pin is FALSE there, so this clause is vacuous at the state that reddens the invariant naming it"
b_mut_parent = "Mut_BugResetGatesFirst.cfg RED: ResetNeverWeakensSurvivingState — 24 048 states, 5 472 distinct, depth 8, 1 s. Its INVARIANTS block holds seven names including both the parent and `NoAccessibleSecretWithoutGate`, and the parent is listed second, immediately after TypeOK; the reported name is the parent. So the one configuration that checks this clause's owner against BOTH overlapping invariants reports neither of them by the conjunct that fell"
b_sibling_witness = "SoloClause_ResetKeepsTheAlwaysUvGate.cfg RED: ResetKeepsTheAlwaysUvGate — 20 480 388 states, 2 063 890 distinct, depth 18, 40 s. Carried here because its falsifying state prints `pin = [set |-> TRUE, retries |-> 8, everSet |-> TRUE]`: THIS clause holds there and the sibling does not, so clause A and clause B are separated by a witness and not by an argument"

# TIER C — one harness, one baseline, and a four-arm mutation table over its
# own cover.
c_kani = "crates/rsk-fido/src/reset_refinement_kani.rs:122's `reset_keeps_the_pin_gate` is this row's whole bounded evidence and the only reason its status reads BOUNDED. Driven on the scratch copy: VERIFICATION SUCCESSFUL, 604 checks, 0 failed, 8 unreachable, one cover SATISFIED, verification time 0.99 s"
c_kani_subsumption = "and its ASSERTION is implied by the parent harness rather than independent of it. Both assume `well_formed(pre)`, apply one symbolic step, and `well_formed` ends in the conjunction at reset_assurance.rs:267 — so `well_formed(post)` gives this clause. What this harness adds is its cover and a mutation signal, and the cover is what this bundle measured"
c_cover_is_not_a_witness = "AND THE COVER IS NOT A WITNESS FOR THIS CLAUSE'S ANTECEDENT. The clause is false exactly when `snapshot.seen && snapshot.credential && snapshot.pin && owner_credential_usable && !persistent.pin`; the shipped cover at reset_refinement_kani.rs:133-138 is `snapshot.seen && snapshot.pin && owner_credential_usable && persistent.pin` — three of the four antecedent conjuncts, with the CONSEQUENT standing where `snapshot.credential` belongs. Driven: conjoining `!snapshot.credential` to the shipped condition leaves it SATISFIED, one of one cover properties satisfied, 1.08 s. So a witness the shipped cover accepts may be a state at which this clause holds vacuously, and the cover cannot tell a non-trivially satisfied domain from one in which the assertion cannot fail"
c_cover_refutes_the_parent = "which refutes a sentence in the parent bundle. `assurance/bundle/SEC-FIDO-006.toml:198` writes `stops_covers = \"anything beyond the three antecedents they witness. One cover per clause says that clause's antecedent is satisfiable and nothing about any other valuation\"`. For this clause that is false as measured, and the reason is one omitted conjunct rather than anything about the prover"
c_cover_repair_is_free = "and the repair is one conjunct at no cost. With `snapshot.credential` conjoined into the shipped condition the cover is still SATISFIED — one of one, 0.98 s against a 0.99 s baseline — so the strictly stronger witness, the full antecedent jointly with the consequent, is available and was not taken. Since the assertion proves no state has antecedent without consequent, a cover of antecedent-with-consequent WOULD establish the antecedent is satisfiable, which is what the parent's sentence claims and what the shipped condition does not deliver"
c_cover_does_bite = "the guard is not inert, and the bound belongs beside the finding. Under a real vacuity mutation — `persistent.credential` and `snapshot.credential` both drawn as false, which makes this clause's antecedent unsatisfiable at every post-step state because `begin` is the only writer of `snapshot.credential` and takes it from `persistent.credential` — the shipped cover goes UNSATISFIABLE, zero of one cover properties satisfied, 0.94 s. So it catches the vacuity route that runs through `persistent.credential` and misses the one that runs through the snapshot"
c_cover_shape_is_shared = "and the shape is not this clause's alone. Read from the source: `reset_keeps_the_always_uv_gate` at :142 covers `seen && always_uv && owner_credential_usable && persistent.always_uv` and omits `snapshot.credential`; `reset_keeps_the_backup_seal` at :162 covers `seen && owner_seed && owner_seed_reachable && persistent.backup_sealed` and omits `snapshot.backup_sealed`. Each names three of four antecedent conjuncts and substitutes the consequent. Only this clause's was DRIVEN, and a shared shape is not a shared verdict — the sibling bundles owe their own arms"
c_twin = "the code twin is `BugResetGatesFirst`, whose `formal/comutants.toml` entry carries `status = \"patch\"`, `expect = \"killed\"` and a slice of `cargo test -p rsk-fido`; it swaps the two `sweep(...)` lines at crates/rsk-fido/src/reset.rs:120-121. That single entry is the whole of this row's `co = 1`, and it is the same entry `SEC-FIDO-004` counts"

# THE PRODUCTION AND RUNTIME SIDES.
r_owners = "one `Refines` tag, at crates/rsk-fido/src/reset.rs:245, and it is on `is_fido_gate_record` — a five-member `matches!` — rather than on the order the clause is about. `rust = 1` is a count of FILES: `assurance_gate.grep_word` returns file names, so the tag and the ordering block resolve to the same one file whether the tag names one clause or three"
