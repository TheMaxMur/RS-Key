gs.sh`, `formal/comutants.toml`, `formal/Historical_E76.cfg` and `scripts/assurance_gate.py`. Each was checked against this bundle's own inputs and none reaches them — `git diff --stat` over RSKeySecurityState.tla, this bundle's four configurations, run-tlc.sh, floors.txt and runs.toml exits clean; the `comutants.toml` hunks are at :1093-:1109 in an OTP entry, not in the reset family at :188 and :328; and the `gen-configs.sh` hunks touch the `Historical_E76` emit and a new duplicate-configuration sweep, not `CLAUSE_INV` or `clause_mutant`. The transcribed `result.gate_*` lines were derived over that live tree, and they have since been RE-DERIVED at integration and agree — which is not a courtesy: `bundle_gate.gate_transcriptions` derives all five from the gates themselves on every run, so a drifted one is a red row rather than a note here. One of them had already moved while this was being written, and `result.gate_ledger` records which"
