# THE THIN END OF THE SCALE, and the second measurement of it.
#
# `docs/authorization-slice.md` named TWO calibration counterparts, not one:
# `SEC-FIDO-007` and `SEC-FIDO-008`, "each measured at 4 configurations, 1 model
# mutant, 0 Kani, 0 fuzz, 0 device tests and 1 production owner". FIVE of those
# six still hold for this row; `cfgs` is 5 now, and the extra one is a
# configuration CHECKING the invariant rather than new evidence about it.
#
# `SEC-FIDO-008` is the WEAKEST-supported of the eleven: cfgs=5 mut=1 co=1
# kani=0 fuzz=0 rust=1 test=0, against `SEC-FIDO-007`'s identical vector but for
# `rust`, and against the strong row's 50/12/12/4. So the question this file is
# an answer to is not "is the property sound" — it is "do the ten group floors,
# set on the best-supported row in the registry, stay reachable when there is
# genuinely less subject matter, or do they force padding".
#
# MEASURED, and the answer is the same as the counterpart's: all ten clear
# without padding, and two of them clear by a MARGIN OF NOTHING. `[[tool]]` is
# four rows of five fields, exactly the floor of 20, because four is how many
# tools produced a number here and there is no prover among them. `[[assumption]]`
# would be 30 leaves at five rows and is seven, because seven premises were
# found by reading, not because thirty leaves were wanted. The one group that
# takes its floor with WEAKER MATERIAL is the same one the counterpart named:
# `bound_*`, where the review and mutation rows have no compressed shipped
# constant to name and count sites, hunks and asserting tests instead. SEVENTEEN
# of this file's 42 bound keys are of that weaker kind — every bound of the two
# review rows and of the mutation row, plus the counterexample length in the
# solo row and the gate-record width in the ForceChange row, neither of which is
# a constant its configuration assigns.
#
# Three findings about the TREE, recorded here because they were measured while
# building this and the contract says a bundle records what it finds:
#
#  * the single `Refines` tag IS on a half that can falsify — unlike the
#    counterpart's, which sits on the consequent — but it is on the half the
#    requirement already covers, and the half that was ACTUALLY REFUTED ONCE
#    (the reset, `formal/README.md:122`) carries no tag for this property at all;
#  * `docs/authorization-slice.md:523-529` records that `formal/run-tlc.sh`
#    "skips the wrong-reason comparison exactly there", on this property's only
#    RED row. That is STALE: `formal/run-tlc.sh:69-74` derives the name now, and the
#    derivation was measured against this configuration rather than assumed;
#  * `trace = 0 of 0` on the vector, and the recorded session carries BOTH HALVES
#    of this implication at all 80 boundaries with the antecedent TRUE at 48 of
#    them. That is the exact inverse of the counterpart's trace finding, and it
#    means the cheapest evidence this property could gain is a line in an
#    INVARIANTS block.

# ---- 1. Property, subject and owners -----------------------------------------

[property]
id = "SEC-FIDO-008"
invariant = "NoLiveTokenWithoutPinRecord"
# `assurance/properties.toml:167`, verbatim.
statement = "A live pinUvAuthToken implies EF_PIN exists. Structural fact; refuted once when only half of state reset was modelled, asserted ever since."
# §4.1's subject classes. THREE are covered, against the counterpart's two, and
# the difference is one field down: a requirement document does state a rule
# here. It states HALF of one, which `requirement_reading` is about.
subjects = ["requirement", "abstract model", "Rust source"]
subjects_absent = ["FFI", "binary", "hardware", "integration"]
requirement = [
  "CTAP 2.3 §6.5 authenticatorClientPIN — the registered root (assurance/properties.toml:168), and it covers the MINTING half: a token cannot be obtained where no PIN record exists",
  "CTAP 2.3 §6.6 authenticatorReset — where the surviving half would have to live, and it is NOT in the registered source",
  "formal/RSKeySecurityState.tla:1808-1817 — the model's own argument: the sentence ConfigGuard's justification is made of, and the same sentence that makes the alwaysUv-with-no-PIN conjunct inert",
  "formal/README.md:122 — the claim-table row, and the record that this sentence was refuted once and then relied on again",
]
# AND THE REQUIREMENT COVERS ONE HALF OF THE IMPLICATION. §6.5's rule is about
# ISSUANCE — `crates/rsk-fido/src/clientpin.rs:685-693` is that rule in Rust,
# `PinNotSet` when `EF_PIN` has no data, called from `get_pin_token` at :345 —
# and it constrains the antecedent-maker only. Nothing in §6.5 says a token may
# not SURVIVE the record's deletion; the only way a CTAP authenticator deletes
# `EF_PIN` at all is §6.6's reset, and §6.6 is in neither the registry's `source`
# nor this row's evidence. So the requirement subject is real and it is half.
requirement_reading = "the registered clause and the single Refines tag cover the SAME half — issuance — and the half that has actually gone wrong in this tree is the other one. What would close it is adding §6.6 to `assurance/properties.toml`'s `source` for this row and tagging the reset, not new evidence: the model already checks the whole implication and the counterexample already lands on the reset side"
threat_clause = "docs/threat-model.md#TM-HOST-GATES"
# It TRACES and it does not COVER, and the distinction is the tree's own:
# `assurance/threat_clauses.toml:47-59` states the rule — a property traces to a
# clause when that clause states the THREAT it defends against, even where the
# clause's enumeration does not name it. Read at docs/threat-model.md:27-29,
# `TM-HOST-GATES` is one sentence naming gate MECHANISMS — PINs/UV with retry
# counters and lockout, touch on FIDO and OpenPGP UIF, OATH access codes, PIV
# management-key auth. A live token with no record behind it IS that clause's
# threat (the gate evaporates and the grant it minted does not), so the trace is
# sound; but the clause states no rule about a grant OUTLIVING the record that
# bought it, so it roots the property without stating it.
threat_clause_reading = "linkage stronger than the counterpart's and still not coverage. `SEC-FIDO-007` is the one `[[untraced]]` row of assurance/threat_clauses.toml, verdict `would-overclaim`; this row is traced and no gate disputes it. What the page does not carry is a sentence about a session grant's lifetime against its record — the nearest is the torn-reset half of TM-HOST-POWER-CUT, which is about what a cut LEAVES BEHIND in flash and says nothing about volatile authorization surviving it"
# The one `Refines … — SEC-FIDO-008` tag in the tree. `git grep -n \"Refines
# \\`RSKeySecurityState\"` over `crates/` returns 28 tags across 9 files and
# exactly one of them names this property.
owners_tagged = ["crates/rsk-fido/src/clientpin.rs:404 clientpin::issue_token — the doc comment above `fn issue_token` at :405"]
# AND IT IS ON A HALF THAT CAN FALSIFY, which the counterpart's is not. This is
# the measured contrast with `SEC-FIDO-007`, whose tag sits on `ensure_seed` —
# a function that writes the CONSEQUENT and structurally cannot break the
# implication. `issue_token` makes `tok.live` TRUE (`begin_using_token` at
# :425), so an unguarded issuance IS a falsifying step, and the model's
# `GetPinToken` (RSKeySecurityState.tla:694-703) is exactly this function.
owners_tag_reading = "the tag is correct and the coverage is half. `git grep -n begin_using_token` gives two non-test callers, `clientpin.rs:425` inside the tagged function and `crates/rsk-fido/src/conformance/mod.rs:165`, and the second is not in any image — `assurance_gate.cfg_excluded` reports `lib.rs declares mod conformance under cfg(test)`, measured by running that derivation. So the antecedent has exactly ONE production maker and it is tagged. The consequent's DESTROYER is not: `crates/rsk-fido/src/reset.rs:104` `ctx.state.reset()`, ahead of the flash phases that delete EF_PIN, is what makes this invariant true, and reset.rs carries seven Refines tags — 006 four times, 004, 006A, 006B, 006C — and none for 008. formal/README.md:122 records that this invariant was refuted once by modelling ONLY the `keydev_dec` half of that call, so the untagged half is the half with the history"
# The antecedent: every production site that can make `tok.live` true.
owners_antecedent = [
  "crates/rsk-fido/src/state.rs:506 `begin_using_token` — the definition, `paut.in_use = true`; the model's `tok' = [live |-> TRUE, …]`",
  "crates/rsk-fido/src/clientpin.rs:425 — the ONLY call site in a buildable image, inside the tagged `issue_token`",
  "crates/rsk-fido/src/clientpin.rs:345 `get_pin_token` — the door, and where `pin_set_and_unblocked` gates issuance on the record",
  "crates/rsk-fido/src/clientpin.rs:685-693 `pin_set_and_unblocked` — §6.5's rule in Rust: `PinNotSet` when EF_PIN has no data",
  "crates/rsk-fido/src/conformance/mod.rs:165 — the second caller, and NOT one: `mod conformance` is `#[cfg(test)]`, so it is in `assurance_gate.cfg_excluded` and reaches no image",
]
# The consequent: every production site that can make `pin.set` false, and the
# one that must kill the token before it does.
owners_consequent = [
  "crates/rsk-fido/src/reset.rs:104 `ctx.state.reset()` — the ordering the invariant IS, ahead of every flash write; UNTAGGED for this property",
  "crates/rsk-fido/src/reset.rs:121 the phase-2 sweep over `is_fido_gate_fid` — the only path in the FIDO applet that deletes EF_PIN",
  "crates/rsk-fido/src/reset.rs:228-252 `is_fido_gate_fid` / `is_fido_gate_record` — EF_PIN is a member, and the list is five where the clauses are three",
  "crates/rsk-fs/src/fs.rs:477 `Fs::factory_wipe` — the SECOND deleter, device-wide, which bypasses `reset()` entirely and is unmodelled (AS-TOK-4)",
  "crates/rsk-fido/src/clientpin.rs:845-846 `write_pin_verifier` — the one EF_PIN writer that is not a deleter: it OVERWRITES and clears the persistent grant first, so it cannot falsify this implication",
]
# The file the one killed code twin patches (formal/comutants.toml:361-384). Not
# among the tagged owners, and the same file the counterpart's twin patches.
owners_co_refuted = ["crates/rsk-fido/src/reset.rs"]
# The test that falls when that twin is applied — and it asserts about the RAM
# SEED, not about the token. Recorded because the `co = 1` column says nothing
# about which half of which invariant the killing assertion is about.
owner_of_the_kill = "crates/rsk-fido/src/reset_tests.rs:1202 a_torn_reset_never_leaves_the_session_running_on_a_wiped_seed — its assertion is `state.keydev_dec.is_none()`, which is `SEC-FIDO-007`'s consequent and not this one's antecedent"
# The nearest thing in the suite to a shipped twin of THIS implication, and why
# it is not one: it drives an UNTORN reset, where the twin's patch still runs
# `ctx.state.reset()` before returning, so the assertion holds under the mutant.
owner_of_the_near_miss = "crates/rsk-fido/src/reset_tests.rs:32 reset_wipes_state_and_regenerates — asserts `!fs.has_data(EF_PIN)` at :76 and `state.paut.permissions == 0` at :95, which is both halves in one test; it tears nothing, so the ordering the invariant is about is exactly what it cannot see"
# The sibling that owns the OTHER kind of grant. Written down because a reader
# who finds no `gate.ppuat` clause here should not conclude the model has none.
sibling_clause = "the persistent grant's half of the same shape is `NoAccessibleSecretWithoutGate`'s third clause, `Idle => (gate.ppuat => pin.set)` at formal/RSKeySecurityState.tla:1788 — SEC-FIDO-004's, not this one's. This invariant is the SESSION token's half and carries no `Idle` guard, so it also holds mid-operation, which the sibling clause does not claim"

# ---- 2. Commit, build and features -------------------------------------------

[build]
commit = "31c21a771734c1fc87f093c38125bffbee47c558"
tree_state = "NOT CLEAN, and saying how is load-bearing here in a way it is not in the other two bundles. The recorded runs were taken at b819ee5949022b92229e25dfdc2930211e29e013 and this commit is five later; `git diff b819ee5..HEAD -- 'formal/*.tla' 'formal/*.cfg' 'formal/*.sh'` is EMPTY, measured, so the committed model, configurations and runner that produced every number below are byte-identical at this commit. The WORKING TREE is not: this bundle was written beside several others in one checkout, and `git status --short` during it carried uncommitted edits to formal/RSKeySecurityState.tla, formal/Shipped.cfg, formal/floors.txt, formal/gen-configs.sh, formal/run-tlc.sh and two new formal/PermWideMut_*.cfg. Each was read against this property rather than assumed harmless: the .tla edit is COMMENT-ONLY (two lines, both inside comment blocks, no line-number shift); the Shipped.cfg edit ADDS three reset-clause invariants to the INVARIANTS block and removes none, so the recorded GREEN still covers this invariant and no longer describes that file's whole block; and neither new configuration names this invariant — `grep -lw NoLiveTokenWithoutPinRecord formal/*.cfg` is still exactly the five below, so `cfgs = 5` is unmoved"
matrix_column = "firmware"
cargo_features = "the default workspace feature set, and nothing was built: no cargo invocation produced a verdict in this bundle, so the feature set is a property of the tree the source review read rather than of a compilation"
board_knobs = "BOARD unset, LED_KIND unset, the default 4 MB layout — and none of the three is an input here: a TLC run and a source review read no board preset and no flash geometry"
host_triple = "aarch64-apple-darwin"
firmware_triple = "thumbv8m.main-none-eabihf"
machine = "18 cores, macOS 27.0 aarch64 — the figure TLC's own banner records in every artifact below, so the log and this line cannot disagree"
# The same two columns the other bundles derive onto, for the same reason and
# with the same limit: an identical cargo feature closure, not a second run.
equivalent_columns = ["firmware-pico", "waveshare-one"]

# ---- 3. Method and scope/bounds ----------------------------------------------

# FIVE model checks, two reviews and one mutation row, and that is the whole
# list. `kani = 0`, `fuzz = 0` and `test = 0` are this property's correct values
# and not unfilled fields — `grep -lw NoLiveTokenWithoutPinRecord formal/*.cfg`
# is exactly the five configurations below, `crates/*/src/*kani*.rs` declares no
# harness whose name carries the snake-cased invariant, and `tests/**/*.py`
# mentions neither the invariant nor its snake form. Nothing is invented to fill
# them; `subjects_absent` and the assumption group say what that costs.

[[method]]
obligation = "the invariant over the whole reachable space of the shipped constants"
method = "model-check"
artifact = "formal/RSKeySecurityState.tla::NoLiveTokenWithoutPinRecord + Shipped.cfg::NoLiveTokenWithoutPinRecord"
bound_rps = 2
stops_rps = "nothing this invariant can express — `tok.live => pin.set` names two booleans and no relying party. What two costs is reach alone"
bound_channels = 2
stops_channels = "nothing this invariant can express; what two costs is reach — a falsifying state first arising over a third concurrent channel is not in the set searched"
bound_max_retries = 8
stops_max_retries = "nothing by shrinking: eight IS the shipped ladder, and this constant is ON this property's path, because the only producer of the antecedent is reachable only through a successful PIN attempt. So the approach runs at full shipped depth here and is reduced on all three arms below"
bound_mismatch_limit = 3
stops_mismatch_limit = "nothing by shrinking, for the same reason as the ladder it pairs with — three IS the shipped mismatch limit and the antecedent's approach passes through it"
bound_max_clock = 1
stops_max_clock = "any falsifying state that needs a second unit of elapsed time"
bound_reset_window = 0
stops_reset_window = "the in-window arm. At zero the reset that clears the PIN record is reached only outside the power-up window"
shipped_relation = "MaxRetries and MismatchLimit ARE the shipped MAX_PIN_RETRIES (8) and PIN_MISMATCH_LIMIT (3) at crates/rsk-fido/src/consts.rs; RPs and Channels are 2 against an unbounded device; MaxClock 1 is the smallest value at which Tick is not dead; ResetWindow 0 runs the window closed only. FOUR of the six are off this property's path — `tok.live => pin.set` names two booleans and no constant — but two are NOT, and that is the difference from the counterpart: MaxRetries and MismatchLimit bound the PIN-attempt ladder, and `GetPinToken` (the only producer of the antecedent) is reachable only THROUGH a successful PinAttempt. A ladder of 8 is the shipped one, so the antecedent's own approach is at full shipped depth here and reduced on the three arms below"
cfg = "none"
features = "none"

[[method]]
