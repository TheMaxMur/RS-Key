m_solo_value_before_meta = "RED: NoOrphanedMetadata. StoreSolo_BugDeleteValueBeforeMeta.cfg: 171 states generated, 61 distinct states found, depth 4. The solo half, which is what says the Mut_ verdict above was not a sibling's."
m_mut_meta_only_under_present = "RED: NoOrphanedMetadata. StoreMut_BugDeleteMetaOnlyUnderPresent.cfg: 174 states generated, 58 distinct states found, depth 4. Its state counts are a property of WHEN the race between two workers reached the violation, not of the space: re-running the same configuration printed a different distinct count in this session, which is why the number quoted here is held to this log and to no other"
m_solo_meta_only_under_present = "RED: NoOrphanedMetadata. StoreSolo_BugDeleteMetaOnlyUnderPresent.cfg: 195 states generated, 66 distinct states found, depth 4. The solo half of the second switch."
r_production = "`Fs::delete` calls `self.meta_delete(fid)` on its first line and only then reaches the backend, and it returns the metadata answer — crates/rsk-fs/src/fs.rs:597-606. That ordering is the whole refinement, and it is read here rather than proved"
r_removal_sites = "4 removal sites inside `Fs` are registered in assurance/deleters.toml as `[[fs_removal]]` rows; three of the four are the delete family this property is about, and the fourth is `factory_wipe`"
c_step_predicate = "crates/rsk-fs/src/store_assurance.rs::delete_orphaned_metadata is the projection of this invariant onto a real `StoreView`, and it is a STEP predicate for the reason the file states: a meta-only file legally has a record and no value, so the same state is a violation after a delete and the ordinary shape of a MetaAdd"
t_tier = "formal/runs.toml records the safety tier at 2026-09-18 on 68eaca6; 22 of its rows are Store*.cfg and this bundle cites 5 of them. Three of the five agree with the record on states, on distinct and on depth. One RED row does not, and it is the only RED disagreement the six bundles have: the record's row for StoreMut_BugDeleteMetaOnlyUnderPresent.cfg reads `states=195` with `distinct=65`, where assurance/bundle/logs/SEC-STORE-001/tlc-StoreMut_BugDeleteMetaOnlyUnderPresent.log printed 174 states generated, 58 distinct states found — the worker race the header records rather than a disagreement about the model. One GREEN row disagrees too, on DEPTH and on nothing else: the record reads `depth=7` for Store.cfg, and assurance/bundle/logs/SEC-STORE-001/tlc-Store.log searched to depth 6, which is the depth nondeterminism m_green_reproducibility measures rather than the race. No GREEN state count and no GREEN distinct count disagrees, here or in any of the six"
