invocation = "nix develop -c ./formal/run-tlc.sh StoreMut_BugDeleteValueBeforeMeta.cfg"
expected = "RED: NoOrphanedMetadata"
verdict = "RED: NoOrphanedMetadata, 171 states generated, 61 distinct states found, depth 4, 0.86 s wall"
fell = "NoOrphanedMetadata, and it is this property's own invariant rather than a sibling's — the direction is the modelled one: the counterexample ends with meta[a] TRUE and val[a] back at the absent sentinel, which is a record OUTLIVING its value and not the meta-only file the model allows"
direction = "modelled"

