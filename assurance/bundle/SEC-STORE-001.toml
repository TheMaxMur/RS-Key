[[tool]]
name = "the gate suite"
version = "the tree at the commit this bundle records"
provenance = "scripts/*.py of this checkout, run through the same dev shell"
invocation = "nix develop -c python scripts/bundle_gate.py, and the four gates result.gate_* transcribe"
environment = "the dev shell's python 3; no network and no board on any row"

