# THE BEST-SUPPORTED ROW OF THE REGISTRY, AS RAW EVIDENCE — and therefore the
# calibration point for how much of stage 1A п.3's ten-group contract is
# available WITHOUT a new run. Nothing here was executed for it. Every TLC
# verdict is copied from the tier `formal/runs.toml` recorded at `b819ee5` on
# 2026-08-30, whose raw logs are the twelve `[[artifact]]` rows below; every Kani
# verdict is read out of `assurance/bundle/logs/kani-state-tier.log.gz`, a log
# SEC-FIDO-001 already committed. The work was READING, and §10 says so: the two
# non-artifact cost rows are 191 of the 278 attended minutes, against 3193 s of
# runner time none of which this session spent.
#
# `SEC-FIDO-003` `NoTokenAfterInvalidation`: cfgs=44 (45 in the working tree, and
# the `[result]` group says why the figure is not transcribed) mut=7 co=6 kani=2 fuzz=1
# rust=3 test=0 — the strongest vector of the fifty-nine after SEC-FIDO-001's,
# and the first bundle in this programme whose property has BOTH a specification
# section and a threat clause in `assurance/properties.toml`'s `source`.
#
# Four findings are about the tree rather than about the property, and they are
# what a bundle built on a strong row is for:
#
#  * THE INVARIANT HAS THREE CONJUNCTS, NOT TWO HALVES, and all three are
#    separately falsified — but only ONE of them (the session token) is reached
#    by either Kani harness, and the third (`~(gate.ppuat /\ gate.ppuatStale)`)
#    has no reachable falsifying state on the shipped tree at all, because
#    `ppuatStale` is a model variable with no counterpart in the firmware;
#  * THE ORDER'S OWNER CARRIES NO TAG. Six `Refines … SEC-FIDO-003` tags stand
#    over three files, and the function where the revoke-before-write order
#    actually lives — `write_pin_verifier` — is not one of them. The two tagged
#    PIN-flow sites hold a redundant outer layer, which `formal/comutants.toml`
#    measured: deleting `set_pin`'s own `clear_ppuat` leaves all 668 rsk-fido
#    tests green over three runs;
#  * THREE CITATIONS ON THIS PROPERTY'S OWN BRIDGE NAME CODE THE PROSE IS NOT
#    ABOUT, and `scripts/citation_gate.py` is green over all three. One rotted
#    and was re-locked at the drifted text; one is written in a spelling the
#    gate's regex cannot match, so it is read by nothing; one was WRONG THE DAY
#    IT WAS WRITTEN and has never named the function it claims;
#  * THE THREAT CLAUSE IS TOPICAL AND NOT COVERING. `TM-HOST-GATES` is a
#    three-line enumeration of defence categories that roots NINETEEN of the
#    forty P0-family properties; it names no grant lifetime, no revocation and no
#    ordering. The specification half of the root is real and is the load-bearing
#    one — and it too covers one conjunct of three.

# ---- 1. Property, subject and owners -----------------------------------------

[property]
id = "SEC-FIDO-003"
invariant = "NoTokenAfterInvalidation"
# `assurance/properties.toml:108`, verbatim.
statement = "A grant invalidated by a PIN change, PIN set, reset, stopUsingPinUvAuthToken or power cycle never authorizes again."
# §4.1's subject classes. Three are covered — the same three SEC-FIDO-001 has —
# and the other four are named because a bundle that lists only what it has is a
# bundle whose gaps are invisible.
subjects = ["requirement", "abstract model", "Rust source"]
subjects_absent = ["FFI", "binary", "hardware", "integration"]
requirement = [
  "CTAP 2.3 §6.5.5.7 obtaining and using a pinUvAuthToken — the usage timers, beginUsingPinUvAuthToken/stopUsingPinUvAuthToken, and the post-user-presence triad. The registry names this section and nothing else, and it is the SESSION token's clause",
  "CTAP 2.3 §6.5.5.5 setPIN — the registry does NOT name it, and `set_pin` is one of the six tagged owners",
  "CTAP 2.3 §6.5.5.6 changePIN step 15, which calls resetPersistentPinUvAuthToken — the registry does NOT name it either, and it is the clause the write-ORDER conjunct is about",
  "CTAP 2.3 §6.5.4 resetPersistentPinUvAuthToken — the persistent `pcmr` grant's own clause; `crates/rsk-fido/src/seed.rs:326` cites it and the registry does not",
  "CTAP 2.3 §6.6 authenticatorReset — the `reset` invalidator the statement names, also unrooted",
]
threat_clause = "docs/threat-model.md#TM-HOST-GATES"
# AND THE CLAUSE IS TOPICAL, NOT COVERING. Read at docs/threat-model.md:27-29,
# `TM-HOST-GATES` is three lines — "**Protocol gates.** PINs/UV with retry
# counters and lockout, physical-touch requirements on FIDO operations and
# OpenPGP UIF, OATH access codes, PIV management-key auth." It is an enumeration
# of defence CATEGORIES. It states that gates exist; this property is about what
# happens to a grant AFTER it has passed one. No sentence of it names a
# revocation, a lifetime, a write order or a power cycle.
threat_clause_reading = "measured rather than argued: `python3 scripts/threat_gate.py` reports `TM-HOST-GATES  19  SEC-FIDO-001, SEC-FIDO-003, SEC-FIDO-004, …` — nineteen of the forty P0-family rows root on this one three-line bullet, which is the shape of a catch-all anchor and not of a covering clause. For SEC-FIDO-001 it IS the claim: `no protected operation completes without the live authorization its own gate requires` is what `Protocol gates` means. For this property it is the neighbouring subject. What would fix it is a clause naming the grant's lifetime — that an authenticator which retires a grant must leave nothing behind that still opens a door, and that the revoke must land before the new verifier does. TM-HOST-POWER-CUT is the nearest existing clause and is about what an interrupted WRITE leaves behind, which is half of the ordering conjunct and none of the other two"
# The invariant's own text (formal/RSKeySecurityState.tla:1748-1757). THREE
# conjuncts, and the bundle is organised on them because they have different
# owners, different mutants and different coverage.
clause_ghost = "`\"NoTokenAfterInvalidation\" \\notin viol` — the step half. Written by TokenBypass (:600-605) at five call sites, by SetPinWrite (:846) and ChangePinWrite (:880) when the verifier lands over a standing grant, and by CmBeginViaPpuat (:1193) for a stale persistent record"
clause_session = "`~(plat.held /\\ plat.revoked /\\ tok.perms # {})` — a retired session token leaves zero permissions. The model cites state.rs:552-553 for it"
clause_persistent = "`~(gate.ppuat /\\ gate.ppuatStale)` — a revoked persistent grant is DELETED, not merely stopped being honoured"
# The six `Refines … — SEC-FIDO-003` tags the registry greps for, mapped onto the
# three conjuncts. Both of the halves the design page claims are covered ARE
# covered; the finding is the third.
owners_tagged = [
  "crates/rsk-fido/src/state.rs:491 FidoState::reset_pin_uv_auth_token — session",
  "crates/rsk-fido/src/state.rs:551 FidoState::stop_using_token — session, and the site the model cites",
  "crates/rsk-fido/src/state.rs:600 FidoState::expire_stale_token — session, on the timer arm",
  "crates/rsk-fido/src/clientpin.rs:175 set_pin — persistent, and the REDUNDANT layer",
  "crates/rsk-fido/src/clientpin.rs:229 change_pin — persistent, and the REDUNDANT layer",
  "crates/rsk-fido/src/seed.rs:337 clear_ppuat — persistent, the deletion itself",
]
# AND THE ORDER'S OWNER IS NOT AMONG THEM. `write_pin_verifier`
# (clientpin.rs:836) clears the grant at :845-847 and writes EF_PIN at :857 — it
# is the one function every EF_PIN verifier write goes through, from
# `store_new_pin` (:968), the panel's `store_local_pin` (:1256) and the
# device-PIN path (:1287). It carries no tag of any kind.
owners_tag_reading = "the tagged pair `set_pin`/`change_pin` hold a SECOND `clear_ppuat` above the one that matters, and `formal/comutants.toml [comutant.BugSetPinKeepsPpuat]` records the measurement: deleting `set_pin`'s leaves all 668 rsk-fido tests green over three runs, while deleting `write_pin_verifier`'s is red at once on `every_ef_pin_verifier_write_revokes_the_persistent_token` and `local_pin_change_revokes_the_persistent_token`. So the tags sit on the layer whose removal nothing notices. The column would not move if this were fixed — `assurance_gate.grep_word` returns FILE names and `clientpin.rs` is already counted — which is exactly why no gate has ever asked for it"
# The fourth invalidation door, in a crate the `rust` axis DOES scan, with a
# killed code twin and no tag. Fixing this one WOULD move the column, 3 -> 4.
owners_untagged = [
  "crates/rsk-fido/src/clientpin.rs:836 write_pin_verifier — the revoke-before-write order, three callers",
  "crates/rsk-display/src/gates.rs:149 local_pin_gate's `ends_host_token` — the panel PIN pad as a fourth door (E66); `formal/comutants.toml [comutant.BugLocalPinKeepsToken]` patches it and records `expect = \"killed\"`",
  "crates/rsk-fido/src/state.rs:426 FidoState::reset — the `reset` invalidator the statement names; tagged for SEC-FIDO-006 and not for this one, though `state_kani.rs`'s OP_AUTHENTICATOR_RESET drives it and asserts A1-A4 after it",
  "crates/rsk-fido/src/state.rs:371 FidoState::new — the `power cycle` invalidator the statement names, driven as OP_POWER_CYCLE and carrying no tag at all",
]
# The six comutants the `co` column counts, and the seventh that is not a patch.
owners_co_refuted = [
  "crates/rsk-fido/src/clientpin.rs — BugTokenSurvivesPinChange, BugWrongPinKeepsToken, BugChangePinKeepsPpuat, BugPinWriteBeforeRevoke",
  "crates/rsk-fido/src/state.rs — BugStopUsingKeepsPerms",
  "crates/rsk-display/src/gates.rs — BugLocalPinKeepsToken, the only one outside rsk-fido",
]
# The citations that carry the bridge, read BY CONTENT rather than by the gate.
citation_reading = "twenty-three references over this property's owners and switches were opened by hand — the twenty that `citation_gate.citations` itself parses out of formal/README.md:99,204,205,206,207,215,223,225 and formal/RSKeySecurityState.tla:63,65,89,122,823,1752,1755, plus three it cannot see. Sixteen land on their subject. Five occurrences of three distinct citations do not: `RSKeySecurityState.tla:65` cites `state.rs:584-599` for `stopUsingPinUvAuthToken` and that span is `retire_sequences_except` plus the head of `expire_stale_token`'s doc comment (it WAS exactly `stop_using_token` at `250be31`; the function is at `:547-562` today, which the module's own :1751 comment and `formal/README.md:99` both use); `formal/README.md:99` cites `seed.rs:323-324` for `clear_ppuat` and that span is `r.map(|()| tok)` and `}`, the tail of the function ABOVE it — and it was those two lines at `5e3abef`, the commit that introduced the citation, so it has never named `clear_ppuat`; and `clientpin.rs:300-304`, which the module writes bare as `:300-304` three times over (`RSKeySecurityState.tla:89`, `RSKeySecurityState.tla:824`, `RSKeySecurityState.tla:1755`), is four lines short of the `clear_ppuat` call it is cited for, stopping at the first line of the comment above it. Two more, `formal/README.md:204` `clientpin.rs:316` and `formal/README.md:215` `clientpin.rs:786`, each name the line AFTER the line the mutant they describe deletes (:315 and :785)"
citation_gate_reading = "the gate is GREEN over all three, and each is green for a different reason. `state.rs:584-599` and `seed.rs:323-324` are in `formal/citations.lock` AT THE DRIFTED TEXT (rows 445 and 149), and the rule is `only a locked line found ELSEWHERE is reported` — a re-lock makes the rot the baseline, which the gate's own docstring predicts at :115, `a citation wrong the day it was written locks wrong`. The module's bare form of `clientpin.rs:300-304` is in no lock row at all: `CITE` (scripts/citation_gate.py:618-621) matches a continuation only after a backtick, and the module writes its citations as plain TLA+ comment text, so `, :300-304` is not even parsed. Driven rather than argued: running `citation_gate.citations` over the two pages returns twenty citations across the fifteen lines above and not one of the module's three bare occurrences of `clientpin.rs:300-304`, while README:223's backticked `` `:305-309` `` — the twin of the same claim — comes back as a `file=None` continuation, is locked, and followed the code"

# ---- 2. Commit, build and features -------------------------------------------

[build]
commit = "31c21a771734c1fc87f093c38125bffbee47c558"
tree_state = "clean at this commit but for the untracked FORMAL_VERIFICATION_ROADMAP.md, this bundle and its twelve logs, and the uncommitted work of eight sibling bundles being written into the same tree at the same time. That is the one thing about this file a reader should distrust, so it is measured rather than waved at. Of the concurrent edits, four touch a page this bundle reads and NONE changes what it reads: `assurance/properties.toml` gains a `source` entry on SEC-POL-003 and SEC-POL-006 only, so this property's row is byte-identical; `docs/threat-model.md` gains one hunk at line 114, below the `TM-HOST-GATES` anchor, whose three lines at :27-29 are unchanged; `formal/RSKeySecurityState.tla`'s two hunks are both inside comment blocks about `WidePerms`, so no action, guard or invariant moved; and `formal/README.md` moves six lines. What DID move, and matters: `formal/Shipped.cfg` gained three more invariants in its INVARIANTS block, `formal/gen-configs.sh` gained a `PermWideMut_*` family, and two of those configurations are now in the working tree untracked and unrun — one of them, `PermWideMut_BugStopUsingKeepsPerms.cfg`, names this invariant. So the working tree's Shipped.cfg is no longer the file that produced this bundle's tlc-Shipped.log, and the `cfgs` count of the registry line moved twice while this was being written"
matrix_column = "firmware"
cargo_features = "the default workspace feature set, with no cargo feature requested — which is what `assurance/configurations.toml`'s `firmware` column IS. The Kani rows are the exception and name theirs in the method table: `--features kani-soft`"
board_knobs = "BOARD unset and LED_KIND unset, so `firmware/build.rs` resolves its own defaults — the 4 MB layout, ws2812 rgb on GPIO16, BOOTSEL presence"
host_triple = "aarch64-apple-darwin"
firmware_triple = "thumbv8m.main-none-eabihf"
machine = "18 cores, macOS 27.0 aarch64, Azul Systems 1.8.0_492 — the figure the TLC banner records in all twelve logs, so the artifacts and this line cannot disagree; `formal/runs.toml` names the part as Apple M5 Pro"
# THREE, where both worked examples have two, and the third is derived rather
# than assumed: `assurance/configurations.toml` gives this property a `covered`
# cell on `firmware` and `equivalent` cells on three columns, against
# SEC-FIDO-001's two. `abrobot-4m` is the difference, and the reason it is
# claimable here and not there is that its knob delta is an LED and a presence
# SOURCE — and no conjunct of this invariant reads a presence source.
equivalent_columns = ["firmware-pico", "waveshare-one", "abrobot-4m"]
tlc_run = "the safety tier of `formal/runs.toml`, recorded at `b819ee5949022b92229e25dfdc2930211e29e013` on 2026-08-30. `git diff b819ee5..HEAD -- formal/*.tla formal/*.cfg formal/*.sh` is EMPTY, so those verdicts describe the model at this bundle's commit. Against the WORKING TREE they do not, in one direction only: build.tree_state records that a sibling slice has added invariants to Shipped.cfg's INVARIANTS block, which widens what that configuration checks and cannot change whether this invariant held over the same state space"
kani_run = "not run here. Both harness verdicts are read out of `assurance/bundle/logs/kani-state-tier.log.gz`, taken at `f52b720` for SEC-FIDO-001. `git diff f52b720..HEAD` over the two harness files is COMMENT-ONLY — eight changed lines, every one a citation line number inside a `//` or `///` — and `state.rs`, `credmgmt.rs` and `pinproto.rs`, the three production files they drive, are byte-identical"

# ---- 3. Method and scope/bounds ----------------------------------------------

# NINE rows. Four model-check rows for the four GREEN configurations, one for
# the seven non-degeneracy rows, two bounded proofs, one review and one
# mutation. There is no `trace` row and no `measurement` row, and neither is an
# omission: no `TraceSecurity*` configuration checks this invariant (AS-NTAI-4)
# and nothing here was taken on silicon.

[[method]]
obligation = "tier B: the whole invariant over the shipped constants, on the arm the image actually builds"
method = "model-check"
artifact = "formal/RSKeySecurityState.tla::NoTokenAfterInvalidation + Shipped.cfg::NoTokenAfterInvalidation"
bound_rps = 2
stops_rps = "an rpId-binding defect that needs a third relying party; two is what the ghost's binding half is checked over"
bound_channels = 2
stops_channels = "a three-channel interleaving of the invalidators — two channels is every concurrency this row searches"
bound_max_retries = 8
stops_max_retries = "nothing by shrinking: eight IS the shipped MAX_PIN_RETRIES, so the two mutants that reach this invariant through the retry ladder walk the rungs the image has. The row that costs this property ladder depth is the reduced arm below, not this one"
bound_mismatch_limit = 3
stops_mismatch_limit = "nothing by shrinking, for the same reason as the ladder it pairs with — three IS PIN_MISMATCH_LIMIT, so the soft-lock approach is at shipped depth here"
bound_max_clock = 1
stops_max_clock = "every question about elapsed time. One Tick is the whole clock, so the TIMER invalidator — `expire_stale_token` against a usage period this model has no wall clock for — is exercised as `some time has passed` and never at a duration"
bound_reset_window = 0
stops_reset_window = "the reset invalidator as a legitimate in-window reset. At zero the window is only ever seen closed, so `reset` is reached through ResetStart and ResetConfirmed and never through the power-up window the shipped device opens"
shipped_relation = "MaxRetries and MismatchLimit ARE the shipped MAX_PIN_RETRIES (8) and PIN_MISMATCH_LIMIT (3) at crates/rsk-fido/src/consts.rs:368,372, and for THIS property that matters in a way it does not for SEC-FIDO-007: `BugWrongPinKeepsToken` and `BugLocalPinKeepsToken` are both reached through the retry ladder, so the ladder is on the path. RPs and Channels are 2 against an unbounded device; MaxClock 1 is the smallest value at which Tick is not dead, which bounds the TIMER arm — `expire_stale_token` is a tagged owner and PUAT_MAX_USAGE_PERIOD_MS (600 000 ms) is a wall clock this model does not have. ResetWindow 0 runs the window closed only, so the `reset` invalidator is exercised through ResetStart/ResetConfirmed and never through a legitimate in-window reset. This is the ONLY one of the four GREEN rows at AlwaysUvShipped = FALSE"
cfg = "none"
features = "none"

[[method]]
obligation = "tier B: the same invariant on the arm of AlwaysUvShipped the default image does not build"
method = "model-check"
artifact = "AlwaysUv.cfg::AlwaysUvShipped"
bound_rps = 2
stops_rps = "an rpId-binding defect needing a third relying party, on the alwaysUv arm"
bound_channels = 2
stops_channels = "a three-channel interleaving, on the alwaysUv arm"
bound_max_retries = 2
stops_max_retries = "the two rungs this arm does not have. Both mutants that reach this invariant walk the ladder, so at two rungs against the shipped eight this arm is not where a retry-shaped defect is caught"
bound_mismatch_limit = 1
stops_mismatch_limit = "the two mismatches between one and the shipped three, and any approach to the soft lock that needs them — the same shrink the ladder takes, on the counter it pairs with"
bound_max_clock = 1
stops_max_clock = "every question about elapsed time, as on the shipped row: one Tick, so the timer invalidator is exercised as `some time has passed` only"
bound_reset_window = 0
stops_reset_window = "the in-window reset arm, as on the shipped row — the window is seen closed on this arm too"
shipped_relation = "the retry ladder is REDUCED here and the shipped one is not — 8:3 becomes 2:1 (formal/AlwaysUv.cfg:6-7) — because the arm buys the alwaysUv reachability question and Shipped.cfg is the row that is about the ladder. What the row buys this property is that a registered standing assumption is run BOTH ways against it. What it costs is stated rather than implied: the two mutants that walk the ladder would have two fewer rungs to walk here, so this arm is not where a retry-shaped defect is caught"
cfg = "none"
features = "always-uv (modelled as the compiled default, not built)"

[[method]]
obligation = "tier B: the permission alphabet's other arm, which is the one this invariant's own term reads"
method = "model-check"
artifact = "PermWide.cfg::WidePerms"
bound_perm_subsets = 16
stops_perm_subsets = "nothing — sixteen is the whole four-bit domain and this axis is a WIDENING, not a shrink. It is worth more to this invariant than to its neighbours because `tok.perms # {}` is a term of the second conjunct, so the domain the permission set is drawn from is a domain the invariant quantifies over"
bound_rps = 1
stops_rps = "the rpId-binding half of the ghost. One relying party is the price this row pays for the wide permission domain, so on this configuration a token has no second relying party to be wrongly bound to"
bound_channels = 2
stops_channels = "a three-channel interleaving of the invalidators, on the wide-permission arm"
bound_max_retries = 2
stops_max_retries = "the six rungs between two and the shipped eight, so the two ladder-walking mutants are shallower here than on the shipped row"
bound_mismatch_limit = 1
stops_mismatch_limit = "the two mismatches between one and the shipped three, on the wide-permission arm"
shipped_relation = "WidePerms = TRUE draws `ps` from SUBSET Perms — all sixteen subsets of {mc, ga, cm, acfg} instead of the five `PermSets` narrows to (RSKeySecurityState.tla:174-177). This row is worth MORE to this property than to SEC-FIDO-001, and the reason is textual: `tok.perms # {}` is a TERM of the second conjunct, so the domain the token's permission set is drawn from is the domain the invariant quantifies over. The cost is on the other axis and is real — RPs drops to 1, so the rpId-binding half of the ghost has no second relying party to be bound to on this row, and AlwaysUvShipped is TRUE here as well"
cfg = "none"
features = "none"

[[method]]
obligation = "tier B: the forced-PIN-change gate's other arm, a gate that refuses token ISSUANCE after a correct PIN"
method = "model-check"
artifact = "ForceChange.cfg::ForceChangeModelled"
bound_rps = 1
stops_rps = "the rpId-binding half of the ghost, which this arm drops to one relying party the same way the wide-permission arm does"
bound_channels = 2
stops_channels = "a three-channel interleaving, on the forced-change arm"
bound_max_retries = 2
stops_max_retries = "the six rungs between two and the shipped eight; a retry-shaped defect is not what this arm is for"
bound_mismatch_limit = 1
stops_mismatch_limit = "the two mismatches between one and the shipped three, on the forced-change arm"
shipped_relation = "ForceChangeModelled = TRUE turns on `gate.forceChange`, EF_MINPINLEN byte 1, which `clientpin.rs` reads at the two get_pin_token doors and `change_pin` clears. It belongs to this property because it is a refusal AFTER the PIN has verified — a grant that must not be minted rather than one that must be retired — and `assurance/platform.toml` PLAT-MODEL-010 is `discharged` on it. What the arm does NOT reach is the built-in-UV door (clientpin.rs:493-495), which has no action in this module at all, and the panel's own clear at clientpin.rs:1269"
cfg = "none"
features = "none"

[[method]]
obligation = "non-degeneracy: the invariant can go red, seven different ways, and each red names it rather than a sibling"
method = "model-check"
artifact = "Solo_BugTokenSurvivesPinChange.cfg Solo_BugStopUsingKeepsPerms.cfg Solo_BugWrongPinKeepsToken.cfg Solo_BugLocalPinKeepsToken.cfg Solo_BugChangePinKeepsPpuat.cfg Solo_BugPinWriteBeforeRevoke.cfg Solo_BugSetPinKeepsPpuat.cfg"
bound_invariants = 2
stops_invariants = "anything about the invariants a solo row does not check. TypeOK and this name alone is what tells a kill from a neighbouring invariant's, and the price is that a state falsifying two at once is seen here as falsifying one"
bound_armed_switches = 1
stops_armed_switches = "any defect needing two switches at once. One armed switch is what attributes the kill to the defect that was injected"
bound_configurations = 7
stops_configurations = "an eighth way for this invariant to fail. Seven switches are seven defects somebody wrote, so non-degeneracy covers those seven and no failure mode nobody modelled"
bound_conjuncts_falsified = 3
stops_conjuncts_falsified = "nothing — all three conjuncts are separately falsified, which is the strongest single statement in this bundle, because a conjunction whose clauses are never falsified apart is a conjunction with a passenger. What it does not say is that each clause is falsified in every way it could be"
shipped_relation = "every one of the seven checks TypeOK and this invariant and NOTHING ELSE (formal/gen-configs.sh:181-184 emits the SOLO block — the WORKING-TREE numbers, re-taken by content after a sibling slice grew that file by 69 lines NET — 72 added and 3 removed, 923 lines to 992; the same four lines stood at :173-176 at this bundle's `build.commit`, which stays where it is because `scripts/evidence_gate.py:459-490` dates a bundle by a commit git can resolve and the one carrying this file does not exist yet), with exactly one Bug* TRUE and every other FALSE, which is what tells a kill from a neighbouring invariant's. `mut = 7` IS this set: `assurance_gate.solo_target_counts` counts single-target Solo_* configurations. All three conjuncts are separately falsified — the ghost by BugPinWriteBeforeRevoke, the session term by four, the persistent term by two — and that is the strongest single statement in this bundle, because a conjunction whose clauses are never falsified apart is a conjunction with a passenger"
cfg = "none"
features = "none"

[[method]]
obligation = "tier C: the session token's own state machine, over a symbolic five-operation sequence"
method = "bounded proof"
artifact = "crates/rsk-fido/src/state_kani.rs::no_token_after_invalidation"
bound_sequence = 5
stops_sequence = "any defect needing a sixth operation. Five from one starting state against a device that dispatches unboundedly, so an invalidation sequence that has to set itself up over six steps is outside this harness"
bound_opcodes = 8
stops_opcodes = "any invalidator the alphabet does not name. The four the registry statement names are all in the eight, so what is left out is any OTHER route by which a grant could be retired or kept alive"
bound_symbolic_permission_bytes = 6
stops_symbolic_permission_bytes = "nothing — the permission bytes are full symbolic u8, one per step plus the opening grant, so this axis is not a shrink and no permission valuation is excluded"
bound_clock_values = 2
stops_clock_values = "a token that expires strictly BETWEEN the two clock values. The timer arm is exercised at T0 and at the end of the usage period and nowhere in between"
bound_clauses = 4
stops_clauses = "the persistent grant. Four clauses are the session token's; `pcmr` lives in flash, no clause here names it, and AS-NTAI-3 is the row that owns that hole"
shipped_relation = "five operations from one starting state against a device that dispatches unboundedly, drawn from eight opcodes — Begin, MarkUsed, ConsumeAfterUp, Stop, ResetToken, AuthenticatorReset, PowerCycle, TimePasses — so the four invalidators the registry statement names are all in the alphabet. The permission sets are FULL symbolic u8, one per step plus the opening grant, which is not a shrink. The clock is two values, T0 and T0 + PUAT_MAX_USAGE_PERIOD_MS, so the timer arm is exercised at its edges and nowhere between. Every clause is an EQUALITY, not an implication, which is what stops an authenticator that retires everything on sight from satisfying it. What is NOT here: the persistent `pcmr` grant, which is in flash — the harness header says so, and AS-NTAI-3 is the row that owns it"
