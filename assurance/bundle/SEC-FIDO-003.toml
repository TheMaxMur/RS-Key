# AND IT IS ALREADY STALE BY ONE, measured rather than waited for.
recorded_stale = "`scripts/evidence_gate.py` reads 52 inputs for this property and reports `31c21a7 stale (1 input(s) newer)`. The one input is `formal/PermWideMut_BugStopUsingKeepsPerms.cfg`, a sibling slice's configuration that is UNTRACKED in the working tree — and `freshness` puts a never-committed input in `behind` outright, because no commit can be its ancestor. So this bundle is stale against a file that no history contains, which is the axis behaving correctly and reading strangely; it settles the moment that configuration is committed or removed. Recorded here because a bundle whose own freshness verdict is a surprise is a bundle that should say why"

# ---- 10. Measured costs ------------------------------------------------------

# THE HONEST SHAPE OF A BUNDLE WITH NO NEW RUNS. `runner_seconds` is real in
# every artifact row — run-tlc.sh's own timer, transcribed from
# `formal/runs.toml`'s matrix. `peak_memory_mb` is NOT a measurement anywhere in
# this file: run-tlc.sh records no RSS, this bundle ran no TLC, and the one
# figure available is a sibling bundle's `/usr/bin/time -l` peak over the same
# configuration under the same invocation. It is presented as a bound, and it
# says so in every row.

# THE HUMAN COLUMN IS A RECONSTRUCTION, AND ITS AGGREGATE DOES NOT FIT THE
# WINDOW IT IS DATED IN. The fourteen rows below total 278 human_minutes, and
# the six bundles this one arrived with total 1709 — 28.5 hours, every one of
# them stamped `freshness.measured = 2026-08-30` inside a window that runs from
# `31c21a7` (2026-08-30 22:03:52 +0300) to `b185fc3` (2026-08-31 01:24:37),
# which is 3 h 21 min. NO TIMER PRODUCED ANY OF THEM: they are attended time
# reconstructed after the fact, and every `basis` below says so in its own row
# rather than leaving a reader to find this paragraph. They are kept because
# they are the only cost signal the programme has, not because they are
# measurements.
#
# AND THE SHIPPED BOUND IS NOT THE ONE `SEC-FIDO-002` CARRIES over a
# byte-identical artifact — `317703de…`, the same log in six directories. 2940
# MiB is a `/usr/bin/time -l` SAMPLE of a DIFFERENT run — the log at
# `assurance/bundle/logs/SEC-FIDO-007/tlc-Shipped.log` has its own sha256, its
# own seed and its own closing line, so the figure bounds THAT process and is
# carried across to this one. `SEC-FIDO-002` bounds the same log with 3705
