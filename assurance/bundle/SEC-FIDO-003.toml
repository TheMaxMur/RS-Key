discharger = "reading the four call sites of crates/rsk-fido/src/seed.rs:337 and asking what could leave a record standing but unhonoured. Nothing can today — which is the point: `~(gate.ppuat /\\ gate.ppuatStale)` is UNFALSIFIABLE on the shipped tree by construction, the same shape SEC-FIDO-007's AS-RAM-5 records for RamNeverOutlivesFlashSeed. A second EF_PAUTHTOKEN writer, or a `force_delete` error a caller drops, would make it bite"
