# ---- 8. Mutation verdicts ----------------------------------------------------

# TEN rows and no `inverse` one, and that is a limit of this bundle rather than a
# property of the tree: every verdict here is READ from a recorded run, and an
# inverse kill is something you find by re-driving a mutant the other way, which
# would have been a new run. What the direction column carries instead is the
# reading of which conjunct fell and in which direction, taken from each log's
# own final state.

[[mutation]]
level = "B"
mutant = "BugTokenSurvivesPinChange — changePIN keeps the session token; §6.5.5.6 step 15 skipped, armed ALONE"
invocation = "formal/run-tlc.sh Solo_BugTokenSurvivesPinChange.cfg"
expected = "RED: NoTokenAfterInvalidation"
verdict = "RED: NoTokenAfterInvalidation, 148 546 states, 23 052 distinct, depth 10, 2 s"
fell = "the second conjunct, `~(plat.held /\\ plat.revoked /\\ tok.perms # {})`, at a state reached through SetPin, GetPinToken, ChangePin and ChangePinRotateToken"
direction = "modelled"
reading = "the final state is `plat.held /\\ plat.revoked /\\ tok.live /\\ tok.perms = {\"cm\"}`: the platform still holds a token the device has retired, and it still carries a permission. The inverse — a changePIN that retires MORE than it should — cannot fail this conjunct at all, because it can only shrink `tok.perms`, and the conjunct is a negation over a NON-EMPTY set."

[[mutation]]
level = "B"
mutant = "BugStopUsingKeepsPerms — stopUsingPinUvAuthToken drops `in_use` and keeps the permission bits"
invocation = "formal/run-tlc.sh Solo_BugStopUsingKeepsPerms.cfg"
expected = "RED: NoTokenAfterInvalidation"
verdict = "RED: NoTokenAfterInvalidation, 6019 states, 1659 distinct, depth 7, 1 s"
fell = "the second conjunct, at the shallowest depth of the seven — five actions from the initial state"
direction = "modelled"
reading = "this is the defect the two Kani clauses were written for, and the log says why they had to be a pair: the final state has `tok.live = FALSE` and `tok.perms = {\"cm\"}`, so a guard that also tested `the token is in use` would have caught it and the two bare-shaped call sites do not have that conjunct. The kill is the permission bits surviving, not the token bytes moving — A4 is the clause that separates those and it is not the one that falls here."

[[mutation]]
level = "B"
mutant = "BugWrongPinKeepsToken — the pre-E38 tree, where a PIN mismatch leaves the outstanding token alive"
invocation = "formal/run-tlc.sh Solo_BugWrongPinKeepsToken.cfg"
expected = "RED: NoTokenAfterInvalidation"
verdict = "RED: NoTokenAfterInvalidation, 5920 states, 1619 distinct, depth 7, 1 s"
fell = "the second conjunct, at a state reached by WrongPin rather than by a PIN write"
direction = "modelled"
reading = "the invalidator here is a FAILED authentication, which the registry statement does not list among its five and the model does. The direction is that a guess against the PIN leaves the previous holder's grant standing; the inverse, a mismatch that retires a token it should have left alone, is a conformance question and not this invariant's — it would show up as a refusal, and nothing in this conjunct quantifies over refusals."

[[mutation]]
level = "B"
mutant = "BugLocalPinKeepsToken — E66, the trusted-display PIN pad no longer ends the host token"
invocation = "formal/run-tlc.sh Solo_BugLocalPinKeepsToken.cfg"
expected = "RED: NoTokenAfterInvalidation"
verdict = "RED: NoTokenAfterInvalidation, 5886 states, 1619 distinct, depth 7, 1 s"
fell = "the second conjunct, at a state reached by LocalPinWrong — the panel's own wrong-PIN arm"
direction = "modelled"
reading = "the fourth door, and the only one of the seven whose production owner is in another crate: crates/rsk-display/src/gates.rs:149 decides `ends_host_token` and its code twin patches it to `false`. The state count is one below BugWrongPinKeepsToken's on the same depth, which is what says the panel arm and the wire arm are two paths and not one — a single shared owner would have produced identical spaces."

[[mutation]]
level = "B"
mutant = "BugChangePinKeepsPpuat — changePIN marks the persistent grant stale instead of deleting it"
invocation = "formal/run-tlc.sh Solo_BugChangePinKeepsPpuat.cfg"
expected = "RED: NoTokenAfterInvalidation"
verdict = "RED: NoTokenAfterInvalidation, 19 655 states, 4472 distinct, depth 8, 1 s"
fell = "the THIRD conjunct, `~(gate.ppuat /\\ gate.ppuatStale)`, at ChangePinClearPpuat"
direction = "modelled"
reading = "the whole content is that this is a different conjunct from the four above: `tok` is empty in the final state and `plat.held` is FALSE, so the second conjunct is satisfied and the kill is entirely the flash record. That is what makes `gate.ppuatStale` a term worth having even though no code path can set it — the mutant is the only thing that ever does, and AS-NTAI-1 is the row that says so."

[[mutation]]
level = "B"
mutant = "BugPinWriteBeforeRevoke — the new verifier lands BEFORE the persistent grant is revoked, at both PIN flows"
invocation = "formal/run-tlc.sh Solo_BugPinWriteBeforeRevoke.cfg"
expected = "RED: NoTokenAfterInvalidation"
verdict = "RED: NoTokenAfterInvalidation, 19 942 states, 4549 distinct, depth 8, 2 s"
fell = "the FIRST conjunct — the ghost. `viol = {\"NoTokenAfterInvalidation\"}` in the final state, written by ChangePinWrite through `PinVerifierLandsPolicy == ~gate.ppuat`"
direction = "modelled"
reading = "the only row of the seven that falls on the step half, and the direction is visible in the state it stops at: `gate.ppuat` TRUE and `gate.ppuatStale` FALSE — a grant that is still live and still honoured while a PIN it does not belong to lands. Neither of the other two conjuncts is violated there, which is what says the ghost is not a duplicate of them. The inverse — revoking too early — leaves no bad state and writes no ghost, because the policy is a guard on the WRITE and not on the revoke."

[[mutation]]
level = "B"
mutant = "BugSetPinKeepsPpuat — setPIN marks the grant stale instead of deleting it, armed ALONE"
invocation = "formal/run-tlc.sh Solo_BugSetPinKeepsPpuat.cfg"
expected = "RED: NoTokenAfterInvalidation"
verdict = "RED: NoTokenAfterInvalidation, 5 521 139 states, 599 634 distinct, depth 15, 12 s"
fell = "the third conjunct, at SetPinClearPpuat — and only after a fifteen-state path"
direction = "modelled"
reading = "the depth is the reading. Reaching it needs a PIN to be set, a grant minted, a reset started, confirmed, swept through ResetSweepSecrets twice and ResetSweepGates, then ABORTED, and only then a second setPIN — because on a tree where the sweep completes there is no PIN to set over. So the state this switch reaches is the torn-reset leftover the production comment at clientpin.rs:217-219 names, and its 599 634 distinct states are two orders above every other row here."

[[mutation]]
level = "B"
mutant = "the same switch against the whole invariant set, with this property's name listed FIRST"
invocation = "formal/run-tlc.sh Mut_BugSetPinKeepsPpuat.cfg"
expected = "RED, and on this property's name — the INVARIANTS block puts it first"
verdict = "RED: NoAccessibleSecretWithoutGate, 1 700 134 states, 203 559 distinct, depth 13, 4 s"
fell = "a SIBLING's name, at depth 13 against this property's depth 15 in the Solo row"
direction = "modelled"
reading = "and the received explanation does not hold here. formal/gen-configs.sh:185-187 puts the target invariant first and Mut_BugSetPinKeepsPpuat.cfg:52 duly lists NoTokenAfterInvalidation ahead of the other five, so list order is NOT what decided this — BFS depth is. The two counterexamples share their first 13 states (`State 13` is `ResetAborts` in both logs) and the sibling's fires there while this one needs two more steps, so TLC stops at the neighbour. A credit rule keyed on the mutant's own configuration therefore misses this property under its own switch, whatever the ordering, and only the invariant-named Solo row observes it."

[[mutation]]
level = "code"
mutant = "the six code twins: the same defects patched into production Rust across two crates"
invocation = "python3 scripts/comutate.py run <bug>, for BugTokenSurvivesPinChange, BugStopUsingKeepsPerms, BugWrongPinKeepsToken, BugChangePinKeepsPpuat, BugPinWriteBeforeRevoke and BugLocalPinKeepsToken"
expected = "killed by the tree's own suite — `cargo test -p rsk-fido` for five, `cargo test -p rsk-display` for the sixth"
verdict = "six of six recorded `expect = \"killed\"` in formal/comutants.toml, whose status vocabulary (:20-22) defines that field as the MEASURED verdict and a killed-becoming-gap as a regression"
fell = "not re-driven here, and the field this bundle can honestly fill is the file's own record rather than a test name — SEC-FIDO-007 took the test name by applying its single patch by hand, and six patches over two crates was a cost this bundle did not spend"
direction = "modelled"
reading = "BugChangePinKeepsPpuat is the one worth reading, because its note records a measurement made in the wrong direction first: the initial patch removed only change_pin's outer `clear_ppuat` and every test stayed green, because the inner revoke in write_pin_verifier held. Two layers had to go before the code reproduced what the model calls one defect — so a single-layer mutant here is a mutant that measures a redundancy rather than a defence."

[[mutation]]
level = "code"
mutant = "BugSetPinKeepsPpuat as a CODE twin — the seventh switch, and the one that could not be made"
invocation = "formal/comutants.toml [comutant.BugSetPinKeepsPpuat], `status = \"unreachable\"`"
expected = "a patch reproducing `setPIN keeps the grant` and nothing else"
verdict = "no such patch exists, measured: deleting set_pin's own `clear_ppuat` (clientpin.rs:220) leaves all 668 rsk-fido tests green over three runs, and deleting write_pin_verifier's is red at once on `every_ef_pin_verifier_write_revokes_the_persistent_token` and `local_pin_change_revokes_the_persistent_token`"
fell = "nothing, on the redundant site — which IS the result. The green suite over a deleted `clear_ppuat` is the measurement, and the red one over the chokepoint is what says the property is enforced there instead"
direction = "modelled"
reading = "this row is why `mut = 7` and `co = 6`, and it is a finding about the CODE rather than a hole in the evidence: the site changePIN and the panel share has no per-caller mutant, so a defect scoped to setPIN alone cannot be built. The entry's own history is the warning it carries — it was written as a MODEL measurement first, after its sibling BugBackupSealedNotAGate was caught carrying a model result in a code field, and the code half turned out to be a different answer."

