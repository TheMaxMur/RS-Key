bound_slice_crates = 1
stops_slice_crates = "any test outside the one crate the slice runs"
bound_credited_configurations = 1
stops_credited_configurations = "what the killing TEST is about. The one credit exists only because the index reads solo configurations by invariant name; the test that falls is not a test of this property, and the source says so"
shipped_relation = "the patch moves `ctx.state.reset()` from ahead of the flash work to behind `ensure_seed` (formal/comutants.toml:353-366) — the E76 regression, in the shipped file, not a model edit — and `expect = \"killed\"` is a RECORDED verdict per that file's own status vocabulary (:19-21), not a plan. The one credited configuration is Solo_RamNeverOutlivesFlashSeed.cfg, which `comutate.solo_index` reads BY INVARIANT NAME (scripts/comutate.py:337-365); without that reading the kill is credited to SEC-FIDO-006 and this row's column is the `co = 0` docs/authorization-slice.md:455-469 describes correcting. What the column does NOT say, and the source says so in as many words, is that the killing TEST is a test of this property"
