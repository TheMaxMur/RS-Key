# ---- 7. Assumptions and TCB / trust dependencies -----------------------------

# THE GROUP THE COUNTERPART SAID HAS TO BE PRODUCED FROM NOTHING. On
# SEC-FIDO-001 these fields are transcription — eight AS-AUTH-* rows were already
# argued in the design page and all eight have a platform-registry entry. Here
# there were none, and every row below was derived by reading
# formal/RSKeySecurityState.tla, crates/rsk-fido/src/seed.rs, state.rs and
# lib.rs, plus the two files those three reach that the estimate did not name.
#
# `registered` is machine-checked and is not free prose: scripts/platform_gate.py
# :491-505 compares `registered.startswith("yes")` against whether
# assurance/platform.toml claims `slice:<id>`. A `yes` on a fresh id would redden
# that gate today.

[[assumption]]
id = "AS-RAM-1"
statement = "The model's `ram` is `FidoState::keydev_dec.is_some()`, and nothing else in the tree is a second copy of the seed the model would have to see."
kind = "model fidelity"
discharger = "the projection is written down once, at crates/rsk-device/src/ctap.rs:221, and the recorded replay compares it: formal/TraceSecurity.tla:49 maps `keydevRam |-> raw.keydevRamRaw`, :67 maps it to `ram`, and R4aRawRefinesB (:90-91) equates the two at every boundary. MEASURED, and this is the finding: `keydev_ram_raw` is `false` in all 40 pre and all 40 post snapshots of formal/traces/security-phase4.jsonl, so the comparison never runs its TRUE arm and the field is carried rather than checked. What would discharge it is a recording that performs a vendor UNLOCK"
expressible = "no — a mapping between a model variable and a Rust field, not a boolean constant a configuration could assign"
registered = "yes — assurance/platform.toml PLAT-MODEL-003, pending, refining PLAT-TOOL-002. Written BY this bundle: the entry did not exist, and its discharge route is the recording named above"

[[assumption]]
id = "AS-RAM-2"
statement = "One `store.seed` boolean stands for two flash records, so the soft-locked device — `EF_KEY_DEV` gone, `EF_KEY_DEV_ENC` present — is a state the invariant cannot distinguish."
kind = "model abstraction"
discharger = "reading the two records apart: crates/rsk-fido/src/seed.rs:102 defines the lock as exactly `has_key(EF_KEY_DEV_ENC) && !has_key(EF_KEY_DEV)`, and crates/rsk-fido/src/reset_assurance.rs:18-19 and :173-174 already keep `owner_seed` and `owner_locked_seed` apart on the code side. formal/TraceSecurity.tla:38 collapses them — `seed |-> raw.seedPlainRecord \\/ raw.seedEncryptedRecord`. It matters here and not elsewhere: the locked state is the one where the RAM copy is the ONLY readable seed"
kind_note = "the same collapse is what makes AS-RAM-3's guard sound, so the two rows are read together or neither is"
expressible = "no — the model has one `store.seed` field, and expressing the alternative needs a second VARIABLE; scripts/assumption_gate.py accepts a boolean CONSTANT and nothing else"
registered = "yes — assurance/platform.toml PLAT-MODEL-004, pending. Written BY this bundle; PLAT-MODEL-002 was the nearest shape and names SEC-FIDO-001 and -005, not this row"

[[assumption]]
id = "AS-RAM-3"
statement = "`DeviceUnlock` may not create the RAM copy without a live flash seed — the `store.seed` conjunct at RSKeySecurityState.tla:1071 is what makes this invariant true, and the production unlock has no such conjunct."
kind = "model fidelity"
discharger = "running the other arm. crates/rsk-fido/src/vendor.rs:558-581 gates the unlock on `mse_ready()`, a 32-byte lock key and `lock_engaged(fs)` — which requires the PLAIN record ABSENT — so the code's guard is the wrapped record and the model's is a disjunction of both (AS-RAM-2). A boolean pinning the conjunct and generated both ways would settle it; by construction the FALSE arm goes RED, because `Idle /\\ ~store.seed /\\ ~ram` is reachable through ResetAborts (:1392-1397) after ResetSweepSecrets has deleted the record (:1297-1303). ARGUED FROM THE MODULE TEXT AND NOT RUN — no configuration in this draft was executed"
expressible = "yes, with work — a boolean `UnlockNeedsFlashSeed` read by DeviceUnlock and emitted both ways by formal/gen-configs.sh is the shape AlwaysUvShipped already has; the obstacle is writing the constant and its two arms, not the gate"
registered = "yes — assurance/platform.toml PLAT-MODEL-005, pending, and it is the one row here that can LEAVE this registry: a boolean emitted both ways moves it to assurance/assumptions.toml"

[[assumption]]
id = "AS-RAM-4"
statement = "The RAM copy dies by Rust drop-and-replace, not by an explicit clear, on the path the invariant is about: `reset.rs:104` calls `FidoState::reset`, which assigns `*self = Self::new()` and lets `Drop for FidoState` zeroize the field."
kind = "compiler"
discharger = "stage 11's source-to-binary work, and nothing here. The model writes `ram' = FALSE` outright (RSKeySecurityState.tla:1225); the code's equivalent is state.rs:426-436 plus the exhaustive destructuring at :665-703, whose own comment says a field added later stops the pattern compiling. What no proof in this tree covers is that the emitted image does what the `Drop` says"
expressible = "no — a fact about a compiler, not about the model"
registered = "yes — assurance/platform.toml PLAT-TOOLCHAIN-001, whose `covers` this bundle extended. Not a new row: the statement is that entry at one site, and a second entry would be two answers about one premise"

[[assumption]]
id = "AS-RAM-5"
statement = "The invariant is INERT on the shipped tree: it has no falsifying reachable state by construction, so its GREEN carries no information beyond AS-RAM-3's guard."
kind = "model fidelity"
discharger = "already measured, and written down rather than re-derived: formal/README.md:822-845 records that dropping SeedReachable's `ram` disjunct leaves the state set IDENTICAL and flips no verdict, and that two of the three `ram' = FALSE` assignments (ResetFinish :1371 and VolatileCleared :1405) are dead. The same page names what would make it bite — the second reset path, `Fs::factory_wipe`, still unmodelled, if its reboot were ever separated from the wipe. This is the row that says what the two GREEN configurations are worth, and a bundle without it publishes two GREENs as if they were two kills"
expressible = "no — a statement about the reachable state graph, not a constant"
registered = "yes — assurance/platform.toml PLAT-MODEL-006, pending. There was no non-degeneracy class in that registry at all; SEC-FIDO-001 carries the same obligation as an exit criterion instead"

[[assumption]]
id = "AS-RAM-6"
statement = "The invariant is about REACHABILITY through `Ctx::load_keydev`, not about residue in SRAM: a copy the code can no longer reach satisfies it whatever the memory holds."
kind = "platform"
discharger = "a board measurement, and one exists without its artifact — it is `assurance/platform.toml` PLAT-MEM-001 and its `discharge` field carries the part, the date and the procedure. Deliberately NOT restated here: nothing in this bundle was taken on silicon, `freshness.expires_on_stepping` says so, and a stepping named in this file's prose makes the evidence gate demand a `build.board_revision` the bundle would then be claiming falsely. What belongs here is the software half: crates/rsk-fido/src/lib.rs:104-108 is the reachability the antecedent means — the RAM copy wins over flash — and the residue question is a different subject under a different entry"
