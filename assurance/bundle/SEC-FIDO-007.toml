host_triple = "aarch64-apple-darwin"
firmware_triple = "thumbv8m.main-none-eabihf"
machine = "18 cores, macOS 27.0 aarch64 — the figure TLC's own banner records, so the artifact and this line cannot disagree"
# NOT the same list as SEC-FIDO-001's, and the difference is the point: this
# property's evidence is a model check plus a host-test slice, neither of which
# reads a board preset or a flash geometry, so the equivalence is over the whole
# column set except the six feature columns the matrix already holds as gaps.
equivalent_columns = ["firmware-pico", "waveshare-one"]

# ---- 3. Method and scope/bounds ----------------------------------------------

# FOUR mechanised ways and one review, and that is the whole list. There is no
# Kani harness (`kani=0`) and no TraceSecurity configuration checks this
# invariant — `grep -lw RamNeverOutlivesFlashSeed formal/*.cfg` is exactly
# Shipped.cfg, AlwaysUv.cfg and Solo_RamNeverOutlivesFlashSeed.cfg. Neither is
# invented below.

[[method]]
obligation = "the invariant over the whole reachable space of the shipped constants"
method = "model-check"
artifact = "formal/RSKeySecurityState.tla::RamNeverOutlivesFlashSeed + Shipped.cfg::RamNeverOutlivesFlashSeed"
bound_rps = 2
stops_rps = "nothing this invariant can express — `ram => store.seed` names two booleans and no constant. What two costs is reach alone: a falsifying state that first arises over a third relying party is not in the set searched"
bound_channels = 2
stops_channels = "nothing this invariant can express; what two costs is reach — a falsifying state first arising over a third concurrent channel is not in the set searched"
bound_max_retries = 8
stops_max_retries = "nothing at all. The ladder is off this property's path and eight IS the shipped value, so this axis is neither a shrink nor a term"
bound_mismatch_limit = 3
stops_mismatch_limit = "nothing at all, for the same reason as the ladder it pairs with"
bound_max_clock = 1
stops_max_clock = "nothing this invariant can express. What one Tick costs is reach: a falsifying state needing a second unit of elapsed time is not in the set searched"
bound_reset_window = 0
stops_reset_window = "nothing this invariant can express. What zero costs is reach: a reset started inside the shipped window is a prefix no run here produces"
shipped_relation = "MaxRetries and MismatchLimit ARE the shipped MAX_PIN_RETRIES (8) and PIN_MISMATCH_LIMIT (3) at crates/rsk-fido/src/consts.rs:368,372; RPs and Channels are 2 against an unbounded device; MaxClock 1 is the smallest value at which Tick is not dead; ResetWindow 0 runs the window closed only. AND NONE OF THE SIX IS ON THIS PROPERTY'S PATH: `ram => store.seed` names two booleans and no constant, so what the six buy is the reachable set a falsifying state would have to appear in, and what they cost this invariant is nothing it can express. That is the honest difference from SEC-FIDO-001, where MaxRetries IS the retry ladder the invariant is about"
cfg = "none"
features = "none"

[[method]]
obligation = "the same invariant on the arm of AlwaysUvShipped the default image does not build"
method = "model-check"
artifact = "AlwaysUv.cfg::RamNeverOutlivesFlashSeed"
bound_rps = 2
stops_rps = "a falsifying state that first arises over a third relying party, on the alwaysUv arm — reach again, since the invariant names no relying party"
bound_channels = 2
stops_channels = "a falsifying state that first arises over a third concurrent channel, on the alwaysUv arm"
bound_max_retries = 2
stops_max_retries = "nothing this invariant can express: neither constant appears in `ram => store.seed`, so six rungs off the ladder is free here in a way it is not for SEC-FIDO-001"
bound_mismatch_limit = 1
stops_mismatch_limit = "nothing this invariant can express, for the same reason"
bound_max_clock = 1
stops_max_clock = "any falsifying state needing a second unit of elapsed time, on this arm as on the shipped one"
bound_reset_window = 0
stops_reset_window = "the in-window arm, on this arm as on the shipped one"
shipped_relation = "the retry ladder is REDUCED here and the shipped one is not — 8:3 becomes 2:1 (formal/AlwaysUv.cfg:6-7) — because the arm buys the alwaysUv reachability question and Shipped.cfg is the row that is about the ladder. For THIS invariant the shrink is free in a way it is not for SEC-FIDO-001: neither constant appears in `ram => store.seed`. What the row does buy is that both arms of a registered standing assumption run against this property, which SEC-FIDO-001 also has and the other MODELLED-ONLY rows mostly do not"
cfg = "none"
features = "none"

[[method]]
obligation = "non-degeneracy: the invariant CAN go red, and the red names it rather than a sibling"
method = "model-check"
artifact = "Solo_RamNeverOutlivesFlashSeed.cfg::BugStateResetAfterWipe"
bound_invariants = 2
stops_invariants = "anything about the rest of the invariant set — and the isolation is not optional here: the two structural facts are kept OUT of the model's all-invariants block, and the Mut_ twin under this same switch is recorded going RED on a SIBLING's name"
bound_armed_switches = 1
stops_armed_switches = "any defect needing two switches at once. One armed switch is what makes this the only place in the tree where this property is observed to fail"
bound_rps = 2
stops_rps = "a falsifying state that first arises over a third relying party, on the one row where this invariant is seen to fail"
bound_channels = 2
stops_channels = "a falsifying state that first arises over a third concurrent channel, on that same row"
shipped_relation = "the configuration checks TypeOK and this invariant and NOTHING ELSE (formal/Solo_RamNeverOutlivesFlashSeed.cfg:50-52), and arms BugStateResetAfterWipe alone with every other Bug* FALSE — which is what tells this kill from a neighbouring invariant's. It is needed here in a way it is not on Shipped.cfg: formal/gen-configs.sh:109-114 keeps the two structural facts OUT of ALL_INV precisely so a mutant reports the first invariant it violates, and formal/runs.toml:93 records Mut_BugStateResetAfterWipe.cfg going `RED: ResetNeverWeakensSurvivingState` — a SIBLING's name — under the same switch. So the Solo row is the only place in the tree where this property is observed to fail"
cfg = "none"
features = "none"

[[method]]
obligation = "the production side: which sites own the antecedent, and whether the tagged owner is one of them"
method = "review"
artifact = "crates/rsk-fido/src/seed.rs::ensure_seed + crates/rsk-fido/src/state.rs::clear_keydev_dec + crates/rsk-fido/src/lib.rs::load_keydev"
bound_tagged_owners = 1
stops_tagged_owners = "any owner outside the one tagged site. This is a count of SITES and not a shrink of a shipped constant, because a review has no other unit"
bound_ram_writer_sites = 4
stops_ram_writer_sites = "a writer the grep did not reach. Four are one producer and three destroyers, and a count of them says which sites write the RAM copy, never that they run in an order the implication needs"
bound_ram_reader_sites = 4
stops_ram_reader_sites = "anything about what a reader DOES with the copy it read. Four sites read it and the count is of sites, not of uses"
bound_projection_sites = 2
stops_projection_sites = "nothing about a shipped image — both projection sites are cfg-gated and neither is in one. They are counted apart for that reason, so no bound here credits them as production coverage"
bound_files_in_argument = 6
stops_files_in_argument = "anything in a seventh file — and the measurement is the point: the slice page estimated three files, named the tag's file, and missed both writers and the ordering site"
bound_crates = 2
stops_crates = "a site outside the two crates. A holder of the RAM copy in a third would be outside the argument"
shipped_relation = "the four writers are one producer (vendor.rs:592) and three destroyers (vendor.rs:591, config.rs:428, and reset.rs:104 through FidoState::reset -> Drop); the four readers are crates/rsk-fido/src/lib.rs:106, config.rs:415, config.rs:421 and vendor.rs:967; the two projection sites are crates/rsk-device/src/ctap.rs:221 and crates/rsk-fido/src/reset_assurance.rs:49 and BOTH are cfg-gated, so neither is in a shipped image. Six files and two crates against the THREE files docs/authorization-slice.md:484-487 estimated (seed.rs, state.rs, lib.rs) — the estimate named the tag's file and missed both writers and the ordering site, and seed.rs is the one of the three that contains no `keydev_dec` at all. This bound is a count of sites, not a shrink of a shipped constant, because a review has no other unit"
