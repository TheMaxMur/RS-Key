# THE CALIBRATION COUNTERPART. Stage 1A п.3's ten-group contract at the WEAK end
# of the registry, so that the cost §10 takes from `SEC-FIDO-001` has a second
# point and stops being one number off the strongest row of fifty-nine.
#
# `SEC-FIDO-007` `RamNeverOutlivesFlashSeed`: cfgs=4 mut=1 co=1 kani=0 fuzz=0
# rust=2 test=0, against the strong row's 46/11/11/4. Same ten groups, same
# floors, same gate — `scripts/bundle_gate.py` reads the DIRECTORY now, so this
# file is held to every rule the first one is.
#
# Three of its findings are about the contract rather than about the property,
# and they are why a counterpart was asked for:
#
#  * the floors are NOT calibrated out of a weak row's reach. The hypothesis
#    written before this was built said `mutation`, `tool` and `result` would be
#    unreachable "not by work but by absence of subject". Measured: all ten
#    groups clear without padding, and the one that came closest is `mutation`,
#    which needed the gate and code levels the strong row also uses;
#  * `bound_*` is taken by WEAKER material here. Sixteen of the strong row's
#    twenty-six bound keys compress a shipped constant; a review row and a
#    mutation row have no such unit, so their bounds are counts of sites and of
#    patch hunks. The floor is met and the material behind it is thinner;
#  * `registered` went from ten `no`s to ten `yes`es only because building this
#    STOOD UP the registry rows. Six entries in `assurance/platform.toml` did not
#    exist before this bundle, and one of them is a finding in its own right: the
#    tool-TCB registry had a row for the prover the single bounded slice uses and
#    NONE for the model checker every model-checked row in this tree rests on.

# ---- 1. Property, subject and owners -----------------------------------------

[property]
id = "SEC-FIDO-007"
invariant = "RamNeverOutlivesFlashSeed"
# `assurance/properties.toml:160`, verbatim.
statement = "The RAM copy of the device seed never survives the flash record: ram implies store.seed. Structural fact the model asserts rather than argues from."
# §4.1's subject classes. TWO are covered against SEC-FIDO-001's three, and the
# difference is not a shrink of ambition: `requirement` is absent because no
# requirement document states this property, which is the next field.
subjects = ["abstract model", "Rust source"]
subjects_absent = ["requirement", "FFI", "binary", "hardware", "integration"]
# What stands in for a requirement, since nothing external states one. The
# registry's `source` names ONE clause and no specification section
# (assurance/properties.toml:161), and formal/README.md:115-121 classes the
# invariant as a structural fact that is "not a requirement".
requirement = [
  "formal/RSKeySecurityState.tla:1706-1713 — the model's own argument: why SeedReachable's `ram` disjunct is inert",
  "formal/README.md:121 — the claim table row that relies on it, and the sentence that it was measured once and then relied on",
  "CTAP 2.3 states nothing here: §6.6 authenticatorReset bounds what a reset destroys and says nothing about an authenticator's volatile copy of its own seed",
]
threat_clause = "docs/threat-model.md#TM-ZEROIZATION"
# AND THE CLAUSE DOES NOT SAY WHAT THE PROPERTY IS ABOUT. Read at
# docs/threat-model.md:398-413, `## Zeroization` makes one rule — key-grade
# material in RAM is wiped WHEN ITS USE ENDS, "on drop", "at end of scope",
# "as soon as a message completes" — and names session state, PIN/UV tokens,
# transient key copies, transport buffers, the DEVK and the MKEK. It never names
# the vendor-unlock seed copy, and it states no ordering between a RAM secret and
# a flash record. Worse in the one direction that matters: `keydev_dec` is a
# documented EXCEPTION to that rule. crates/rsk-fido/src/state.rs:338-339 —
# "held until power-off, a reset, or an AUT_DISABLE" — and
# crates/rsk-fido/src/config.rs:405-409 — "`keydev_dec` carries no channel, token
# or timer and lives until power-off (audit run-34 #28). That is accepted". So
# the registered source is a clause the property's own subject is carved out of.
threat_clause_reading = "the anchor is topical and not the claim: TM-ZEROIZATION is end-of-use wiping, this property is an ORDERING between the RAM copy and the flash record across a reset. What would fix it is a threat-model sentence naming the vendor-unlock RAM seed and the reset ordering — reset.rs:100-104 already carries the argument in prose — or a re-source onto a clause about the wipe order. TM-HOST-POWER-CUT is the nearest existing clause and is about a torn flash WRITE, not about volatile state outliving it"
# What `assurance_gate.py` derives as `rust = 1`. Read the derivation before the
# column: `grep_word` matches the bare invariant name ANYWHERE in a production
# file and returns FILE NAMES, so the column counts files that MENTION it, not
# sites that own it — and a second tag in an already-counted file adds nothing.
# The `Refines` regex belongs to a different function, which only validates.
owners_tagged = ["crates/rsk-fido/src/seed.rs:616 seed::ensure_seed", "crates/rsk-fido/src/vendor.rs::unlock — the producer, tagged after this bundle measured that it was not"]
# AND THE TAG IS ON THE CONSEQUENT. `grep -c keydev_dec crates/rsk-fido/src/seed.rs`
# is 0, and `ensure_seed` takes no `FidoState` at all, so it structurally cannot
# touch the antecedent: it writes `EF_KEY_DEV`, which is `store.seed`. It can
# never falsify `ram => store.seed`; it can only make the right side true.
owners_tag_reading = "an independent measurement REFUTED the reading this bundle first wrote. The three SEC-FIDO-006 tags at reset.rs:35, state.rs:425 and crates/rsk-fido/src/lib.rs:103 are NOT a sibling's tag standing in this one's place: SEC-FIDO-006 is ResetNeverWeakensSurvivingState, two of whose three clauses contain SeedReachable == store.seed \\/ ram — the same `ram`. All three functions legitimately own BOTH properties, and crates/rsk-fido/src/lib.rs:104-108 `Ctx::load_keydev` IS SeedReachable's disjunction in Rust, cited for exactly that twice in RSKeySecurityState.tla. The defect is a MISSING SECOND TAG, not a wrong first one. The one genuinely untagged owner is vendor.rs:558 `unlock`, which the model names as `ram`'s only producer"
# Every production site that writes or reads the RAM copy, enumerated over five
# spellings because one under-approximates: the field, `clear_keydev_dec`,
# `ctx.state.reset()`, `*self = Self::new()` and the destructuring `Drop`.
owners_writers = [
  "crates/rsk-fido/src/vendor.rs:592 — `ctx.state.keydev_dec = Some(seed)`, the SOLE producer (model: DeviceUnlock)",
  "crates/rsk-fido/src/vendor.rs:591 — the clear before it, so an unlock cannot stack two copies",
  "crates/rsk-fido/src/state.rs:386 — `keydev_dec: None` in `FidoState::new`",
  "crates/rsk-fido/src/state.rs:413 — `clear_keydev_dec`, zeroize then None",
  "crates/rsk-fido/src/state.rs:431 — `*self = Self::new()` inside `FidoState::reset`, which drops the old value",
  "crates/rsk-fido/src/state.rs:701 — `Drop for FidoState`, the exhaustive destructuring that zeroizes it",
  "crates/rsk-fido/src/config.rs:428 — AUT_DISABLE's clear; the model omits this action outright",
  "crates/rsk-fido/src/reset.rs:104 — `ctx.state.reset()` AHEAD of every flash write, which is the ordering the invariant IS",
]
owners_readers = [
  "crates/rsk-fido/src/lib.rs:106 — `Ctx::load_keydev`, RAM first then flash: the concrete SeedReachable, and the chokepoint nine call sites reach it through",
  "crates/rsk-fido/src/config.rs:415 — AUT_DISABLE's authorization gate",
  "crates/rsk-fido/src/config.rs:421 — the take that re-seals it",
  "crates/rsk-fido/src/vendor.rs:967 — BACKUP_STATE's ungated `unlocked` bit",
  "crates/rsk-device/src/ctap.rs:221 — the trace projection, cfg-gated",
  "crates/rsk-fido/src/reset_assurance.rs:49 — the verification projection, cfg-gated",
]
# The file the one killed code twin patches (formal/comutants.toml:350-373), and
# what the `co = 1` column is. It is not among the owners above and not tagged.
owners_co_refuted = ["crates/rsk-fido/src/reset.rs"]
# The unit test that kills that twin, recorded here because it counts in NO
# derived column: `assurance_gate.py`'s `rust` axis drops filenames containing
# `tests`, and its `test` axis reads only `tests/**/*.py`.
owner_of_the_kill = "crates/rsk-fido/src/reset_tests.rs:1202 a_torn_reset_never_leaves_the_session_running_on_a_wiped_seed"

# ---- 2. Commit, build and features -------------------------------------------

[build]
commit = "3e08f7532328895750ad0e66516f79a1002b2a67"
tree_state = "clean but for the untracked FORMAL_VERIFICATION_ROADMAP.md. The runs were taken at `03efa33` with `formal/` frozen, and the recorded commit is three later — the difference in the only input among them, `formal/RSKeySecurityState.tla`, is COMMENT-ONLY: `git diff 03efa33 3e08f75 -- formal/RSKeySecurityState.tla` moves citation line numbers and one prose sentence, and every changed line outside a comment block is a `CONSTANTS` name with a trailing `\\*` note. The independent check is the state count: Shipped.cfg returned 77 563 872 distinct here, byte-identical to `formal/runs.toml`'s recorded tier"
matrix_column = "firmware"
cargo_features = "none — the default workspace feature set; the co-refutation slice is `cargo test -p rsk-fido` with none either"
