provenance = "the dev shell's zulu-ca-jdk 8.0.492, which is what run-tlc.sh takes for $JAVA"
invocation = "nix develop -c java -version"
environment = "the same shell every TLC row below ran in"

[[tool]]
name = "cargo-kani"
version = "0.67.0"
provenance = "the version pinned as KANI_VERSION in .github/workflows/ci.yml and read by scripts/kani_gate.py. cargo-kani is in no nix file, so its pin is a number in a workflow rather than a hash in flake.lock — AS-RESET-7 is the row that carries that gap"
invocation = "nix develop -c cargo kani -p rsk-fs --harness <name>"
environment = "aarch64-apple-darwin, default workspace features, --cfg kani"

[[tool]]
name = "rustc"
version = "1.96.0 (ac68faa20 2026-05-25)"
provenance = "the dev shell's pinned stable toolchain, printed by its banner on every command here"
invocation = "nix develop -c rustc -vV"
environment = "host aarch64-apple-darwin; no firmware image is built for anything in this bundle"

[[tool]]
name = "the gate suite"
version = "the tree at the commit this bundle records"
provenance = "scripts/*.py of this checkout, run through the same dev shell"
invocation = "nix develop -c python scripts/bundle_gate.py, and the four gates result.gate_* transcribe"
environment = "the dev shell's python 3; no network and no board on any row"

