#
# THE COMPOSITION COUNTERPART. Stage 1A п.3's ten-group contract over the one
# P0-launch property that is a CONJUNCTION with its conjuncts separately
# registered — `SEC-FIDO-006A/006B/006C` are `clause_of = "SEC-FIDO-006"` — so
# this bundle is about what a composed claim's evidence reads as when the
# apparatus counts the parts and the runs check the whole.
#
# `SEC-FIDO-006` `ResetNeverWeakensSurvivingState`: cfgs=40 mut=3 co=3 kani=1
# fuzz=1 rust=3 test=1, and it is the only one of the eleven whose `test` column
# is not zero. Against `SEC-FIDO-001`'s 49/12/12/4 and `SEC-FIDO-007`'s 5/1/1/0
# it sits between them, and it is the first bundle in this directory whose
# subject reaches all four rungs of the ladder — model, proof, fuzz, board.
#
# Three findings are the reason a composition counterpart was worth building,
# and none of them is about the firmware:
#
#  * THE PARENT'S GREEN RUNS DO ASSERT ALL THREE CONJUNCTS, and the registry
#    cannot see it. `scripts/assurance_gate.py:122-142` reads the bare names
#    under a configuration's `INVARIANTS` block and never opens the module, so a
#    conjunction's conjuncts are invisible to it. At `build.commit` each clause
#    row therefore read `asserted 0 of 1` while the parent read `4 of 40` —
#    and the same three clauses had just held over 77 563 872 distinct states.
#  * ONE OF THE THREE CLAUSES CANNOT FAIL ON THREE OF THE FOUR GREEN RUNS.
#    `ResetKeepsTheAlwaysUvGate` is unfalsifiable by construction wherever
#    `AlwaysUvShipped = TRUE`, which is `AlwaysUv.cfg`, `PermWide.cfg` and
#    `ForceChange.cfg`. So the parent's `asserted 4` is, for clause B, one
#    non-vacuous run and three vacuous ones — and no column in this tree says so.
#  * AND THE CLAUSE SPLIT IS A LOCALISATION DEVICE AT BOTH TIERS, NOT A
#    STRENGTHENING. At tier B the three `SoloClause_*.cfg` rows exist because all
#    three parent-credited mutants report through the THIRD clause; at tier C the
#    three clause harnesses assert conjuncts of what the parent harness already
#    asserts. What each buys is which conjunct, not another obligation — and the
#    fuzz and HIL rungs below them have no such split at all.

# ---- 1. Property, subject and owners -----------------------------------------

[property]
id = "SEC-FIDO-006"
invariant = "ResetNeverWeakensSurvivingState"
# `assurance/properties.toml:129`, verbatim.
statement = "No prefix of an authenticatorReset — torn or complete — leaves a surviving usable secret whose gate has already gone; the RAM copy of the seed counts as surviving."
# §4.1's subject classes. FOUR are covered, which is one more than SEC-FIDO-001
# and two more than SEC-FIDO-007, and the fourth is `requirement` only in the
# sense `threat_clause_reading` below narrows it to.
subjects = ["requirement", "abstract model", "Rust source"]
subjects_absent = ["FFI", "binary", "hardware", "integration"]
requirement = [
  "CTAP 2.3 §6.6 authenticatorReset — the END state and its authorization, and nothing about a PREFIX of it: every §6.6 citation in this tree is the power-up window, the touch, or the two ways the gesture can fail (crates/rsk-fido/src/reset.rs:40-42 and :255-261, crates/rsk-device/src/lib.rs:54, crates/rsk-sdk/src/presence.rs:81). None attributes an ordering or atomicity obligation to it, because the specification states none",
  "docs/threat-model.md#TM-HOST-POWER-CUT — the clause that DOES state this property, in its own words: `no gate comes up softer on the next boot than it went down — a torn authenticatorReset may not drop the PIN or alwaysUv record while leaving a credential usable`. That sentence is clauses A and B",
  "docs/threat-model.md#TM-SEED-BACKUP — clause C's root, and it is a real one: `after an explicit finalize, export is refused until a full reset regenerates a new seed`. A torn reset that clears EF_BACKUP_SEALED over a seed it did not regenerate is that sentence made false",
]
threat_clause = "docs/threat-model.md#TM-HOST-GATES"
# AND THE REGISTERED CLAUSE MERELY LINKS TO THE PROPERTY; it does not cover it.
# `TM-HOST-GATES` is three lines — "PINs/UV with retry counters and lockout,
# physical-touch requirements on FIDO operations and OpenPGP UIF, OATH access
# codes, PIV management-key auth" (docs/threat-model.md:27-29). It names the two
# gates clauses A and B are about and states no obligation ACROSS a reset: no
# ordering, no prefix, no "comes up softer". It is also the tree's catch-all —
# 19 of the registry's `source` lines name it, against ONE for
# `TM-HOST-POWER-CUT`, which is the clause that states this property almost
# verbatim and is registered to the store family instead.
threat_clause_reading = "the anchor is topical and not the claim, and the clause that IS the claim exists two bullets down the same page. `TM-HOST-GATES` gives the vocabulary (a PIN gate, an alwaysUv gate) and no rule a torn reset could break; `TM-HOST-POWER-CUT` gives the rule and is claimed by `SEC-STORE-003` alone. What would fix it is one line in assurance/properties.toml: `source` gains `docs/threat-model.md#TM-HOST-POWER-CUT` beside the two it has. The clause rows are better off than the parent — `SEC-FIDO-006C` is already sourced onto `TM-SEED-BACKUP`, which states its obligation outright, while `006A`/`006B` inherit the parent's catch-all"
# The five `Refines … — SEC-FIDO-006` tags the registry greps for, in three
# files. The `rust` column is 3 because `assurance_gate.grep_word` returns FILE
# names: two of the five tags move nothing.
owners_tagged = [
  "crates/rsk-fido/src/reset.rs:35 reset — the command itself",
  "crates/rsk-fido/src/reset.rs:133 sweep — one phase of it",
  "crates/rsk-fido/src/reset.rs:313 survives_factory_reset — the OTHER wipe, the trusted-display one, which the model does not have at all",
  "crates/rsk-fido/src/state.rs:425 FidoState::reset — the volatile half, and the first thing the command does",
  "crates/rsk-fido/src/lib.rs:103 Ctx::load_keydev — RAM first then flash, which is what makes the RAM copy count as surviving",
]
# And the three CLAUSE tags, which are all on one function and are the reason
# each clause row derives `rust = 1`.
owners_tagged_clauses = "crates/rsk-fido/src/reset.rs:245-247 — all three, on `is_fido_gate_record`, whose own doc comment at :237-243 says the list is FIVE records and the clauses are three and that `EF_DEVICE_PIN` and `EF_MINPINLEN` are in the phase and in no clause"
# The ordering site, which carries no tag of its own and is where the property
# actually lives.
owner_of_the_order = "crates/rsk-fido/src/reset.rs:104-121 — `ctx.state.reset()` first, then FIDO_SEED_FIDS in its own loop, then the secret sweep, then the gate sweep, then ensure_seed. Five steps in that order and nothing enforces it but the order; the whole property is a statement about this block"
# The verification-only Rust that MIRRORS the conjunction, which is the fact this
# bundle is about and which no derived column mentions.
owner_of_the_alpha = "crates/rsk-fido/src/reset_assurance.rs:106-134 — `reset_keeps_the_pin_gate`, `reset_keeps_the_always_uv_gate`, `reset_keeps_the_backup_seal` and, at :130-134, their conjunction under the parent's name. The composition is written twice, in TLA+ and in Rust, and the two agree"
# What co-refutation patches, which the derived column cannot see, and where the
# three killing tests are.
owners_co_refuted = ["crates/rsk-fido/src/reset.rs"]
owners_of_the_kills = [
  "crates/rsk-fido/src/reset_tests.rs:723 a_torn_reset_never_unseals_a_surviving_seed — the shipped twin RSKeySecurityState.tla:1827 names",
  "crates/rsk-fido/src/reset_tests.rs:1202 a_torn_reset_never_leaves_the_session_running_on_a_wiped_seed",
  "crates/rsk-fido/src/reset_assurance_tests.rs:130 a_backup_seal_swept_with_the_secrets_is_a_reopened_export_window",
  "crates/rsk-fido/src/reset_assurance_tests.rs:46 reset_property_controls_go_red_on_each_early_gate_mutant — three mutants, one per clause, and the only per-clause negative control anywhere in the tree outside `formal/`",
]

