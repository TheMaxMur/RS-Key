tree_state = "the runs this bundle records are `formal/runs.toml`'s safety tier, taken at `9cafee7`. THE TIER HAS NOW MOVED UNDER THIS BUNDLE TWICE — it was written against `b819ee5`, re-derived at `b185fc3`, and re-derived again here — and each time every state count, wall clock, log digest and preserved log was taken again from `formal/runs.toml` and from `formal/out/`. What the third pass shows is a clean split, and it is worth more than any single number: the four GREEN configurations moved in NOTHING but wall clock (Shipped 1984 -> 1938 s, AlwaysUv 536 -> 535, PermWide 555 -> 561, ForceChange 182 -> 178) — identical states, distinct states and depth, because a complete search is a property of the model; while every RED one moved in states and distinct too, because an aborted search stops where two workers happened to be. Falsifying names and depths did not move on any of them. All eight sha256s moved, all eight logs are replaced. The working tree while this was written is NOT clean: it carries another agent's uncommitted `crates/rsk-otp/**`, `CHANGELOG.md`, `docs/` and `firmware/src/main.rs` edits, none of which this bundle's inputs reach. The transcribed `result.gate_*` lines were re-derived over that tree at the moment they were written, which is what `bundle_gate.gate_transcriptions` holds them to"
