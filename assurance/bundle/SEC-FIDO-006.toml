# ---- 3. Method and scope/bounds ----------------------------------------------

# NINE ways, and the ladder they make is the subject. docs/reset-refinement.md
# calls it the evidence ladder and lists five rungs; this table splits the model
# rung in three (the parent's arms, the clause isolation) and the proof rung in
# two (the parent harness, the clause harnesses), because that split is where the
# composition question lives.

