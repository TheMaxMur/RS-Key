bound_rps = 2
stops_rps = "a torn prefix that first goes wrong over a third relying party; no clause names one, so what two costs is reach and not a term"
bound_channels = 2
stops_channels = "a torn prefix that first goes wrong over a third concurrent channel"
bound_max_retries = 8
stops_max_retries = "nothing by shrinking — eight IS the shipped ladder, and no clause of this conjunction names a retry count"
bound_mismatch_limit = 3
stops_mismatch_limit = "nothing by shrinking, for the same reason as the ladder it pairs with"
bound_max_clock = 1
