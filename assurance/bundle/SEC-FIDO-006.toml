c_kani = "the four harnesses of crates/rsk-fido/src/reset_refinement_kani.rs are this property's whole bounded evidence and the only reason its status reads BOUNDED. docs/reset-refinement.md records the parent solving in 0.52 s and the three clause harnesses in 0.45–0.48 s on Kani 0.67.0, all four covers reachable — and records the measurement that made those numbers possible, a direct run through the real `FidoState::reset()` stopped after 72.45 s with CBMC still unwinding `zeroize`"
