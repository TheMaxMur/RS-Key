r_owners = "five `Refines` tags in three files for the parent and three more on one function for the clauses; the ordering the property IS carries no tag at all and is crates/rsk-fido/src/reset.rs:104-121. One of the five tags is on `survives_factory_reset`, the trusted-display wipe — a SECOND reset path with no action in the model, which formal/README.md names as the one that would make SEC-FIDO-007's invariant bite"
