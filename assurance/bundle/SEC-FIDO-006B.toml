stops_negative_controls = "any control over the WIPE. The one per-clause control sets `persistent.always_uv = false` by hand after `begin()` and asserts the clause method returns false — it proves the method can fail, not that the phase order is what keeps it true"
bound_feature_flavours = 2
stops_feature_flavours = "nothing, and that is the finding rather than a gap in the row: both flavours were driven and both are green, so the pair bounds no defect and instead measures that the α cannot tell them apart"
