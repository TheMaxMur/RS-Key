# ---- 8. Mutation verdicts ----------------------------------------------------

# NINE rows, none `inverse`. SIX are model rows over the recorded safety tier and
# THREE are code rows; NOT ONE mutates a gate script. That split is stated because
# `VERDICT_FLOOR` counts rows and two bundles in this directory clear it with the
# majority of their rows mutating gate scripts — a floor taken that way proves
# nothing about the firmware.

[[mutation]]
level = "B"
mutant = "BugResetGatesFirst — the two sweeps exchanged so the gate phase runs first, against this clause alone"
invocation = "formal/run-tlc.sh SoloClause_ResetKeepsTheAlwaysUvGate.cfg"
expected = "RED: ResetKeepsTheAlwaysUvGate"
verdict = "RED: ResetKeepsTheAlwaysUvGate, 20 480 388 states, 2 063 890 distinct, depth 18, 40 s"
fell = "ResetKeepsTheAlwaysUvGate, at log line 17, in an Idle state reached by ResetAborts with snap.auv TRUE, snap.surv = {r1}, store.seed TRUE and gate.alwaysUv FALSE"
direction = "modelled"
reading = "the counterexample is a credential the owner still has beside an alwaysUv override the wipe already dropped, which is the defect and not its inverse: the inverse — a wipe that keeps EF_ALWAYS_UV too long — leaves gate.alwaysUv TRUE and makes the consequent true, so it cannot redden this row at all. The route is State 17 ResetSweepGates and State 18 ResetAborts, and State 13 is the ConfigOp that raised the flag in the first place: at AlwaysUvShipped FALSE nothing else can, which is why this trace needs a live token where the sibling clause's does not."

[[mutation]]
level = "B"
mutant = "the same switch, against the PIN clause alone — carried as the control that says this clause's red is not its sibling's"
invocation = "formal/run-tlc.sh SoloClause_ResetKeepsThePinGate.cfg"
expected = "RED: ResetKeepsThePinGate, and a falsifying state in which THIS clause is not violated"
verdict = "RED: ResetKeepsThePinGate, 8 729 164 states, 918 170 distinct, depth 16, 18 s"
fell = "ResetKeepsThePinGate, at log line 17, with snap = [pin TRUE, seen TRUE, auv FALSE, surv {r1}, seed TRUE, sealed FALSE] and pin.set FALSE"
direction = "modelled"
reading = "snap.auv is FALSE in that state, so the alwaysUv clause's antecedent is false and the clause holds vacuously there — the mirror of the row above, where pin.set is TRUE and the PIN clause holds. One switch, two configurations, two counterexamples, and neither is evidence about the other clause: the separation is by witness rather than by argument, and it runs in both directions rather than the one the parent bundle records."

[[mutation]]
level = "B"
mutant = "the same switch armed alone against the PARENT invariant, which is the granularity the tree had before the clause rows existed"
invocation = "formal/run-tlc.sh Solo_BugResetGatesFirst.cfg"
expected = "RED: ResetNeverWeakensSurvivingState, and the question is which conjunct"
verdict = "RED: ResetNeverWeakensSurvivingState, 23 327 states, 5 331 distinct, depth 8, 1 s"
fell = "ResetNeverWeakensSurvivingState, at log line 16, with snap = [pin FALSE, seen TRUE, auv FALSE, surv {}, seed TRUE, sealed TRUE] and gate.backupSealed FALSE"
direction = "modelled"
reading = "the switch that is the SOLE model owner of this clause reports through a clause it does not own. snap.surv is empty and snap.auv is FALSE, so the alwaysUv conjunct is vacuous twice over in the falsifying state and what actually fell is the backup seal — reached at depth 8 where this clause needs 18. A verdict column at invariant granularity cannot show that, and this row is why the clause-level configuration exists."

[[mutation]]
level = "B"
mutant = "the same switch against the whole invariant set rather than one name"
invocation = "formal/run-tlc.sh Mut_BugResetGatesFirst.cfg"
expected = "RED: ResetNeverWeakensSurvivingState, TLC reporting the first violated name of the block"
verdict = "RED: ResetNeverWeakensSurvivingState, 24 048 states, 5 472 distinct, depth 8, 1 s"
fell = "ResetNeverWeakensSurvivingState, at log line 16, on the identical shape — snap.surv {}, snap.auv FALSE, snap.seed TRUE, snap.sealed TRUE, gate.backupSealed FALSE"
direction = "modelled"
reading = "adding the rest of the invariant set changes nothing about which conjunct is reported: the state counts differ by a few hundred and the falsifying state is the same shape as the solo row's. So neither of the two parent-level ways of arming this defect produces a verdict that names the alwaysUv gate, and a reader taking the parent's RED as evidence about this clause would be reading a backup-seal counterexample."

[[mutation]]
level = "B"
mutant = "the arm rather than the defect: this clause named on a configuration where its own mutant could be armed at AlwaysUvShipped TRUE"
invocation = "no such configuration exists — measured over all 210 by intersecting `grep -l 'AlwaysUvShipped = TRUE' formal/*.cfg` with `grep -l 'BugResetGatesFirst = TRUE' formal/*.cfg`"
expected = "a row that would either exhibit the vacuity or refute it"
verdict = "the intersection is EMPTY: five configurations take the arm (AlwaysUv.cfg, PermWide.cfg, ForceChange.cfg, PermWideMut_BugConsumeKeepsMcGa.cfg, PermWideMut_BugStopUsingKeepsPerms.cfg) and five arm the switch (Mut_BugResetGatesFirst.cfg, Solo_BugResetGatesFirst.cfg, SoloClause_ResetKeepsThePinGate.cfg, SoloClause_ResetKeepsTheAlwaysUvGate.cfg, Solo_NoAccessibleSecretWithoutGate.cfg), and no file is in both lists"
fell = "nothing fell, because nothing ran — and the row is here because that is the content: the vacuity claim in this bundle is argued from the model text and cannot be falsified by any configuration the tree has"
direction = "modelled"
reading = "an unarmed cell of a two-by-two is not a green; it is an absence, and writing it as a mutation row is what stops the argument being read as a measurement. The defect this cell would model is the same phase swap; what it would test is whether the clause still detects it when the compiled default has moved, and the reading of the model says it would not. Adding the configuration is a model change and this bundle does not make one."

[[mutation]]
level = "B"
mutant = "BugStateResetAfterWipe — the volatile reset moved behind the flash work, a reset-family defect this clause does NOT own"
invocation = "formal/run-tlc.sh Solo_BugStateResetAfterWipe.cfg"
expected = "RED: ResetNeverWeakensSurvivingState, and not through the alwaysUv conjunct"
verdict = "RED: ResetNeverWeakensSurvivingState, 478 501 states, 68 156 distinct, depth 11, 2 s, as formal/runs.toml:124 records it"
fell = "ResetNeverWeakensSurvivingState, on the backup-seal shape again, at a state where the RAM seed copy outlives the flash record"
direction = "modelled"
reading = "carried as the negative half of ownership: three switches are credited to the parent invariant and only one of them can redden the alwaysUv conjunct, so `mut = 1` on this row is a smaller number than the parent's `mut = 3` for a reason and not by omission. It is also the one place in the reset family where SeedReachable's RAM disjunct does work, which is what AS-RESET-3 says the green runs never see."

[[mutation]]
level = "code"
mutant = "BugResetGatesFirst as a source patch: the two `sweep` lines of crates/rsk-fido/src/reset.rs:120-121 exchanged, which is exactly the model switch"
invocation = "the slice formal/comutants.toml:339 declares — cargo test -p rsk-fido — driven by scripts/comutate.py, not re-driven for this bundle"
expected = "killed, per formal/comutants.toml:340"
verdict = "recorded `killed`; `assurance_gate.co_refuted` credits it to this clause because SoloClause_ResetKeepsTheAlwaysUvGate.cfg is a solo-style configuration showing it break the clause, which is the whole of this row's `co = 1`"
fell = "the unit suite of rsk-fido, at whichever tests the recorded run names; this bundle did not re-drive the patch and does not claim to know which assertion fell"
direction = "modelled"
reading = "the twin is the tightest correspondence in this bundle — the model switch and the code patch are the same two lines in the same order — and the honest limit is that the RECORDED verdict is a status word in a registry, not a log in this directory. What it says is that the phase order is load-bearing in the Rust; what it does not say is which test noticed, and no artifact here would let a reader check."

[[mutation]]
level = "code"
mutant = "the α state mutant: `persistent.always_uv` set false after `begin()` and the clause method asked whether it still holds"
invocation = "cargo test -p rsk-fido --target aarch64-apple-darwin reset_assurance, driven for this bundle"
expected = "the clause method returns false, which is what the middle third of reset_property_controls_go_red_on_each_early_gate_mutant asserts"
verdict = "GREEN — 6 passed, 0 failed, 0 ignored, 664 filtered out, and the test is one of the six"
fell = "the assertion at crates/rsk-fido/src/reset_assurance_tests.rs:57, `assert!(!always_uv.reset_keeps_the_always_uv_gate(&volatile))`, held — so the negative control is live and the clause method can be made to answer false"
direction = "modelled"
reading = "this is the only per-clause negative control the tree has outside formal/, and it is narrower than it looks: it mutates the STATE and never the wipe, so what it proves is that the method is not a constant true. A phase-order defect would have to reach it through `delete` and `advance`, and that path is the twin row above rather than this one."

[[mutation]]
level = "code"
mutant = "the build feature itself: --features always-uv, which inverts `DEFAULT_ALWAYS_UV` and with it what the presence of EF_ALWAYS_UV means"
invocation = "cargo test -p rsk-fido --features always-uv --target aarch64-apple-darwin reset_assurance, driven for this bundle beside the default-feature run"
expected = "if the α's `always_uv` field meant the GATE rather than the RECORD, the arm that inverts the record's meaning would move at least the per-clause negative control"
verdict = "NO KILL — 6 passed, 0 failed on both arms, against two different test binaries (rsk_fido-f5d8ff78571a8849 and rsk_fido-e1858dd7a29d0379), and the artifact carries both transcripts"
fell = "nothing fell on either arm, which is the row's content: the α is feature-blind, and `git grep 'feature = \"always-uv\"' crates/rsk-fido/src` returns two sites, neither of them in reset.rs, reset_assurance.rs or reset_refinement_kani.rs"
direction = "modelled"
reading = "a survived mutant is the finding here and not a failure of the row. The assertion is TRUE on both builds — the phase order preserves the record whatever it holds — so nothing is wrong; what is measured is that no α-level artifact can distinguish a build where record-present means the gate is ON from one where it means the gate is OFF, and the clause's NAME is only accurate on the first."

