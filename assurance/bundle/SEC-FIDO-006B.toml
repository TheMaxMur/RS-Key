#
# THE SECOND CONJUNCT. `SEC-FIDO-006B` `ResetKeepsTheAlwaysUvGate` is one of the
# three `clause_of = "SEC-FIDO-006"` rows, and the one whose evidence is shaped by
# a build feature: `EF_ALWAYS_UV` exists only as an OVERRIDE of a compiled
# default, so what "the gate survived" means depends on which default the image
# was built with. This bundle is the raw evidence for that clause and for what
# the dependence costs.
#
# `SEC-FIDO-006B` `ResetKeepsTheAlwaysUvGate`: cfgs=2 mut=1 co=1 kani=1 fuzz=1
# rust=1 test=1, derived live and transcribed in §5. Two configurations name the
# clause out of two hundred and ten, one green and one red, and the red one is
# the reason the green one is worth anything.
#
# Four findings, and the first is confirmatory while the other three are not:
#
#  * CONFIRMED, AND RE-DERIVED FROM THE MODEL TEXT RATHER THAN INHERITED. This
#    clause has no falsifying state wherever `AlwaysUvShipped = TRUE`.
#    `gate.alwaysUv` has exactly two writers: `ConfigOp`, which clears `snap` in
#    the same action, and `ResetSweepGates`, whose disjunct is guarded by
#    `gate.alwaysUv # AlwaysUvShipped` and assigns `AlwaysUvShipped` — so on the
#    TRUE arm the wipe can only RAISE the flag. `formal/gen-configs.sh:211-225`
#    already states this and `assurance/bundle/SEC-FIDO-006.toml` records it as a
#    finding; §5 re-derives it and adds what neither says — that NO configuration
#    in the tree arms this clause's own mutant on that arm, so the vacuity is
#    argued and cannot be exhibited by any recorded run.
#  * AND THE MATRIX REGISTER CONTRADICTS IT, IN THIS PROPERTY'S NAME.
#    `assurance/configurations.toml:689-720` is the open question for the
#    `firmware-always-uv` column; it names `SEC-FIDO-006B` and answers "THE MODEL
#    HALF IS ANSWERED", resting that answer on `AlwaysUv.cfg`'s green. That green
#    is the one arm on which this clause cannot go red. The same paragraph says
#    `AlwaysUv.cfg` "runs all six invariants"; it names nine.
#  * THE RUST HALF CANNOT SEE THE FEATURE AT ALL, AND THE TESTS PROVE IT. The
#    model's consequent is the FLAG; `reset_assurance.rs`'s is the RECORD's
#    presence, and the module carries no `cfg(feature = "always-uv")` site. Both
#    arms were driven: the six `reset_assurance` tests, including the only
#    per-clause negative control this clause has, pass identically on a build
#    where `EF_ALWAYS_UV`'s presence means the opposite thing.
#  * AND NO GREEN TLC LOG CARRIES A CONSTANTS BLOCK. The four green logs contain
#    neither the word `CONSTANT` nor `AlwaysUvShipped`, so the evidence that an
#    arm took a constant is the configuration file and never the log — which
#    `assurance/bundle/SEC-FIDO-006.toml:391` says the other way round.

# ---- 1. Property, subject and owners -----------------------------------------

[property]
id = "SEC-FIDO-006B"
invariant = "ResetKeepsTheAlwaysUvGate"
# `assurance/properties.toml:145`, verbatim.
statement = "A torn reset never leaves secrets standing with the alwaysUv gate already destroyed."
subjects = ["requirement", "abstract model", "Rust source"]
subjects_absent = ["FFI", "binary", "hardware", "integration"]
requirement = [
  "CTAP 2.1 §6.11 authenticatorConfig toggleAlwaysUv — the toggle and its persistence, and nothing about a reset PREFIX: crates/rsk-fido/src/config.rs:342-350 cites it for the flip and for `State persists until authenticatorReset`, which is the END state and not an ordering over the writes that reach it",
  "CTAP 2.3 §6.6 authenticatorReset — the same silence the parent records. Every §6.6 citation in this tree is the power-up window, the touch, or the two ways the gesture can fail; none attributes an atomicity or ordering obligation to the specification, because the specification states none",
  "docs/threat-model.md:34-42 — the clause that DOES state the obligation, in its own words: the device owes that across a cut `nothing comes back weaker`, an interrupted write left the old value or the new one and never a third. That sentence, narrowed to the alwaysUv record, is this clause",
]
threat_clause = "docs/threat-model.md#TM-HOST-GATES"
# The anchor is the parent's, inherited through `clause_of`, and it is topical
# rather than the claim.
threat_clause_reading = "`TM-HOST-GATES` is `assurance/threat_clauses.toml:148-150`, anchored on docs/threat-model.md:27-29 — `PINs/UV with retry counters and lockout, physical-touch requirements on FIDO operations and OpenPGP UIF, OATH access codes, PIV management-key auth`. It names the gate this clause is about and states no rule ACROSS a reset. The clause that states the rule is `TM-HOST-POWER-CUT` (assurance/threat_clauses.toml:161-166, anchored on docs/threat-model.md:34), and it is claimed by the store family instead. What would fix it is one entry in this property's `source` list; the clause row inherits the parent's catch-all and is worse off than SEC-FIDO-006C, which is sourced onto a clause that states its obligation outright"
record = "EF_ALWAYS_UV = 0xCE13, crates/rsk-fido/src/consts.rs:322 — one byte, and NOT a plain on/off. crates/rsk-fido/src/config.rs:334-340 resolves it as `[1]` on, `[0]` off, absent falls back to `DEFAULT_ALWAYS_UV`; :351-358 deletes the record when the new value equals that default and writes it otherwise. So the record exists exactly when the effective state differs from the compiled one, which is the abstraction RSKeySecurityState.tla:1363-1368 writes as `gate.alwaysUv # AlwaysUvShipped`"
owner_tag = "crates/rsk-fido/src/reset.rs:246 — `Refines RSKeySecurityState!ResetKeepsTheAlwaysUvGate — SEC-FIDO-006B`, on `is_fido_gate_record`, and it is the whole of what this row's `rust = 1` counts. The tag shares a doc comment with the two sibling clauses' tags, and that comment (reset.rs:237-243) says out loud that the list is FIVE records and the clauses are three"
owner_of_the_order = "crates/rsk-fido/src/reset.rs:120-121 — `sweep(ctx, |fid| is_fido_fid(fid) && !is_fido_gate_fid(fid))?` and then `sweep(ctx, is_fido_gate_fid)?`. Two lines, in that order, and the property is a statement about their order; reset.rs:95-99 is the comment that IS the claim — secrets first, gates last, because the flash ring yields in its own order and one combined sweep could reach the gate records first"
owner_of_the_alpha = "crates/rsk-fido/src/reset_assurance.rs:114-120 — `reset_keeps_the_always_uv_gate`, five disjuncts against the model's implication, and its consequent is `self.persistent.always_uv`, the RECORD's presence. reset_assurance.rs:177 is where that field is cleared, on `delete(EF_ALWAYS_UV)`"
owner_of_the_writer = "crates/rsk-fido/src/config.rs:351-359 — `toggle_always_uv`, the only production site that creates or removes the record outside a reset, and the reason the model's sweep guard reads `# AlwaysUvShipped` rather than the bare flag"
owners_of_the_kills = [
  "crates/rsk-fido/src/reset_assurance_tests.rs:45-63 reset_property_controls_go_red_on_each_early_gate_mutant — its middle third is this clause's only per-clause negative control anywhere outside formal/, and it mutates the STATE and not the wipe",
  "formal/comutants.toml:328-341 BugResetGatesFirst — the code twin, `status = \"patch\"`, `expect = \"killed\"`, and the two swapped `sweep` lines are exactly reset.rs:120-121",
]
siblings = "SEC-FIDO-006A `ResetKeepsThePinGate` and SEC-FIDO-006C `ResetKeepsTheBackupSeal`, under the parent SEC-FIDO-006 `ResetNeverWeakensSurvivingState`. All three tags are on one function; all three clauses are conjuncts of one invariant; and the three SoloClause_* configurations exist because the parent's verdict reports through the third clause every time"

# ---- 2. Commit, build and features -------------------------------------------

[build]
commit = "b185fc3596a3107375fc3f35a597caaacb575b7f"
tree_state = "the runs recorded below are `formal/runs.toml`'s safety tier, taken at `b185fc3`, and `git diff b185fc3..HEAD -- formal/*.tla formal/*.cfg formal/*.sh` is EMPTY (measured, exit 0, zero bytes), so every verdict here describes the model at the recorded commit. The working tree is NOT clean and other agents are in it: `git status --porcelain` lists thirty-odd modified paths including formal/gen-configs.sh, formal/comutants.toml, formal/floors.txt and formal/README.md. None of the four hunks touches this clause — the gen-configs.sh diff adds twenty-seven lines above line 295 and sixty-five at the end and matches nothing containing `clause`, the comutants.toml diff is three lines inside an OTP entry, the floors.txt diff splits the Historical_* glob, and formal/Shipped.cfg, formal/AlwaysUv.cfg and formal/SoloClause_ResetKeepsTheAlwaysUvGate.cfg are clean. LINE CITATIONS INTO formal/ ARE AT `b185fc3`, which for those files is HEAD; the working tree's gen-configs.sh already shifts them, and that drift is why they are written with the file name attached"
matrix_column = "firmware"
cargo_features = "the default workspace feature set. `always-uv` is OFF, which is not a detail here but the subject: crates/rsk-fido/Cargo.toml:100 declares it, firmware/Cargo.toml:150 forwards it, and crates/rsk-fido/src/config.rs:315 is where `DEFAULT_ALWAYS_UV` reads it. The Kani harness builds under `--features kani-soft` with `--cfg kani`, which does not turn it on either"
board_knobs = "BOARD unset, LED_KIND unset, the default 4 MB layout — none of the three is on this clause's path, which is what makes the two equivalent columns below equivalent"
host_triple = "aarch64-apple-darwin"
firmware_triple = "thumbv8m.main-none-eabihf"
machine = "18 cores, macOS 27.0 aarch64 — the figure TLC's own banner records in every TLC artifact below, so the log and this line cannot disagree"
equivalent_columns = ["firmware-pico", "waveshare-one"]
inequivalent_columns = "firmware-always-uv and firmware-always-uv-pqc are NOT equivalent to this column for this clause, and saying so is half the bundle. On those the compiled default inverts, the record's presence means the gate is OFF, and the clause has no falsifying state in the model at all. assurance/configurations.toml:689-720 carries the open question for the first of them and names this property in it"

# ---- 3. Method and scope/bounds ----------------------------------------------

# SEVEN ways. The model rung is split three (the green base, the clause's own red
# row, the vacuous arms) because that split is where this clause differs from its
# siblings; the runtime rungs are folded into one row because their oracles are
# folded too.

[[method]]
obligation = "the clause over the whole reachable space of the shipped constants, on the one green configuration that names it"
method = "model-check"
artifact = "Shipped.cfg::ResetKeepsTheAlwaysUvGate formal/RSKeySecurityState.tla::ResetKeepsTheAlwaysUvGate"
bound_rps = 2
stops_rps = "a torn prefix that first goes wrong over a third relying party. The clause needs only `snap.surv # {}`, so two is reach and not a term of the claim"
bound_channels = 2
stops_channels = "a torn prefix that first goes wrong over a third concurrent channel"
bound_max_clock = 1
stops_max_clock = "any prefix needing two units of elapsed time — and with `ResetWindow = 0` one Tick is also what closes the reset window, so the two bounds bite together on this row"
bound_reset_window = 0
stops_reset_window = "the whole of the shipped power-up window but its first instant: a reset may START only at clock 0, so a reset begun late inside the shipped RESET_WINDOW_MS — 10 000 ms at crates/rsk-fido/src/consts.rs:404 — is a prefix this row never tears. The touch is NOT what is skipped; crates/rsk-fido/src/reset.rs:37-51 runs the ceremony unconditionally after the window check"
bound_invariants = 12
stops_invariants = "nothing about this clause by omission — twelve is what this configuration's INVARIANTS block names, TypeOK and eleven invariants, and the last three are the clauses. It is worth the count because two other bundles describe this same block as nine, which was true at `b819ee5` and is false at the commit these runs were taken at"
bound_green_bases = 1
stops_green_bases = "any second green configuration. Of the two hundred and ten configurations, forty name the parent invariant and exactly two name this clause; only one of those two is green, so this row is the whole of the clause's positive model evidence and there is no independent arm to corroborate it"
shipped_relation = "MaxRetries 8 and MismatchLimit 3 ARE the shipped MAX_PIN_RETRIES and PIN_MISMATCH_LIMIT at crates/rsk-fido/src/consts.rs:368,372; RPs and Channels are 2 against an unbounded device. The constant that matters to THIS clause is `AlwaysUvShipped = FALSE`, and it is the shipped image's own value: firmware/Cargo.toml's default feature set does not name `always-uv`. On that value the record exists exactly when the flag is on, so the model's consequent `gate.alwaysUv` and the firmware's `EF_ALWAYS_UV` presence are the same fact — which is the correspondence the whole ladder below rests on and which the other arm breaks"
cfg = "none"
features = "none"

[[method]]
obligation = "non-degeneracy: that the clause has a falsifying state at all on the constants its green run uses, and that the state is this clause's and not a sibling's"
method = "model-check"
artifact = "SoloClause_ResetKeepsTheAlwaysUvGate.cfg SoloClause_ResetKeepsThePinGate.cfg"
bound_invariants = 2
stops_invariants = "anything about the rest of the invariant set; TypeOK and one clause is the whole of what each row checks, which is exactly what makes a RED attributable"
bound_armed_switches = 1
stops_armed_switches = "every defect but the one. `BugResetGatesFirst` is the sole model owner of this clause, so a defect the phase swap does not produce has no red row here"
bound_constant_deltas = 1
stops_constant_deltas = "any doubt about whether the green base could go red. This configuration differs from Shipped.cfg in ONE constant (`BugResetGatesFirst = TRUE`) besides its invariant block — measured by `diff`, which reports that line and the INVARIANTS block and nothing else — so the red and the green are the same model with one switch between them"
bound_depth = 18
stops_depth = "nothing — eighteen is a MEASURED trace length and not a cap. What it says is why the parent cannot name this clause: the sibling clause falls at sixteen and the third at eight, so a search checking all three reports the shallowest every time"
bound_distinct_states = 2063890
stops_distinct_states = "nothing by shrinking; it is what the search visited before the counterexample, and it is the figure to read against the parent's own solo row, which reaches a violation in five thousand three hundred and thirty-one"
shipped_relation = "each configuration checks TypeOK and ONE clause (formal/gen-configs.sh:182-189 emits exactly that under SOLO, and :330-332 is the loop that names the three), so a RED here cannot be a sibling clause's. Both rows arm the same switch, `clause_mutant` at formal/gen-configs.sh:321-328 mapping the first two clauses onto `BugResetGatesFirst` with the comment that the phase order is their only owner. The pair is what separates the two clauses by a WITNESS: in this clause's counterexample `pin.set` is TRUE, so clause A holds there; in clause A's, `snap.auv` is FALSE, so this clause is vacuous there"
cfg = "none"
features = "none"

[[method]]
obligation = "the other arm of the constant this clause depends on, and what the clause is worth on it"
method = "model-check"
artifact = "AlwaysUv.cfg PermWide.cfg ForceChange.cfg"
bound_arms = 3
stops_arms = "this clause, on every one of them. All three take `AlwaysUvShipped = TRUE`, and on that value the clause has no falsifying state: what the three arms buy is the other value of three standing booleans for the OTHER invariants, and for this one they buy a vacuous conjunct"
bound_falsifying_states = 0
stops_falsifying_states = "the whole of what a green run normally means. Zero is not a measurement of these runs — TLC reports no such count — it is the consequence of `gate.alwaysUv` having two writers, one that clears the antecedent's `snap` and one that can only raise the flag on this arm"
bound_rps = "2 on AlwaysUv.cfg, 1 on PermWide.cfg and ForceChange.cfg"
stops_rps = "a torn prefix over a further relying party, and on two of the three arms there is no second one at all. For this clause that shrink costs nothing extra, since the arm has already cost it everything"
bound_max_retries = 2
stops_max_retries = "nothing this clause can express: it names no retry count, so six rungs off the ladder is free here"
bound_configurations_arming_the_mutant = 0
stops_configurations_arming_the_mutant = "the ability to EXHIBIT the vacuity rather than argue it. Measured: five configurations set `AlwaysUvShipped = TRUE` and five arm `BugResetGatesFirst`, and the two sets are disjoint — every configuration arming this clause's mutant takes the FALSE arm. So no recorded run shows the switch failing to redden the clause on the TRUE arm; the claim rests on reading the two writers"
shipped_relation = "these three are the arms the scope registry buys — `AlwaysUvShipped`, `WidePerms` and `ForceChangeModelled` — and all three happen to take the first of them TRUE. On the shipped image the constant is FALSE, so these rows describe a build the tree publishes and does not ship. `formal/gen-configs.sh:211-225` states the consequence in the generator itself and is the reason `clauses=1` is on Shipped.cfg and on no other baseline: recording the clause as asserted on these three would be recording a row that cannot go red"
cfg = "none"
features = "none"

[[method]]
obligation = "tier C: the clause holds of the Rust projection after any one concrete reset step"
method = "bounded proof"
artifact = "crates/rsk-fido/src/reset_refinement_kani.rs::reset_keeps_the_always_uv_gate crates/rsk-fido/src/reset_assurance.rs::reset_keeps_the_always_uv_gate"
bound_steps = 1
stops_steps = "every reachability question. Closure under one symbolic step out of a symbolic pre-state is an induction and carries to sequences; what it cannot say is that any particular interleaving is REACHED, so a step whose precondition no real run satisfies is proved about all the same"
bound_actions = 13
stops_actions = "any reset step the thirteen do not name. One is selected by `action % 13` and applied once, so a transition the shipped reset can make and `apply_symbolic_step` has no arm for is outside the closure argument"
bound_symbolic_booleans = 14
stops_symbolic_booleans = "every field of `FidoState` the projection does not carry. Fourteen booleans — six persistent, six snapshot, two volatile — are the WHOLE projection, and there is one because a direct run through the real reset was stopped with the prover still expanding zeroize loops"
bound_covers = 1
stops_covers = "every witness but the one. This harness's single `kani::cover!` says its own antecedent is satisfiable and nothing about any other valuation"
bound_feature_arms = 1
stops_feature_arms = "the arm this clause is about. `scripts/kani.sh` selects `-p rsk-fido --features kani-soft`, so the proof runs on the default build only; nothing bounded is proved about the build where the record's presence inverts"
shipped_relation = "AND THE ASSERTION IS IMPLIED BY THE PARENT HARNESS on the tree as it stands, which this bundle says rather than presenting an independent proof: all four harnesses assume `well_formed(pre)`, take the same one symbolic step, and `well_formed` ends in the conjunction (crates/rsk-fido/src/reset_assurance.rs:267), so `well_formed(post)` already gives this clause. What the harness adds is its own cover and a signal if the conjunction ever loses a conjunct. The α is ALSO not the model: its consequent is `persistent.always_uv`, the record's presence, where the TLA+ consequent is the flag — the same fact only while the compiled default is off"
cfg = "kani"
features = "kani-soft"

[[method]]
obligation = "the production side: which sites decide this clause, and which of them the tag counts"
method = "review"
artifact = "crates/rsk-fido/src/reset.rs::reset crates/rsk-fido/src/reset.rs::sweep crates/rsk-fido/src/reset.rs::is_fido_gate_record crates/rsk-fido/src/config.rs::toggle_always_uv crates/rsk-fido/src/config.rs::always_uv_state crates/rsk-fido/src/config.rs::DEFAULT_ALWAYS_UV"
bound_tagged_sites = 1
stops_tagged_sites = "every site the tag is not on, which is where the property lives. The one tag is on the CLASSIFIER; the ordering that makes the clause true is two untagged lines at crates/rsk-fido/src/reset.rs:120-121, and the writer that decides what the record MEANS is in another file entirely"
bound_gate_records = 5
stops_gate_records = "the two members no clause names. `is_fido_gate_record` matches EF_PIN, EF_DEVICE_PIN, EF_ALWAYS_UV, EF_MINPINLEN and EF_BACKUP_SEALED; three clauses cover three of them, and a torn reset that drops either of the other two early is unobserved by every artifact in this bundle"
bound_flag_writers = 2
stops_flag_writers = "any site outside the two. `toggle_always_uv` creates and removes the record; the gate sweep removes it. `crates/rsk-fido/src/config.rs:327-329`'s `always_uv_enabled` READS it and resolves a faulted read to ON rather than to the default, which is a strictness this clause does not model at all"
bound_feature_sites = 2
stops_feature_sites = "any dependence the two sites do not carry. `git grep 'feature = \"always-uv\"' crates/rsk-fido/src` returns exactly crates/rsk-fido/src/config.rs:315 and crates/rsk-fido/src/conformance/config.rs:77 — neither is in reset.rs or reset_assurance.rs, so no verification-side file in this bundle can tell the two builds apart"
shipped_relation = "the review is over the shipped source at `b185fc3` with `crates/rsk-fido/` clean in the working tree, and its result is a split: the model's consequent is the FLAG and the Rust α's is the RECORD, and `toggle_always_uv` is what makes the two coincide — it deletes the record when the new value equals `DEFAULT_ALWAYS_UV` and writes it otherwise, so record-present means flag-on exactly while that default is off"
cfg = "none"
features = "none"

[[method]]
obligation = "the runtime rungs, and whether either of them could report THIS clause rather than its sibling"
method = "review"
artifact = "fuzz/fuzz_targets/power_cut.rs::reset_property_holds fuzz/fuzz_targets/power_cut.rs::reset_probe tests/29_reset_power_cut.py::cut_during_reset"
bound_oracles = 2
stops_oracles = "any rung either oracle does not reach. One is a boolean over a mounted store, the other a sequence of CTAP commands after an operator's cut, and neither has an assertion this clause owns"
bound_separable_clauses = 1
stops_separable_clauses = "this clause and its PIN sibling, on both rungs. `reset_property_holds` folds them into one conjunct — `!credential_usable || (fs.has_data(EF_PIN) && fs.has_data(EF_ALWAYS_UV))` — so a failure names the function; tests/29_reset_power_cut.py:526-529 folds them into `assert assertion_status != 0`, which says the assertion was refused without saying which gate refused it. Only the backup seal is separable, and it is the sibling this bundle is not about"
bound_recorded_runs = 0
stops_recorded_runs = "everything the board rung would say. The `test` column counts a FILE that names the invariant; no board run is recorded anywhere, `hardware` is 0 on the evidence vector, and PLAT-FLASH-001 owns the missing result at `status = \"pending\"`"
bound_asserts = 2
stops_asserts = "any clause the two device assertions do not separate, and one of the two is the folded one. The script prints `alwaysUv` from getInfo in its failure message, so an operator reading a red run can see the flag — but the assertion does not test it"
shipped_relation = "both rungs drive the REAL reset: the fuzz target cuts inside the store writes and remounts, the device script asks an operator to pull the cable. Their oracles read what the device answers, which for alwaysUv is the FLAG on the device side (getInfo `options.alwaysUv`) and the RECORD on the fuzz side (`fs.has_data(EF_ALWAYS_UV)`) — a third spelling of the same split, and on the shipped default build the two agree"
cfg = "none"
features = "none"

[[method]]
obligation = "mutation: what has to break before something goes red about this clause, at the code tier"
method = "mutation"
artifact = "formal/comutants.toml crates/rsk-fido/src/reset_assurance_tests.rs::reset_property_controls_go_red_on_each_early_gate_mutant assurance/bundle/logs/SEC-FIDO-006B/cargo-test-reset-assurance-flavours.log"
