# ---- 7. Assumptions and TCB / trust dependencies -----------------------------

[[assumption]]
id = "AS-AUTH-1"
statement = "tools/emu implements the same authorization gates as the firmware, so a recorded session is evidence about the firmware."
kind = "tool fidelity"
discharger = "a board recording of the same session, compared boundary by boundary"
expressible = "no — not a model constant"
registered = "yes — assurance/platform.toml PLAT-TOOL-002, pending, and it refines the emulator-wide PLAT-TOOL-001"

[[assumption]]
id = "AS-AUTH-2"
statement = "The shipped image is built without --features always-uv, so gate.alwaysUv is a free state variable rather than the compiled default every reset restores."
kind = "build configuration"
discharger = "firmware/Cargo.toml's default feature set, and the firmware-always-uv matrix column"
expressible = "yes"
registered = "yes — assurance/assumptions.toml AlwaysUvShipped, whose TRUE/FALSE split over formal/*.cfg is the re-derived gate_assumption line in §5 and not a second copy here; read by Init, GatesLive and ResetSweepGates; the fact underneath it is assurance/platform.toml PLAT-BUILD-001, one of that registry's discharged rows. This field read `FALSE by 89 configurations and TRUE by AlwaysUv.cfg` until 2026-09-02, when both halves were wrong at once — 91 and 5 — twenty lines from a derived line in this same file that had them right"

[[assumption]]
id = "AS-AUTH-3"
statement = "A CTAPHID channel id is a routing label the sender writes, so channel ownership is a scoping rule and never an authentication one."
kind = "threat model"
discharger = "a clause of docs/threat-model.md; state.rs states it in prose today"
expressible = "no"
registered = "yes — assurance/platform.toml PLAT-THREAT-001, pending on a threat-model clause"

[[assumption]]
id = "AS-AUTH-4"
statement = "PowerOnClearsScratch2 — a real power-on clears the watchdog word the soft lock rides in."
kind = "platform"
discharger = "the board measurement assurance/assumptions.toml already describes"
expressible = "yes, and registered — but in RSKeyBootHardening, and the overlap between the 13 configurations that assign it and those that check NoAuthorizationBypass is ZERO"
registered = "yes — assurance/platform.toml PLAT-RESET-001, which discharges the constant and is itself pending on a board. The constant lives in RSKeyBootHardening and the overlap between the 13 configurations that assign it and those that check NoAuthorizationBypass is still ZERO"

[[assumption]]
