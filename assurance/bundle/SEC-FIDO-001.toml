# ---- 5. Principal result -----------------------------------------------------

[result]
# TIER A — the requirement gate. Every row is `formal/run-tlc.sh <cfg>`, WORKERS=2,
# HEAP=4g, and the invariant column is what floors.txt holds the run to.
a_gate = "TokenGate.cfg GREEN — 875 states, 44 distinct, depth 3, 1 s; invariants TypeOK + NoAuthorizationBypassA. 44 distinct IS the whole A domain, which is what makes the state-sliced invariant cover AllowedRelation"
a_oracle = "TokenGateOracle.cfg GREEN — 506 states, 22 distinct, depth 1, 1 s; the probe's initial states ARE the disagreement set"
a_disagreement = "TokenGateDisagreement.cfg RED: RequiredGateAgreesWithRelation, 1 s — the non-degeneracy, and it must be RED"
a_disagreement_set = "31 disagreeing (state, operation) pairs over 22 states, in two families: ClearPin on all 22 (the relation's `pre.pinSet` is a FRAME condition — there was a record to delete — while §6.6's actual gate is the 10 s window and a touch, neither of which tier A can see), and UseCm on 9 of them (§6.8.2 step 4 lets the persistent grant authorize on its own; the relation also demands pinSet, because authorized_by_ppuat refuses a grant with no EF_PIN behind it — the shipped tree being STRICTER than the requirement, which an oracle taken from the code could not have shown)"
a_mutant = "TokenGateMut_BugUnauthorizedEdge.cfg RED: NoAuthorizationBypassA, 1 s"

# TIER B — every invariant Shipped.cfg names over the shipped constants, and the
# assumption's other arm. Read that set out of the cfg, never out of this
# sentence: formal/gen-configs.sh assembles it from TypeOK, `ALL_INV` and
# `EXTRA_INV` in both configurations, plus `CLAUSE_INV` in Shipped.cfg alone —
# the one row `emit` is given `clauses=1` for, and the reason the two blocks
# differ at all. This paragraph called both of them nine until 2026-09-02: the
# three clause names joined Shipped.cfg after the runs below were recorded, and
# SEC-FIDO-006B's `stops_invariants` had already said so, in this bundle's name.
# Shipped.cfg's distinct count is IDENTICAL to the one recorded before
# `AlwaysUvShipped` was introduced, which is what says the constant changed no
# behaviour on the arm the image ships.
b_shipped = "Shipped.cfg GREEN — 986 836 197 states, 77 563 872 distinct, depth 58, 1915 s"
b_shipped_unchanged = "77 563 872 distinct against 77 563 872 before AlwaysUvShipped — bit-identical, measured rather than argued"
b_always_uv = "AlwaysUv.cfg GREEN — 273 124 081 states, 23 521 512 distinct, depth 51, 535 s; all nine invariants with alwaysUv as the compiled default. The seconds are the runner's, which is what the cost row below carries; TLC's own closing line in the attached log says 08min 54s = 534 s, and the runner wraps the invocation in `date +%s` so its figure can only be the larger. It read 526 s until 2026-08-31 — a figure neither artifact can produce, corrected to the one the shipped log supports"
b_mutants = "24 rows, 12 Solo_* and 12 Mut_*, every one RED: NoAuthorizationBypass — BugCmWalkIgnoresChannel, BugConsumeKeepsMcGa, BugForceChangeIgnored, BugHostPreemptsLocalWait, BugLocalPinIgnoresBudget, BugNoConsumeAfterUp, BugNoTouchRequired, BugSetPinOverExisting, BugSoftLockLostOnWarmReset, BugTokenlessIgnoresAlwaysUv, BugUvNotRqdIgnoresRk, BugWarmResetReopensWindow. The roster is not this row's to keep: it is every formal/*.cfg whose INVARIANTS block targets this invariant, and formal/runs.toml's safety tier carries a RED row for each of them. It read 11 and 11 until 2026-09-02 — BugForceChangeIgnored arrived with f5577ab, ran with the rest, and reached both the recorded tier and the derived mut=12 in §5 without ever reaching this line"

# B -> A, the native refinement, and the two negatives that say it can refuse.
