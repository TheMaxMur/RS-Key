# ---- 8. Mutation verdicts ----------------------------------------------------

[[mutation]]
level = "A"
mutant = "BugUnauthorizedEdge — one Authorized UseAcfg edge from a state with no PIN and no live token"
invocation = "formal/run-tlc.sh TokenGateMut_BugUnauthorizedEdge.cfg"
expected = "RED: NoAuthorizationBypassA"
verdict = "RED: NoAuthorizationBypassA, 1 s"
fell = "NoAuthorizationBypassA — the implication AuthorizedFrom(a, op, post) => RequiredGate(op, a)"
direction = "modelled"
reading = "the failure is an operation AUTHORIZED without the gate its requirement names, which is the defect. The inverse — the requirement refusing something the relation admits as Rejected — cannot fail this invariant at all, because it quantifies over Authorized edges only."

[[mutation]]
level = "A"
mutant = "the oracle read off the relation instead of the requirement — the degeneracy §4.3 condition 11 refuses"
invocation = "formal/run-tlc.sh TokenGateDisagreement.cfg"
expected = "RED: RequiredGateAgreesWithRelation"
verdict = "RED: RequiredGateAgreesWithRelation, 1 s"
fell = "RequiredGateAgreesWithRelation, at a state with ~pinSet where ClearPin disagrees"
direction = "modelled"
reading = "the direction is the whole content: RequiredGate is TRUE where GateFromRelation is FALSE, i.e. the REQUIREMENT is weaker. The inverse — a requirement stricter than the relation on an Authorized edge — would have reddened NoAuthorizationBypassA instead, and did not. Driven the other way as well: with the oracle defined as GateFromRelation this row goes GREEN, run-tlc.sh reports `!! expected RED`, and exit is 1."

[[mutation]]
level = "B"
mutant = "the eleven switches this property names as their target"
invocation = "formal/run-tlc.sh Solo_<Bug>.cfg and Mut_<Bug>.cfg, 22 rows"
expected = "RED: NoAuthorizationBypass on every one"
verdict = "22 of 22 RED: NoAuthorizationBypass"
fell = "NoAuthorizationBypass — on the Solo_ rows it is the ONLY invariant checked, so a RED there cannot be a sibling's"
direction = "modelled"
reading = "each Solo_ configuration checks TypeOK and this invariant and nothing else, which is what tells a kill from a kill by a neighbouring invariant. The 11 Mut_ twins check the whole set and report the same name first."

[[mutation]]
level = "B"
mutant = "deleting every route by which one action writes the name — 21 actions, and every single route, 24 of them"
invocation = "python -m pytest scripts/test_ghost_gate.py"
expected = "the ghost row names the action, and a HALF-deleted guard names the route"
verdict = "55 cases green: 21 delete-every-route, 24 single-route, 3 half-deleted-guard, plus a swapped policy, a new alias, a new recorder, a stale entry, an empty reason and an empty derivation"
fell = "`<Action>: owned in assurance/ghost_actions.toml and records NoAuthorizationBypass nowhere`, and for the two-route actions `<Action>: … gone: <route>`"
direction = "modelled"
reading = "the arm that matters is the half-deleted one: RegisterStart, RegisterNdStart and AssertStart each record TWICE, so after one deletion the action still records and a name-set equality is GREEN. `test_a_half_deleted_guard_is_not_a_pass` asserts the derivation still finds the action recording BEFORE it asserts the row goes red, so the failure cannot be the inverse."

[[mutation]]
level = "B->A"
mutant = "MutateTokenGamma and BugDeadTokenAuthorized"
invocation = "formal/run-tlc.sh TokenRefinementBadMap.cfg / TokenRefinementDeadToken.cfg"
expected = "RED on the refinement and on the outcome clause"
verdict = "RED (the action property in RSKeyTokenAbstract) and RED: R1oTokenOutcomes"
fell = "the B->A step obligation, and the labelled-outcome obligation"
direction = "modelled"
reading = "a wrong gamma breaks the STATE refinement and a dead token authorizing breaks the OUTCOME one; the two rows fall on different properties, which is what says they model different defects."

[[mutation]]
level = "trace"
mutant = "MutateUvNotRqd, MutateResetWindow, MutateAlwaysUvArm, MutatePinSet"
invocation = "formal/run-tlc.sh TraceSecurityBad{UvNotRqd,ResetWindow,AlwaysUvArm,PinSet}.cfg"
expected = "RED: R4cGateAnswers, at one of the seven gate boundaries"
verdict = "4 of 4 RED: R4cGateAnswers, at depths 44, 75, 51 and 12"
fell = "R4cGateAnswers — the replay's own prediction of the gate's answer"
direction = "modelled"
reading = "the four fall at four DIFFERENT depths, which is what says each reaches its own boundary rather than all four tripping on the first one. The GREEN control TraceSecurityBadAlphaNoR4b.cfg is what says R4b alone catches the alpha shift."

[[mutation]]
level = "C"
mutant = "BugCmWalkIgnoresChannel, re-driven against the HARNESS rather than the unit suite — the first recorded mutant in this tree to redden a Kani proof"
invocation = "python scripts/comutate.py run BugCmWalkIgnoresChannel"
expected = "killed by the slice AND by the proof, on NoAuthorizationBypass/B1"
verdict = "killed — test result: FAILED. 617 passed; 1 failed; proof: Failed Checks: NoAuthorizationBypass/B1"
fell = "NoAuthorizationBypass/B1: the RP walk is servable to the wrong set of channels"
direction = "modelled"
reading = "the patch drops the channel conjunct out of `may_walk_rps`, so B1's EQUALITY must fail on the NON-OWNING probe — servable where the ghost says it should not be. B2 (the credential walk) is untouched and did not fall, which is what says the kill is this defect and not a neighbour's. The first attempt at this row reported `proof-broke` instead: `not currently supported` appears in a Kani codegen WARNING and in the description of unreachable checks on a run that PASSED, so the tool-limit matcher had to be scoped to the `Failed Checks:` lines."

[[mutation]]
level = "C"
mutant = "verify_cm_token loses its `state.paut.permissions & PERM_CM == 0` conjunct — the requirement (§6.8) demands the permission and the code no longer does"
invocation = "cargo kani -p rsk-fido --features kani-soft --harness no_authorization_bypass_rps_begin_at_call_site, over the patched tree"
expected = "RED on D1, the decision clause, and on nothing else"
verdict = "VERIFICATION:- FAILED — Complete - 0 successfully verified harnesses, 1 failures, 1 total"
fell = "NoAuthorizationBypass/D1: the Begin's gate admitted the wrong set of requests"
direction = "modelled"
reading = "E4b, and the direction is the whole content. D1 is an EQUALITY between the real decision and a ghost computed from the request, so it falls in both directions — but the message that fell says ADMITTED, and the input class is a request with a valid MAC and a satisfied rpId binding whose token does NOT carry `cm`. That is an authorization bypass, not an over-refusal. D2 did not fall separately, which is what says the cursor writes are downstream of the decision rather than a second defect."

[[mutation]]
level = "gate"
mutant = "the three guard axes' derivation stopped reading the tree"
invocation = "python -m pytest scripts/test_token_refinement_gate.py"
expected = "each axis's floor trips, naming the axis and the count"
verdict = "green; the walk and window arms derive 0 sites, and the soft-lock arm derives 2 of 12 when the scan is restricted to rsk-fido"
fell = "`walk: 0 site(s) derived, under the floor of 3`, `reset_window: 0 …`, `softlock: 2 site(s) derived, under the floor of 8`"
direction = "modelled"
reading = "the soft-lock arm is the one worth reading: restricting UNITS to the applet is exactly the mistake a hand-written scan would make, and it loses the board half rather than everything — a floor and not a zero test is what catches that."

[[mutation]]
level = "gate"
mutant = "a group of the bundle keeps its heading and loses its body"
invocation = "python -m pytest scripts/test_bundle_gate.py"
expected = "the leaf floor trips for that group"
verdict = "green over all ten groups, both directions (heading gone, and body gone)"
fell = "`group `<name>` carries 1 leaf/leaves, under the floor of N`"
direction = "modelled"
reading = "the missing-group arm and the empty-group arm are separate, because ten headings with one line each satisfy the first and are exactly what the second exists to refuse."

