# TenStar RP2350-USB — WS2812B-standard LED (GRB byte order),
# the BOOT button (BOOTSEL) for presence (issue #125). No display.

[usb]
vidpid = "RSKey"

[led]
kind = "ws2812"
pin = 22
order = "grb"

[presence]
source = "bootsel"

[flash]
size_mb = 16
kvmain_kb = 1408
