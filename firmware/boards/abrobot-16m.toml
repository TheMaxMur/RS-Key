#
# ABrobot RP2350-16M — a development board featuring 4 WS2812 LEDs,
# 16MB Flash, and three push-button switches (BOOTSEL, RESET, and USER).
# WS2812 addressable GRB LEDs on GPIO16; USER button on GPIO23.
# No built-in display.

[usb]
vidpid = "RSKey"
# 0x1209:0x0001 — this project's own pid.codes identity

[led]
kind = "ws2812"
pin = 16
order = "grb"
max_leds = 4

[presence]
source = "gpio"
pin = 23
active_high = false

[flash]
size_mb = 16
kvmain_kb = 1408
