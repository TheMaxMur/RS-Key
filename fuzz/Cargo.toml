# Standalone workspace so the parent (thumbv8m) build never pulls these in.
[workspace]

# Same vendored sequential-storage patch as the root workspace, so the power_cut /
# kv_durability fuzz targets exercise the exact KV code the firmware ships (see the
# root Cargo.toml [patch] note + third_party/sequential-storage.patch).
[patch.crates-io]
sequential-storage = { path = "../third_party/sequential-storage" }
