[package]
name = "rsk-fuzz"
version = "0.0.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rsk-sdk = { path = "../crates/rsk-sdk" }
rsk-fs = { path = "../crates/rsk-fs", features = ["test-util"] }
rsk-usb = { path = "../crates/rsk-usb" }
rsk-crypto = { path = "../crates/rsk-crypto" }
rsk-fido = { path = "../crates/rsk-fido" }
rsk-openpgp = { path = "../crates/rsk-openpgp" }
# The RSA layer the two openpgp_* RSA targets now fuzz directly: the DigestInfo
# parser (`rsa_sign_em`) and the import-side key rebuild (`rsa_from_pqe`).
rsk-rsa = { path = "../crates/rsk-rsa" }
rsk-devconf = { path = "../crates/rsk-devconf", features = ["test-util"] }
rsk-mgmt = { path = "../crates/rsk-mgmt" }
rsk-oath = { path = "../crates/rsk-oath" }
rsk-otp = { path = "../crates/rsk-otp" }
rsk-phy = { path = "../crates/rsk-phy" }
rsk-piv = { path = "../crates/rsk-piv" }
rsk-rescue = { path = "../crates/rsk-rescue" }
# The applet wiring the firmware and `tools/emu` both run — registration order,
# the capability gating, reset_card/reset_chaining, the CTAPHID config surface.
# cross_applet used to hand-roll a five-applet dispatcher of its own, and a second
# copy of the routing rules is the drift this crate exists to prevent. `display`
# only adds `pin_ref_ready` / `reset_chaining`; the dispatch path is unchanged.
rsk-device = { path = "../crates/rsk-device", features = ["display"] }
# The seventh applet's AID and its `Platform`, for the same target's applet set.
rsk-vendor = { path = "../crates/rsk-vendor" }
# The store the device runs. `power_cut` used to torture a hand-written mirror of
# it; a mirror can only be as right as whoever last synced it, and this one had
# already drifted (no `last_error`, no `compact`, one missing counter FID).
rsk-store = { path = "../crates/rsk-store" }
# sha512_diff differential-fuzzes this fast SHA-512/384 against `sha2` below.
rsk-sha512 = { path = "../crates/rsk-sha512" }
# rsk-ui is the host-testable trusted-display logic; display_label fuzzes its
# Label sanitizer + the confirm-screen renderer, which needs the DrawTarget trait.
rsk-ui = { path = "../crates/rsk-ui" }
embedded-graphics = { version = "0.8", default-features = false }
# fido_cred_pqc drives CredKey::cose_public, which encodes into a minicbor Encoder.
minicbor = { version = "2.2", default-features = false }
# The piv_apdu seed runs the AES-192 management-key auth dance host-side.
aes = { version = "0.8", default-features = false }
# sha512_diff's differential reference — the exact `sha2` version rsk-sha512 is
# byte-identical to; the shared digest 0.10 makes the `Digest` traits unify.
sha2 = { version = "0.10", default-features = false }
# openpgp_key_load reconstructs an RSA key from attacker MPIs and checks n == p*q
# against a plain BigUint multiply — the same bignum rsk-rsa is arithmetic over.
num-bigint-dig = { version = "0.8.6", default-features = false, features = ["i128", "prime", "zeroize"] }
# power_cut: the real on-device storage stack (pinned to the firmware's
# version) over sequential-storage's power-cut-injecting mock flash (`_test`).
sequential-storage = { version = "=8.0.0", features = ["_test"] }
embedded-storage-async = "0.4"
embassy-futures = "0.1"

